# 竞赛线主结局（TASK-I010/I011）
endings:
  - id: c_end_gold_real
    campaign: competition
    title: 《金奖：真实的重量》
    mainResult: 决赛金奖，项目真实可信
    requirements:
      kind: and
      conditions:
        - { kind: state, key: progress, op: gte, value: 70 }
        - { kind: state, key: credibility, op: gte, value: 70 }
        - { kind: flag, key: c_final_done }
    priority: 200
    tier: hidden
    baseText: |
      "金奖——社团管家，XX大学。"
      掌声里，江雨桐哭了，方远假装没哭。孙教授握着你的手说："最打动我的不是功能，是你们那句'错了我们认'。"
      奖杯会落灰。但这21天里你们把一句"做个工具"变成了一份真实、可查、可复现的东西——这个能力跟着你们走。
    growthVariantRules:
      - dimension: evidenceDiscipline
        variants:
          - { gte: 70, text: "评审表备注栏里，高主任写了一行：数据口径清晰，见附录。全场比赛唯一一个。" }
          - { lte: 45, text: "有惊无险。有两处数据你最后关头才对齐——再晚一天就是另一个故事。" }
      - dimension: independence
        variants:
          - { gte: 65, text: "从规则提取到答辩应答，每个关键决定都有你自己的签名。" }
      - dimension: teamTrust
        variants:
          - { gte: 70, text: "散伙饭上方远说：下个比赛，还组这个队。" }
    characterEpilogueRules:
      - characterId: c_tech
        positive: 方远把那套回归测试开源了，README第一行写着"献给第一次比赛"。
        neutral: 方远把奖杯照片设成了头像，配文就俩字：够了。
        negative: 方远说"下次别再逼我写测试了"——但你们都知道，下次他还会写。
      - characterId: c_design
        positive: 雨桐的作品集里，这个项目排在第一页，标题是"真实的胜利"。
        neutral: 雨桐把路演稿裱了起来——她说这是她讲过最顺的一次。
        negative: 雨桐感慨："要是材料时间再多两天就好了。"但她说这话时在笑。
      - characterId: c_advisor
        positive: 何老师把你们的申报书存进了"以后给历届看"的文件夹。
        neutral: 何老师在朋友圈转发了获奖推送，配了三个字：应该的。
        negative: 何老师说："奖拿了，但你们本可以赢得更稳。"
    projectFutureRules:
      - { key: adopted, condition: { kind: flag, key: transfer_venture }, text: "社团联合会的采购合同在一个月后签了下来。比赛结束了，产品活着。" }
      - { key: research, condition: { kind: flag, key: transfer_research }, text: "你们的访谈数据成了一篇论文的田野素材——金奖项目发表了它的第二生命。" }
      - { key: archived, condition: { kind: always }, text: "仓库归档，README最后一行写着：如果有人接手，测试会告诉你一切。" }
    specialFlagSections:
      - { flag: regression_guard, text: "决赛演示第7步——那个曾在彩排时崩溃的环节——稳稳通过。回归测试在领奖台下立了功。" }
      - { flag: ai_disclosed, text: "你们的AI使用台账被评委称为'全场比赛最诚实的附录'。" }
    specialTags: [good, best_ending]
    reflection: 金奖证明的不是你们强，是你们真。真实是可以准备出来的。
    lessonHint: 真实的数据、清晰的口径、诚实的边界感

  - id: c_end_fake_exposed
    campaign: competition
    title: 《被揭穿的92%》
    mainResult: 数据造假在决赛被揭穿
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: fake_metrics }
        - { kind: state, key: day, op: gte, value: 20 }
    priority: 220
    tier: main
    baseText: |
      决赛问答环节。孙教授推了推眼镜："申报书写准确率92%，但你演示时后台日志闪过一个78。哪个是真的？"
      房间安静了三秒。这三秒里你想起了第15天的那个下午——那个"顺手只展示最好一组"的决定。
      你如实回答了。评委记下了你的诚实，也记下了那个数字。取消评奖资格，理由：材料与演示不一致。
    growthVariantRules:
      - dimension: credibility
        variants:
          - { lte: 35, text: "高主任补了一句：'初赛材料我们也复核了。'雪崩是整座的。" }
          - { gte: 55, text: "因为你当场承认、口径清楚，组委会保留了参赛记录——但奖没有了。" }
      - dimension: independence
        variants:
          - { gte: 55, text: "你在复盘里写道：'造假不是方远的错，是我第15天没有喊停。'" }
    characterEpilogueRules:
      - characterId: c_tech
        positive: 方远扛下了技术锅的另一半："当时我说只展示好的一组，你就该骂醒我。下次互相盯着。"
        neutral: 方远沉默地收拾设备，那晚他没说话。
        negative: 方远说："我早说过别这么干。"队伍的裂缝比取消资格更疼。
      - characterId: c_design
        positive: 雨桐在赛后重新剪了一版视频——所有镜头都是真实数据。"我们亏得起奖，亏不起人。"
        neutral: 雨桐把那次申报书从作品集里抽掉了。
        negative: 雨桐说："我再也不想在被窝里改数据了。"
    projectFutureRules:
      - { key: rebuild, condition: { kind: state, key: credibility, op: gte, value: 50 }, text: "第二年你们又报了名。这次申报书的数据页只写实测——评委换了，规矩没换。" }
      - { key: shadow, condition: { kind: always }, text: "那个78和92的故事，成了你们队每次赛前例会的第一页PPT。" }
    specialFlagSections:
      - { flag: missed_rule_17, text: "雪上加霜：第1天跳过的第17页条款——AI内容未标注——被一并点名。" }
    specialTags: [bad_end, integrity]
    reflection: 演示在撒谎和数据在撒谎，评委看来是一回事。
    lessonHint: 数据口径统一，是最后的底线

  - id: c_end_national_prize
    campaign: competition
    title: 《国赛入场券》
    mainResult: 省赛金奖晋级国赛并获奖
    requirements:
      kind: and
      conditions:
        - { kind: state, key: progress, op: gte, value: 65 }
        - { kind: state, key: credibility, op: gte, value: 55 }
        - { kind: flag, key: c_final_done }
    priority: 150
    tier: main
    baseText: |
      省赛金奖，国赛二等奖。领奖台上你举着证书，想起21天前的那个40页PDF。
      从读不懂规则，到让评委点头——这条路上你掌握的不只是比赛技巧，是一套把想法做成真的流程。
    growthVariantRules:
      - dimension: execution
        variants:
          - { gte: 70, text: "国赛现场，偶发崩溃没有出现——你在省赛后的修复+回归起了作用。" }
          - { lte: 45, text: "国赛的路演你讲得比省赛稳——被初赛毒打过的部分，都长成了经验。" }
      - dimension: teamTrust
        variants:
          - { gte: 65, text: "三个人的分工表赛后传给了下一届——比任何'组队心得'都管用。" }
    characterEpilogueRules:
      - characterId: c_judge_final
        positive: 孙教授在国赛现场认出了你们："数据口径那组。今年讲得更好。"
        neutral: 孙教授评分表上的评语：完成度高，边界清晰。
        negative: 孙教授提的那个问题你们还是没答好——记进下一年的功课。
    projectFutureRules:
      - { key: handover, condition: { kind: always }, text: "你们把项目移交给了下一届。交接文档30页——比申报书还厚。" }
    specialFlagSections:
      - { flag: budget_thrifty, text: "整届比赛花费：¥0。免费层撑到了国赛——预算纪律也是一种创新。" }
    specialTags: [good]
    reflection: 从校赛到国赛，变的是对手，不变的是方法。
    lessonHint: 方法可迁移，奖只是副产品

  - id: c_end_province_gold
    campaign: competition
    title: 《省赛金奖》
    mainResult: 省赛金奖
    requirements:
      kind: and
      conditions:
        - { kind: state, key: progress, op: gte, value: 60 }
        - { kind: flag, key: prelim_passed }
        - { kind: flag, key: c_final_done }
    priority: 120
    tier: main
    baseText: |
      省赛金奖拿到手的那刻，你先想到的不是奖，是第15天那个下午——把92改成78的那个决定。
      它当时看着像吃亏，现在看着像伏笔。
    growthVariantRules:
      - dimension: evidenceDiscipline
        variants:
          - { gte: 65, text: "省赛答辩的三个数据追问，你们全部用口径回答。评委之间交换了一个眼神——那是认可。" }
      - dimension: execution
        variants:
          - { lte: 50, text: "奖是拿了，但演示有一处小卡顿。差一点点，它就是银奖和金奖的区别。" }
    characterEpilogueRules:
      - characterId: c_rival
        positive: 邱一鸣带队来恭喜，然后问："那个回归测试，能发我们一份吗？"
        neutral: 邱一鸣的队伍这次拿了银奖。他说"下次见"的时候是真心的。
        negative: 邱一鸣卫冕失败，全程黑线。你们假装没看见。
    projectFutureRules:
      - { key: continue, condition: { kind: flag, key: transfer_venture }, text: "奖杯放进社团办公室，工具继续迭代——用户说'比金奖更实在'。" }
      - { key: default, condition: { kind: always }, text: "证书挂在实验室墙上。下一届报名时，它是最有效的招新海报。" }
    specialTags: [good]
    reflection: 诚实的数据不会让你输，它会让你赢得踏实。
    lessonHint: 对齐真实数据是最划算的决定

  - id: c_end_province_bronze
    campaign: competition
    title: 《省赛铜奖》
    mainResult: 省赛铜奖
    requirements:
      kind: and
      conditions:
        - { kind: state, key: progress, op: gte, value: 48 }
        - { kind: flag, key: prelim_passed }
        - { kind: flag, key: c_final_done }
    priority: 90
    tier: main
    baseText: |
      省赛铜奖。不算耀眼，但奖杯是真的，答辩时的每一句回答都站得住。
      复盘会上你们列了"如果能重来"清单——十条里八条，其实已经在21天里做对了。
    growthVariantRules:
      - dimension: execution
        variants:
          - { gte: 60, text: "评委点评：'完成度高于多数对手，败在了创新表达。'下届改进方向明确。" }
          - { lte: 45, text: "有几处演示小失误。你们的B计划救了场——不然连铜奖都悬。" }
    characterEpilogueRules:
      - characterId: c_advisor
        positive: 何老师说："铜奖进我文件夹的左边——那是'有潜力'的意思。"
        neutral: 何老师说："铜奖，正常发挥。"
        negative: 何老师叹气："差的那口气，是赛前一个月欠的。"
    projectFutureRules:
      - { key: next_year, condition: { kind: always }, text: "你们把复盘清单发到了队群。有人回了一句：明年再来。" }
    specialTags: [neutral]
    reflection: 铜奖是起点线：证明方法有效，提醒差距具体。
    lessonHint: 每一次彩排都在给奖杯上色

  - id: c_end_school_third
    campaign: competition
    title: 《校赛三等奖》
    mainResult: 校赛三等奖
    requirements:
      kind: and
      conditions:
        - { kind: state, key: progress, op: gte, value: 40 }
        - { kind: flag, key: c_final_done }
    priority: 70
    tier: main
    baseText: |
      校赛三等奖。名次不高，但你们完整走完了：规则、组队、选题、调研、Demo、材料、路演。
      有人问方远值不值。他指了指那套自动化测试："这套东西，值回票价。"
    growthVariantRules:
      - dimension: teamTrust
        variants:
          - { gte: 60, text: "散伙饭吃到十点。三个人约好：课程设计一起组队。" }
          - { lte: 40, text: "合影时三人站得很开。名次会过去，缝隙不一定。" }
      - dimension: evidenceDiscipline
        variants:
          - { gte: 60, text: "评审老师特意问了一句：你们的调研做了多久——那是褒奖的问法。" }
    characterEpilogueRules:
      - characterId: c_design
        positive: 雨桐把这次路演的脱敏稿发给了学妹们："照这个练，能少走半年弯路。"
        neutral: 雨桐把奖状收进文件夹，转身投入了下一份作业。
        negative: 雨桐说："下次我想跟个稳的队。"
    projectFutureRules:
      - { key: seed, condition: { kind: flag, key: transfer_venture }, text: "三等奖的奖品是一套机械键盘。工具倒是被两个社团持续用着——用户比评委诚实。" }
      - { key: default, condition: { kind: always }, text: "三等奖证书和那套测试一起躺在仓库里。后者被下载了37次。" }
    specialTags: [neutral]
    reflection: 奖项衡量21天的输出，能力衡量往后三年。
    lessonHint: 输了比赛不等于白打

  - id: c_end_school_fail
    campaign: competition
    title: 《止步校赛》
    mainResult: 校赛未获奖
    requirements:
      kind: and
      conditions:
        - { kind: state, key: progress, op: lte, value: 42 }
        - { kind: flag, key: c_final_done }
    priority: 60
    tier: main
    baseText: |
      校赛落选。评审意见只有一行："完成度不足。"
      你盯着这五个字看了很久，然后打开了21天前的那份倒排表——有几格是空的，你清楚是哪几格。
    growthVariantRules:
      - dimension: execution
        variants:
          - { lte: 35, text: "复盘时你数了数：倒排表上的Demo周，实际有效工作日只有四天。" }
          - { gte: 50, text: "你们输在选题创新性——执行没大错，方向差半拍。这类失败最值得复盘。" }
      - dimension: aiDependence
        variants:
          - { gte: 65, text: "申报书里AI味最重的那段，被评委当场圈了出来。" }
    characterEpilogueRules:
      - characterId: c_advisor
        positive: 何老师说："明年再来，我先给你们占个题。"
        neutral: 何老师说："参赛经历也是经历。"
        negative: 何老师把那份申报书退回："这样的材料别署我的名。"
    projectFutureRules:
      - { key: regroup, condition: { kind: state, key: teamTrust, op: gte, value: 55 }, text: "队伍没散。你们把这次的仓库设为私有，README写着：明年见。" }
      - { key: default, condition: { kind: always }, text: "落选的申报书你没删。它比任何教程都更懂你的弱点。" }
    specialFlagSections:
      - { flag: scope_creep, text: "复盘第一条：第12天的'顺手加功能'——它吃掉了修核心bug的整整两天。" }
      - { flag: loose_teamwork, text: "复盘第二条：没有分工表的三个人，等于六只手。" }
    specialTags: [bad_end]
    reflection: 比赛淘汰的不是没才华的队，是没流程的队。
    lessonHint: 倒排表空着的格子，就是输掉的原因

  - id: c_end_hollow_award
    campaign: competition
    title: 《空心的奖杯》
    mainResult: 奖项不错，但项目赛后即死
    requirements:
      kind: and
      conditions:
        - { kind: state, key: competitionRank, op: gte, value: 1 }
        - { kind: state, key: userUnderstanding, op: lte, value: 40 }
        - { kind: flag, key: c_final_done }
    priority: 105
    tier: special
    baseText: |
      证书到手，热闹散场。两周后有社团想真的用你们的工具——打开仓库，没人敢动：代码没人说得清，数据是造的，文档没有。
      奖杯很重。重得像一块墓碑。
    growthVariantRules:
      - dimension: userUnderstanding
        variants:
          - { lte: 30, text: "你从没真正见过目标用户怎么干活。奖评审的是故事，用户要的是工具——你们只备了前者。" }
          - { gte: 45, text: "访谈你做了，只是没做完。'报销比报名更痛'那条线索，你始终没敢追。" }
      - dimension: credibility
        variants:
          - { gte: 60, text: "好在材料没有造假。奖杯至少立得住——只是里面是空的。" }
    characterEpilogueRules:
      - characterId: c_design
        positive: 雨桐后来在分享会上说："那次我们学会了做奖，下一次想学做产品。"
        neutral: 雨桐把奖杯放在了宿舍书架最上层，落灰处。
        negative: 雨桐说："那三个星期，我们其实一直在给评委打工。"
    projectFutureRules:
      - { key: revive, condition: { kind: flag, key: transfer_venture }, text: "除非——你翻开了那个仓库。补文档、清数据、找用户。奖杯从墓碑变成了奠基石。" }
      - { key: default, condition: { kind: always }, text: "仓库最后一次提交停在决赛当晚。zip包里躺着'最新版最终版真最终版'。" }
    specialFlagSections:
      - { flag: demo_data_hidden, text: "有社团认真问过：'系统里那300个用户是谁？'你没法回答。" }
    specialTags: [warning]
    reflection: 为评委做项目，得奖即终点；为用户做项目，得奖只是开始。
    lessonHint: 项目空心的根源是没有真用户

  - id: c_end_to_venture
    campaign: competition
    title: 《赛场之外》
    mainResult: 竞赛项目转化为真实产品
    requirements:
