        variants:
          - { gte: 60, text: "仓库里那套测试直接迁移到了正式项目。老本，吃得很香。" }
    characterEpilogueRules:
      - characterId: c_tech
        positive: 方远成了"技术合伙人"——他给这个title配的备注是：继续写测试。
        neutral: 方远答应"帮着维护"，条件是别再逼他开会。
        negative: 方远婉拒了："比赛打完了，我想歇歇。"产品后来换了他做。
    projectFutureRules:
      - { key: paying, condition: { kind: state, key: userUnderstanding, op: gte, value: 50 }, text: "第一个学期结束，工具覆盖了全校41个社团。另一个学校的社团联合会发来了邮件。" }
      - { key: default, condition: { kind: always }, text: "产品活着，但很勉强。创业线的故事，才刚刚开始。" }
    specialTags: [good, transfer]
    reflection: 比赛给你观众，用户给你饭吃。分清这两件事，是创业第一课。
    lessonHint: 有观众不等于有用户

  - id: c_end_team_dissolve
    campaign: competition
    title: 《散伙》
    mainResult: 团队在赛程中解散
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: loose_teamwork }
        - { kind: state, key: teamTrust, op: lte, value: 35 }
    priority: 140
    tier: main
    baseText: |
      第16天，方远退群了。没有吵架——比吵架更冷。他说："材料你们做，代码我自己交一版。"
      江雨桐第二天也没来。实验室白板上还留着那份没人执行的分工表——当初它太温柔了，温柔到谁都没被真正约束。
    growthVariantRules:
      - dimension: teamTrust
        variants:
          - { lte: 25, text: "复盘时你们连群聊记录都懒得翻。三个优秀的人，凑不出一个队。" }
          - { gte: 40, text: "其实裂缝早有征兆：第一次彩排迟到、第一次互相甩锅……每一根稻草都是自己放的。" }
      - dimension: independence
        variants:
          - { gte: 55, text: "你一个人交了一版残缺的作品。评委问“团队呢”，你说：'都在，只是没绑在一起。'" }
    characterEpilogueRules:
      - characterId: c_tech
        positive: 多年后方远承认："那次是我混。后来我带的每个队，第一件事都是写分工表。"
        neutral: 方远删了群，留下了仓库。代码还在，队没了。
        negative: 方远和你在走廊遇见，互相点了点头。就这样。
      - characterId: c_design
        positive: 雨桐后来转了个"如何做分工表"的视频给你，备注：下个队见。
        neutral: 雨桐把那次没做完的PPT模板发在了网上，下载量意外地高。
        negative: 雨桐说："你们技术男的世界我不懂。"其实懂的只是没说。
    projectFutureRules:
      - { key: solo, condition: { kind: state, key: independence, op: gte, value: 60 }, text: "第二年你单枪匹马又报了名，拿了校三等奖。但你知道：一个人能走，一群人才走得远。" }
      - { key: default, condition: { kind: always }, text: "散伙饭没吃。有些饭，错过就永远错过了。" }
    specialFlagSections:
      - { flag: push_output, text: "你记得那个连锁反应的起点：方远状态最差的那天，你选择了催他。" }
    specialTags: [bad_end, team]
    reflection: 分工表约束的不是人，是失望的累积速度。
    lessonHint: 团队死于没有边界的温柔

  - id: c_end_tech_fail
    campaign: competition
    title: 《第7步，又崩了》
    mainResult: 决赛演示技术故障，评分崩盘
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: crash_unfixed }
        - { kind: flag, key: c_final_done }
    priority: 125
    tier: main
    baseText: |
      决赛演示，第7步——那个概率三成的偶发崩溃，如期而至。
      投影屏上的报错红得刺眼。你启动了B计划录屏，可评委的目光已经变了：他们看到的不只是一个bug，是一个没被认真对待的bug。
    growthVariantRules:
      - dimension: evidenceDiscipline
        variants:
          - { gte: 55, text: "你坦然说明：'这个偶发问题我们已定位并发未修复，录屏显示的是修复前状态。'评委给了尊重分。" }
          - { lte: 40, text: "你试图现场Debug。全场看着报错页面挂了四分钟——那是本场比赛最长的四分钟。" }
      - dimension: execution
        variants:
          - { gte: 60, text: "虽然演示崩了，问答环节你们扳回不少。最终名次：优秀奖。本可以是金奖的。" }
    characterEpilogueRules:
      - characterId: c_tech
        positive: 方远在返程车上把崩溃根因写成了一篇技术博客：署名"一个差点葬送全队的bug"。
        neutral: 方远说："概率三成……我们赌错了。下次我信测试不信运气。"
        negative: 方远把责任推给了"机器不稳定"。你看着他，想起了第20天你自己点的头。
    projectFutureRules:
      - { key: redemption, condition: { kind: flag, key: demo_backup_ready }, text: "B计划保住了底线。评委私下说：'有预案的队，输也输得像专业队。'" }
      - { key: default, condition: { kind: always }, text: "从那以后，你们队的演示标准流程第一行写着：先跑回归，再谈演示。" }
    specialFlagSections:
      - { flag: stayed_calm, text: "崩盘时你没有慌——第11天朋友圈事件练出来的。慌不能修bug。" }
    specialTags: [bad_end, tech]
    reflection: 概率三成的崩溃，在决赛就是百分之百的崩溃。
    lessonHint: 高风险项在赛前清零，不许赌

  - id: c_end_to_research
    campaign: competition
    title: 《数据在说话》
    mainResult: 竞赛调研转化为研究方向
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: transfer_research }
        - { kind: flag, key: c_final_done }
    priority: 110
    tier: special
    baseText: |
      赛后你做的第一件事是打开访谈纪要。"报销比报名更痛"——5个受访者里4个主动提过。
      你把这个发现写成一页研究备忘，发给了陈教授。半小时后他回了三个字：来聊聊。
    growthVariantRules:
      - dimension: evidenceDiscipline
        variants:
          - { gte: 60, text: "因为你当初坚持问'过去的行为'而不是'会不会用'，这些数据真的能当证据用。" }
          - { lte: 40, text: "你有点后悔访谈问得太浅。数据能用，但要用得更小心。" }
      - dimension: independence
        variants:
          - { gte: 55, text: "从竞赛到研究，是你自己看见的数据在牵引——不是导师布置，不是AI推荐。" }
    characterEpilogueRules:
      - characterId: c_design
        positive: 雨桐帮你把访谈录音频转成了文字稿——她说"这算我们队的第二个项目"。
        neutral: 雨桐说："调研那几天原来是最值钱的。"
        negative: 雨桐耸肩："反正材料我不管了，随便转。"
    projectFutureRules:
      - { key: research_line, condition: { kind: always }, text: "那页备忘成了你科研线的第一块拼图。竞赛教会你的验证习惯，全部迁移了过去。" }
    specialTags: [good, transfer]
    reflection: 会做比赛的人很多，会从比赛里看出问题的人少。
    lessonHint: 真实访谈的数据是双倍资产

  - id: c_end_biz_validated
    campaign: competition
    title: 《意外的商业课》
    mainResult: 竞赛项目完成真实商业验证
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: transfer_venture }
        - { kind: state, key: userUnderstanding, op: gte, value: 60 }
        - { kind: flag, key: c_final_done }
    priority: 118
    tier: special
    baseText: |
      采购合同签了；更妙的是，另外两所高校的社团联合会主动找来——他们看过你们公开的演示视频。
      方远算了一笔账：服务器成本、维护工时、订阅定价。"如果我们收费的话……是正的。"
      你们没打算创业。但"有人愿意付钱"这件事，比金奖更让人睡不着觉。
    growthVariantRules:
      - dimension: userUnderstanding
        variants:
          - { gte: 70, text: "因为你们从一开始就问对了问题，付费来得像水到渠成——用户说：'你们是唯一听我们说话的团队。'" }
      - dimension: execution
        variants:
          - { gte: 65, text: "那套回归测试成了服务承诺的一部分：“月度更新，全量测试后才发布。”" }
    characterEpilogueRules:
      - characterId: c_rival
        positive: 邱一鸣团队成了你们的第一家"渠道代理"——他维护本市高校客户，分成谈得明明白白。
        neutral: 邱一鸣发来祝贺，外加一句"有好事别忘了我"。
        negative: 邱一鸣在朋友圈内涵"某些队靠运气"。你回复了一个微笑。
    projectFutureRules:
      - { key: startup_line, condition: { kind: always }, text: "你把账本新建了一个文件夹：创业线。竞赛线的故事在这里存档。" }
    specialTags: [good]
    reflection: 竞赛验证的是 presentation，市场验证的是 value。两个都赢的人不多。
    lessonHint: 有人付费比有人投票更真实

  - id: c_end_infighting
    campaign: competition
    title: 《内部起火》
    mainResult: 队伍内讧拖垮冲刺
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: loose_teamwork }
        - { kind: state, key: teamTrust, op: lte, value: 45 }
        - { kind: flag, key: c_final_done }
    priority: 108
    tier: main
    baseText: |
      没散伙，但也没法合作了。材料归雨桐"自愿"包揽，代码归方远，你负责所有没人爱干的活。
      名次不算差——三个人各自的部分都还专业。可复盘时谁也不想再提这次比赛。火没烧塌房子，但烧掉了下一次。
    growthVariantRules:
      - dimension: teamTrust
        variants:
          - { lte: 35, text: "庆功宴提议了三次，改期三次，最后取消。三人组的聊天群从此只剩转发通知。" }
          - { gte: 50, text: "好在底子还在。比赛结束一周后，方远在群里发了句“那顿饭我请”，裂痕开始愈合。" }
      - dimension: independence
        variants:
          - { gte: 60, text: "你从中学到了队长最贵的一课：分工表不是用来贴的，是用来在第一天就说不的。" }
    characterEpilogueRules:
      - characterId: c_advisor
        positive: 何老师单独找你聊了一小时。最后他说："带队这门课，你挂科了，但补考机会很多。"
        neutral: 何老师在总结表“团队协作”一栏写了“一般”。
        negative: 何老师说："名次我看重，但队伍带成这样，是队长失职。"
    projectFutureRules:
      - { key: heal, condition: { kind: state, key: teamTrust, op: gte, value: 50 }, text: "一年后三人重新组队，这次分工表两页纸，签了名。他们拿了金奖。" }
      - { key: default, condition: { kind: always }, text: "第二年你换了队友。新的分工表第一行写着：任何分歧，当天说清。" }
    specialTags: [bad_end, team]
    reflection: 内讧不是性格不合，是规则缺位。
    lessonHint: 冲突当天清，积怨毁全队

  - id: c_end_recognized_drained
    campaign: competition
    title: 《好评与透支》
    mainResult: 评委认可，但团队透支严重
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: mock_defense_done }
        - { kind: state, key: energy, op: lte, value: 30 }
        - { kind: flag, key: c_final_done }
    priority: 95
    tier: special
    baseText: |
      评审表上，"答辩表现"拿了全场第二高——评委说你们的应答"像打磨过一百遍"。
      确实打磨了一百遍。代价是：领奖台上，江雨桐的嗓子哑了，方远的黑眼圈垂到了下巴，你在回去的地铁上睡着了，坐过了三站。
      名次中上。身体的账单，晚一点也会到。
    growthVariantRules:
      - dimension: execution
        variants:
          - { gte: 65, text: "你们是用勤奋堆出来的完成度。有效，但不可复制——明年呢？" }
          - { lte: 45, text: "透支让最后两天的产出几乎为零。你要的不是冲刺，是节奏。" }
      - dimension: teamTrust
        variants:
          - { gte: 60, text: "好在你们互相逼着对方睡觉过——至少这一次。团队账上还有存款。" }
    characterEpilogueRules:
      - characterId: c_design
        positive: 雨桐在赛后请全队做了按摩，说这是"团队建设的正确形态"。
        neutral: 雨桐睡了两天。醒来发的第一条动态是："再也不熬了。"三个月后她破了纪录。
        negative: 雨桐病了一场，期中考试垮了两门。这个代价没人提前算过。
    projectFutureRules:
      - { key: sustainable, condition: { kind: always, }, text: "你在复盘文档顶部加了一行粗体：所有排期，先排睡觉。" }
    specialTags: [warning]
    reflection: 拿健康换的完成度，利息高得吓人。
    lessonHint: 疲劳是隐藏的硬伤

  - id: c_end_time_up
    campaign: competition
    title: 《21天，到这里》
    mainResult: 时间耗尽的开放式结算
    requirements: { kind: always }
    priority: 1
    tier: main
    baseText: |
      21天到了。故事停在它此刻的样子——也许在半途，也许还差最后一步。
      时间是比赛最公平的地方：每个队都是21天。你们用掉的那些，都真实地花在了某些地方。
    growthVariantRules:
      - dimension: execution
        variants:
          - { gte: 55, text: "你的倒排表大部分打了勾。时间不够的队很多，账目清楚的队很少。" }
          - { lte: 35, text: "21天像一场没睡醒的梦。醒来时，白板上的时间轴才画了一半。" }
      - dimension: aiDependence
        variants:
          - { gte: 65, text: "AI记得这21天的每个细节。可比赛是你们打的。" }
    characterEpilogueRules:
      - characterId: c_tech
        positive: 方远说："仓库留着，明年这周，我还有空。"
        neutral: 方远耸肩："反正比上课有意思。"
        negative: 方远已经拉了新队。头像换得很快。
    projectFutureRules:
      - { key: again, condition: { kind: always }, text: "新的周目已经开放。这一次，第1天你就知道该干什么。" }
    specialTags: [neutral, time_up]
    reflection: 比赛教的最贵一课：deadline不会等你准备好。
    lessonHint: 时间对谁都一样，方法决定它去哪
