    baseText: |
      三天，八个社团，无数杯茶。补出来的样本里藏着原样本永远给不了的答案：
      文艺社团怕收钱，体育社团怕批场地，学术社团怕交接——三个痛点，三条产品线，一张真正的需求地图。
      何老师看完纪要说："这五天的土，没白跑。"
    growthVariantRules:
      - dimension: evidenceDiscipline
        variants:
          - { gte: 65, text: "评委问到样本时，雨桐直接翻到配额表那页。孙教授笑了：「这是今天第一份让我想追问下去的材料。」" }
          - { lte: 45, text: "补是补了，口径还是没统一。真数据配着旧叙事，像新鞋配旧袜子。" }
    characterEpilogueRules:
      - characterId: c_design
        positive: 雨桐把那张需求地图裱在宿舍——她说这是她做过最累也最踏实的一页PPT。
        neutral: 雨桐从此负责所有调研的抽样设计。她说这叫「痛过才知道」。
        negative: 雨桐感慨要是第一轮就这么做就好了——那三天本可以用来打磨故事。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "那张三类痛点地图被下一届队伍沿用——真实的需求，是最耐用的资产。" }
    reflection: 偏差不可耻，可耻的是明知偏差还替它化妆。
    lessonHint: 发现样本偏差，最便宜的处理是立刻补齐
    specialTags: [research_fix]

  - id: c_v2_re_bias_coverup
    campaign: competition
    title: 《滴水不漏》
    mainResult: 用措辞掩盖抽样缺陷，在追问中信用崩塌
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: key_c_bias_hidden }
    priority: 91
    tier: main
    family: research_evidence
    tone: negative
    whyDistinct: 核心结果是「语言修复证据失败」，与补样/降级结局的机制完全不同
    baseText: |
      "深度访谈五人"——每个字都是真的，连起来却是一句谎话。
      孙教授的追问只有两层：第一层问样本，第二层问"为什么恰好都在一栋楼"。
      你的措辞没有漏洞。可漏洞不在措辞里，在数据里。滴水不漏的，从来只有水。
    growthVariantRules:
      - dimension: credibility
        variants:
          - { gte: 50, text: "你当场承认了抽样缺陷。评委记下了这个78比92的诚实版本——你们丢的是奖，不是全部。" }
          - { lte: 40, text: "你试图把话题引回产品功能。孙教授不再追问，只是在评分表上写了一行字。" }
    characterEpilogueRules:
      - characterId: c_design
        positive: 雨桐赛后把那页「滴水不漏」的材料删了，重写了一版带着局限说明的。她说这次睡得着了。
        neutral: 雨桐说：「文案没有错，错的是让我写它的人。」她说的是她自己。
        negative: 雨桐的完美主义从此拐向了另一个极端——所有材料都附三页局限声明，没人看得完。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "你们队的材料审查清单新增终审一问：「这页经得起第二层追问吗？」" }
    reflection: 措辞能修饰证据，不能替代证据。追问只有两层，但每层都通到底。
    lessonHint: 掩盖偏差的成本在答辩当天集中结算
    specialTags: [integrity]

  - id: c_v2_re_reframe
    campaign: competition
    title: 《初步探索》
    mainResult: 主动降级结论口径，用诚实换取可信度
