    baseText: |
      "补交材料"功能不存在—— Agent 生成的代码很漂亮，只是漂亮在另一个需求上。
      方远检查了三遍生成的依据，最后合上电脑："它没写错，是我们没写清。"
      那天你们做了一件比修代码更重要的事：把需求文档从六页扩到九页，逐条标注"必须"与"可选"。
    growthVariantRules:
