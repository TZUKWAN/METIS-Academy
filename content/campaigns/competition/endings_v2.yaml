    baseText: |
      组委会的问询函用了三个词：互相攻击、均可入场、下不为例。
      邱一鸣丢了口碑，你们丢了风度，比赛照常进行——只是两支队伍的名字，从此连在一起出现在负面例里。
      方远把那句话写进了复盘：「我们没能证明他抄袭，只证明我们会吵架。」
