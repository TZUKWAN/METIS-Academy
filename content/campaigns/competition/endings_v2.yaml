          - { lte: 45, text: "带教占用了你们期末的时间。有队友怨过，看完省赛直播后，怨气变成了截图发进群里——配文「值」。" }
    characterEpilogueRules:
      - characterId: c_design
        positive: 雨桐把复盘会的录音剪成了播客第一期。她说：「经验不发声，就会过期。」
        neutral: 雨桐把带教清单传给了下一届队长——传承安排上了二次传承。
        negative: 雨桐赛后累到住院观察一天。传承的账单，有时是拿健康付的。
