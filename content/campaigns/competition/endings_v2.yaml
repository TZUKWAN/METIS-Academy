    baseText: |
      「材料不全。」四个字，让三周的心血瞬间降格为一份待补交的文件。
      附件3第2条，命名规范——就一行字。第15天深夜你跳过的那11条，此刻变成了邮件里最冷的铅字。
      补交窗口24小时。你们的手比教训先动了起来。
    growthVariantRules:
      - dimension: evidenceDiscipline
        variants:
          - { gte: 55, text: "补交时你们附了一封说明信，逐条列出修正与自查结果。组委会回了句「态度端正」——印象分的裂缝补上了一半。" }
          - { lte: 40, text: "补交的文件命名又错了一次。第二次邮件到来时，全队没人敢点开。" }
    characterEpilogueRules:
      - characterId: c_advisor
        positive: 何老师把那封邮件裱了起来（字面意思），挂在实验室：「这是我教过的最贵的一行字。」
        neutral: 何老师说：「规则不看你的心血，只看你的格式。」
        negative: 何老师从此亲自检查你们每一份材料的命名——包括非比赛的。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "「材料不全」四个字被写在实验室门后，每个新队员进门第一眼就能看到。" }
    reflection: 格式是规则的门票，检票口不聊情怀。
    lessonHint: 提交前逐条对照官方清单，尤其是命名
    specialTags: [compliance]

