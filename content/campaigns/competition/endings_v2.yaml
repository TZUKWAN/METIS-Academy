  # ===== 证据家族 =====
  - id: c_v2_pq_sample_bias
    campaign: competition
    title: 《住在一栋楼的样本》
    mainResult: 便利样本在申报书上留下裂缝
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: key_c_sample_bias }
    priority: 91
    tier: main
    family: research_evidence
    tone: mixed
    whyDistinct: 核心结果是「抽样缺陷被识别但未修复」的中间状态，与补样/掩盖两条后续路径互斥
    baseText: |
      申报书交上去的那一刻，"深度访谈五人"六个字安安静静躺在方法论一节。
      只有你们知道这五个人是谁：三个室友，两个常一起吃饭的同学。
      数据好看得像便利用户的礼貌。裂缝埋好了，就等一个会追问的评委。
    growthVariantRules:
      - dimension: evidenceDiscipline
        variants:
          - { gte: 55, text: "你在附录老老实实写了抽样局限。这一行 honesty 后来被评委点名表扬——诚实没让你免罪，但买了尊重。" }
          - { lte: 40, text: "五个人的名字没出现在任何地方。你开始祈祷评委不问抽样——祈祷不是方法。" }
    characterEpilogueRules:
      - characterId: c_advisor
        positive: 何老师后来说：「那五份访谈我一眼就认出来了。你们没撒谎，只是没长大——长大就好。」
        neutral: 何老师在申报书那一页停了三秒，什么也没说。
        negative: 何老师那句「样本怎么选的」成了你们队内的黑话——专指一切心虚的环节。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "下一届队伍的访谈模板第一题变了：不是「问什么」，而是「去哪里找人」。" }
    reflection: 样本结构比样本数量更早决定结论的上限。
    lessonHint: 抽样方式要在设计时写死，而不是在答辩时补救
    specialTags: [sampling]

  - id: c_v2_pq_bias_owned
