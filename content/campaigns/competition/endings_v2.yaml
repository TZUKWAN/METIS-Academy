          - { lte: 40, text: "结论是降级了，可宣传海报还印着旧版本。诚实只做了一半，等于没做。" }
    characterEpilogueRules:
      - characterId: c_advisor
        positive: 何老师说：「认小最难。你们这次及格了——下次学着把小的做大。」
        neutral: 何老师翻着降级版的申报书，难得没挑出毛病。
        negative: 何老师嘀咕：「什么都承认局限，评委会以为你们什么都没做。」
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "「初步探索」成了你们队的常用词——它不是挡箭牌，是分期付款的承诺。" }
    reflection: 结论的尺寸要匹配证据的尺寸，多一寸都是负债。
    lessonHint: 结论与证据要同比例，宁可小而真
    specialTags: [calibration]

