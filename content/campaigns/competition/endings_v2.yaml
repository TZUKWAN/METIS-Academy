    reflection: 翻盘不靠新牌，靠把手里的牌打到极限。
    lessonHint: 弱势局面下，答辩强度是性价比最高的投入
    specialTags: [qa]

  # ===== Demo家族（本批） =====
  - id: c_v2_pd_gap_trimmed
    campaign: competition
    title: 《王同学退场》
    mainResult: 删除虚构叙事页，材料收敛回真实功能
    requirements:
      kind: and
      conditions:
