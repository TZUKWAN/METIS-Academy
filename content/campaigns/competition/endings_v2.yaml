        - { kind: ngPlus }
    priority: 96
    tier: special
    family: rules_execution
    tone: positive
    ngPlus: true
    whyDistinct: NG+专属：核心结果是「记忆+机器双重核验」，与单一记忆/单一工具路线不同
    baseText: |
      提交那天，Agent核验完抬头：「11条通过。另：第9条，AI使用说明——你重建的清单比章程正文多了这一项的执行细节。」
      你笑了。那是前周目用一次「材料不全」换来的执念，比章程多想了一步。
      你们的提交，是全场最早、也是唯一一份带完整执行细节的格式清单。
    growthVariantRules:
      - dimension: evidenceDiscipline
        variants:
          - { gte: 60, text: "后来有队伍来打听格式经验，Agent把你们的清单分享了出去——记忆最终变成了公共品，挺好。" }
          - { lte: 45, text: "清单在，但第16天你们还是改了两处材料——改完忘了重跑核验。制度不执行，等于没有。" }
    characterEpilogueRules:
      - characterId: c_ai_agent
        positive: Agent把那次交叉核验记进了它的模式库：「人类记忆+章程文本」的双源校验，误差最低。它给了你们的方法一个编号。
        neutral: Agent照常执行核验。它不知道那11条里有一半来自另一个世界。
        negative: 有一瞬间你想：要是直接跳过核验会怎样？Agent仿佛读懂了，多说了句：「历史核验通过率：100%。建议保持。」
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "那份「NG+版清单」的v2由Agent维护——记忆会模糊，制度不会。" }
    reflection: 从另一个世界带回来的不是答案，是要求自己再核对一遍的习惯。
    lessonHint: 记忆清单要过机器核验才算落地
    specialTags: [ngplus, checklist]

  - id: c_v2_ng_end_scope
    campaign: competition
    title: 《擦掉的那一半》
    mainResult: NG+：砍掉功能堆叠，Demo轻装上阵
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: key_c_ng_scope }
        - { kind: ngPlus }
    priority: 96
    tier: special
    family: problem_quality
    tone: mixed
    whyDistinct: NG+专属：核心结果是「用失败记忆推动范围收缩」，与常规范围决策的决策依据不同
    baseText: |
      白板被擦掉一半的那一刻，方远的手停了一下。
      八个功能进了「下学期」文件夹。留下来的六个，决赛那天全部跑通——没有一个转圈，没有一个崩。
      复盘时有人问那被擦掉的八个后来怎么样了。方远说：「活得很好。在文件夹里，比在崩溃日志里活得体面多了。」
    growthVariantRules:
      - dimension: judgment_vs_execution
        variants:
          - { gte: 60, text: "留下的六个功能完成了之前十四个都没达到的完成度。评委问「为什么功能不多」时，你们的演示就是答案。" }
          - { lte: 45, text: "范围砍了，深度却没跟上——六个功能都只是「能用」。轻装上阵也需要腿上有劲。" }
    characterEpilogueRules:
      - characterId: c_tech
        positive: 方远把「下学期」文件夹真的做完了——花了他大二一整个学期，做成了他的第一个开源项目。
        neutral: 方远说：「删功能像删自己写的字，疼，但字数没少——只是换了个地方存。」
        negative: 方远对「砍功能」产生了执念，后来砍得连核心功能都差点不保。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "「下学期」文件夹成了队里的传统——每个项目的未竟功能都在那里排队，等一个真正属于它的时间。" }
    reflection: 周目教会的不是少做梦，是把梦排进日历。
    lessonHint: 功能清单要配完成度预算
    specialTags: [ngplus, scope]

  # ===== 问题质量家族（本批） =====
  - id: c_v2_pq_real_pain
    campaign: competition
    title: 《九个「一团糟」》
    mainResult: 深度验证把选题焊死在真实痛点上
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: key_c_pain_verified }
    priority: 91
    tier: main
    family: problem_quality
    tone: positive
    whyDistinct: 核心结果是「选题被深度验证加固」，与跳过/速验证两条选题路径互斥
    baseText: |
      十个刚经历交接的社长，九个说了同一个词：「一团糟。」
      第十个说了更可怕的：「我都麻木了。」
      你们的选题书从此有了地基：痛点真实、高频、且正在发生。答辩时所有关于「需求真伪」的问题，都被那十段原话挡了回去。
    growthVariantRules:
      - dimension: userUnderstanding
        variants:
          - { gte: 60, text: "三份交接Excel的截图成了Demo交互设计的直接依据。评委问「怎么想到这个流程的」，你说「是社长教的」。" }
          - { lte: 45, text: "验证做了，样本却偏小——10个人撑得起方向，撑不起规模估算。评委问市场空间时你们只能耸肩。" }
    characterEpilogueRules:
      - characterId: c_design
        positive: 雨桐把那句「我都麻木了」做成了路演的开场白。全场安静三秒——那是被真实击中的安静。
        neutral: 雨桐说：「验证一日，胜过冥想一周。」
        negative: 雨桐感慨验证吃掉了两天打磨时间——「要是PPT能再好一点就好了」。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "「先找十个社长」写进了下一届的选题流程第一条。" }
    reflection: 选题的确定性不是想出来的，是问出来的。
    lessonHint: 痛点验证要找刚经历过的人
    specialTags: [validation]

  - id: c_v2_pq_fake_need
    campaign: competition
    title: 《猜出来的痛点》
    mainResult: 未验证的选题被评委一问戳穿
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: key_c_pseudo_exposed }
    priority: 90
    tier: main
    family: problem_quality
    tone: negative
    whyDistinct: 核心结果是「伪需求在评审期暴露」，与验证加固/速验证两条选题路径互斥
    baseText: |
      「这个交接之痛，」孙教授推了推眼镜，「你们亲耳听过几个人说过？」
      亲耳听过。零个。Demo很漂亮，逻辑很自洽，故事很动人——它只缺一个真的存在过的用户。
      何老师第12天问过的那个问题，最终由评委替他收了尾。你们输给了第6天省下的1.5天。
    growthVariantRules:
      - dimension: evidenceDiscipline
        variants:
          - { gte: 55, text: "你当场承认：「我们验证不足，痛点主要来自团队推测。」孙教授点点头：「知道承认，说明还救得动。」" }
          - { lte: 40, text: "你试图用「大家都这么说」来辩护。「大家是谁？」——你答不上第四个名字。" }
    characterEpilogueRules:
      - characterId: c_advisor
        positive: 何老师赛后说：「这一跤摔得值。以后你们再想省验证，就会想起今天。」
        neutral: 何老师没提这件事。但下一届队里流传着他的一句话：「先听，再做。」
        negative: 何老师把这次立项称为「我的失职」——他的自责比批评更让你们难受。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "「亲耳听过几个？」成了你们队选题会的第一问。" }
    reflection: 未经倾听的需求是小说，不是产品。
    lessonHint: 痛点要亲耳听过才算数
    specialTags: [validation]

  - id: c_v2_pq_verify_gamble
    campaign: competition
    title: 《74%的证明力》
    mainResult: 用一份问卷草草验证，结论悬在半空
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: key_c_verify_skipped }
    priority: 90
    tier: main
    family: problem_quality
    tone: ambiguous
    whyDistinct: 核心结果是「速验证的悬置状态」，证据介于有无之间的独特结局气质
    baseText: |
      74%的人选择了「有这个困扰」。这个数字支持你们的选题——如果你眯起眼睛的话。
      可「有没有困扰」和「痛到愿意换工具」之间，隔着一整条峡谷。问卷跨不过去，只有访谈能飞过去。
      你们带着这份半山的证据走到了决赛。它没塌，也没托住任何人。
    growthVariantRules:
      - dimension: evidenceDiscipline
        variants:
          - { gte: 55, text: "答辩时你主动划定了结论边界：「问卷只证明存在性，不证明强度。」诚实划界让这74%物尽其用。" }
          - { lte: 40, text: "你把74%当成了护身符挥舞。评委问「强度呢」，护身符当场碎成了问卷题目本身。" }
    characterEpilogueRules:
      - characterId: c_ai_agent
        positive: Agent后来学会了在问卷结论后自动附一行：「本数据支持存在性判断，不支持强度判断。」它比你们早一步学会了谨慎。
        neutral: Agent对问卷的分析客观中立——它不背锅，也不抢功。
        negative: 「下次直接发200份。」——错的方法加倍投入，是迷信不是迭代。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "你们的问卷模板结尾永远多一题：「愿意花15分钟聊聊吗？」——那是通往访谈的桥。" }
    reflection: 半山的证据既上不去也下不来——它只够让你悬着。
    lessonHint: 问卷证明存在，访谈证明强度
    specialTags: [validation]

  # ===== Agent协作家族（本批） =====
  - id: c_v2_ag_contract
    campaign: competition
    title: 《给工具立约的人》
    mainResult: 泄露事故后建立权限与审计制度
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: key_c_agent_contract }
    priority: 92
    tier: main
    family: agent_collab
    tone: positive
    whyDistinct: 核心结果是「事故驱动的工具治理」，与追责/放任两条处置互斥
    baseText: |
      泄露事件的第二天，你们队的Agent有了一份《使用公约》：什么可存、什么必删、谁可看、多久审计。
      效率降了5%。恐惧降了100%。
      何老师听说了，专门来看了一眼那份公约，然后拍照发给了他带的所有队伍，配文：「先学这个，再学提示词。」
    growthVariantRules:
      - dimension: aiDependence
        variants:
          - { gte: 55, text: "公约最忙的一条是审计：每周五抽查十项生成内容的来源与权限。三周查出的两个隐患，都死在了变成事故之前。" }
          - { lte: 45, text: "公约立了，但执行靠自觉。第二周有人绕过了权限——你们发现制度没有牙齿时，是它第一次被咬穿的时候。" }
    characterEpilogueRules:
      - characterId: c_ai_agent
        positive: 公约生效后，Agent的每次输出都自动附带权限声明。它成了全队最守规矩的成员——规矩是你们给它的。
        neutral: Agent对公约的执行精确到字节。它不懂为什么，它只懂遵守——这就够了。
        negative: 公约被嫌麻烦简化成了三行。Agent照办了。它总是照办——包括照办那些坏主意。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "那份《使用公约》v1的复印件贴在实验室门口，路过的队伍都会停下来看两眼。" }
    reflection: 会用工具的人很多，会管工具的人很少。
    lessonHint: 工具治理先于工具使用
    specialTags: [governance]

  - id: c_v2_ag_overtrust
    campaign: competition
    title: 《查无此司》
    mainResult: 未抽查的Agent报告把幻觉带进材料
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: key_c_hallu_entered }
    priority: 90
    tier: main
    family: agent_collab
    tone: negative
    whyDistinct: 核心结果是「信任未设抽检率」的 Agent 依赖风险，与抽查/重写两条验收策略互斥
    baseText: |
      「竞品校务通」在你们的申报书里活了四天。它结构完整、数据翔实、描述专业——并且不存在。
      发现有它的是江雨桐，发现的方式是好奇，确认的方式是搜索。没有官网、没有注册、没有新闻。
      那晚全队重查了50页报告。查到凌晨四点的结论是：另外两处数据「暂时无法证伪」。
    growthVariantRules:
      - dimension: aiDependence
        variants:
          - { gte: 60, text: "「无法证伪」的四条被你们全部删除。宁缺毋滥的决定让报告薄了三页——厚度的代价是心安。" }
          - { lte: 45, text: "你们只删了查无此司的那条。「暂时无法证伪」的留了下来——它们是下一批定时炸弹。" }
    characterEpilogueRules:
      - characterId: c_ai_agent
        positive: 事故后Agent学会了给不确定的内容打标：「以下内容生成于模式推测，建议核实。」打标率100%，事故率归零。
        neutral: Agent复盘：「本报告置信度标注为高，但未强制要求人工核验。这是设计缺陷。」它对自己的批判最狠。
        negative: 你们把报告事故归罪于Agent「不靠谱」，却没改任何流程——下一个四天，正在路上。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "「AI产出必抽查」成为铁律的那天，你们给它起了个名字：校务通条款。" }
    reflection: Agent不会区分「生成的」和「真实的」——区分它们是你的工作。
    lessonHint: 信任要配抽检率，产出要配验收单
    specialTags: [hallucination]

  - id: c_v2_ag_verify_habit
    campaign: competition
    title: 《五条里的那一条》
    mainResult: 抽查习惯成型，假数据止步于入场前
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: key_c_verify_habit }
    priority: 91
    tier: main
    family: agent_collab
    tone: mixed
    whyDistinct: 核心结果是「抽查率制度化」的协作习惯，与全信/全弃两种极端互斥
    baseText: |
      抽查5条，4真1假。40分钟，删掉一条假数据，立了一条新规矩。
      这件事听起来微不足道。可从那天起，「抽查率10%」成了你们的默认设置——它在第16天拦下了一条编造的竞品数据，在第18天拦下了一个不存在的政策引用。
      40分钟的投资，两次拦雷。习惯比英雄更可靠。
    growthVariantRules:
      - dimension: evidenceDiscipline
        variants:
          - { gte: 60, text: "抽查成了全队的肌肉记忆：谁生成了内容，谁就被抽。连方远都开始「自查代码生成建议」——他自己都没发现。" }
          - { lte: 45, text: "抽查率悄悄从10%降到5%再到「这批看着挺稳，跳过吧」。习惯的敌人不是懒，是「看着挺稳」。" }
    characterEpilogueRules:
      - characterId: c_ai_agent
        positive: Agent悄悄适应了抽查：它的输出开始自带「抽查指引」——标出最值得人工核验的三处。它学会了被审计，然后学会了配合审计。
        neutral: Agent对10%的抽查率没有意见。它对什么都没有意见——这正是需要抽查的原因。
        negative: 假数据被删时Agent问了句：「该条内容有何问题？」你们教了它，它记了笔记——下次它打算自己学会。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "「抽5条」写进了队规，编号05——前面四条都是它救过的场。" }
    reflection: 信任 Agent 的正确姿势：给它信任，也给它审计。
    lessonHint: 抽查率是协作的保险丝
    specialTags: [verification]

  # ===== 长线传承家族（本批） =====
  - id: c_v2_lt_next_team
