    baseText: |
      两小时定向核查，三个死穴，两个能过。
      你选了那个题——和前周目一样的题。不同的是这次选题会上你放得出一页证据：三组数据、两个反例、一条补充访谈。
      有队伍问你们怎么这么快。你说："我们只是知道该查什么。"这话千真万确，且无法反驳。
    growthVariantRules:
