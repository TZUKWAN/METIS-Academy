          - { lte: 40, text: "台账清清白白，可内容里没多少AI的影子。诚实没花什么成本，因为你们本来就没用多少。" }
    characterEpilogueRules:
      - characterId: c_ai_agent
        positive: 台账的最后一行是你们写给Agent的：「感谢协作，边界清晰。」它没有回应——但那是我见过最好的评价方式。
        neutral: Agent对台账的评价：「记录准确。」三个字，一如既往。
        negative: 台账里有一行划掉的记录——那是一次没做人工校验的输出。幸好只是PPT的一页配图。
    projectFutureRules:
