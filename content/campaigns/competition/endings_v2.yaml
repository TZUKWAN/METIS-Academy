    whyDistinct: NG+专属结局：核心结果是「记忆转化为提前行动」，只可能发生在周目重开之后
    baseText: |
      组队当天你按住了那两只准备击掌的手。
      十分钟后，分工表诞生。方远盯着"视频制作：方远"看了三秒，问："为什么我觉得这个表格很重要？"
      你说不出"我上辈子在第8天摔过"。你只说："写下来的东西，不会在deadline前变成谜语。"
    growthVariantRules:
      - dimension: teamTrust
        variants:
          - { gte: 60, text: "材料周日，雨桐把分工表拍在群里：「谢谢第3天的我们自己。」方远回了个敬礼。" }
          - { lte: 45, text: "表是立了，执行还是打了折。记忆能给你先手，给不了你全队的自律。" }
    characterEpilogueRules:
      - characterId: c_tech
        positive: 方远后来养成怪癖：组队必先写表。他不知道为什么，「就是觉得不写要出事」。
        neutral: 方远配合地签了字。有些价值，要等第8天他没被冤枉时才想起来。
        negative: 方远说「你这人怎么提前知道这么多」——你笑而不语，他也没再问。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "那张v0分工表被留了下来，页脚写着一行小字：「献给某个没人记得的第8天。」" }
    reflection: 周目的意义不是预知灾难，是提前三十分钟做那件对的事。
    lessonHint: 记忆的价值要兑换成当场的行动
    specialTags: [ngplus, team_contract]

  - id: c_v2_ng_end_ai
    campaign: competition
