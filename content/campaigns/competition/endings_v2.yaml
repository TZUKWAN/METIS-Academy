          - { lte: 40, text: "话术在第2轮追问时用尽了。评委在表上写：'材料与产品边界不清。'" }
    characterEpilogueRules:
      - characterId: c_design
        positive: 雨桐赛后把「叙事边界」写进了她的设计规范第一条：故事只讲系统里存在的路。
        neutral: 雨桐说：「下次故事照讲——但每个场景我都先问一句：真的吗？」
