# 竞赛线 V2 扩展结局（全部由唯一 flag 门控，priority 90-99）
# 家族分布：competition_result / problem_quality / team / research_evidence / product_demo / innovation / presentation_defense / rules_execution / agent_collab / longterm_cross
endings:
  # ===== 团队家族 =====
  - id: c_v2_tm_unwritten
    campaign: competition
    title: 《视频是谁做的？》
    mainResult: 未书面确认的分工在材料周引爆返工
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: key_c_unwritten_split }
    priority: 92
    tier: main
    family: team
    tone: mixed
    whyDistinct: 本结局的核心结果不是奖级而是「分工契约缺位」这一独立后果，由第3天口头分工唯一导出
    baseText: |
      申报书、PPT、视频，最后一样在deadline前40分钟拼了出来。
      没有人做错什么——除了第3天那句"口头说定就行"。
      复盘会上雨桐把那张迟到的分工表贴在墙上，标题写着："本表本应诞生于第3天。"
    growthVariantRules:
      - dimension: teamTrust
        variants:
          - { gte: 60, text: "好在没有人记仇。方远说：'下次谁再讲默契，我把这页PPT拍他脸上。'" }
          - { lte: 40, text: "三个人都没再提这件事。但下学期组队通知发出来时，群里安静了很久。" }
    characterEpilogueRules:
      - characterId: c_tech
        positive: 方远现在接任何活，第一句都是「先写清楚归谁」。
        neutral: 方远把分工表截图设成了聊天背景。
        negative: 方远在实习组的第一次例会上就重演了这一幕——这次他成了那个以为别人做了的人。
      - characterId: c_design
        positive: 雨桐把那版拼凑的视频也存了档：「它丑，但它教会我们的东西最贵。」
        neutral: 雨桐从此负责队里所有文档，因为「写下来」三个字她再也不假手于人。
        negative: 雨桐后来拒绝参加任何「先干起来再说」的项目。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "那张分工表被你们传给了下一届参赛队，表头第一行写着：'先写下来，再击掌。'" }
    reflection: 默契是结果，契约是前提。把前提当结果，就要在deadline前付利息。
    lessonHint: 口头分工必须落成书面契约，尤其是「谁做视频」这种小事
    specialTags: [team_contract]

  - id: c_v2_tm_stay_pact
    campaign: competition
    title: 《一份叫〈安心〉的文档》
    mainResult: 得知队友去向并重签契约，队伍平稳走完赛程
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: key_c_tech_stay }
    priority: 91
    tier: main
    family: team
    tone: positive
    whyDistinct: 核心结果是「以契约化解队友退出风险」，与其他团队结局的冲突/流失路径完全不同
    baseText: |
      决赛技术台上站着的还是方远。他守着那台跑通压测的机器，身后是打印出来的交接文档。
      没有人知道他兜里揣着实习offer——知道了也没关系，文档第一页写着分工，最后一页写着"决赛我到场"。
      雨桐说，那是她见过最浪漫的离职预防。
    growthVariantRules:
      - dimension: teamTrust
        variants:
          - { gte: 65, text: "答辩结束那天，方远把工牌和奖状并排拍了张照：'两个都是真的。'" }
          - { lte: 45, text: "契约撑住了赛程，却没撑住友情。他退群时说：'文档在，随时能接手。'" }
    characterEpilogueRules:
      - characterId: c_tech
        positive: 方远的实习转正答辩里，评委指着交接文档问「这是什么风格」——他答：「被一个队长教的。」
        neutral: 方远赛后如约退居二线，群里只在中奖时冒头。
        negative: 方远没能平衡两头，决赛前夜他发来一份新的交接文档，署名日期是明天。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "《安心》成了你们队每届的传家宝，版本号已经更到v7。" }
    reflection: 让人留下来的从来不是挽留，是一份写得清清楚楚的边界。
    lessonHint: 队友的去向要摊开谈，用契约代替猜测
    specialTags: [team_contract, trust]

  - id: c_v2_tm_confront_rift
    campaign: competition
    title: 《再没说废话的人》
    mainResult: 摊牌施压导致核心队友冷暴力式疏离
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: key_c_tech_confront }
    priority: 91
    tier: main
    family: team
    tone: negative
    whyDistinct: 核心结果是「施压式沟通造成的持续性关系破裂」，区别于契约型与流失型团队结局
    baseText: |
      方远没有走。他修完了所有bug，交齐了所有文档，然后在群里的发言变成了"收到""改好了""已部署"。
      决赛他来了，站完了属于他的八分钟，鞠躬下台。
      庆功宴他没来。你在他朋友圈看到实习工牌的照片，配文："新环境，新开始。"
    growthVariantRules:
      - dimension: independence
        variants:
          - { gte: 60, text: "你在复盘里写：'我用最伤人的方式说出了最合理的要求。合理不等于正确。'" }
          - { lte: 40, text: "你把责任推给了他的「心态」。这个说法你自己都不信。" }
    characterEpilogueRules:
      - characterId: c_tech
        positive: 半年后方远在食堂主动跟你打了招呼。裂痕还在，但至少能看清对面的人了。
        neutral: 你们再也没有单独说过话。
        negative: 他带新队拿了下一届的金奖。颁奖照片里，每个人都笑得很用力。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "队伍的技术能力强了一截，但再没有人敢在组队时说真话。" }
    reflection: 摊牌的目标是解决问题，不是解决提出问题的人——哪怕那个人是你自己不爽的。
    lessonHint: 对队友的秘密，先谈边界再谈去留
    specialTags: [team_conflict]

  - id: c_v2_tm_silent_leaver
    campaign: competition
    title: 《长在脑子里的文档》
    mainResult: 回避沟通导致核心成员冲刺期撤出，技术知识无人接手
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: key_c_tech_ignore }
    priority: 91
    tier: main
    family: team
    tone: negative
    whyDistinct: 核心结果是「知识单点依赖在核心成员离场时的总爆发」，与冲突型结局的破裂机制不同
    baseText: |
      冲刺周第2天，方远的工位空了。服务器还在跑，可部署步骤、账号密码、架构取舍——全在他的脑子里。
      雨桐对着面板点开了每一个菜单，像在玩一款没有教程的游戏。
      你守住的不是秘密，是一颗雷的引信。现在它响了。
    growthVariantRules:
      - dimension: evidenceDiscipline
        variants:
          - { gte: 55, text: "你们靠着文档习惯抢回了三成知识，演示做成了降级版——至少它跑完了。" }
          - { lte: 40, text: "决赛演示到第4步，一个只有方远知道的配置项让系统拒绝登录。" }
    characterEpilogueRules:
      - characterId: c_tech
        positive: 方远深夜发来一份手写部署指南，末尾写着：「对不起，也谢谢你们没问。」
        neutral: 方远在实习很忙，你们的对话停留在他退群的那句「祝好」。
        negative: 后来有人问「你们队那个技术呢」，雨桐替你回答：「他去了更远的地方。」
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "下一届队伍的第一条队规诞生了：任何知识不落盘，等于不存在。" }
    reflection: 装作不知道，是把选择权交给了最坏的时间点。
    lessonHint: 单点依赖要提前消解，秘密要提前定价
    specialTags: [bus_factor]

  - id: c_v2_tm_advisor_takeover
    campaign: competition
    title: 《第6版方案》
    mainResult: 项目在指导老师主导下拿奖，但队伍失去了作者身份
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: key_c_advisor_takeover }
    priority: 90
    tier: main
    family: team
    tone: ambiguous
    whyDistinct: 核心结果是「主导权让渡后的胜利归属困惑」，区别于边界重谈与单干型结局
    baseText: |
      何老师的第6版方案确实赢了。颁奖台上他站在C位，你们仨站在两侧，像三个来合影的 nephew。
      奖状是真的，资源是真的，可雨桐在台下问了一句："我们参加的是比赛，还是他的方法论验证？"
      没有人回答。奖杯很重，托着它的手有点虚。
    growthVariantRules:
      - dimension: independence
        variants:
          - { gte: 60, text: "你在复盘里写：'我用主导权换了胜率。这笔交易我对一半，后悔一半。'" }
          - { lte: 40, text: "你很快习惯了被安排。下一个项目立项时，你的第一反应是「去问老师」。" }
    characterEpilogueRules:
      - characterId: c_advisor
        positive: 何老师后来在课上讲这个案例，说：「那届学生教会我，带队的尽头是放手。」
        neutral: 何老师的战绩又添一行。他的Excel里，你们是一行数据。
        negative: 何老师把下一届也安排成了同样的方案，这次他们连奖都没拿到——评委见过一遍了。
      - characterId: c_tech
        positive: 方远靠这个项目进了大厂实习。面试官问哪个部分是你做的，他报出了附录第3页。
        neutral: 方远说：「拿奖就行，姓谁的无所谓。」他说这话时没看任何人。
        negative: 方远再也没参加过何老师的项目，连点名都没到。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "信息中心的合作延续到了下学期。项目活着，创始人却换成了方法论。" }
    reflection: 借来的胜率要用作者身份偿还。有的账，领奖那天才开始算。
    lessonHint: 接受资源时先谈主导权归属
    specialTags: [advisor]

  - id: c_v2_tm_advisor_boundary
    campaign: competition
    title: 《十分钟的谈判》
    mainResult: 与指导老师重划边界，项目回到队伍手中并走得更好
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: key_c_advisor_reset }
    priority: 91
    tier: main
    family: team
    tone: positive
    whyDistinct: 核心结果是「向上管理成功重获主导权」，与全盘接受/决裂两条路径互斥
    baseText: |
      那十分钟里你说完，办公室安静得能听见空调滴水。
      然后何老师笑了："五届了，你是第一个跟我说'这是我们的项目'的学生。"
      方案退回第三版——你们自己的版本。决赛那天，何老师坐在最后一排，全程没看手机。
    growthVariantRules:
      - dimension: independence
        variants:
          - { gte: 65, text: "答辩时你主动提到何老师的贡献，然后补了一句：'方向和代码是我们的。'台下他点头了。" }
          - { lte: 45, text: "谈判赢了，执行却没跟上。你证明了自己要得起主导权，还没证明你接得住。" }
    characterEpilogueRules:
      - characterId: c_advisor
        positive: 何老师把「十分钟的谈判」写进了他的指导手册第一条：先问学生想做什么。
        neutral: 何老师照旧很忙。但你们的组会，他一次都没缺席过。
        negative: 何老师嘴上说「年轻人有想法」，手上把资源转给了更听话的一队。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "信息中心的接口续到了第二年——这次，申请人是你们自己。" }
    reflection: 主导权不是老师给的，是学生谈出来的。
    lessonHint: 资源与边界要一起谈，冲突要当面谈
    specialTags: [advisor, negotiation]

  - id: c_v2_tm_authorship_lost
    campaign: competition
    title: 《候场时的一拍沉默》
    mainResult: 决赛过关，但队伍对项目归属的沉默暴露了空洞
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: key_c_advisor_deep }
    priority: 90
    tier: main
    family: team
    tone: negative
    whyDistinct: 核心结果是「归属感流失在决赛时刻的显影」，与主动让渡（第6版方案）结局的心路不同
    baseText: |
      "这是你们老师的研究方向吧？"——就这一句闲聊，让候场区安静了一拍。
      那一拍里，雨桐看方远，方远看你，你看地板。
      决赛过了。可散场路上没人说话，每个人都抱着一份说不清是谁的成果。
    growthVariantRules:
      - dimension: independence
        variants:
          - { gte: 55, text: "你在总结里写：'那一拍沉默是警钟。下一个项目，第一个字由我们自己敲。'" }
          - { lte: 40, text: "你安慰自己「结果好就行」。可你发现你连项目的需求文档都没打开过。" }
    characterEpilogueRules:
      - characterId: c_design
        positive: 雨桐下一学期立项了自己的项目，立项书第一行写着：「这是我们自己的。」
        neutral: 雨桐把这段经历做成了作品集里的一个匿名条目。
        negative: 雨桐退出了下一届比赛——她说不想再体会候场时的那一拍沉默。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "项目归档时，三人在README里为「作者」一栏争执了十分钟，最后写了个团队代号。" }
    reflection: 归属感不写在署名栏里，写在每个人开口的速度里。
    lessonHint: 项目归属要趁早确认，沉默会在最重要的时刻发声
    specialTags: [belonging]

  - id: c_v2_tm_solo_way
    campaign: competition
    title: 《自主的汇率》
    mainResult: 拒绝老师资源独自闯关，付出数据与工时的代价
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: key_c_solo_way }
    priority: 90
    tier: main
    family: team
    tone: mixed
    whyDistinct: 核心结果是「以资源换自主的独立发展路径」，与谈判成功/主导权让渡结局互斥
    baseText: |
      43条自己爬的数据，撑起了一个小小的、完全属于你们的Demo。
      它比何老师方案里的三千条数据寒酸得多——可当评委问"这个想法怎么来的"，你们仨同时开口。
      自主的汇率很贵：三个通宵，两次返工，一次差点散伙。但发票抬头写着你们自己的名字。
    growthVariantRules:
      - dimension: independence
        variants:
          - { gte: 70, text: "答辩最后一页你们放了一张爬虫代码截图，配文：'数据是我们一条一条捡来的。'评委席有人笑了。" }
          - { lte: 45, text: "自主撑住了叙事，没撑住完成度。你说「我们赢在下学期」，台下没人接话。" }
    characterEpilogueRules:
      - characterId: c_tech
        positive: 方远把爬虫脚本开源了，README写着：「献给所有没有资源的学生队。」
        neutral: 方远说「下次有资源还是要接的，但方向得是我们的」。你同意了一半。
        negative: 方远在复盘会上说：「自主不能当饭吃。」这次的裂痕，靠时间才合上。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "那43条数据成了下一届的冷启动数据集——自主是可以继承的。" }
    reflection: 拒绝资源不是姿态，是一笔要算清的汇率。
    lessonHint: 婉拒援助前，先估清自主的账单
    specialTags: [independence]

  # ===== 问题质量家族 =====
  - id: c_v2_pq_topic_regret
    campaign: competition
    title: 《41个卷王》
    mainResult: 赛道选择后陷入懊悔与换道抉择的拉扯
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: key_c_track_regret }
    priority: 90
    tier: main
    family: problem_quality
    tone: mixed
    whyDistinct: 核心结果是「赛道误判后的中途抉择期」，与最终坚持/换道两种结局形成分流
    baseText: |
      算法赛道名单公示那晚，你们盯着41个对手看了很久——7支有论文，3支背后是实验室。
      方远问："我们拿什么卷？"雨桐问："现在换还来得及吗？"
      第9天的这通争吵没有输赢，它只是把一个第4天就该算清的账，摆上了台面。
    growthVariantRules:
      - dimension: judgment_vs_execution
        variants:
          - { gte: 60, text: "你把情绪按住，带着两人做了个对手矩阵。做完矩阵，答案自己浮出来了。" }
          - { lte: 40, text: "你们吵到实验室锁门。第二天谁也没提换道的事——用沉默代替了决定。" }
    characterEpilogueRules:
      - characterId: c_tech
        positive: 方远后来选技术路线前都会先拉一遍对手名单：「41个卷王教会我的。」
        neutral: 方远说「赌都赌了」，然后埋头把性能又提了一截。
        negative: 方远在决赛那天看到隔壁赛道的人数，久久没说话。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "你们的选赛道清单里多了一行加粗的字：'先数对手，再数自己的热情。'" }
    reflection: 选赛道是在选对手、选评委、选叙事——热情只是其中一票。
    lessonHint: 报名前先做赛道强度调查
    specialTags: [track_choice]

  - id: c_v2_pq_topic_stuck
    campaign: competition
    title: 《将错就错》
    mainResult: 明知赛道误配仍硬着头皮坚持到底
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: key_c_track_stuck }
    priority: 90
    tier: main
    family: problem_quality
    tone: negative
    whyDistinct: 核心结果是「沉没成本驱动的坚持」，与果断换道结局的因果链完全相反
    baseText: |
      "换的话五天白干。"方远把这句话钉在了白板上。
      五天确实白干了——在你们最终排名第六、而应用赛道隔壁那队用同样的创意拿了金奖的时候。
      复盘会上你说"至少我们坚持了"。雨桐小声接了一句："坚持和将就，隔着一张对手名单。"
    growthVariantRules:
      - dimension: judgment_vs_execution
        variants:
          - { gte: 60, text: "你在换道窗口关闭前留了一手：把核心模块做成了双赛道通用。这份远见值回了票价的一半。" }
          - { lte: 40, text: "你们把「坚持」重复了二十一遍，直到它听起来像咒语而不是决策。" }
    characterEpilogueRules:
      - characterId: c_design
        positive: 雨桐把那张对手矩阵裱了起来——她说这是她交过最贵的学费凭据。
        neutral: 雨桐说：「我们尽力了。」这句话她说得很轻，像怕吵醒什么。
        negative: 雨桐后来每个决定都做两手准备，她说她再也不想把命运押在一个赛道名上。
    projectFutureRules:
