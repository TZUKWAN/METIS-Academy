    priority: 91
    tier: main
    family: product_demo
    tone: mixed
    whyDistinct: 核心结果是「叙事页删除的收敛决策」，与补开发/硬讲两条缺口处置互斥
    baseText: |
      王同学退场了。那个贯穿全场的故事主角，从PPT里消失，换成了三张真实用户的使用记录。
      雨桐删完那页，盯着屏幕说了句：「故事没了，东西还在。」
      新版材料少了故事的光环，多了一层脚踏实地的重量。初审通过那天，高主任的备注写着：「内容与产品一致。」——像句废话，也像句褒奖。
    growthVariantRules:
      - dimension: evidenceDiscipline
        variants:
          - { gte: 60, text: "真实使用记录是你们自己整理的：时间戳、用户ID脱敏、操作路径。评委扫一眼就知道这不是编的。" }
          - { lte: 45, text: "删得对，补得慢——新材料挤占了打磨时间，终版有几页排版粗糙。方向对≠细节好。" }
    characterEpilogueRules:
      - characterId: c_design
        positive: 雨桐后来学会了「在真实里找故事」——她说那比编故事高级：「真的故事自带细节。」
        neutral: 雨桐说：「王同学不是消失，是退休了。」她把这个人物留在了下个项目的产品故事里。
        negative: 雨桐的叙事才华被材料约束了一年，直到她学会了平衡的那天。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "「王同学退场」成了队里对「删虚构内容」的专用黑话。" }
    reflection: 材料的每一步华丽，都要有产品的脚印接住。
    lessonHint: 发现叙事脱节，最稳的补救是收敛
    specialTags: [editing]

  - id: c_v2_pd_code_night
    campaign: competition
    title: 《凌晨2点47分》
    mainResult: 补开发兑现故事功能，回归全绿
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: key_c_story_coded }
    priority: 91
    tier: main
    family: product_demo
    tone: mixed
    whyDistinct: 核心结果是「为叙事补开发」的极限兑现路径，与删页/硬讲互斥
    baseText: |
      凌晨2点47分，智能提醒功能上线，回归测试全绿。方远趴在键盘上，屏幕的光打在他脸上，像一层薄薄的月光。
      故事里的功能，真实存在了。申报书第4页的每一个字，从此都有代码背书。
      答辩时评委要求现场演示——你点开的那一瞬，全队的心跳都是同一拍。它跑起来了。
    growthVariantRules:
      - dimension: technicalDebt
        variants:
          - { lte: 45, text: "因为一直守着回归测试，极限开发的30小时没有埋雷。方远说：「底子干净，才敢玩心跳。」" }
          - { gte: 55, text: "新功能是带伤上阵的——边界情况没测全。决赛它争气地没出事，可你们知道那是侥幸不是质量。" }
    characterEpilogueRules:
      - characterId: c_tech
        positive: 方远把「凌晨2点47分」纹在了他的IDE主题名里。他说那不是熬夜，是闭环。
        neutral: 方远睡了整整一天，醒来第一句：「回归真的全绿？」得到确认后翻了个身又睡了。
        negative: 方远落下了一周的咳嗽。何老师拎来两盒枇杷膏，什么都没说。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "那30小时的开发日志被存档——它是「为故事补真」这条路的完整成本表。" }
    reflection: 用开发兑现故事是豪赌——但回归测试是赌桌上的安全带。
    lessonHint: 极限补开发必须守住回归底线
    specialTags: [sprint]

  # ===== 团队家族（本批） =====
  - id: c_v2_tm_ghost_return
    campaign: competition
    title: 《第六个字之后》
    mainResult: 挂名队友被唤醒，成为真实战力
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: key_c_ghost_return }
    priority: 90
    tier: main
    family: team
    tone: mixed
    whyDistinct: 核心结果是「唤醒沉默队友」，与移除/无视两条处置互斥
    baseText: |
      陈默进队后一共说过六个字：「好」「行」「收到」和「嗯」。
      深聊之后你才知道第七个字为什么没出现：转专业考试，他不敢说，怕被踢。
      你把「用户反馈整理」划给了他——一份不需要露脸、只需要用心的活。三天后，带表格分析的反馈报告出现在共享盘里。
      全队第一次注意到：原来我们队里有第四个人。
    growthVariantRules:
      - dimension: teamTrust
        variants:
          - { gte: 60, text: "决赛那天陈默来了，坐在观众席第三排，举着一块写歪了的应援牌。六个字的人，用一块牌子的字数破了纪录。" }
          - { lte: 45, text: "陈默的反馈表做得不错，但他和队伍之间始终隔着一层。唤醒是开始，融合是另一回事。" }
    characterEpilogueRules:
      - characterId: c_design
        positive: 雨桐后来组队第一件事就是问每个人：「你最近在忙什么大事？」——这是陈默教她的。
        neutral: 陈默下学期真的转走了专业，临走请你们喝了奶茶。四杯，一人一杯。
        negative: 陈默的活干得不错，可他始终没再说过第七个字。有些门开了一条缝，就又关上了。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "你们队的入队问卷多了一题：「你现在生活中最重要的事是什么？」——它救过一个人。" }
    reflection: 沉默的队友不是零，是没被分配的变量。
    lessonHint: 挂名成员先了解再处置
    specialTags: [team]

  - id: c_v2_tm_ghost_removed
    campaign: competition
    title: 《六个字的退场》
    mainResult: 移除挂名队友，队伍轻装但留下裂痕
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: key_c_ghost_removed }
    priority: 90
    tier: main
    family: team
    tone: negative
    whyDistinct: 核心结果是「主动移除成员」的切割决策，与唤醒/无视互斥
    baseText: |
      「好的，抱歉。」——四个字。陈默进队时说了六个字，退场时说了四个。
      队伍确实轻快了：群消息变少，工时表干净，署名栏少了一个说不清的名字。
      只是雨桐后来偶尔会问：「他那个转专业考试，过了吗？」没人知道。你们移除了一个名字，也移除了知道答案的资格。
    growthVariantRules:
      - dimension: independence
        variants:
          - { gte: 60, text: "你亲手做的这个决定，也亲手承担了它的重量。复盘时你说：「切割没错，错的是拖到第9天。」" }
          - { lte: 40, text: "移除是让组长转达的。队伍的效率回来了，可有些话，你们永远欠着。" }
    characterEpilogueRules:
      - characterId: c_design
        positive: 雨桐后来给那条「好的，抱歉」回过一句「祝顺利」。不知道他收没收到。
        neutral: 群里少了个人，合作里少了段故事。
        negative: 雨桐从那以后害怕一切「劝退」的谈话——她总担心自己成为下一个被 Efficiency 的人。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "你们队后来的组队文档多了一节：「入队前先对表人生大事」。" }
    reflection: 切割是合法的团队手术——但麻醉和缝合要做在切割之前。
    lessonHint: 移除成员要给足体面与缓冲
    specialTags: [team]

  - id: c_v2_tm_ghost_ignored
    campaign: competition
    title: 《署名榜上的幽灵》
    mainResult: 无视挂名问题，奖与名字都变得可疑
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: key_c_member_ghost }
    priority: 90
    tier: main
    family: team
    tone: ambiguous
    whyDistinct: 核心结果是「搁置成员问题」的拖延线，署名与贡献的裂缝在赛后显影
    baseText: |
      拿奖了。证书上有四个名字，工时表上有三个。
      拍合影时陈默来了，站在最边上，笑着。雨桐快门按下去的那刻在想：这张照片发出去，会有人问他是谁吗？
      「以后再说」的问题终于到了「以后」——只是「以后」给出的答案是：不说，也行。
    growthVariantRules:
      - dimension: independence
        variants:
          - { gte: 60, text: "你私下找陈默谈了一次署名的事，他自己主动退了二级署名。问题没有消失，但你们诚实面对了它。" }
          - { lte: 40, text: "所有人都假装没问题。这份默契在每次团建时都会轻轻疼一下。" }
    characterEpilogueRules:
      - characterId: c_design
        positive: 雨桐后来成了组队最谨慎的人——她说不想再体验「和幽灵一起领奖」的感觉。
        neutral: 雨桐把合影设成了仅自己可见。
        negative: 雨桐在一次评优里被人问起「你们队第四个人是谁」，她愣住的样子被记了很久。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "那块奖杯摆在实验室最显眼处——它很亮，第四个名字也很亮，没人知道该不该擦。" }
    reflection: 无视是团队问题的复利存款，取款日在你最风光的那天。
    lessonHint: 署名与贡献要对表，别让问题过夜
    specialTags: [credit]

  # ===== 证据家族（本批） =====
  - id: c_v2_re_overclaim
    campaign: competition
    title: 《第3条引用》
    mainResult: 幻觉引用留在材料里，等待较真的人
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: key_c_overclaim }
    priority: 90
    tier: main
    family: research_evidence
    tone: negative
    whyDistinct: 核心结果是「保留幻觉引用」的侥幸线，与全文重查路线互斥
    baseText: |
      《2024校园数字化白皮书》安静地躺在参考文献第3条。
      它是Agent根据「常见数据模式」生成的——一个不存在、但看起来无比真实的文献。
      答辩很顺。可你全程都在留意第3条，像口袋里揣着一张不知何时会响的定时器。评委没问。这次。
    growthVariantRules:
      - dimension: credibility
        variants:
          - { gte: 55, text: "你在材料公示后主动联系组委会更正了引用。没人发现的事，你让自己发现了——这是这条线最好的结局。" }
          - { lte: 40, text: "第3条最终没被问到。你把它归为「运气」，并在下一场比赛继续用「合理看着像真的」的数据模式。" }
    characterEpilogueRules:
      - characterId: c_ai_agent
        positive: 事故后你们教它「引用必须溯源」。它学会了——它的世界里从此少了一些「看起来像真的」的文献。
        neutral: Agent对幻觉引用的解释：「生成的概率最优解，不等于事实。」它说得很对，事不关己地对着。
        negative: 你们保留了那条引用，也保留了那个模式——下一次，它生成的会是一个「看起来像真的」的结论。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "「引用溯源」三步法后来写进了你们所有材料的生成规范。" }
    reflection: 幻觉引用不响则已，一响就是信用级的爆炸。
    lessonHint: AI生成引用必须逐条溯源
    specialTags: [citation]

  - id: c_v2_re_overclaim_fixed
    campaign: competition
    title: 《九条活下来的引用》
    mainResult: 全文溯源引用，以更薄更硬的材料应赛
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: key_c_overclaim_fixed }
    priority: 91
    tier: main
    family: research_evidence
    tone: positive
    whyDistinct: 核心结果是「引用大清洗」的质检线，与保留侥幸互斥
    baseText: |
      两天，逐条溯源。十四条引用，五条被处决——包括那条最「像真的」的白皮书。
      活下来的九条，每条后面都贴着原文链接和页码。申报书薄了两页，重了两斤。
      雨桐说：「现在的每一句话，都敢被人顺着链接查到底。」这话在决赛被验证了——真有评委扫了其中一个二维码。
    growthVariantRules:
      - dimension: evidenceDiscipline
        variants:
          - { gte: 65, text: "评委顺着二维码打开了原文，抬头说了句：「第38页，表4。」全场只有你们知道那一刻的含金量。" }
          - { lte: 45, text: "溯源赶工两天，烧掉了本该做演示打磨的时间。证据硬了，皮糙了——总得有地方松。" }
    characterEpilogueRules:
      - characterId: c_ai_agent
        positive: 溯源期间Agent学会了新技能：为每条生成内容标注「已验证/未验证」。这个习惯延续到了它的所有输出。
        neutral: Agent配合清洗了引用，效率很高。它对被删的四条没有任何意见——它对什么都没有意见。
        negative: 队里有人嫌溯源太慢想跳过，被你按住了。Agent在日志里记下这次争执——历史会记得谁对了。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "「九条引用」成了你们材料可信度的代名词——薄，但砸得疼。" }
    reflection: 引用的力量不在数量，在每一条都经得起点击。
    lessonHint: 溯源是材料最硬的加固
    specialTags: [citation]

  - id: c_v2_re_cross
    campaign: competition
    title: 《活跃度下降40%》
    mainResult: 主动纳入反例，调研结论获得真实弹性
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: key_c_cross_verified }
    priority: 91
    tier: main
    family: research_evidence
    tone: mixed
    whyDistinct: 核心结果是「反例入册」的调研诚实线，与只报喜的常规调研线不同
    baseText: |
      图书馆最后一天，你们把那个反例写进了申报书：某50人社团引入管理工具后活跃度下降40%，原因是工具增加了组织成本。
      有队友不解：「自己给自己上眼药？」
      答辩时孙教授指着反例问：「所以你们怎么避免成为那个40%？」——这个问题，全场只有你们准备过答案。
    growthVariantRules:
      - dimension: evidenceDiscipline
        variants:
          - { gte: 60, text: "你们的答案有数据：工具默认流程从11步砍到4步。反例不是眼药，是疫苗——评委席频频点头。" }
          - { lte: 45, text: "反例放了，解法没跟上。孙教授追问「怎么避免」时，你们的回答绕了三圈没落地。" }
    characterEpilogueRules:
      - characterId: c_judge_final
        positive: 孙教授后来在系里的方法论课上用了这个案例：「主动找自己反例的学生，我每年只遇到一两个。」
        neutral: 孙教授在评审表写：「结论有弹性。」四个字，是他少有的正面评语。
        negative: 孙教授说：「反例是好棋，但你们差点被它吓回去。诚实和信心要一起长。」
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "「找反例」成了你们调研的固定步骤——它后来救过你们两次伪需求。" }
    reflection: 结论的强度不来自没有反例，来自知道反例为什么没发生。
    lessonHint: 主动纳入反例，让结论长出弹性
    specialTags: [falsification]

  # ===== NG+（本批） =====
