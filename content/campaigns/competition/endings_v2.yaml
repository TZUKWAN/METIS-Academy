        variants:
          - { gte: 60, text: "评委后来引用了你们那页核查证据，说「这才叫验证」。你没告诉他，这份熟练度练了很多个周目。" }
          - { lte: 45, text: "定向核查省了时间，也省掉了意外发现——别的队伍在乱撞中撞见了更好的题。" }
    characterEpilogueRules:
      - characterId: c_ai_agent
        positive: Agent记录了你的核查路径并标注「高效」。它不知道，这条路径是你的第三个周目踩出来的。
        neutral: Agent照常列出了核查清单。清单的顺序，和你记忆里的死穴一模一样。
        negative: Agent问：「为何跳过常规全面扫描？」你答不上来，只好又补了一轮。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "你把「定向核查三死穴」写成了模板——记忆会过期，方法不会。" }
    reflection: 记忆可以给你地图，路还是要自己走一遍——踩着证据走。
    lessonHint: 用记忆加速验证，而不是跳过验证
    specialTags: [ngplus, verification]

  - id: c_v2_ng_end_judge
