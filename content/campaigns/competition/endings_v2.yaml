    baseText: |
      没砍页，没提速，没彩排。雨桐说：「正式上场我会更兴奋。」
      她说对了，也说错了。兴奋让她的开场比彩排亮了三倍，也让中段快得像倒带。
      超时铃响起时她还有两页。评委摆摆手让她讲完——那天他们心情不错。你们赢了，赢在一个没人能计划的东西上。
    growthVariantRules:
      - dimension: riskTolerance
        variants:
          - { gte: 60, text: "复盘时你说：「赌赢了。」方远接：「下次还赌吗？」没人回答。这个问题不需要答案，因为下次不会一样。" }
          - { lte: 40, text: "超时被扣了分。你安慰自己「内容都没丢」——可你们都知道，丢掉的是选择权。" }
    characterEpilogueRules:
      - characterId: c_design
        positive: 雨桐把这次称为「我人生最刺激的八分钟」——然后默默把下次的稿砍了三页。
        neutral: 雨桐说：「赌就是赌，不后悔，也不再来。」
        negative: 雨桐后来不再相信「临场会更好」这句话——包括别人说的时候。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "复盘文档里那页写着「赌赢了」，旁边有人用铅笔补了一行：「也赌输了未来的排期。」" }
    reflection: 临场变量是真实的——但把计划建在变量上，是把队伍押给运气。
    lessonHint: 可以接受赌，但要清楚赌桌上下注的是全队
    specialTags: [gamble]

  # ===== 规则执行家族 =====
  - id: c_v2_ru_format
    campaign: competition
    title: 《材料不全》
    mainResult: 提交格式不合规，材料资格一度告危
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: key_c_submit_flagged }
    priority: 90
    tier: main
