      没有申诉，没有解释。你把格式改完，补交，收到一封「已收到」。
      就这样？就这样。没有人知道你们经历了什么，也没有人欠你们一句评价。
      有些损失是隐形的：评委不会知道那封迟到的材料背后有什么。你们把这个无声的一小时，咽进了复盘里。
    growthVariantRules:
      - dimension: independence
        variants:
          - { gte: 60, text: "你在复盘里写：「认栽一小时，省下的是争辩三天。这笔账我认。」有人觉得你亏了，你觉得你赚了。" }
          - { lte: 40, text: "你不申诉是因为不敢。这份「低调」，其实是逃避穿着体面的衣服。" }
    characterEpilogueRules:
      - characterId: c_advisor
        positive: 何老师后来说：「那次你们咽得快。能咽的性格，走得更远。」
        neutral: 何老师没评价。他只是在下次例会上多讲了十分钟「材料规范」。
        negative: 何老师私下说：「该争的时候不争，评委会以为你们真的错了。」
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "那封「已收到」被截图存档——它什么都没说，又好像什么都说了。" }
    reflection: 认错要快，但要知道自己认的是错，还是话语权。
    lessonHint: 补救的沉默有成本，选择前先定价
    specialTags: [compliance]

  - id: c_v2_ru_resubmit
    campaign: competition
    title: 《11条全绿》
    mainResult: 通宵彻查全部格式，把事故变成制度
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: key_c_resubmit }
    priority: 91
    tier: main
    family: rules_execution
    tone: mixed
    whyDistinct: 核心结果是「过度补救转化为可复用制度」，与认栽/申诉路线的结果形态不同
    baseText: |
      本来只错了一条。你们把11条全查了一遍。
      凌晨四点，最后一条打上钩。那份清单后来被Agent做成了自动核验模板——从此每次提交，4分钟，全绿。
      事故的最好结局不是没发生，是变成制度。
    growthVariantRules:
      - dimension: evidenceDiscipline
        variants:
          - { gte: 60, text: "你们把清单共享到了年级大群。评论区有人问「这是哪个队整理的」——你们没说，但骄傲是藏不住的。" }
          - { lte: 45, text: "清单是有了，第二次提交时还是有人想跳过。「用一次吧，求你了。」——制度最怕的从来不是错，是懒。" }
    characterEpilogueRules:
      - characterId: c_ai_agent
        positive: Agent把那份清单设为了所有提交任务的默认检查项。制度的执行力，第一次比人可靠。
        neutral: Agent说：「清单已收录。」它收录过很多东西，这份是少见的由你们自己写的。
        negative: 清单躺在共享盘里落灰——Agent提醒过三次，都被「下次再说」按了下去。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "那份清单的版本号停在v1——因为它从来没需要改过。" }
    reflection: 一次事故的正确打开方式，是让它永远无法第二次发生。
    lessonHint: 补救要超出事故范围，做成防复发机制
    specialTags: [process]

  # ===== 创新家族 =====
  - id: c_v2_in_copy_fight
