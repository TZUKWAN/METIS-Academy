    specialTags: [legacy]

  - id: c_v2_lt_quiet_exit
    campaign: competition
    title: 《擦干净的白板》
    mainResult: 安静谢幕，把起点还给实验室
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: key_c_quiet_exit }
    priority: 90
    tier: main
    family: longterm_cross
    tone: ambiguous
    whyDistinct: 核心结果是「无仪式的收束」，与仪式收尾/怨气散伙两种赛后姿态互斥
    baseText: |
      白板擦干净之前，你们拍了张照。21天的推演、争吵、计划、里程碑——都在那一板密密麻麻里。
      然后它变成了干干净净的一块黑板，像什么都没发生过。
      各自道别时没有煽情。方远走到门口回了下头，雨桐在楼下挥了挥手。有些句号是安静的，但它们收得很紧。
    growthVariantRules:
      - dimension: independence
        variants:
          - { gte: 60, text: "你在日记里写：「我们不需要仪式来确认它发生过。」这句话写下的瞬间，你确认了自己长大了。" }
          - { lte: 40, text: "没有仪式的告别让一些话永远没说出口。半年后有人提起「当时其实想……」——晚了半年的一句话。" }
    characterEpilogueRules:
      - characterId: c_tech
        positive: 方远把那张白板照片打印出来，裁成三份，一人一张。背面写着：谢谢，不谢。
        neutral: 方远说：「散了就散了，又不是死了。」他后来每学期都这么说，每学期都聚。
