  - id: c_v2_in_buzz
    campaign: competition
    title: 《概念密度前5%》
    mainResult: 概念堆砌的方案在追问下显出空心
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: key_c_buzzword }
    priority: 90
    tier: main
    family: innovation
    tone: negative
    whyDistinct: 核心结果是「概念先行」的创新失真，与人话化/单点收敛两条命名策略互斥
    baseText: |
      「基于多智能体协同的全域校园服务生态」——孙教授把这个名字念了一遍，慢慢地问：
      「多智能体，是几个？全域，是哪个域？生态——指你们那个报名表单吗？」
      三连问，问号像手术刀。你听见自己的声音越来越小，直到变成一句：「……主要是报名。」
      全场很安静。安静得能听见概念蒸发的声音。
    growthVariantRules:
      - dimension: evidenceDiscipline
        variants:
          - { gte: 55, text: "你在第三问时止损了：「您说得对，名字起大了。产品解决的是报名这一件事。」诚恳兜底，输的一半赢了回来。" }
          - { lte: 40, text: "你继续用概念解释概念。孙教授不再追问，在「创新性」一栏写下了那个你们最怕的词：空洞。" }
    characterEpilogueRules:
      - characterId: c_judge_final
        positive: 孙教授赛后说：「名字起大的孩子很多，能自己承认的很少。你们记住这个感觉，比记住奖重要。」
        neutral: 孙教授在评分表上写完，轻轻合上了你们的材料。
        negative: 孙教授在下一届评审会上引用了你们的名字当反面教材——没有提队名，但每个字都是你们。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "「主要是报名」成了你们队内的自我警句——专治一切起名上头。" }
    reflection: 概念是利息，证据是本金；只付利息的方案会破产在追问里。
    lessonHint: 名字的尺寸不能超过产品的尺寸
    specialTags: [naming]

