          - { lte: 40, text: "跳页之后又是翻错页。评委低头写字的声音，是你们那八分钟唯一的伴奏。" }
    characterEpilogueRules:
      - characterId: c_design
        positive: 雨桐此后每场演讲必彩排三遍。她说：「我不欠排练的了。」
        neutral: 雨桐把那次台本折了角，放进抽屉最深处。
