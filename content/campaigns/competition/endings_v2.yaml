    tone: positive
    ngPlus: true
    whyDistinct: NG+专属：核心结果是「先立约后使用」的协作前置，与事后补救型Agent结局路径互斥
    baseText: |
      "第一条：所有事实性输出，必须附来源链接。"
      前周目里它编过的引用、跑偏的PPT、存进公共库的核心Prompt——这次，全都没有发生。
      Agent照常高效，只是每个输出后面都拖着一条安静的链接，像系好的鞋带。
    growthVariantRules:
      - dimension: aiDependence
        variants:
          - { gte: 55, text: "有队友嫌附链接麻烦。你打开前周目记忆里那页「编造的引用」——哦不对，那页只存在于你的脑子里。你说：「信我一次。」" }
          - { lte: 40, text: "铁律太严，效率掉了两成。你在想：约束和信任的配比，也许还要再调几个周目。" }
    characterEpilogueRules:
      - characterId: c_ai_agent
        positive: 赛后你翻它的会话日志，发现它在第20天自动补了一条来源校验——规矩已经长成了它的习惯。
        neutral: Agent对铁律的评价是「已保存」。三个字，一个是效率，一个是边界。
        negative: 铁律被队友嫌烦删掉了两条。你盯着空了两行的文档，像看见没锁的门。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "那三条铁律你带到了下一个项目，如今已经有了第七条。" }
    reflection: 对工具最深的了解，是知道它会在哪里坑你——然后提前一天把栏杆装上。
    lessonHint: NG+的真正外挂是把教训前置成规则
    specialTags: [ngplus, agent_contract]

  - id: c_v2_ng_end_topic
    campaign: competition
    title: 《踩着证据选的》
    mainResult: NG+：定向验证命中选题，既快又稳
