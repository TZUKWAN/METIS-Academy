    baseText: |
      申诉信写了三稿。第一稿在喊冤，删了；第二稿在甩锅，删了；第三稿只做三件事：承认疏漏、说明修正、询问依据。
      组委会的回复很官方，但有一句是暖的：「经复核，格式条款存在理解空间，贵队补交材料进入正常评审。」
      何老师看完只说了一句：「会吵架的人很多，会谈规则的人很少。」
    growthVariantRules:
      - dimension: independence
        variants:
          - { gte: 60, text: "申诉是你执笔的。后来组委会的学长说，那封信被评委传阅过——「这队的学生懂规矩」。" }
          - { lte: 45, text: "申诉保住了资格，没保住印象分。规则内的胜利，也是要用姿态去换的。" }
    characterEpilogueRules:
      - characterId: c_advisor
        positive: 何老师把那封申诉信存进了教学邮箱，主题栏写着：范文。
        neutral: 何老师点点头：「没白教。」
        negative: 何老师嘀咕：「申诉有风险——这次是他们运气好，条款真有歧义。」
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "那封申诉信的第三稿被命名为「规则沟通模板」，静静躺在队里的共享盘。" }
    reflection: 规则不是用来怕的，是用来读的；读完的规则才可以谈。
    lessonHint: 事故后第一封信决定评委的第二印象
    specialTags: [appeal]

