          - { lte: 40, text: "你们把怒气带进了决赛答辩，评委问合作场景时语气冲得像在打架。分数替你们付了账。" }
    characterEpilogueRules:
      - characterId: c_rival
        positive: 邱一鸣在赛后主动握手：「都是屁孩子。下次拿作品说话。」你握了——比赛结束了，人没散。
        neutral: 邱一鸣再没和你们说过话。两条路，各自走远。
        negative: 邱一鸣把「那个队」做成了他每届赛前的动员素材：「别学他们。」
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "你们队的冲突手册第一页：「先存证，后发声，永远不裸奔。」——用一场战争换来的三句话。" }
    reflection: 揭发需要证据，愤怒不需要——所以愤怒总跑得更快。
    lessonHint: 竞争冲突先走证据流程，不走情绪通道
    specialTags: [conflict]

