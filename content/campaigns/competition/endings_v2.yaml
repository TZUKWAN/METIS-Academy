    characterEpilogueRules:
      - characterId: c_tech
        positive: 方远把那一个功能调优到了极致。他说：「我第一次知道，把一件事做到底比做十件事到一半爽。」
        neutral: 方远说：「就一个功能，我还挺不甘心的。」但他的手很诚实地只优化了它。
        negative: 方远后来总想「要是再多讲一个功能」——贪念是会发芽的。
