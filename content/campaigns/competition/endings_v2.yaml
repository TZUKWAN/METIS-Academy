    baseText: |
      打印店老板还记得你们：那群把PPT改了七遍的学生。
      第七遍改的不是内容，是结构——数据放左上，结论放第一行，证明材料标页码。因为第10天的走廊里，高主任边走边说了那三条。
      决赛那天，评委在第7页停留了将近两分钟。全场平均，是90秒。
    growthVariantRules:
      - dimension: evidenceDiscipline
        variants:
          - { gte: 60, text: "你把那三条用到了申报书、PPT、海报每一处。有评委嘀咕：「这队的材料像量过尺寸。」" }
          - { lte: 40, text: "情报拿到了，执行却只改了PPT。申报书还是老样子——评委会先看哪份，你们比谁都清楚。" }
    characterEpilogueRules:
      - characterId: c_judge_prelim
        positive: 高主任在评审会上说：「有一支队伍的材料，是我这些年读得最顺的。」
        neutral: 高主任照常90秒一页地翻。翻到第7页，他多停了一秒——一秒，在评审里算是很久了。
        negative: 高主任后来发现你们「针对」过他的阅读习惯，笑着说了句「聪明」，评分却没加。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: "「数据放左上」成了你们队所有材料的不成文宪法。" }
    reflection: 材料的第一读者是评委，不是你自己。为他设计，不是讨好他。
    lessonHint: 评审注意力是稀缺资源，结构比辞藻值钱
    specialTags: [judge_perspective, hidden_path]

