    dialogue:
      - { speaker: 方远, text: "名字不重要，能跑才重要。", mood: neutral }
      - { speaker: 江雨桐, text: "评委翻开申报书第一个看到的就是名字。\"社管系统\"听着像要收物业费。", mood: serious }
    choices:
      - id: name_guanjia
        text: 定\"社团管家\"——名字即定位：我们管的是烦琐事
        visibleResponse: 申报书第一栏敲定。雨桐顺手把PPT母版标题也改了。名字定了，后面的材料突然都有了主心骨。
        hiddenEffects: [{ kind: add, key: execution, value: 3 }, { kind: setFlag, key: name_set }]
      - id: name_tech
