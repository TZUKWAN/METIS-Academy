    day: 3
    type: npc
    trigger: { kind: manual }
    purpose: { learning: 口头分工要落成文字 }
    scene: { location: lab, characters: [c_tech, c_design] }
    setup: ["开工会前最后确认。你把分工表念了一遍，要求每个人说出自己\"不许做的事\"。"]
    dialogue:
      - { speaker: 方远, text: "我，功能与测试。不许做的事：不许接需求——需求走你。", mood: neutral }
      - { speaker: 江雨桐, text: "我，材料与体验。不许做的事：不许在数据上\"润色\"。", mood: serious }
    choices:
      - id: sign_charter
        text: 把这份口头确认写成分工表v2，全员回复\"确认\"
        visibleResponse: 群里四条\"确认\"排成一列。这也许是全场最便宜的一份合同。
        hiddenEffects: [{ kind: add, key: teamTrust, value: 5 }, { kind: setFlag, key: charter_v2 }]
        next: c_xe3_kickoff
      - id: oral_enough
        text: 都听见了就行，不用搞形式主义
        visibleResponse: 一周后关于——视频脚本谁写——的争论中，每个人都记起了不一样版本的分工商定。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 3 }]
        next: c_xe3_kickoff
    unlockKnowledge: [kc_c_team_charter]
    next: c_xe3_kickoff

  - id: c_xe3_conflict_seed
    campaign: competition
    day: 3
    type: story
    trigger: { kind: day, day: 3, phase: end }
    purpose: { narrative: 第一次摩擦, learning: 摩擦来自标准不同而非人品 }
    scene: { location: lab, characters: [c_tech, c_design] }
    setup: ["方远给报名页配了系统默认按钮——灰色，直角。雨桐盯着看了十秒，说\"这也拿得出手？\"方远说\"能点不就行了\"。"]
    dialogue:
      - { speaker: 方远, text: "功能逻辑没问题。你嫌丑是审美问题，不是工程问题。", mood: angry }
      - { speaker: 江雨桐, text: "演示的时候，评委就是靠\"感觉\"打分的！丑就是扣分！", mood: angry }
      - { speaker: 系统, text: "两个人都对了一半。半对加半对，需要一个整对的裁决。" }
    next: c_xe3_conflict_choice

  - id: c_xe3_conflict_choice
    campaign: competition
    day: 3
    type: decision
    keyDecision: true
    trigger: { kind: manual }
    purpose: { learning: 冲突裁决要回到共同判据 }
    scene: { location: lab, characters: [c_tech, c_design] }
    choices:
      - id: judge_by_user
        text: 裁决标准：\"用户第一眼看到什么\"——拿演示脚本当判据
        visibleResponse: 你指着10步演示脚本第1步："用户第一眼是报名页。雨桐出样式稿，方远保证三步内能报上名。"两人各自认领，散会。
        hiddenEffects: [{ kind: add, key: teamTrust, value: 6 }, { kind: setFlag, key: conflict_resolved_v1 }, { kind: achievement, achievementId: ach_c_first_judgment }]
      - id: judge_by_vip
        text: 和稀泥：都让一步，各改一点
        visibleResponse: 按钮变成了浅灰圆角——没人满意，也没人再吵。这一页成了全项目——差不多——文化的起点。
        hiddenEffects: [{ kind: add, key: technicalDebt, value: 3 }, { kind: subtract, key: teamTrust, value: 2 }]
      - id: judge_by_cap
        text: 站方远这边：功能优先，样式以后再说
        visibleResponse: 雨桐没再说话。当晚她把自己的样式稿发在群里，附言："那按你们的来。"群里的安静有点响。
        hiddenEffects: [{ kind: subtract, key: teamTrust, value: 6 }, { kind: setFlag, key: design_sulking }]
    learningPoint: 冲突裁决回到共同判据，而不是看谁声音大
    terminal: true

