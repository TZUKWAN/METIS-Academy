  - id: c_xe4_pain_rank
    campaign: competition
    day: 7
    type: decision
    trigger: { kind: day, day: 7, phase: end }
    purpose: { learning: 痛点排序=产品边界的民意基础 }
    scene: { location: lab, characters: [c_tech, c_design] }
    setup: ["痛点清单七条。只能选一个做主打——申报书里「解决所有问题」的项目，评委默认它一个都解决不了。"]
    choices:
      - id: rank_by_data
        text: 按访谈频次×强度排序：催交+去重并列第一，做「收表→自动去重→一键催交」
        visibleResponse: 排序表贴墙。主打功能定案，其余五条进「路线图」。老K在朋友圈看到产品概念图，主动转发：「这就是我说的那个东西！」
        hiddenEffects:
          - { kind: add, key: userUnderstanding, value: 6 }
          - { kind: setFlag, key: pain_ranked }
          - { kind: add, key: credibility, value: 4 }
      - id: rank_by_demo
        text: 哪个功能演示起来最炫就主打哪个——AI推荐好友社团！
        visibleResponse: 方远眼睛亮了。但七次访谈里没有任何人提过想要推荐。炫点悬在真空里，落不了地。
        hiddenEffects: [{ kind: add, key: technicalDebt, value: 5 }, { kind: setFlag, key: fancy_focus }]
    unlockKnowledge: [kc_c_mvp_scope]
    terminal: true

  - id: c_xe4_focus_group
    campaign: competition
    day: 7
    type: npc
    trigger: { kind: random, weight: 2 }
    purpose: { narrative: 老K带来的五人社长小群, learning: 廉价快速的concept测试 }
    scene: { location: canteen, characters: [] }
    setup: ["老K拉了个五人社长小群让你发概念图。五个人，四种反应，加一个沉默的。"]
    dialogue:
      - { speaker: 老K, text: "（语音）我看了，就问一句：能不能设报名上限？我们场地只装得下80人，年年超。", mood: neutral }
    choices:
      - id: ask_follow_up
        text: 追问这个细节：上限满了之后，候补怎么排？
        visibleResponse: 五人群瞬间活跃：候补、优先级、部门配额……一个你没规划过的功能域浮出水面。记进停车场，主线不变。
        hiddenEffects: [{ kind: add, key: userUnderstanding, value: 6 }, { kind: setFlag, key: quota_insight }]
      - id: just_thanks_group
        text: 回复「收到！上线一定加！」然后溜了
        visibleResponse: 老K回了个「+1」。你收获了好人缘和一条没有细节的需求——做的时候你会发现「报名上限」三个字根本不够。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 3 }]
    terminal: true

