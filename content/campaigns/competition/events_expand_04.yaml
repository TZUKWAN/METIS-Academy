        text: 不演练，材料都对，直接交
        visibleResponse: 提交时发现申报书是「终稿2」不是「终稿3」，撤回重传——而系统提示「撤回后需等管理员审核」。那半小时你体验了什么叫心跳过速。
        hiddenEffects: [{ kind: subtract, key: energy, value: 12 }, { kind: add, key: academicDebt, value: 3 }]
