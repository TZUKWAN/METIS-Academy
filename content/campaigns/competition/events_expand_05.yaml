        visibleResponse: 「基本不会」——孙教授追问：「81%在你们自己的申报书里。19%去哪了？」你的答案和你的材料打了一架。
        hiddenEffects: [{ kind: subtract, key: credibility, value: 10 }, { kind: setFlag, key: hard_q_flubbed }]
        next: c_xe7_final_closing
