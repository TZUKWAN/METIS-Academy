# 竞赛线扩展包05：初赛 / 复赛网评 / 评委 / 对手 / 临场应对（D17-D21）
events:
  - id: c_xe7_prelim_morning
    campaign: competition
    day: 19
    type: story
    trigger: { kind: day, day: 19, phase: start }
    purpose: { narrative: 初赛日早晨, learning: 比赛日的仪式感与检查 }
    scene: { location: dorm, characters: [] }
    setup: ["初赛日上午。你按清单检查：U盘×2、备用机、一页纸应答卡、充电宝、纸质申报书一份。方远在群里发了三个字：「都到位。」"]
    dialogue:
      - { speaker: 系统, text: "比赛日的平静不是运气，是清单给的。" }
    next: c_xe7_prelim_wait_room

  - id: c_xe7_prelim_wait_room
    campaign: competition
    day: 19
    type: npc
    trigger: { kind: manual }
    purpose: { narrative: 候场区观察, learning: 候场时间的管理 }
    scene: { location: corridor, characters: [c_rival] }
    setup: ["候场区。邱一鸣的队伍在第9号，你们第11号。他的队员在低声过稿子，他本人翘着腿刷手机——演给你们看的。"]
    dialogue:
      - { speaker: 邱一鸣, text: "（路过）你们手都在抖？放轻松，初赛而已。", mood: pleased }
      - { speaker: 方远, text: "（低头系鞋带）他说的对，初赛而已。（系了个死结）", mood: neutral }
    choices:
      - id: warm_up_routine
        text: 按彩排惯例热身：默讲一遍开场30秒+深呼吸三轮
        visibleResponse: 三人轮流默讲开场。轮到林晓时她声音有点抖，讲完自己愣住："好像也没那么可怕。"
        hiddenEffects: [{ kind: add, key: energy, value: 4 }, { kind: setFlag, key: warmup_done }]
        next: c_xe7_prelim_qa_data
      - id: spy_on_rival
        text: 凑近听第9号队伍过稿子，摸他们的重点
        visibleResponse: 你听到了三个功能名，没听到任何数据。信息没用上，自己的热身时间倒是没了。
        hiddenEffects: [{ kind: subtract, key: energy, value: 3 }]
        next: c_xe7_prelim_qa_data
    terminal: true

  - id: c_xe7_prelim_qa_data
    campaign: competition
    day: 19
    type: npc
    trigger: { kind: manual }
    purpose: { narrative: 初赛数据追问, learning: 每个数字都要能说出处 }
    scene: { location: defense_hall, characters: [c_judge_prelim] }
    setup: ["答辩进行中。高主任的手指停在数据页：「81%。三轮均值——三轮样本分别是多少？差异多大？」"]
    dialogue:
      - { speaker: 高主任, text: "81%很好看。我想知道的是 variance。", mood: serious }
      - { speaker: 你, text: "三轮分别是78%、82%、83%，样本量120。第三轮高是因为修了两个分类错误后补测的。" }
      - { speaker: 高主任, text: "（第一次抬头看了你们一眼）continue。", mood: neutral }
    next: c_xe7_prelim_surprise_q
    choices:
      - id: answer_precise
        text: 精确作答：每轮数字、样本、差异原因
        visibleResponse: 答完这题，剩下的问题明显变温和了——数据答得动的队伍，评委会自动降低攻击性。
        hiddenEffects: [{ kind: add, key: credibility, value: 8 }, { kind: setFlag, key: prelim_data_good }]
      - id: answer_vague
        text: 「大致都在80%左右」——模糊但不出错
        visibleResponse: 高主任「嗯」了一声，在表格上写了什么。那个「嗯」的音调你会在今晚反复回放。
        hiddenEffects: [{ kind: subtract, key: credibility, value: 4 }, { kind: setFlag, key: prelim_data_shaky }]
    terminal: true

  - id: c_xe7_prelim_surprise_q
    campaign: competition
    day: 19
    type: decision
    keyDecision: true
    trigger: { kind: manual }
    purpose: { learning: 没准备的问题：诚实+现场推理 }
    scene: { location: defense_hall, characters: [c_judge_prelim] }
    setup: ["最后一个问题超出准备范围：「如果学校明年统一采购了一个商业社团系统，你们的项目还有什么价值？」"]
    choices:
      - id: honest_think
        text: 停两秒，诚实推理：商业系统管全校，我们管「最后三公里」的社团自定义
        visibleResponse: 你承认没想过这个场景，然后现场分析：商业系统覆盖通用流程，但72个社团的个性化表单和去重规则没人管——那是你们的生存空间。高主任在表上落笔。
        hiddenEffects:
          - { kind: add, key: credibility, value: 6 }
          - { kind: add, key: independence, value: 5 }
          - { kind: setFlag, key: surprise_q_survived }
        next: c_xe7_prelim_exit
      - id: bluff_hard
        text: 「我们的技术领先，任何竞品都无法替代」
        visibleResponse: 高主任追了一句：「哪个技术点？」你报了两个功能名——那是功能，不是技术。他合上了材料。
        hiddenEffects: [{ kind: subtract, key: credibility, value: 8 }, { kind: setFlag, key: bluff_failed }]
        next: c_xe7_prelim_exit
    terminal: true

  - id: c_xe7_prelim_exit
    campaign: competition
    day: 19
    type: story
    trigger: { kind: manual }
    purpose: { narrative: 下场后的第一分钟, learning: 赛后立即复盘黄金五分钟 }
    scene: { location: corridor, characters: [c_tech, c_design] }
    setup: ["下场的走廊上，雨桐第一句话：「第3页讲快了。」方远：「数据那题咱们答得漂亮。」你们借了走廊白板，五分钟记下四条复盘。"]
    automaticEffects:
      - { kind: add, key: execution, value: 3 }
      - { kind: setFlag, key: prelim_retro_done }
    dialogue:
      - { speaker: 系统, text: "赛后五分钟的记忆保鲜期，比一周后的任何回忆都准。" }
    terminal: true

  - id: c_xe7_semifinal_notice
    campaign: competition
    day: 20
    type: story
    trigger: { kind: day, day: 20, phase: start }
    purpose: { narrative: 复赛网评规则, learning: 新阶段新规则 }
    scene: { location: dorm, characters: [] }
    setup: ["上午十点，入围名单公示：应用赛道12进8，你们在列。同一条通知里写着复赛规则：今晚20:00前提交更新版申报书与3分钟视频，网评分数计入决赛总分30%。"]
    automaticEffects:
      - { kind: setFlag, key: semifinal_notified }
    dialogue:
      - { speaker: 方远, text: "（盯着「30%」）这意味着决赛前我们不能躺。", mood: serious }
      - { speaker: 江雨桐, text: "更新版申报书——好消息是素材全有，坏消息是今晚八点。", mood: worried }
    next: c_xe7_semifinal_plan

  - id: c_xe7_semifinal_plan
    campaign: competition
    day: 20
    type: decision
    keyDecision: true
    trigger: { kind: manual }
    purpose: { learning: 时间紧急时按「增量」更新而非重做 }
    scene: { location: lab, characters: [c_tech, c_design] }
    setup: ["十小时倒计时。更新什么？全队列出候选：修崩溃后的新数据/竞品对比加强/用户证言/界面优化截图/砍掉愿景页。"]
    choices:
      - id: update_incremental
        text: 增量更新：补新测试数据+用户证言+修复后的稳定性说明，结构不动
        visibleResponse: 三处增量，两小时完成。数据源表加了三行，全部有出处。20:00前一小时提交完毕——这次你们连命名格式都是现成的。
        hiddenEffects:
          - { kind: add, key: execution, value: 6 }
          - { kind: setFlag, key: semifinal_submitted }
          - { kind: achievement, achievementId: ach_c_semifinal_fast }
        next: c_xe7_semifinal_user_quote
      - id: update_overhaul
        text: 趁机大改版：反正评委是同一批，焕然一新给个好印象
        visibleResponse: 大改版改到19:40，视频导出到87%时软件崩溃。最终压线提交了一个没有封面的版本。焕然一新，新得缺页。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 5 }, { kind: scheduleEvent, eventId: c_xe7_dly_semifinal_mess, onDay: 21 }]
        next: c_xe7_semifinal_user_quote
      - id: skip_semifinal_effort
        text: 原样再交一遍，把力气留给决赛
        visibleResponse: 原样交了。网评评委的评语栏写着：「与初赛完全一致，未见迭代诚意」——30%的分数里你们丢了大半。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 6 }, { kind: setFlag, key: semifinal_lazy }]
        next: c_xe7_semifinal_user_quote
    terminal: true

  - id: c_xe7_semifinal_user_quote
    campaign: competition
    day: 20
    type: npc
    trigger: { kind: manual }
    purpose: { narrative: 用户证言的收集, learning: 让用户替你说话 }
    scene: { location: canteen, characters: [] }
    setup: ["你去找老K要一句证言放进更新材料。老K口述，你记录，他改了两遍措辞——比想象中认真。"]
    dialogue:
      - { speaker: 老K, text: "（改第三遍）这句不行，「大幅提升效率」是我说的话吗？我原话是「我不用再拿三个手机回收到了」。用原话。", mood: serious }
    next: c_xe7_speech_polish
    choices:
      - id: use_verbatim
        text: 用原话，一个字不改
        visibleResponse: 原话进了申报书用户证言栏，粗体。网评评委的批注（赛后公开的）写着：「用户证言可信度高」。
        hiddenEffects: [{ kind: add, key: credibility, value: 6 }, { kind: setFlag, key: k_quote_used }]
      - id: polish_quote
        text: 帮老K把话润色得更有书面感
        visibleResponse: 润色后的证言读起来像广告文案。老K看到后说：「这说的不是我。」——证言的说服力随润色递减。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 3 }]
    terminal: true

  - id: c_xe7_judge_style_study
    campaign: competition
    day: 20
    type: decision
    trigger: { kind: day, day: 20, phase: end }
    purpose: { learning: 决赛前研究评委的公开学术观点 }
    scene: { location: dorm, characters: [c_ai_agent] }
    setup: ["决赛评委名单公布：孙教授领衔。你让Agent搜集他近年的公开演讲观点。它汇总出三条：反感概念堆砌/重视数据可溯/欣赏「承认边界」的答辩者。"]
    choices:
      - id: study_judges
        text: 核对这三条的真实性：找他两段公开视频亲自验证
        visibleResponse: 视频里孙教授果然两次追问「这个数据的来源」、一次肯定了「这个我们做不了」的回答。三条全部属实，答辩策略据此调整。
        hiddenEffects:
          - { kind: add, key: evidenceDiscipline, value: 5 }
          - { kind: setFlag, key: judge_studied }
          - { kind: achievement, achievementId: ach_c_judge_study }
      - id: trust_agent_summary
        text: Agent总结得挺好，直接用
        visibleResponse: 总结里第三条「欣赏承认边界的答辩者」其实是它的推测。决赛你按这条答了一道本可以拿分的问题——评委的表情说明了一切。
        hiddenEffects: [{ kind: add, key: aiDependence, value: 5 }]
    terminal: true

  - id: c_xe7_rival_semifinal_duel
    campaign: competition
    day: 20
    type: npc
    trigger: { kind: random, weight: 2 }
    scene: { location: corridor, characters: [c_rival] }
    setup: ["提交入口前遇到邱一鸣。他看着你们的队伍编号，忽然伸出手。"]
    dialogue:
      - { speaker: 邱一鸣, text: "说真的，你们材料的数据链是我这两年见过最全的。决赛别软。", mood: serious }
      - { speaker: 系统, text: "对手的认可偶尔是真的。接住它，不用怀疑。" }
    choices:
      - id: handshake
        text: 握手：「你们的功能演示也不水。决赛见。」
        visibleResponse: 两只手握了三秒。回去的路上方远说："他刚才没放烟雾弹。"有些较量的尊重，只在赛场存在。
        hiddenEffects: [{ kind: relationship, characterId: c_rival, delta: 8 }, { kind: add, key: riskTolerance, value: 3 }]
      - id: suspicious_refuse
        text: 「又是心理战吧。」侧身走过
        visibleResponse: 邱一鸣耸耸肩走了。你的警惕心没白费，但那晚你的复盘里多了一条没必要的猜测，睡得不太好。
        hiddenEffects: [{ kind: relationship, characterId: c_rival, delta: -4 }, { kind: subtract, key: energy, value: 4 }]
    terminal: true

  - id: c_xe7_final_venue_check
    campaign: competition
    day: 20
    type: decision
    trigger: { kind: day, day: 20, phase: end }
    purpose: { learning: 场地侦察消灭环境变量 }
    scene: { location: defense_hall, characters: [] }
    setup: ["决赛场地开放踩点。你记下：投影比例4:3（PPT是16:9，两边会被裁）、HDMI接口在讲台左侧、WiFi密码贴在签到台、讲台有翻页笔但没激光。"]
    choices:
      - id: full_recon
        text: 全面踩点：试投影、试接口、试网络、记讲台动线
        visibleResponse: PPT连夜改成4:3安全区排版；演示备份机插上HDMI试了一遍；翻页笔没激光——雨桐把「指屏幕」写进了分工。
        hiddenEffects:
          - { kind: add, key: execution, value: 6 }
          - { kind: setFlag, key: venue_recon }
          - { kind: achievement, achievementId: ach_c_venue_recon }
      - id: skip_recon
        text: 明天早点到，现场调就行
        visibleResponse: 「现场调」发生在评委注视下：PPT两边被裁掉一列数据，你蹲在讲台左侧插线时话筒差点掉地。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 5 }]
    unlockKnowledge: [kc_c_backup_plan]
    terminal: true

  - id: c_xe7_speech_polish
    campaign: competition
    day: 20
    type: decision
    trigger: { kind: manual }
    purpose: { learning: 讲稿改到「像说话」为止 }
    scene: { location: lab, characters: [c_design] }
    setup: ["答辩稿第五版。雨桐念了一遍，停下来：「这句「赋能多场景应用」——你自己平时这么说吗？」"]
    choices:
      - id: speak_human
        text: 全稿改成「人话」：每个句子先念三遍，拗口的 rewrite
        visibleResponse: 改完的稿子念起来像你在讲话，不像播音稿。彩排时你自己都惊讶：不背稿也能讲——因为是自己的话。
        hiddenEffects: [{ kind: add, key: execution, value: 4 }, { kind: setFlag, key: speech_human }]
        next: c_xe7_final_role_assign
      - id: keep_written_style
        text: 书面语更专业，背熟就行
        visibleResponse: 背到第九遍时你开始在「赋能」处卡壳——大脑拒绝记住舌头不认的词。
        hiddenEffects: [{ kind: subtract, key: energy, value: 8 }]
        next: c_xe7_final_role_assign
    terminal: true

  - id: c_xe7_final_role_assign
    campaign: competition
    day: 20
    type: decision
    keyDecision: true
    trigger: { kind: manual }
    purpose: { learning: 答辩分工：主讲/演示/接问各有其人 }
    scene: { location: lab, characters: [c_tech, c_design] }
    setup: ["决赛8分钟+5分钟问答。谁主讲？谁操作演示？谁接追问？三人第一次为「谁上」认真讨论——上次这么认真还是分外卖红包。"]
    choices:
      - id: best_speaker
        text: 雨桐主讲（彩排得分最高），方远演示，你专职接数据类追问
        visibleResponse: 分工落定。方远对「不说话只操作」有意见，看了两遍自己彩排录像后撤回意见："我手比嘴稳。"
        hiddenEffects: [{ kind: add, key: teamTrust, value: 5 }, { kind: setFlag, key: final_roles_set }]
      - id: captain_all_in
        text: 你全包：主讲加接问，你们俩专心操作
        visibleResponse: 你一个人扛了13分钟的输出量。问答环节第三个问题时你的大脑开始缓冲——单点过载，和服务器一个道理。
        hiddenEffects: [{ kind: subtract, key: execution, value: 3 }, { kind: setFlag, key: captain_overload }]
    terminal: true

  - id: c_xe7_sleep_decision
    campaign: competition
    day: 20
    type: decision
    trigger: { kind: day, day: 20, phase: end }
    purpose: { learning: 决赛前夜的睡眠是比赛装备 }
    scene: { location: dorm, characters: [] }
    setup: ["23:40。备选：再全流程过一遍（约40分钟）/立刻睡。明早9点开赛。"]
    choices:
      - id: sleep_first
        text: 睡。练了五遍的东西不差这一遍，缺的是明天的清醒
        visibleResponse: 你睡了七小时。早上醒来第一反应是「昨晚彩排第8步好像能再顺一点」——睡过的大脑自己完成了整理。
        hiddenEffects: [{ kind: add, key: energy, value: 15 }, { kind: setFlag, key: slept_well }]
      - id: one_more_run
        text: 再来一遍，第6遍肯定比第5遍强
        visibleResponse: 第6遍其实比第5遍差了——你在第4步开始用「昨晚的肌肉记忆」而不是脑子。凌晨一点，你带着遗憾睡着。
        hiddenEffects: [{ kind: subtract, key: energy, value: 10 }]
    unlockKnowledge: [kc_c_energy_mgmt]
    terminal: true

  - id: c_xe7_final_morning
    campaign: competition
    day: 21
    type: story
    trigger: { kind: day, day: 21, phase: start }
    purpose: { narrative: 决赛日早晨, learning: 赛前流程闭环 }
    scene: { location: dorm, characters: [] }
    setup: ["决赛日。检查清单最后一遍：设备✓、材料✓、备份✓、人员✓。雨桐在群里发了张照片：四个人的早餐，每人面前一杯豆浆。", "「最后一顿比赛餐。晚上换庆功宴或者安慰宴，反正先吃饱。」"]
    automaticEffects:
      - { kind: add, key: energy, value: 5 }
      - { kind: setFlag, key: final_morning_ready }
    next: c_xe7_final_draw_order
    terminal: true

  - id: c_xe7_final_draw_order
    campaign: competition
    day: 21
    type: npc
    trigger: { kind: manual }
    purpose: { narrative: 抽签运气, learning: 出场顺序影响心态不影响分数 }
    scene: { location: defense_hall, characters: [c_rival] }
    setup: ["出场顺序抽签：邱一鸣第2位，你们第7位——中间隔着五个对手，包括一支带着实物机器人的队伍。"]
    dialogue:
      - { speaker: 邱一鸣, text: "（下场时）前面几个都不行。你们要是再不行，评委审美就疲劳了。", mood: pleased }
    choices:
      - id: ignore_banter
        text: 不接话。把候场时间用来最后默过一遍10步脚本
        visibleResponse: 默讲到第8步时工作人员叫到你们。走上台的那几秒，你只想着一件事：第一句话怎么开。
        hiddenEffects: [{ kind: add, key: execution, value: 3 }, { kind: setFlag, key: final_calm }]
        next: c_xe7_final_tech_fail
      - id: pressure_adopt
        text: 被他说得有点烦，情绪上头
        visibleResponse: 你带着一股「要争口气」的火气开讲，语速比彩排快了15%。雨桐在旁边拼命给你打「慢」的手势。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 3 }]
        next: c_xe7_final_tech_fail
    terminal: true

  - id: c_xe7_final_tech_fail
    campaign: competition
    day: 21
    type: story
    trigger: { kind: manual }
    purpose: { narrative: 现场突发：投影失灵, learning: B计划的真正考验 }
    scene: { location: defense_hall, characters: [c_judge_final] }
    setup: ["开场90秒，投影突然黑屏。会场安静。孙教授抬手示意别慌：「设备问题不扣分，看你们怎么处理。"]
    dialogue:
      - { speaker: 系统, text: "你们等了两年的这一刻来了——而且是以最坏的方式。" }
    next: c_xe7_final_demo_live
    choices:
      - id: switch_backup
        text: 启动预案：备用笔记本接入，雨桐同步口头讲解第3页内容顶住时间
        visibleResponse: 全程47秒，画面恢复。雨桐的口头补充无缝衔接到下一页。孙教授在评分表上写了什么——你后来知道那是「应变能力：优」。
        hiddenEffects:
          - { kind: add, key: credibility, value: 8 }
          - { kind: setFlag, key: projector_saved }
          - { kind: achievement, achievementId: ach_c_stay_calm }
      - id: panic_wait
        text: 站在台上等工作人员修
        visibleResponse: 三分钟黑屏。你的开场记忆点全凉了，后面的讲述一直在追赶节奏。设备修好了，状态没修好。
        hiddenEffects: [{ kind: subtract, key: credibility, value: 5 }, { kind: setFlag, key: panic_gap }]
    terminal: true

