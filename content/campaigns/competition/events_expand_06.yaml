    terminal: true

  - id: c_xe8_rival_cooperation
    campaign: competition
    day: 21
    type: npc
    trigger: { kind: random, weight: 1 }
    scene: { location: corridor, characters: [c_rival] }
    setup: ["赛后一周（虽然只有一天的游戏时间，但日子翻篇很快），邱一鸣发来消息：「省赛组队赛制，两队联合报名，干不干？」"]
    choices:
      - id: rival_alliance
        text: "可以。但丑话说前头：数据口径我们说了算。"
        visibleResponse: 他秒回："成交。烟雾弹退役。"你们成了省赛最诡异的同盟——两个互相研究了一整月的对手，现在共用一个调研文档。
        hiddenEffects: [{ kind: relationship, characterId: c_rival, delta: 6 }, { kind: setFlag, key: rival_alliance }]
      - id: solo_path
        text: "谢谢，我们想自己打。"
        visibleResponse: 他回了" respect "。省赛的路上少了一个强力盟友，多了一个知根知底的对手。
        hiddenEffects: [{ kind: add, key: independence, value: 3 }]
    terminal: true

  - id: c_xe8_elder_k_ni_new
    campaign: competition
    day: 21
    type: npc
    trigger: { kind: day, day: 21, phase: end }
    purpose: { narrative: 老K的新需求, learning: 用户的下一条需求是产品地图 }
    scene: { location: canteen, characters: [] }
    setup: ["老K又发来消息，这次是语音，背景音很乱：「新学期社团招新要开始了！上次说的报名上限、候补排队……这次能不能有？我一分钟内给你拉来10个社长等着。"]
    choices:
      - id: demand_backlog
        text: 建「用户需求池」：把新需求全部登记、排优先级，两周内给答复
        visibleResponse: 需求池第一天就进了11条。你和方远按「使用频次×实现成本」排了序。老K看到排期表说："你们这是要当真做产品啊。"是的。
        hiddenEffects: [{ kind: add, key: userUnderstanding, value: 5 }, { kind: setFlag, key: demand_pool }]
      - id: promise_all
        text: "都做！下学期全部上线！"
        visibleResponse: 十个社长奔走相告。两周后你交付了三条，剩下的变成社长们聊天时的「那个flag」——承诺通胀的利息比想象中高。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 4 }]
    terminal: true

  - id: c_xe8_mentor_summer_ref
    campaign: competition
    day: 21
    type: npc
    trigger: { kind: random, weight: 1 }
    scene: { location: office, characters: [c_advisor] }
    setup: ["何老师递给你一张表格：「暑期我这边有个数据方向的课题，缺人。看你整理数据的路子挺对我胃口——来不来？"]
    choices:
      - id: join_summer
        text: "来！我先从数据清洗学起。"
        visibleResponse: 他难得笑了一下："清洗都嫌枯燥的人我见多了，你这21天洗过47份问卷的数据，应该忍得住。"表格填好，夏天有了着落。
        hiddenEffects: [{ kind: relationship, characterId: c_advisor, delta: 6 }, { kind: setFlag, key: summer_research }]
      - id: think_about_it
        text: "我考虑几天……"
        visibleResponse: 「考虑可以，位置不等人。」三天后你再去问，位置给了隔壁班那个「当场答应」的同学。机会的保质期通常比你的犹豫短。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 3 }]
    terminal: true

  - id: c_xe8_ending_note
    campaign: competition
    day: 21
    type: system
    trigger: { kind: day, day: 21, phase: end }
    purpose: { narrative: 赛程终章, learning: 结束是下一段的序章 }
    scene: { location: dorm, characters: [] }
    setup: ["你在日记本最后一页写下：\"21天前我不会INIT，不会访谈，不敢站上台。今天我依然有很多不会——但我知道怎么学会了。\"合上本子，窗外是九月的第一缕凉风。"]
    automaticEffects:
      - { kind: setFlag, key: campaign_epilogue }
      - { kind: add, key: independence, value: 3 }
      - { kind: add, key: energy, value: 5 }
    dialogue:
      - { speaker: 系统, text: "竞赛线完结。把想法在约束下做成真的——这件事，你已经会了。" }
    terminal: true
