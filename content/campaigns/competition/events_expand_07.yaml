  - id: c_xe7_random_midterm_conflict
    campaign: competition
    day: 12
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 比赛与课程冲突的时间管理 }
    scene: { location: classroom, characters: [] }
    setup: ["高数期中考排在D13早上——和Demo周完美撞车。方远看着复习提纲笑了：「我上一次翻开这本书还是选课的时候。」"]
    choices:
      - id: plan_exam_blocks
        text: 倒排复习块：每天两个45分钟块，考试前一天全队串讲
        visibleResponse: 复习块排进了日程。D13早上三个人都过了——不漂亮，但过了。比赛课业双线生存，靠的是块状时间而不是愧疚感。
        hiddenEffects: [{ kind: add, key: execution, value: 3 }, { kind: setFlag, key: exam_survived }]
      - id: sacrifice_exam
        text: 比赛要紧，考试裸考吧
        visibleResponse: 考试考出了参赛以来最大的技术债——59分。补考排在决赛周。宇宙的账本从不漏记。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 8 }, { kind: scheduleEvent, eventId: c_xe7_dly_remake_exam, onDay: 20 }]
    terminal: true

