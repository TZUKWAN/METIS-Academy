  - id: c_xe7_random_ai_downtime
    campaign: competition
    day: 13
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 工具不可用日的自持能力 }
    scene: { location: workbench, characters: [c_ai_agent] }
    setup: ["Agent平台今天大规模故障，官方公告「预计恢复时间：未知」。方远盯着转圈的加载图标：「我的左手没了。」"]
    choices:
      - id: work_offline
        text: 降级作业：手写核心逻辑+翻文档，把不依赖AI的活儿排上来
        visibleResponse: 方远徒手写了下午的解析模块，晚上Agent恢复后一测——能跑，还挺好。"原来我会写代码啊。"他久违地感慨了一句。
        hiddenEffects: [{ kind: add, key: independence, value: 6 }, { kind: add, key: execution, value: 3 }, { kind: achievement, achievementId: ach_c_offline_day }]
      - id: wait_for_ai
        text: 等它恢复吧，核心工作都依赖它
        visibleResponse: 恢复是晚上九点。今天净产出：三条未读公告和一屏幕焦虑。依赖单一工具的风险，平时看不见，故障日全款结清。
        hiddenEffects: [{ kind: add, key: aiDependence, value: 6 }, { kind: subtract, key: execution, value: 4 }]
    terminal: true

