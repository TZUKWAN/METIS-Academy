    trigger: { kind: delayed }
    purpose: { narrative: 延迟后果——选题返工利息, learning: 未验证的选题是负债 }
    scene: { location: lab, characters: [c_tech, c_design] }
    setup: ["校务处官网挂出采购公示：实验室仪器预约系统，预算四十万。你们凭感觉选的题，被人用预算补完了。"]
    dialogue:
      - { speaker: 方远, text: "（盯着公示截图）四十万。我们想用零元干成的事，学校直接外包了。", mood: angry }
      - { speaker: 系统, text: "延迟后果：选题会省下的30分钟验证，今天连本带利还清——重选，倒计时继续。" }
    automaticEffects:
      - { kind: add, key: academicDebt, value: 4 }
      - { kind: subtract, key: energy, value: 8 }
    terminal: true

