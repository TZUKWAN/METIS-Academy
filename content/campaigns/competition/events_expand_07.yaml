    choices:
      - id: hard_followup
        text: 问狠问题："如果收费你还用吗？""比Excel好在哪？""哪一步你想骂人？"
        visibleResponse: 收获三条扎心反馈：通知不够及时、某个按钮太深、想导出Excel做备份——「想骂人」环节贡献了两个明日修复项。真实回访的ROI是首发访谈的两倍。
        hiddenEffects: [{ kind: add, key: userUnderstanding, value: 8 }, { kind: addAsset, assetType: user_feedback, name: 一周回访记录, description: 2社长硬核反馈+4条改进项, content: "通知不及时/按钮太深/缺导出/文案歧义" }]
      - id: soft_followup
        text: 客气地问"用得还顺利吗"
        visibleResponse: 「挺好的挺方便的。」——客气话采集完毕，一行可用信息都没有。用户对客气问题的回应永远是客气。
