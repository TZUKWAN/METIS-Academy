        visibleResponse: 备份U盘插上，材料完好。丢的那只在赛后清洁时从沙发缝里现身——它躺在了所有备份安全抵达终点之后。
        hiddenEffects: [{ kind: add, key: execution, value: 3 }, { kind: setFlag, key: backup_saved }]
      - id: panic_search
        text: 放弃候场纪律，全场翻找20分钟
        visibleResponse: U盘没找到（后来证明在沙发缝），你靠最后三分钟找到备用机才没退赛。候场的心理建设归零。
        hiddenEffects: [{ kind: subtract, key: energy, value: 8 }, { kind: add, key: academicDebt, value: 3 }]
    terminal: true

