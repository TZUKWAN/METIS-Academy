# 竞赛线 V2 扩展包01：延迟后果链（种子1-5）+ 隐藏事件 + NG+ 事件
# 链条：技术选型过时 / 未书面确认分工 / 选赛道后悔 / 访谈样本偏差 / 指导老师过度介入 / Demo架构
events:
  # ===== 精力节奏（早决策→延迟债） =====
  - id: c_v2_d02_energy
    campaign: competition
    day: 2
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 2, phase: end }
    purpose: { narrative: 精力分配的隐形契约, learning: 前期透支会在中后期计息 }
    scene: { location: dorm, characters: [c_tech, c_design] }
    setup: ["第2天夜里，群里没人下线。方远在写脚手架，雨桐在改logo第四版。"]
    dialogue:
      - { speaker: 方远, text: "趁现在有手感，我把架子全搭完。这几天别安排我干别的。", mood: serious }
      - { speaker: 江雨桐, text: "视觉定调越早越好，后面材料全靠它。我熬这两天就行。", mood: pleased }
    choices:
      - id: sprint_now
        text: 支持冲刺：这三天全队爆肝，先把架子立起来
        visibleResponse: 三天后骨架立住了，群里刷了一排「牛」。没人注意到三个人都开始咳嗽。
        hiddenEffects:
          - { kind: add, key: execution, value: 5 }
          - { kind: subtract, key: energy, value: 10 }
          - { kind: setFlag, key: key_c_sprint_start }
        delayed:
          - { eventId: c_v2_dly_energy_debt, onDay: 8 }
      - id: steady_pace
        text: 定节奏：每天23点强制下线，进度按周排
        visibleResponse: 方远嘟囔「不够爽」，但第三周他会感谢你。全队睡够了。
        hiddenEffects:
          - { kind: add, key: energy, value: 8 }
          - { kind: setFlag, key: key_c_steady }
        unlockKnowledge: [kc_c_energy_mgmt]
      - id: front_loose
        text: 前松后紧：反正后面再赶也一样
        visibleResponse: 第2天22点全队打游戏。日历上「后面」两个字越写越瘦。
        hiddenEffects:
          - { kind: add, key: technicalDebt, value: 3 }
          - { kind: setFlag, key: key_c_front_loose }
        delayed:
          - { eventId: c_v2_dly_energy_debt, onDay: 5 }
    learningPoint: 精力是预算，不是感觉
    terminal: true

  - id: c_v2_dly_energy_debt
    campaign: competition
    day: 8
    type: delayed
    trigger: { kind: delayed }
    purpose: { narrative: 延迟后果——透支账单, learning: 前期透支中后期计息 }
    scene: { location: lab, characters: [c_tech] }
    setup: ["方案收敛日。方远顶着黑眼圈说CPU烧了——说的是他自己。调试效率掉了三成。"]
    dialogue:
      - { speaker: 方远, text: "（揉眼睛）这段代码昨晚写的，我现在自己都看不懂。", mood: worried }
      - { speaker: 系统, text: "延迟后果：第2天夜里多写的300行，今天要用双倍时间读回来。" }
    automaticEffects:
      - { kind: subtract, key: energy, value: 8 }
      - { kind: add, key: technicalDebt, value: 4 }
    terminal: true

  # ===== 种子4：技术方案提前过时 =====
  - id: c_v2_d05_stack
    campaign: competition
    day: 5
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 5, phase: start }
    purpose: { narrative: 技术选型三难, learning: 选型要考虑21天后的评审现场 }
    scene: { location: lab, characters: [c_tech, c_ai_agent] }
    setup: ["技术选型会。白板三个词：旧框架、新API、Agent脚手架。方远抱着手臂。"]
    dialogue:
      - { speaker: 方远, text: "我用旧框架两小时出活。新API我没碰过，出了bug没人救。", mood: serious }
      - { speaker: Agent, text: "对比结论：旧框架生态成熟；新模型API能力上限高，但接口上周刚变动一次。" }
    choices:
      - id: old_framework
        text: 稳字当头：用方远最熟的旧框架
        visibleResponse: 当晚Demo就跑通了第一版。方远难得夸了句「这决定不蠢」。没人谈论天花板。
        hiddenEffects:
          - { kind: add, key: execution, value: 4 }
          - { kind: setFlag, key: key_c_stack_old }
        delayed:
          - { eventId: c_v2_dly_stack_stale, onDay: 10 }
      - id: new_api
        text: 押注上限：换刚发布的新模型API
        visibleResponse: 效果确实惊艳——直到你发现接口文档还没写全，报错信息只有一行。
        hiddenEffects:
          - { kind: add, key: technicalDebt, value: 3 }
          - { kind: setFlag, key: key_c_stack_new }
        delayed:
          - { eventId: c_v2_dly_api_break, onDay: 10 }
      - id: agent_scaffold
        text: 甩手生成：让Agent按需求文档自动搭全套
        visibleResponse: 一小时后项目立起来了，代码风格整齐得像印刷体。只是没人逐行看过。
        hiddenEffects:
          - { kind: add, key: aiDependence, value: 8 }
          - { kind: setFlag, key: key_c_stack_agent }
        delayed:
          - { eventId: c_v2_dly_agent_drift, onDay: 12 }
    learningPoint: 选型赌的是评审那天，不是今天
    terminal: true

  - id: c_v2_dly_stack_stale
    campaign: competition
    day: 10
    type: delayed
    trigger: { kind: delayed }
    purpose: { narrative: 延迟后果——旧方案被新模型比下去, learning: 舒适区方案有保质期 }
    scene: { location: lab, characters: [c_tech, c_rival] }
    setup: ["邱一鸣在朋友圈晒新模型API的评测截图，配文「速度是上一代的四倍」。方远沉默了。"]
    dialogue:
      - { speaker: 邱一鸣, text: "（路过实验室门口）哟，还在用那个老古董？勇气可嘉。", mood: pleased }
      - { speaker: 方远, text: "（关掉聊天窗）功能一样，就是慢。……好吧，一半是真的。", mood: angry }
    automaticEffects:
      - { kind: setFlag, key: key_c_tech_stale }
      - { kind: subtract, key: credibility, value: 4 }
    terminal: true

  - id: c_v2_dly_api_break
    campaign: competition
    day: 10
    type: delayed
    trigger: { kind: delayed }
    purpose: { narrative: 延迟后果——新API破坏性更新, learning: 追新要有兜底 }
    scene: { location: lab, characters: [c_tech] }
    setup: ["新模型API半夜推送破坏性更新，字段名全改了。官方文档里那行小字写着「不保证向后兼容」。"]
    dialogue:
      - { speaker: 方远, text: "凌晨两点，接口全红了。谁选的这条路线？——哦，是我们自己。", mood: angry }
      - { speaker: 系统, text: "延迟后果：第5天抢来的能力上限，今天用一整晚迁移来付账。" }
    automaticEffects:
      - { kind: setFlag, key: key_c_stack_fragile }
      - { kind: subtract, key: energy, value: 10 }
      - { kind: add, key: technicalDebt, value: 4 }
    terminal: true

  - id: c_v2_dly_agent_drift
    campaign: competition
    day: 12
    type: delayed
    trigger: { kind: delayed }
    purpose: { narrative: 延迟后果——脚手架偏离需求, learning: 没人读过的代码不是你的代码 }
    scene: { location: lab, characters: [c_tech, c_design] }
    setup: ["联调时雨桐发现：Agent生成的报名流程里根本没有「补交材料」——那是需求文档里最痛的一条。"]
    dialogue:
      - { speaker: 江雨桐, text: "（指着屏幕）用户最需要的功能呢？生成的东西很漂亮，但它不是我们的方案。", mood: worried }
      - { speaker: 方远, text: "文档写的是「支持报名」。它没写错，是我们没写清。", mood: serious }
    automaticEffects:
      - { kind: setFlag, key: key_c_agent_drift }
      - { kind: add, key: technicalDebt, value: 5 }
    terminal: true

  # ===== 种子1：未书面确认分工 =====
  - id: c_v2_d03_split
    campaign: competition
    day: 3
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 3, phase: start }
    purpose: { narrative: 分工只停在口头, learning: 未书面确认的分工等于没有分工 }
    scene: { location: classroom, characters: [c_tech, c_design] }
    setup: ["选题过了，三人 casually 说好「你技术他宣传我材料」。没有文档，没有截止日。"]
    dialogue:
      - { speaker: 方远, text: "开发肯定是我。视频嘛……反正会有人做，不就五分钟的事。", mood: neutral }
      - { speaker: 江雨桐, text: "我理解视频归方远？我材料里可有十几页要排版。", mood: worried }
    choices:
      - id: oral_agree
        text: 口头说定就行，都是成年人
        visibleResponse: 三人笑着击掌散会。「视频的事」在每个人心里归了不同的人。
        hiddenEffects:
          - { kind: setFlag, key: key_c_split_oral }
          - { kind: add, key: teamTrust, value: 2 }
        delayed:
          - { eventId: c_v2_dly_boom, onDay: 8 }
      - id: write_down
        text: 花二十分钟写分工表：谁、做什么、几号交
        visibleResponse: 雨桐把分工表置顶。方远嘟囔「像签合同」，但默默认领了视频和部署两行。
        hiddenEffects:
          - { kind: setFlag, key: key_c_split_written }
          - { kind: add, key: teamTrust, value: 4 }
          - { kind: add, key: execution, value: 3 }
        delayed:
          - { eventId: c_v2_dly_split_save, onDay: 9 }
        unlockKnowledge: [kc_c_team_charter]
      - id: no_split
        text: 不分了，谁有空谁干
        visibleResponse: 「灵活」两个字写进了空气里。第7天，灵活变成了三个「我以为」。
        hiddenEffects:
          - { kind: setFlag, key: key_c_split_none }
        delayed:
          - { eventId: c_v2_dly_boom, onDay: 7 }
    learningPoint: 分工表的墨迹比默契可靠
    terminal: true

  - id: c_v2_dly_split_save
    campaign: competition
    day: 9
    type: delayed
    trigger: { kind: delayed }
    purpose: { narrative: 延迟后果——分工表兑现, learning: 书面契约在混乱时刻兑现价值 }
    scene: { location: lab, characters: [c_tech, c_design] }
    setup: ["宣传素材日。方远打开分工表看了一眼，默默拉起了剪辑软件——第三行写着他的名字。"]
    dialogue:
      - { speaker: 方远, text: "（叹气）行吧，第三行是我。剪视频这种事……也不是不能学。", mood: serious }
      - { speaker: 江雨桐, text: "（举起手机拍他）恭喜方工程师解锁新技能，素材我收下了。", mood: happy }
    automaticEffects:
      - { kind: add, key: teamTrust, value: 5 }
      - { kind: setFlag, key: video_done }
    terminal: true

  - id: c_v2_dly_boom
    campaign: competition
    day: 8
    type: decision
    keyDecision: true
    trigger: { kind: delayed }
    purpose: { narrative: 分工真空爆雷, learning: 危机时刻的救场选择决定损耗大小 }
    scene: { location: lab, characters: [c_tech, c_design] }
    setup: ["初赛材料日。群里同时冒出两句：「视频你做了吗？」「不是你做吗？」空气凝固了五秒。"]
    dialogue:
      - { speaker: 方远, text: "我以为雨桐顺手就剪了。她不是最会讲故事吗？", mood: surprised }
      - { speaker: 江雨桐, text: "我以为方远录屏配个音就行。……现在吵这个没用，还剩36小时。", mood: angry }
    choices:
      - id: tech_saves
        text: 方远停代码去剪视频，你顶上他的联调
        visibleResponse: 方远熬夜剪完，功能联调由你半懂不懂地推进——两件事都做了，两件事都磕磕绊绊。
        hiddenEffects:
          - { kind: setFlag, key: key_c_video_tech }
          - { kind: add, key: technicalDebt, value: 4 }
          - { kind: subtract, key: energy, value: 8 }
        delayed:
          - { eventId: c_v2_dly_split_rework, onDay: 15 }
      - id: design_saves
        text: 雨桐放下材料去救视频，你帮她排版
        visibleResponse: 视频保住了，但申报书排版降级成「能用」。雨桐没说什么，只是那晚走得最晚。
        hiddenEffects:
          - { kind: setFlag, key: key_c_video_design }
          - { kind: add, key: academicDebt, value: 3 }
          - { kind: relationship, characterId: c_design, delta: -3 }
        delayed:
          - { eventId: c_v2_dly_split_rework, onDay: 15 }
      - id: both_halves
        text: 你把视频拆成三段，三人各做一段
        visibleResponse: 三段视频三种色调，像三个人各说各话。但它在deadline前拼出来了。
        hiddenEffects:
          - { kind: setFlag, key: key_c_video_split }
          - { kind: subtract, key: credibility, value: 3 }
        delayed:
          - { eventId: c_v2_dly_split_rework, onDay: 15 }
    learningPoint: 危机救场没有免费选项
    terminal: true

  - id: c_v2_dly_split_rework
    campaign: competition
    day: 15
    type: delayed
    trigger: { kind: delayed }
    purpose: { narrative: 延迟后果——救场视频暴露口径问题, learning: 赶工产物会二次计息 }
    scene: { location: lab, characters: [c_design, c_tech] }
    setup: ["材料对表日。雨桐发现视频里的界面是三天前的旧版——和申报书截图对不上，得重录。"]
    dialogue:
      - { speaker: 江雨桐, text: "（平静地）重录两小时，重剪三小时。我只想问一句：当时要是写了分工表呢？", mood: serious }
      - { speaker: 系统, text: "延迟后果：第3天省下的二十分钟，今天连本带利变成五小时。" }
    automaticEffects:
      - { kind: setFlag, key: key_c_unwritten_split }
      - { kind: subtract, key: energy, value: 8 }
      - { kind: add, key: academicDebt, value: 4 }
    terminal: true

  # ===== 种子2：选赛道后悔 =====
  - id: c_v2_d04_track
    campaign: competition
    day: 4
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 4, phase: end }
    purpose: { narrative: 三条赛道, learning: 选赛道是在选对手和评委 }
    scene: { location: classroom, characters: [c_design, c_ai_agent] }
    setup: ["章程附录：应用赛道（队伍最多）、算法赛道（卷王云集）、公益赛道（稀缺但评审严）。"]
    dialogue:
      - { speaker: Agent, text: "统计：应用赛道往届平均分最低；公益赛道评委匹配度不确定，数据样本仅两届。" }
      - { speaker: 江雨桐, text: "应用赛道故事好讲。但所有人都会讲——我们凭什么被记住？", mood: serious }
    choices:
      - id: algo_hype
        text: 追热门：算法赛道曝光高，赢了含金量足
        visibleResponse: 方远眼睛亮了。你在报名表勾下「算法赛道」时，手心其实有点汗。
        hiddenEffects:
          - { kind: setFlag, key: key_c_track_algo }
          - { kind: add, key: riskTolerance, value: 5 }
        delayed:
          - { eventId: c_v2_dly_track_regret, onDay: 9 }
      - id: strength_fit
        text: 按优势：应用赛道，做我们最熟的校园场景
        visibleResponse: 没有惊喜，也没有意外。雨桐的故事和方远的代码终于住在同一个赛道里。
        hiddenEffects:
          - { kind: setFlag, key: key_c_track_fit }
          - { kind: add, key: execution, value: 3 }
      - id: sparse_track
        text: 避锋头：公益赛道人少，容易出头
        visibleResponse: 报名页面显示「该赛道3支队伍」。三人相视一笑——笑得有点早。
        hiddenEffects:
          - { kind: setFlag, key: key_c_track_sparse }
        delayed:
          - { eventId: c_v2_dly_sparse_risk, onDay: 12 }
    learningPoint: 赛道决定你的对手、评委和叙事
    terminal: true

  - id: c_v2_dly_track_regret
    campaign: competition
    day: 9
    type: delayed
    trigger: { kind: delayed }
    purpose: { narrative: 延迟后果——算法赛道撞卷王, learning: 热门赛道的利息是对手强度 }
    scene: { location: lab, characters: [c_tech, c_design] }
    setup: ["算法赛道公示名单：41支队伍，7支有论文，3支挂着实验室名号。你们的招牌是「校园需求」。"]
    dialogue:
      - { speaker: 方远, text: "（往椅背一靠）四十一个卷王的赛道。我们拿什么卷？热情吗？", mood: worried }
      - { speaker: 江雨桐, text: "要不……换回去？现在换还来得及，就是前面全白干。", mood: worried }
    automaticEffects:
      - { kind: setFlag, key: key_c_track_regret }
    next: c_v2_d09_switch

  - id: c_v2_d09_switch
    campaign: competition
    day: 9
    type: decision
    keyDecision: true
    trigger: { kind: manual }
    purpose: { narrative: 沉没成本前的换道抉择, learning: 换道越晚，利息越高 }
    scene: { location: lab, characters: [c_tech, c_design] }
    setup: ["换道窗口只剩48小时。白板上两栏：换（重做调研）vs 不换（硬卷技术分）。"]
    dialogue:
      - { speaker: 方远, text: "换的话我五天的框架白搭。不换的话……我大概能卷进前十？大概。", mood: serious }
      - { speaker: 江雨桐, text: "我们的故事在应用赛道是前十，在算法赛道可能是陪跑。数字我算过。", mood: serious }
    choices:
      - id: switch_now
        text: 果断换回应用赛道，认赔五天工时
        visibleResponse: 一夜重排计划。方远把旧框架改造成应用赛道底座——没全白干，但真的累。
        hiddenEffects:
          - { kind: setFlag, key: key_c_switch_now }
          - { kind: add, key: teamTrust, value: 3 }
          - { kind: subtract, key: energy, value: 6 }
        delayed:
          - { eventId: c_v2_dly_switch_cost, onDay: 13 }
      - id: stay_course
        text: 不换，就在算法赛道卷出一条路
        visibleResponse: 「那就卷。」方远把椅子拖回屏幕前。雨桐开始把「校园需求」翻译成技术语言。
        hiddenEffects:
          - { kind: setFlag, key: key_c_track_stuck }
          - { kind: add, key: riskTolerance, value: 4 }
      - id: double_line
        text: 双线下注：材料两头投，哪边能行跑哪边
        visibleResponse: 雨桐的排期表裂成两份。方远说了句「贪是原罪」，然后继续写代码。
        hiddenEffects:
          - { kind: setFlag, key: key_c_double_line }
          - { kind: add, key: academicDebt, value: 4 }
          - { kind: relationship, characterId: c_design, delta: -2 }
    learningPoint: 换道决策的核心是未来成本，不是过去投入
    terminal: true

  - id: c_v2_dly_switch_cost
    campaign: competition
    day: 13
    type: delayed
    trigger: { kind: delayed }
    purpose: { narrative: 延迟后果——换道工时债, learning: 换道的代价在冲刺期兑现 }
    scene: { location: lab, characters: [c_tech] }
    setup: ["冲刺周。换道欠下的调研与材料债一次性到期，三个人同时在做「两个人的活」。"]
    dialogue:
      - { speaker: 方远, text: "（含着润喉糖）我这周干了两周的量。下次换赛道，记得先问我嗓子。", mood: angry }
      - { speaker: 系统, text: "延迟后果：第9天的果断，今天用双倍工时来结算。" }
    automaticEffects:
      - { kind: subtract, key: energy, value: 8 }
      - { kind: add, key: academicDebt, value: 3 }
    terminal: true

  - id: c_v2_dly_sparse_risk
    campaign: competition
    day: 12
    type: delayed
    trigger: { kind: delayed }
    purpose: { narrative: 延迟后果——冷门赛道评审错配, learning: 人少的赛道可能是评委错配的赛道 }
    scene: { location: office, characters: [c_advisor] }
    setup: ["何老师扫了一眼公益赛道评委名单：「两位都是民政系统的。你们讲技术架构，他们听什么？"]
    dialogue:
      - { speaker: 何老师, text: "冷门赛道不是蓝海，是错配。评委想听受益人的故事，不是你的并发数。", mood: serious }
