          - { kind: add, key: teamTrust, value: 5 }
          - { kind: add, key: execution, value: 3 }
      - id: trust_memory
        text: 记忆会骗人，但我选择相信这次不一样
        visibleResponse: 你犹豫了。熟悉的对话、熟悉的击掌、熟悉的「反正会有人做」。历史在旁边轻轻叹气。
        hiddenEffects:
          - { kind: setFlag, key: key_c_ng_ignored }
          - { kind: add, key: riskTolerance, value: 3 }
    learningPoint: NG+的意义不是预知，而是敢于提前三十分钟行动
    terminal: true

