  # ===== AI披露链（规则执行） =====
  - id: c_v2_d14_ai_disclose
    campaign: competition
    day: 14
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 14, phase: start }
    purpose: { narrative: AI使用披露, learning: 披露是规则也是信用资产 }
    scene: { location: lab, characters: [c_ai_agent, c_advisor] }
    setup: [“章程第17条：AI生成内容须标注。你们的申报书有六成篇幅经过Agent之手。标注，还是不标注？”]
    dialogue:
      - { speaker: Agent, text: "数据：去年参赛作品中，主动披露AI使用占比约12%。其中进入决赛的比例为38%，显著高于均值。" }
      - { speaker: 何老师, text: "（放下茶杯）我不问你们用没用。我只问：被问起来那天，你们想站在哪一边。", mood: serious }
    choices:
      - id: full_disclose
        text: 全量披露：逐节标注AI参与方式与人工校验
        visibleResponse: 附录多了一页《AI使用台账》：每个AI参与的环节、提示词、人工修正记录。何老师看完点了点头。
        hiddenEffects:
          - { kind: setFlag, key: key_c_ai_use_honest }
          - { kind: add, key: credibility, value: 6 }
        unlockKnowledge: [kc_c_ai_disclosure]
      - id: footnote_only
        text: 脚注声明：一句「部分内容借助AI工具」
        visibleResponse: 脚印小小的，态度却算有。合规线上走，不惊艳，不出错。
        hiddenEffects:
          - { kind: setFlag, key: key_c_ai_use_footnote }
          - { kind: add, key: credibility, value: 2 }
      - id: hide_use
        text: 不提：反正评委会看不出哪句是谁写的
        visibleResponse: 材料干干净净。第17条安安静静躺在章程里，像一颗没有拆的雷。
        hiddenEffects:
          - { kind: setFlag, key: key_c_ai_use_hidden }
          - { kind: add, key: aiDependence, value: 3 }
        delayed:
          - { eventId: c_v2_dly_ai_audit, onDay: 19 }
    learningPoint: AI披露不是减分项，是信用凭证
    terminal: true

  - id: c_v2_dly_ai_audit
    campaign: competition
    day: 19
    type: delayed
    trigger: { kind: delayed }
    purpose: { narrative: 延迟后果——未披露被点名, learning: 赛后复核是真实存在的 }
    scene: { location: defense_hall, characters: [c_judge_final, c_judge_prelim] }
    setup: [“决赛答辩后，组委会例行抽检AI标注。你们队的材料被抽中了——第17条，白纸黑字。”]
    dialogue:
      - { speaker: 高主任, text: "（翻着材料）孙老师，您看这段行文——和Agent的输出风格高度一致。标注呢？", mood: neutral }
      - { speaker: 孙教授, text: "（温和地）我更想听你们说说，为什么选择不标注。", mood: serious }
    automaticEffects:
      - { kind: setFlag, key: key_c_ai_audit_hit }
      - { kind: subtract, key: credibility, value: 8 }
    terminal: true

