  # ===== 概念浓度（创新家族） =====
  - id: c_v2_d11_buzz
    campaign: competition
    day: 11
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 11, phase: end }
    purpose: { narrative: 方案概念浓度, learning: 概念是利息，证据是本金 }
    scene: { location: lab, characters: [c_ai_agent, c_design] }
    setup: [“方案收敛日。Agent给方案起了个名字：「基于多智能体协同的全域校园服务生态」。雨桐念了三遍才念顺。”]
    dialogue:
      - { speaker: Agent, text: "该命名在同类申报书中概念密度排名前5%。概念密度与评审新鲜感呈正相关，与可信度呈负相关。" }
      - { speaker: 江雨桐, text: "（放下笔）它很亮。可我说不清它到底是什么——评委要是也说不清，怪谁？", mood: serious }
    choices:
      - id: keep_buzz
        text: 保留：概念先行，显得高级
        visibleResponse: 名字印上了封面。方远说「听起来像要融资」，没人接话。
        hiddenEffects:
          - { kind: setFlag, key: key_c_buzzword }
          - { kind: add, key: academicDebt, value: 4 }
      - id: plain_words
        text: 说人话：「帮社团三天完成换届交接的工具」
        visibleResponse: 名字改成了人话。雨桐说「不好听了，但至少我妈能听懂」。
        hiddenEffects:
          - { kind: setFlag, key: key_c_plain_words }
          - { kind: add, key: credibility, value: 4 }
      - id: one_true_innov
        text: 收敛到一件事：只讲那个没人做的「交接清单自动生成」
        visibleResponse: 全案围绕一个功能重写。小，但锋利。方远说「这才像个能赢的功能」。
        hiddenEffects:
          - { kind: setFlag, key: key_c_small_innov }
          - { kind: add, key: independence, value: 4 }
    learningPoint: 概念浓度越高，可信度越稀
    terminal: true

  # ===== AI-washing 应对 =====
  - id: c_v2_d13_aiwash
    campaign: competition
    day: 13
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 13, phase: end }
    purpose: { narrative: AI含量诚实度, learning: AI含量是创新真实性的试金石 }
    scene: { location: lab, characters: [c_tech, c_ai_agent] }
    setup: [“孙教授往年的公开演讲里有一页：「警惕AI+万物」。你们系统里，AI真正参与的只有推荐那一步。”]
    dialogue:
      - { speaker: 方远, text: "实话说，核心流程是规则引擎，AI只占一成。可申报书通篇在讲AI。", mood: serious }
      - { speaker: Agent, text: "选项：A，如实调整表述；B，维持现状；C，答辩现场切至纯AI模式演示。C方案风险较高。" }
    choices:
      - id: honest_ratio
        text: 如实调整：写清AI真实占比与边界
        visibleResponse: 申报书多了一段「AI能力边界声明」。诚实得有点扎眼——也有点踏实。
        hiddenEffects:
          - { kind: setFlag, key: key_c_no_wash }
          - { kind: add, key: credibility, value: 5 }
      - id: keep_wash
        text: 维持现状：AI就AI了，评委爱听这个
        visibleResponse: 材料没动。你在「AI+万物」那页折了个角，像折在一个说不出口的地方。
        hiddenEffects:
          - { kind: setFlag, key: key_c_ai_washing }
          - { kind: add, key: academicDebt, value: 4 }
      - id: switch_ai_mode
        text: 现场切换：把核心流程改成真AI驱动
        visibleResponse: 方远熬夜把推荐模块接进了主流程。跑是跑通了，就是慢了三倍。
        hiddenEffects:
          - { kind: setFlag, key: key_c_ai_mode_switch }
          - { kind: add, key: technicalDebt, value: 4 }
          - { kind: subtract, key: energy, value: 6 }
    learningPoint: AI含量要经得起「哪一步是AI」这一问
    terminal: true

  # ===== 模拟排名链 =====
  - id: c_v2_d17_mock
    campaign: competition
    day: 17
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 17, phase: end }
    purpose: { narrative: 排名信息应对, learning: 中途排名是参考系也是陷阱 }
    scene: { location: defense_hall, characters: [c_judge_prelim, c_design] }
    setup: [“模拟答辩结束，高主任随口说：「按现在这个水平，你们大概在第4名上下。前三很稳，你们很悬。」”]
    dialogue:
      - { speaker: 高主任, text: "第4。差一步有奖，差两步没有。就差在——你们和第3名比，缺一个「记住点」。", mood: neutral }
      - { speaker: 江雨桐, text: "（在笔记本上写下「第4」）还有五天。这个「记住点」，值得全队赌一把吗？", mood: serious }
    choices:
      - id: defense_extra
        text: 死磕答辩：把追问环节练成主场
        visibleResponse: 最后五天，你们互问了六十多个问题。方远的应答从「嗯……这个」进化成了反问。
        hiddenEffects:
          - { kind: setFlag, key: key_c_defense_extra }
          - { kind: subtract, key: energy, value: 5 }
          - { kind: add, key: teamTrust, value: 3 }
      - id: diff_bet
        text: 押差异化：改路演主线，做一个全场唯一的开场
        visibleResponse: 雨桐把开场改成了现场扫码互动——成了，全场第一个抬头的评委出现在第10秒。
        hiddenEffects:
          - { kind: setFlag, key: key_c_diff_bet }
          - { kind: add, key: riskTolerance, value: 4 }
      - id: play_safe
        text: 保平：第4就第4，别把稳的玩砸了
        visibleResponse: 你们把最后五天用来「不出错」。没有惊喜，也没有事故——像你们排期表上写的一样平。
        hiddenEffects:
          - { kind: setFlag, key: key_c_play_safe }
    learningPoint: 第4名的信息是资源，不是判决
    terminal: true

