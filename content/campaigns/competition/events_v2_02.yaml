# 竞赛线 V2 扩展包02：延迟后果链（种子6-10）+ 隐藏事件 + NG+ 事件
# 链条：PPT叙事脱节 / 排练不足 / 提交格式 / 竞品抄袭 / AI披露 / 截止日 / 概念浓度 / AI-washing / 模拟排名
events:
  # ===== 种子6：PPT叙事与真实产品脱节 =====
  - id: c_v2_d15_narrative
    campaign: competition
    day: 15
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 15, phase: start }
    purpose: { narrative: 材料叙事路线, learning: 故事与产品必须互为证据 }
    scene: { location: lab, characters: [c_design, c_tech] }
    setup: [“材料周启动会。雨桐铺开叙事大纲：第一页是王同学的故事——可Demo里根本没有王同学的场景。”]
    dialogue:
      - { speaker: 江雨桐, text: "故事是钩子，功能是肉。没有钩子，评委第30秒就划走了。", mood: serious }
      - { speaker: 方远, text: "可讲故事讲的那个场景，系统里不存在。评委一问「现场演示一下」，谁接？", mood: serious }
    choices:
      - id: story_first
        text: 叙事先行：先讲故事，产品按故事包装
        visibleResponse: PPT焕然一新，王同学贯穿全场。方远盯着第4页看了很久，没说话。
        hiddenEffects:
          - { kind: setFlag, key: key_c_narrative_first }
          - { kind: add, key: evidenceDiscipline, value: -2 }
          - { kind: relationship, characterId: c_design, delta: 2 }
        delayed:
          - { eventId: c_v2_dly_ppt_gap, onDay: 18 }
      - id: product_first
        text: 产品先行：只写Demo里真实存在的东西
        visibleResponse: PPT朴素得像说明书。雨桐说「这不是我最好的作品」，但每一页都站得住。
        hiddenEffects:
          - { kind: setFlag, key: key_c_honest_deck }
          - { kind: add, key: credibility, value: 5 }
          - { kind: relationship, characterId: c_design, delta: -2 }
      - id: agent_polish
        text: 让Agent把故事和产品「有机融合」一下
        visibleResponse: Agent十分钟产出一版天衣无缝的叙事——好到你都忘了哪些功能是真的。
        hiddenEffects:
          - { kind: setFlag, key: key_c_agent_polish }
          - { kind: add, key: aiDependence, value: 6 }
        delayed:
          - { eventId: c_v2_dly_polish_expose, onDay: 19 }
    learningPoint: 叙事是产品的放大器，不是替代品
    terminal: true

  - id: c_v2_dly_ppt_gap
    campaign: competition
    day: 18
    type: delayed
    trigger: { kind: delayed }
    purpose: { narrative: 延迟后果——叙事与产品脱节, learning: 故事里的功能会在答辩时被点名 }
    scene: { location: lab, characters: [c_judge_prelim, c_design] }
    setup: [“模拟初审。高主任翻到第4页：「这个智能提醒功能不错——现场能演示吗？」雨桐的手指停在半空。”]
    dialogue:
      - { speaker: 高主任, text: "（敲了敲第4页）功能不错。现在，打开你们的系统，点给我看。", mood: neutral }
      - { speaker: 系统, text: "延迟后果：第15天的钩子，今天变成了答辩台上三厘米厚的沉默。" }
    automaticEffects:
      - { kind: setFlag, key: key_c_ppt_gap_marked }
      - { kind: subtract, key: credibility, value: 5 }
    next: c_v2_d18_gap_fix

  - id: c_v2_d18_gap_fix
    campaign: competition
    day: 18
    type: decision
    keyDecision: true
    trigger: { kind: manual }
    purpose: { narrative: 脱节补救三策, learning: 材料与产品冲突时的三种止损 }
    scene: { location: lab, characters: [c_design, c_tech] }
    setup: [“距离提交还有40小时。白板三行：删页、补开发、硬讲。雨桐和方远各站一头，看着你。”]
    dialogue:
      - { speaker: 江雨桐, text: "删了那一页，故事就不完整了。但硬讲，是在答辩台上赌运气。", mood: worried }
      - { speaker: 方远, text: "补开发的话，给我30小时和一个不许任何人碰我电脑的承诺。", mood: serious }
    choices:
      - id: trim_page
        text: 删页重排：把故事收敛到真实功能上
        visibleResponse: 王同学退场，真实用户数据上位。雨桐重排到凌晨——新版比原版更紧，也更真。
        hiddenEffects:
          - { kind: setFlag, key: key_c_gap_trimmed }
          - { kind: add, key: credibility, value: 4 }
          - { kind: subtract, key: energy, value: 5 }
      - id: code_night
        text: 补开发：让方远把故事里的功能做出来
        visibleResponse: 方远卷起袖子：「30小时后见。」全队进入战时状态，材料组的活全归了你。
        hiddenEffects:
          - { kind: setFlag, key: key_c_gap_coded }
          - { kind: add, key: technicalDebt, value: 4 }
          - { kind: subtract, key: energy, value: 10 }
        delayed:
          - { eventId: c_v2_dly_code_night, onDay: 20 }
      - id: keep_talking
        text: 硬讲：话术圆过去，功能虚一点就虚一点
        visibleResponse: 雨桐连夜写了三套应答话术。你把「如果被现场要求演示」那页折了个角。
        hiddenEffects:
          - { kind: setFlag, key: key_c_ppt_gap }
          - { kind: add, key: academicDebt, value: 5 }
    learningPoint: 叙事缺口只有三种补法，每种都有价格
    terminal: true

  - id: c_v2_dly_polish_expose
    campaign: competition
    day: 19
    type: delayed
    trigger: { kind: delayed }
    purpose: { narrative: 延迟后果——润色跑偏, learning: 无人校对的生成内容会自作主张 }
    scene: { location: lab, characters: [c_tech, c_ai_agent] }
    setup: [“终审PPT时方远发现：Agent把「周末预约」润色成了「全域智能调度平台」。第6页整个跑偏了。”]
    dialogue:
      - { speaker: 方远, text: "（指着第6页）「全域智能调度平台」？我们连全域的「域」是哪个域都不知道。", mood: angry }
      - { speaker: Agent, text: "说明：该表述提升方案格局。原始表述「预约」被认为缺乏竞争力，已优化。" }
    automaticEffects:
      - { kind: setFlag, key: key_c_polish_drift }
      - { kind: subtract, key: credibility, value: 4 }
      - { kind: add, key: academicDebt, value: 3 }
    terminal: true

  - id: c_v2_dly_code_night
    campaign: competition
    day: 20
    type: delayed
    trigger: { kind: delayed }
    purpose: { narrative: 延迟后果——补开发兑现, learning: 极限开发的成功率取决于此前守护的回归 }
    scene: { location: lab, characters: [c_tech, c_design] }
    setup: [“决赛前夜2点47分。智能提醒功能上线，回归测试全绿。方远趴在键盘上睡着了，屏幕的光打在他脸上。”]
    dialogue:
      - { speaker: 江雨桐, text: "（给方远披上外套，轻声）故事里的功能，今天真的存在了。", mood: pleased }
      - { speaker: 系统, text: "延迟后果：40小时的豪赌，用全绿的回归测试结算——这是技术债的最好结局，但不是默认结局。" }
    automaticEffects:
      - { kind: add, key: credibility, value: 5 }
      - { kind: add, key: teamTrust, value: 4 }
      - { kind: setFlag, key: key_c_story_coded }
    terminal: true

  # ===== 种子7：排练不足 =====
  - id: c_v2_d16_rehearsal
    campaign: competition
    day: 16
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 16, phase: end }
    purpose: { narrative: 排练量决策, learning: 路演是表演，表演需要排练量 }
    scene: { location: auditorium, characters: [c_design, c_tech] }
    setup: [“空教室可以约到决赛前。雨桐提议全流程彩排三次，方远说代码离不开人，最多一次。”]
    dialogue:
      - { speaker: 江雨桐, text: "8分钟路演是表演。没有排练量的表演，就是开盲盒。", mood: serious }
      - { speaker: 方远, text: "彩排三次=我离开代码三次。Demo现在还是个薛定谔的猫。", mood: serious }
    choices:
      - id: rehearse_full
        text: 彩排三次：代码冻结两天，保路演
        visibleResponse: 三次彩排，三次计时。第三次，你们把8分钟压到了7分40秒，还留了喘气的时间。
        hiddenEffects:
          - { kind: setFlag, key: key_c_rehearsal_full }
          - { kind: add, key: execution, value: 4 }
          - { kind: subtract, key: energy, value: 5 }
        unlockKnowledge: [kc_c_rehearsal_timing]
      - id: rehearse_partial
        text: 只练一遍：开头结尾顺一遍就行
        visibleResponse: 一遍下来，中段卡壳两次，翻页翻错一次。雨桐说「正式上场应该会更好」——应该。
        hiddenEffects:
          - { kind: setFlag, key: key_c_rehearsal_partial }
          - { kind: add, key: academicDebt, value: 3 }
        delayed:
          - { eventId: c_v2_dly_timing_miss, onDay: 19 }
      - id: rehearse_none
        text: 不排了：内容都在脑子里，临场发挥
        visibleResponse: 你们把彩排的三十分钟用来多测了两轮Demo。路演稿的第一页，还停在想象里。
        hiddenEffects:
          - { kind: setFlag, key: key_c_rehearsal_none }
          - { kind: add, key: technicalDebt, value: -2 }
        delayed:
          - { eventId: c_v2_dly_blackout, onDay: 20 }
    learningPoint: 排练量是路演的承重墙
    terminal: true

  - id: c_v2_dly_timing_miss
    campaign: competition
    day: 19
    type: delayed
    trigger: { kind: delayed }
    purpose: { narrative: 延迟后果——时长失控, learning: 没有计时排练就没有时间感 }
    scene: { location: lab, characters: [c_design] }
    setup: [“最后一次自测：雨桐讲到第6页时，计时器跳到了6分50秒。后面还有5页。”]
    dialogue:
      - { speaker: 江雨桐, text: "（盯着计时器）超了。至少超两分钟。要么砍内容，要么练语速，要么……祈祷评委爱听。", mood: worried }
      - { speaker: 系统, text: "延迟后果：第16天省下的排练时间，今天变成了台上的倒计时炸弹。" }
    automaticEffects:
      - { kind: setFlag, key: key_c_timing_miss }
    next: c_v2_d19_cut

  - id: c_v2_d19_cut
    campaign: competition
    day: 19
    type: decision
    keyDecision: true
    trigger: { kind: manual }
    purpose: { narrative: 超时止损, learning: 上台前每个决定都要落在纸面 }
    scene: { location: lab, characters: [c_design, c_tech] }
    setup: [“还剩24小时。砍哪5页？加多快语速？还是相信临场？白板上三个词越来越刺眼。”]
    dialogue:
      - { speaker: 江雨桐, text: "砍内容我手会抖，但语速加快听众会累。你们选一个，我来执行。", mood: serious }
      - { speaker: 方远, text: "砍第6到9页，功能页留一页总览。代码页评委又不看，看的是你讲不讲得清。", mood: neutral }
    choices:
      - id: cut_content
        text: 痛砍5页：只留核心证据链
        visibleResponse: 雨桐删到手软。瘦身后的路演，8分钟讲完还剩30秒——用来鞠躬。
        hiddenEffects:
          - { kind: setFlag, key: key_c_cut_content }
          - { kind: add, key: execution, value: 3 }
      - id: speed_up
        text: 提速：语速加两成，内容全保
        visibleResponse: 彩排一遍，7分58秒。雨桐喘着气说「能讲完」，没人敢问「能听懂吗」。
        hiddenEffects:
          - { kind: setFlag, key: key_c_time_over }
          - { kind: add, key: academicDebt, value: 3 }
      - id: gamble_stage
        text: 不改：相信临场的肾上腺素
        visibleResponse: 「正式上场我会更兴奋，讲得更快。」雨桐说这话时，眼神飘了一下。
        hiddenEffects:
          - { kind: setFlag, key: key_c_time_gamble }
          - { kind: add, key: riskTolerance, value: 4 }
    learningPoint: 超时的账，上台前必须结清
    terminal: true

  - id: c_v2_dly_blackout
    campaign: competition
    day: 20
    type: delayed
    trigger: { kind: delayed }
    purpose: { narrative: 延迟后果——台上断片, learning: 未排练的内容在高压下会蒸发 }
    scene: { location: backstage, characters: [c_design, c_tech] }
    setup: [“候场第4分钟，雨桐盯着台本发呆。她突然发现：你们从没从头到尾连着讲过一遍完整路演。”]
    dialogue:
      - { speaker: 江雨桐, text: "（手心出汗）我突然不确定，第3页讲完是接第4页还是接第5页。", mood: worried }
      - { speaker: 方远, text: "（翻台本）……我们真的没有完整排过一遍。一次都没有。", mood: surprised }
    automaticEffects:
      - { kind: setFlag, key: key_c_blackout_risk }
      - { kind: subtract, key: teamTrust, value: 2 }
    terminal: true

  # ===== 种子8：提交格式 =====
  - id: c_v2_d15b_submit
    campaign: competition
    day: 15
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 15, phase: end }
    purpose: { narrative: 提交检查策略, learning: 格式合规是零分与满分的分界线 }
    scene: { location: lab, characters: [c_ai_agent, c_design] }
    setup: [“初赛材料齐了。章程附件3写着提交格式：命名规范、页序、附件清单、PDF版本——共11条。”]
    dialogue:
      - { speaker: Agent, text: "检测到材料已就绪。是否需要按章程第11条附件规范执行自动检查？预计耗时4分钟。" }
      - { speaker: 江雨桐, text: "4分钟，或者赌主办方不看格式。往年真有队栽在这上面。", mood: serious }
    choices:
      - id: check_self
        text: 人工逐条对照：11条，一条一条打钩
        visibleResponse: 第9条抓出来了——附件缺「AI使用说明」。雨桐十分钟补齐。你们的PDF是全场少数合规的。
        hiddenEffects:
          - { kind: setFlag, key: key_c_format_caught }
          - { kind: add, key: evidenceDiscipline, value: 4 }
          - { kind: addAsset, assetType: checklist, name: 提交格式11条清单, description: 命名/页序/附件/版本, content: "按章程附件3逐条核验记录" }
      - id: agent_check
        text: 丢给Agent：让它按章程全文自动核对
        visibleResponse: Agent两分钟给出报告：「全部合规」。你们没有抽查——报告很漂亮，但这不是它的比赛。
        hiddenEffects:
          - { kind: setFlag, key: key_c_agent_submit }
          - { kind: add, key: aiDependence, value: 5 }
        delayed:
          - { eventId: c_v2_dly_format_error, onDay: 17 }
      - id: rush_upload
        text: 赶紧传：格式是小事，先保deadline
        visibleResponse: 23:58点击提交。绿色的「上传成功」让人忘了问一句：传的文件命名对吗？
        hiddenEffects:
          - { kind: setFlag, key: key_c_format_error }
          - { kind: add, key: academicDebt, value: 3 }
        delayed:
          - { eventId: c_v2_dly_submit_panic, onDay: 16 }
    learningPoint: 格式检查没有捷径，只有清单
    terminal: true

  - id: c_v2_dly_submit_panic
    campaign: competition
    day: 16
    type: delayed
    trigger: { kind: delayed }
    purpose: { narrative: 延迟后果——格式翻车, learning: 赶工跳过的检查会变成事故 }
    scene: { location: lab, characters: [c_design, c_tech] }
    setup: [“组委会邮件：贵队附件命名不符规范（附件3第2条），视为材料不全，24小时内可补交一次。”]
    dialogue:
      - { speaker: 江雨桐, text: "（举着邮件）材料不全。我们三周的心血，现在叫「材料不全」。", mood: angry }
      - { speaker: 方远, text: "还有一次补交机会。……以及，现在才知道第2条写了什么。", mood: serious }
    automaticEffects:
      - { kind: setFlag, key: key_c_submit_flagged }
      - { kind: subtract, key: credibility, value: 4 }
    next: c_v2_d17_appeal

  - id: c_v2_d17_appeal
    campaign: competition
    day: 17
    type: decision
    keyDecision: true
    trigger: { kind: manual }
    purpose: { narrative: 事故应对, learning: 规则内补救的三个姿势 }
    scene: { location: office, characters: [c_advisor, c_design] }
    setup: [“补交窗口24小时。何老师看完邮件只问了一句：「你们要认，还是要争？」”]
    dialogue:
      - { speaker: 何老师, text: "认，就老老实实补交，接受印象分损失。争，就去问清规则依据——但态度要好。", mood: serious }
      - { speaker: 江雨桐, text: "争的话，万一评委觉得我们在狡辩……", mood: worried }
    choices:
      - id: file_appeal
        text: 礼貌申诉：问清依据，附上修正版
        visibleResponse: 组委会回复：格式确实有歧义，你们的补交不影响评审。一场虚惊，还白学了一条规则。
        hiddenEffects:
          - { kind: setFlag, key: key_c_appeal }
          - { kind: add, key: evidenceDiscipline, value: 3 }
          - { kind: relationship, characterId: c_advisor, delta: 2 }
      - id: accept_penalty
        text: 认栽补交：快速改完，接受教训
        visibleResponse: 一小时改完补交。组委会回了句「已收到」。没人知道这晚了24小时的材料背后发生了什么。
        hiddenEffects:
          - { kind: setFlag, key: key_c_accept_penalty }
          - { kind: add, key: academicDebt, value: 2 }
      - id: resubmit_express
        text: 加急重传全套：顺便把所有附件重新命名
        visibleResponse: 通宵把11条格式全部过了一遍。第二封「已收到」邮件到达时，全队在实验室欢呼。
        hiddenEffects:
          - { kind: setFlag, key: key_c_resubmit }
          - { kind: subtract, key: energy, value: 8 }
          - { kind: add, key: evidenceDiscipline, value: 3 }
        delayed:
          - { eventId: c_v2_dly_resubmit_dawn, onDay: 18 }
    learningPoint: 事故应对的姿态本身就是评审材料
    terminal: true

  - id: c_v2_dly_format_error
    campaign: competition
    day: 17
    type: delayed
    trigger: { kind: delayed }
    purpose: { narrative: 延迟后果——Agent漏检, learning: 未抽查的自动检查等于没检查 }
    scene: { location: lab, characters: [c_tech, c_ai_agent] }
    setup: [“组委会公示材料列表：你们队的附件3缺失。Agent的检查报告还在群里飘着——「全部合规」。”]
    dialogue:
      - { speaker: Agent, text: "复盘：检查规则来源为章程正文，附件3位于附录，未纳入检索范围。结论：我的合规，不是你们的合规。" }
      - { speaker: 方远, text: "（把报告打印出来贴墙上）以后每个自动检查，都配一个人肉抽查。", mood: angry }
    automaticEffects:
      - { kind: setFlag, key: key_c_agent_miss }
      - { kind: subtract, key: credibility, value: 5 }
      - { kind: add, key: academicDebt, value: 4 }
    terminal: true

  - id: c_v2_dly_resubmit_dawn
    campaign: competition
    day: 18
    type: delayed
    trigger: { kind: delayed }
    purpose: { narrative: 延迟后果——格式红利, learning: 一次彻底的合规终身受益 }
    scene: { location: lab, characters: [c_ai_agent] }
    setup: [“决赛材料准备时，Agent调用了你们那晚的格式清单自动核验——4分钟，全绿，无一遗漏。”]
    dialogue:
      - { speaker: Agent, text: "引用历史清单「提交格式11条清单」执行核验。结果：11/11通过。另：该清单已标记为可复用资产。" }
      - { speaker: 系统, text: "延迟后果：那一晚的通宵，变成了此后每一次提交的四分钟。" }
    automaticEffects:
      - { kind: add, key: evidenceDiscipline, value: 3 }
      - { kind: add, key: execution, value: 3 }
    terminal: true

  # ===== 种子10：竞品抄袭 =====
  - id: c_v2_d10_copycat
    campaign: competition
    day: 10
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 10, phase: end }
    purpose: { narrative: 被抄袭应对, learning: 竞争的反应定义你的比赛 }
    scene: { location: canteen, characters: [c_tech, c_rival] }
    setup: [“邱一鸣的团队公开了新Demo视频：界面、功能、甚至连slogan都和你们的像一个模子。”]
    dialogue:
      - { speaker: 方远, text: "（把两段视频并排放）这不是巧合。这是拿着我们的调研报告做出来的。", mood: angry }
      - { speaker: 邱一鸣, text: "（端着餐盘路过）英雄所见略同嘛。对了，你们第14页的思路不错，借鉴了。", mood: pleased }
    choices:
      - id: expose_public
        text: 当众揭发：挂时间戳，发到比赛群里
        visibleResponse: 群里炸了。支持者有，和事佬更多。邱一鸣回了一句「创意无主」，配了个笑脸。
        hiddenEffects:
          - { kind: setFlag, key: key_c_copy_fight }
          - { kind: relationship, characterId: c_rival, delta: -8 }
          - { kind: subtract, key: energy, value: 5 }
        delayed:
          - { eventId: c_v2_dly_copy_backfire, onDay: 14 }
      - id: private_talk
        text: 私下约谈：当面把话说开
        visibleResponse: 约在操场。邱一鸣居然来了，听完说了句「行，决赛见真章」。气氛诡异，但门没关死。
        hiddenEffects:
          - { kind: setFlag, key: key_c_copy_talk }
          - { kind: relationship, characterId: c_rival, delta: 4 }
        delayed:
          - { eventId: c_v2_dly_rival_talk, onDay: 12 }
      - id: differentiate
        text: 不纠缠：把精力砸在差异化上
        visibleResponse: 你把竞品矩阵撕掉重画：他们的每一个功能点旁边，写上一个他们没有的答案。
        hiddenEffects:
          - { kind: setFlag, key: key_c_copy_pivot }
          - { kind: add, key: userUnderstanding, value: 4 }
          - { kind: subtract, key: energy, value: 4 }
        delayed:
          - { eventId: c_v2_dly_pivot_pain, onDay: 15 }
    learningPoint: 被抄袭时，愤怒是成本最高的反应
    terminal: true

