    scene: { location: lab, characters: [c_tech, c_design] }
    setup: ["决赛答辩三个人都能答，但谁主答？全答？还是按领域切分？台本是死的，人是活的。"]
    dialogue:
      - { speaker: 方远, text: "技术我兜底。但我口才一般——别让我讲开场。", mood: serious }
      - { speaker: 江雨桐, text: "那数据类问题呢？我答口径，方远答实现，你兜所有「为什么」。", mood: serious }
    choices:
      - id: qa_split
        text: 按域切分：各答各的，交叉补位
        visibleResponse: 分工表最后一栏写着「补位规则」：谁的领域被追问，谁先答，相邻者三秒内补。
        hiddenEffects:
          - { kind: setFlag, key: key_c_qa_split }
          - { kind: add, key: teamTrust, value: 3 }
          - { kind: add, key: execution, value: 2 }
      - id: qa_own
        text: 一人主答：队长全接，队伍压阵
        visibleResponse: 你把所有问题都揽了下来。练到第二晚嗓子哑了——但所有答案终于长在了一个脑子里。
        hiddenEffects:
          - { kind: setFlag, key: key_c_qa_own }
          - { kind: subtract, key: energy, value: 5 }
          - { kind: add, key: independence, value: 3 }
      - id: qa_bounce
        text: 弹性应答：谁有状态谁上，允许互相递话
        visibleResponse: 没有固定分工，只有一句约定：「答不了就说『这个他更懂』，不硬撑。」
        hiddenEffects:
          - { kind: setFlag, key: key_c_qa_bounce }
          - { kind: add, key: riskTolerance, value: 3 }
    learningPoint: 答辩分工是团队信任的终极测试
    terminal: true

