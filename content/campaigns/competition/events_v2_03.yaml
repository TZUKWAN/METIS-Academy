    dialogue:
      - { speaker: Agent, text: "报告完成。数据来源：公开网络信息汇总。置信度：高。备注：本报告生成耗时11分钟。" }
      - { speaker: 方远, text: "11分钟干完我们三天的活。信它？还是……查它？", mood: serious }
    choices:
      - id: overtrust_report
        text: 直接用：结构这么全，不会错
        visibleResponse: 报告直接进了申报书。省下的时间变成了两次彩排——你们没有注意到第14页有个不存在的公司。
        hiddenEffects:
          - { kind: setFlag, key: key_c_agent_overtrust }
          - { kind: add, key: aiDependence, value: 7 }
        delayed:
          - { eventId: c_v2_dly_report_check, onDay: 16 }
      - id: spot_check
        text: 抽查10%：随机抽5条数据逐个溯源
        visibleResponse: 抽查5条，4真1假。假的那条删掉，顺手给Agent立了条新规：数据必须带链接。耗时40分钟，睡得踏实。
        hiddenEffects:
          - { kind: setFlag, key: key_c_verify_habit }
          - { kind: add, key: evidenceDiscipline, value: 5 }
          - { kind: add, key: aiDependence, value: 2 }
      - id: manual_redo
        text: 弃用重做：关键章节全部人工重写
        visibleResponse: 两天，人工重写了三个关键章节。Agent的版本留在旁边当参考——参考价值约40%。
        hiddenEffects:
          - { kind: setFlag, key: key_c_agent_solo }
          - { kind: subtract, key: aiDependence, value: 6 }
          - { kind: subtract, key: energy, value: 6 }
    learningPoint: 对Agent的信任要配一个抽检率
    terminal: true

