# 竞赛线 V2 扩展包03：补齐决策密度 + 隐藏事件 + NG+ 收束 + 长线传承
events:
  # ===== 选题验证三路 =====
  - id: c_v2_d06_verify
    campaign: competition
    day: 6
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 6, phase: end }
    purpose: { narrative: 选题验证深度, learning: 验证是选题的保险丝 }
    scene: { location: lab, characters: [c_design, c_ai_agent] }
    setup: ["选题已定：社团交接工具。Agent问：是否执行需求验证？雨桐说感觉已经验证过了——用感觉。"]
    dialogue:
      - { speaker: Agent, text: "建议：验证「交接之痛」的真实性与频率。备选：跳过验证，节省1.5天。风险自担。" }
      - { speaker: 江雨桐, text: "1.5天啊。材料周能多磨一版PPT。……但万一这个痛是我想出来的呢？", mood: serious }
    choices:
      - id: verify_deep
        text: 深验证：找10个刚经历交接的社长逐个聊
        visibleResponse: 10个社长，9个说了同一个词「一团糟」。你还意外拿到了3份交接Excel的截图——痛点长出了样子。
        hiddenEffects:
          - { kind: setFlag, key: key_c_pain_verified }
          - { kind: add, key: userUnderstanding, value: 8 }
          - { kind: add, key: evidenceDiscipline, value: 4 }
          - { kind: subtract, key: energy, value: 5 }
        delayed:
          - { eventId: c_v2_dly_pain_compound, onDay: 14 }
      - id: verify_skip
        text: 跳过验证：痛点这么明显，不用证明
        visibleResponse: 省下的一天半花在了界面打磨上。Demo好看极了——如果它解决的问题真的存在的话。
        hiddenEffects:
          - { kind: setFlag, key: key_c_pseudo_need }
          - { kind: add, key: execution, value: 3 }
        delayed:
          - { eventId: c_v2_dly_pseudo_bite, onDay: 12 }
      - id: verify_quick
        text: 快验证：只发50份问卷，一晚出结果
        visibleResponse: 问卷回来了，74%的人选「有这困扰」。可74%对「有没有」的证明力，你心里没底。
        hiddenEffects:
          - { kind: setFlag, key: key_c_verify_skipped }
          - { kind: add, key: userUnderstanding, value: 3 }
          - { kind: add, key: academicDebt, value: 3 }
    learningPoint: 选题验证省下的时间都是负债
    terminal: true

  - id: c_v2_dly_pseudo_bite
    campaign: competition
    day: 12
    type: delayed
    trigger: { kind: delayed }
    purpose: { narrative: 延迟后果——伪需求现形, learning: 未验证的痛点在追问日爆雷 }
    scene: { location: office, characters: [c_advisor] }
    setup: ["何老师看完Demo问了个问题：「交接之痛——你说给三个社长听过吗？」实验室安静得能喝出回声。"]
    dialogue:
      - { speaker: 何老师, text: "Demo很漂亮。可「痛点」两个字，你们只能靠猜。猜的东西，我签不了字。", mood: serious }
      - { speaker: 系统, text: "延迟后果：第6天省下的1.5天，今天变成方案地基上的一道裂缝。" }
    automaticEffects:
      - { kind: setFlag, key: key_c_pseudo_exposed }
      - { kind: subtract, key: credibility, value: 6 }
    terminal: true

  - id: c_v2_dly_pain_compound
    campaign: competition
    day: 14
    type: delayed
    trigger: { kind: delayed }
    purpose: { narrative: 延迟后果——验证复利, learning: 验证素材会在材料周自动升值 }
    scene: { location: lab, characters: [c_design] }
    setup: ["材料周。雨桐把10个社长的原话做成了PPT第5页——一页全是引语，没有一句形容词。"]
    dialogue:
      - { speaker: 江雨桐, text: "（翻到第5页）不用我写什么修辞了。他们的话，比我会说。", mood: pleased }
      - { speaker: 系统, text: "延迟后果：第6天的10杯茶，变成了今天最锋利的一页材料。" }
    automaticEffects:
      - { kind: add, key: credibility, value: 6 }
    terminal: true

  # ===== 用户聚焦三选 =====
  - id: c_v2_d10_user_focus
    campaign: competition
    day: 10
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 10, phase: start }
    purpose: { narrative: 目标用户收敛, learning: 用户画像越准，方案越利 }
    scene: { location: classroom, characters: [c_design, c_tech] }
    setup: ["「所有社团」太大。白板三个圈：大一新生干事、卸任老社长、社联指导老师。"]
    dialogue:
      - { speaker: 江雨桐, text: "新生是数量，老社长是痛点，老师是资源。选一个，就不要贪。", mood: serious }
      - { speaker: 方远, text: "选谁我就按谁的习惯做交互。三个都做=三个都做一半。", mood: neutral }
    choices:
      - id: user_fresh
        text: 主打新生干事：量最大，痛点最急
        visibleResponse: 方远把操作步骤压到三步——「新生没有耐心，第三步必须出结果」。
        hiddenEffects:
          - { kind: setFlag, key: key_c_user_fresh }
          - { kind: add, key: userUnderstanding, value: 5 }
        delayed:
          - { eventId: c_v2_dly_fresh_noise, onDay: 14 }
      - id: user_leader
        text: 主打卸任社长：痛最深，故事最真
        visibleResponse: 雨桐连夜约了两位老社长。「交接一周」的故事让Demo第一次有了体温。
        hiddenEffects:
          - { kind: setFlag, key: key_c_user_leader }
          - { kind: add, key: userUnderstanding, value: 4 }
      - id: user_both
        text: 两个都做：新生管量，社长管深
        visibleResponse: 两套交互逻辑，双倍的工作量。方远在白板上写了两个字：完了。然后开始干。
        hiddenEffects:
          - { kind: setFlag, key: key_c_user_both }
          - { kind: add, key: technicalDebt, value: 5 }
    learningPoint: 用户选择决定方案的刀口
    terminal: true

  - id: c_v2_dly_fresh_noise
    campaign: competition
    day: 14
    type: delayed
    trigger: { kind: delayed }
    purpose: { narrative: 延迟后果——新生用户噪声, learning: 低龄用户的数据需要过滤 }
    scene: { location: lab, characters: [c_design, c_ai_agent] }
    setup: ["新生测试场：20个大一试用，反馈涌进来112条。一半在夸表情包，没人提核心流程。"]
    dialogue:
      - { speaker: Agent, text: "分析：积极反馈中68%与核心功能无关。结论：新生用户数据噪声比高，需加权提取。" }
      - { speaker: 江雨桐, text: "（划掉一堆「可爱」）他们喜欢表情包，不代表他们会用。数据也要洗脸。", mood: serious }
    automaticEffects:
      - { kind: add, key: academicDebt, value: 2 }
      - { kind: add, key: evidenceDiscipline, value: 3 }
    terminal: true

  # ===== 团队冲突 =====
  - id: c_v2_d08_conflict
    campaign: competition
    day: 8
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 8, phase: end }
    purpose: { narrative: 风格冲突仲裁, learning: 冲突仲裁的目标是产出不是面子 }
    scene: { location: lab, characters: [c_tech, c_design] }
    setup: ["方案页大吵：方远要「功能列表一页流」，雨桐要「故事版三页递进」。两人都在等你表态。"]
    dialogue:
      - { speaker: 方远, text: "评委扫材料平均90秒。三页故事？第二页就划走了。", mood: angry }
      - { speaker: 江雨桐, text: "90秒读不懂列表，但看得懂故事。你那是给机器排的版！", mood: angry }
    choices:
      - id: mediate_test
        text: 停吵：拿两个版本各找人测5分钟
        visibleResponse: 测试结果意外：故事版留人，列表版易懂。你们把两者杂交成「故事开场+一页总览」，双双闭嘴，双双服气。
        hiddenEffects:
          - { kind: setFlag, key: key_c_conflict_mediated }
          - { kind: add, key: teamTrust, value: 5 }
          - { kind: add, key: evidenceDiscipline, value: 3 }
      - id: pick_side
        text: 直接拍板：听一边的，另一边执行
        visibleResponse: 你选了故事版。方远闷头执行，嘟囔着「反正代码是我的」。裂缝用效率伪装着。
        hiddenEffects:
          - { kind: setFlag, key: key_c_conflict_picked }
          - { kind: relationship, characterId: c_tech, delta: -4 }
        delayed:
          - { eventId: c_v2_dly_conflict_echo, onDay: 13 }
      - id: delay_conflict
        text: 缓一缓：先各自做，最后拼一版
        visibleResponse: 「都做」的决定花了两倍工时，拼版那晚两人谁也不想改对方的半页。
        hiddenEffects:
          - { kind: setFlag, key: key_c_conflict_delayed }
          - { kind: add, key: academicDebt, value: 4 }
          - { kind: subtract, key: energy, value: 5 }
    learningPoint: 冲突用证据仲裁，不用权力站队
    terminal: true

  - id: c_v2_dly_conflict_echo
    campaign: competition
    day: 13
    type: delayed
    trigger: { kind: delayed }
    purpose: { narrative: 延迟后果——站队余震, learning: 未化解的冲突会在压力期复发 }
    scene: { location: lab, characters: [c_tech, c_design] }
    setup: ["材料周高压期，同一个火药桶复燃：方远又把一页故事版改回了列表。这次连招呼都没打。"]
    dialogue:
      - { speaker: 江雨桐, text: "（盯着被改掉的页面，很平静）上次的架白吵了。原来你从来没服过。", mood: serious }
      - { speaker: 系统, text: "延迟后果：第8天用权力盖住的分歧，今天用默契的裂缝收利息。" }
    automaticEffects:
      - { kind: subtract, key: teamTrust, value: 5 }
      - { kind: add, key: academicDebt, value: 2 }
    terminal: true

  # ===== Demo范围二次决策 =====
  - id: c_v2_d11_scope_demo
    campaign: competition
    day: 11
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 11, phase: start }
    purpose: { narrative: Demo范围收口, learning: 演示范围要有明确的门禁 }
    scene: { location: lab, characters: [c_tech] }
    setup: ["Demo冲刺过半。方远的功能清单又长出4个「顺手就能加」的小功能。加不加？"]
    dialogue:
      - { speaker: 方远, text: "都是小活。导出Excel半天，消息通知半天……加起来也就两天。", mood: pleased }
      - { speaker: 系统, text: "「顺手」是Demo冲刺期最贵的两个字。每个顺手背后都藏着一个测试和一次联调。" }
    choices:
      - id: scope_core
        text: 冻结：只保核心三功能，其他进 backlog
        visibleResponse: 白板划出一条红线，红线外全部贴上「下学期」。方远盯着红线看了会儿，说了句「行，稳了」。
        hiddenEffects:
          - { kind: setFlag, key: key_c_demo_core }
          - { kind: add, key: technicalDebt, value: -3 }
          - { kind: add, key: execution, value: 3 }
      - id: scope_all
        text: 都加：反正每个都不大
        visibleResponse: 四个「小活」花了三天半，还引出两个隐藏bug。Demo更丰满了——丰满得像要难产。
        hiddenEffects:
          - { kind: setFlag, key: key_c_demo_full }
          - { kind: add, key: technicalDebt, value: 6 }
          - { kind: subtract, key: energy, value: 6 }
      - id: scope_flip
        text: 押宝：放下一切，先做一个惊艳的演示特效
        visibleResponse: 那个交互动画确实惊艳。代价是核心功能第13天还在裸奔。
        hiddenEffects:
          - { kind: setFlag, key: key_c_demo_flip }
          - { kind: add, key: riskTolerance, value: 4 }
        delayed:
          - { eventId: c_v2_dly_flip_panic, onDay: 15 }
    learningPoint: 范围门禁是冲刺期的刹车
    terminal: true

  - id: c_v2_dly_flip_panic
    campaign: competition
    day: 15
    type: delayed
    trigger: { kind: delayed }
    purpose: { narrative: 延迟后果——特效裸奔, learning: 炫技的债由核心功能偿还 }
    scene: { location: lab, characters: [c_tech, c_design] }
    setup: ["材料周第一天，核心功能的导出还在报错。惊艳特效在角落里闪着光，像一座没人上得去的桥。"]
    dialogue:
      - { speaker: 方远, text: "（盯着报错栈）特效那天要是拿来修导出……好了不说了，说多了都是泪。", mood: angry }
      - { speaker: 江雨桐, text: "（关掉特效页面）决赛放稳的，不放闪的。都收心。", mood: serious }
    automaticEffects:
      - { kind: setFlag, key: key_c_flip_cost }
      - { kind: add, key: academicDebt, value: 4 }
      - { kind: subtract, key: energy, value: 5 }
    terminal: true

  # ===== 技术路线中期复评 =====
  - id: c_v2_d13_techroute
    campaign: competition
    day: 13
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 13, phase: end }
    purpose: { narrative: 技术路线复评, learning: 中期复评比一开始选对更重要 }
    scene: { location: lab, characters: [c_tech, c_ai_agent] }
    setup: ["Demo雏形体检：响应2.8秒，偶发内存泄漏，代码结构能撑但不能养。方远提出三条路线。"]
    dialogue:
      - { speaker: 方远, text: "A：就这样，能跑；B：停两天重构；C：加一层包装把慢藏起来。说实话我想选A。", mood: serious }
      - { speaker: Agent, text: "数据：往届决赛演示中，响应超过3秒的项目评委互动率下降41%。" }
    choices:
      - id: route_stable
        text: A：不动，把时间全给材料和彩排
        visibleResponse: 你们用省下的两天磨了路演。2.8秒的响应在彩排里被开场白自然带过——没人计较。
        hiddenEffects:
          - { kind: setFlag, key: key_c_route_stable }
          - { kind: add, key: execution, value: 3 }
      - id: route_rewrite
        text: B：停两天，把泄漏修了结构顺了
        visibleResponse: 两天后响应1.4秒，内存曲线平了。方远说「睡了个技术觉」。
        hiddenEffects:
          - { kind: setFlag, key: key_c_route_rewrite }
          - { kind: add, key: technicalDebt, value: -6 }
          - { kind: subtract, key: energy, value: 6 }
      - id: route_wrap
        text: C：加加载动画，把慢藏起来
        visibleResponse: 转圈动画做得极精致，精致得像在道歉。2.8秒变成了「看起来在思考」的2.8秒。
        hiddenEffects:
          - { kind: setFlag, key: key_c_route_wrap }
          - { kind: add, key: academicDebt, value: 4 }
    learningPoint: 中期复评选的是风险去向
    terminal: true

  # ===== 评审策略 =====
  - id: c_v2_d14_judgestrategy
    campaign: competition
    day: 14
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 14, phase: start }
    purpose: { narrative: 评审注意力策略, learning: 评委的注意力是需要设计的 }
    scene: { location: lab, characters: [c_design, c_ai_agent] }
    setup: ["路演策略会：8分钟、5位评委、平均90秒一页的阅读速度。注意力是预算，怎么花？"]
    dialogue:
      - { speaker: Agent, text: "往届数据：评委提问集中在技术实现与数据来源两区，占比63%。建议针对性加固。" }
      - { speaker: 江雨桐, text: "我的直觉相反：让评委记住一个画面，比答对所有问题更值钱。", mood: serious }
    choices:
      - id: judge_focus
        text: 单点爆破：把最大的亮点讲到极致
        visibleResponse: 你们把8分钟的60%压在「交接清单自动生成」上。讲到底，讲到评委点头为止。
        hiddenEffects:
          - { kind: setFlag, key: key_c_judge_focus }
          - { kind: add, key: execution, value: 3 }
      - id: judge_spread
        text: 面面俱到：每个评委的关注点都照顾到
        visibleResponse: 材料加了数据附录、技术附录、用户附录——什么都有一点，什么都只有一点。
        hiddenEffects:
          - { kind: setFlag, key: key_c_judge_spread }
          - { kind: add, key: academicDebt, value: 3 }
      - id: judge_defense
        text: 防守优先：先补数据漏洞，再谈亮点
        visibleResponse: 两天补齐三处口径与样本问题。路演变保守了，但哪里都咬不动。
        hiddenEffects:
          - { kind: setFlag, key: key_c_judge_defense }
          - { kind: add, key: credibility, value: 3 }
          - { kind: subtract, key: progress, value: 2 }
    learningPoint: 评审策略是注意力的预算学
    terminal: true

  # ===== 数据离群值（风险处理） =====
  - id: c_v2_d15_outlier
    campaign: competition
    day: 15
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 15, phase: end }
    purpose: { narrative: 离群值处置, learning: 数据的诚实从处理异常开始 }
    scene: { location: lab, characters: [c_tech, c_ai_agent] }
    setup: ["统计日：30个社团的试用数据里有3个异常值——两个好得离谱，一个差得离谱。怎么处理？"]
    dialogue:
      - { speaker: 方远, text: "删掉异常值，曲线立刻漂亮20%。业界都这么干—— normalization 嘛。", mood: serious }
      - { speaker: Agent, text: "提示：两个高值来自同一社团的重复提交。低值社团反馈与功能无关，与网络环境相关。" }
    choices:
      - id: outlier_report
        text: 如实报告：剔除原因写进附录
        visibleResponse: 附录多了一节《数据清洗说明》：三条异常、剔除理由、敏感性分析。评委看不懂没关系——看得出你们诚实就行。
        hiddenEffects:
          - { kind: setFlag, key: key_c_outlier_report }
          - { kind: add, key: credibility, value: 5 }
          - { kind: add, key: evidenceDiscipline, value: 4 }
      - id: outlier_hide
        text: 静默剔除：不解释，直接删
        visibleResponse: 曲线漂亮了20%，没人知道代价。你在提交前多看了一眼那个消失的低值，然后关掉了文件。
        hiddenEffects:
          - { kind: setFlag, key: key_c_outlier_hide }
          - { kind: add, key: academicDebt, value: 4 }
        delayed:
          - { eventId: c_v2_dly_outlier_ghost, onDay: 19 }
      - id: outlier_rerun
        text: 重测：低值社团换环境再测一次
        visibleResponse: 第二次测试证明了你的猜想：低值是校园网背锅。真实数据反而更好看了——因为它是真的。
        hiddenEffects:
          - { kind: setFlag, key: key_c_outlier_rerun }
          - { kind: add, key: evidenceDiscipline, value: 5 }
          - { kind: subtract, key: energy, value: 5 }
    learningPoint: 异常值是数据的诚实度测试题
    terminal: true

  - id: c_v2_dly_outlier_ghost
    campaign: competition
    day: 19
    type: delayed
    trigger: { kind: delayed }
    purpose: { narrative: 延迟后果——静默剔除回响, learning: 未说明的清洗会被当作操纵 }
    scene: { location: defense_hall, characters: [c_judge_final] }
    setup: ["决赛答辩。孙教授看着曲线问：「这个样本量，30——原始数据就是30吗？」你的心跳漏了半拍。"]
    dialogue:
      - { speaker: 孙教授, text: "（温和地）不着急回答。我只是见过太多「恰好干净」的数据了。", mood: serious }
      - { speaker: 系统, text: "延迟后果：第15天删掉的那三条，今天在评委的 question 里借尸还魂。" }
    automaticEffects:
      - { kind: setFlag, key: key_c_outlier_questioned }
      - { kind: subtract, key: credibility, value: 6 }
    terminal: true

  # ===== 规则灰区 =====
  - id: c_v2_d09_rulegray
    campaign: competition
    day: 9
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 9, phase: end }
    purpose: { narrative: 规则灰区抉择, learning: 灰区里走出的是你自己的边界 }
    scene: { location: lab, characters: [c_tech, c_advisor] }
    setup: ["方远想爬取学校公开数据增强Demo。章程没禁止，也没允许。第14条只禁了「未授权API」。"]
