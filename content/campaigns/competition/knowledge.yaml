# 竞赛线知识卡（kc_c_ 前缀）
knowledge:
  - id: kc_c_rule_extract
    title: 长文档规则提取三步法
    domain: task_contract
    trigger: first_failure
    problem: 40页章程读不完也记不住，关键约束藏在角落
    wrongPattern: 要么硬读全文，要么只信AI摘要
    correctBehavior: AI提取→人工抽查5处→存为清单全队共享
    why: AI提取快但会看错页；人工全读慢但准；组合最稳
    steps:
      - 让AI按维度提取(评分/约束/时间/资格)
      - 抽查5处核对原文
      - 修正后存为checklist资产
    toolMappings:
      claudeCode: PDF放本地让Agent读
      codex: 同左
      deepseekHarness: 附文本分段
    successSignals:
      - 截止时间/权重零记错
    failureSignals:
      - 赛前发现漏看条款
    transferScenarios:
      - 招聘JD分析
      - 合同审阅
    depth30s: AI提取，人抽查，清单共享。
    depth3m: 提取时给维度清单；抽查选"会疼的条款"（deadline/资格/扣分项）；清单放群里当宪法。
    depth10m: 建"规则卡"模板：权重表/红线条款/时间线/争议处理。每次比赛复用。
    relatedSkillIds:
      - tc.deliverable
      - tc.examples
      - tc.inspect_first
  - id: kc_c_deadline_reverse
    title: 倒排时间表
    domain: goal
    trigger: skill_unlock
    problem: 21天看着长，一晃就没了
    wrongPattern: 顺排"先干着看"
    correctBehavior: 从deadline倒排，每段留缓冲，材料期永远最后4天
    why: deadline是硬的，中间所有活动都要为它让路
    steps:
      - 标出硬deadline
      - 切里程碑
      - 每段+20%缓冲
      - 贴在白板
    toolMappings:
      generic: 白板+群置顶
    successSignals:
      - 每个里程碑有交付物
    failureSignals:
      - 最后三天才做材料
    transferScenarios:
      - 毕业论文
      - 搬家计划
    depth30s: 从终点往回排，缓冲前置。
    depth3m: 材料永远比想象慢；Demo永远比想象慢；只有吹牛比想象快。
    depth10m: 倒排表含"砍功能触发线"：某里程碑延期超2天，立即启动砍功能预案。
    relatedSkillIds:
      - goal.milestones
  - id: kc_c_interview
    title: 行为式访谈
    domain: verification
    trigger: first_failure
    problem: 访谈对象都说"会用地"，上线后没人用
    wrongPattern: 问“你会不会用”“你觉得好不好”
    correctBehavior: 只问过去行为：上次什么时候/怎么解决/花了多久/花没花钱
    why: 人对未来意愿的预测极不可靠，对过去事实的记忆可靠得多
    steps:
      - 列出怀疑的痛点
      - 问最近一次发生
      - 追细节(工具/时长/花费)
      - 记录原话
    toolMappings:
      generic: 录音+逐字稿
    successSignals:
      - 访谈里出现具体数字和场景
    failureSignals:
      - 满篇"应该会""可能吧"
    transferScenarios:
      - 需求调研
      - 用户回访
    depth30s: 问过去，别问未来。
    depth3m: 问会不会用得到的是礼貌，问上次怎么解决的得到的是真实。痛点=已经花钱或花时间绕过的坑。
    depth10m: 建立"痛点证据表"：原话/频次/现解决方案/绕行成本。低于3个独立来源的痛点不进方案。
    relatedSkillIds:
      - verification.source_check
  - id: kc_c_competitor_scan
    title: 竞品矩阵四列法
    domain: loop
    trigger: skill_unlock
    problem: 竞品调研一头雾水，答辩被问"和XX有什么区别"
    wrongPattern: 凭印象列两三个名字
    correctBehavior: 迷你契约：限定范围+四列维度(功能/定价/口碑/缺陷)+抽查
    why: 竞品扫描是典型批量任务，结构化才能汇总
    steps:
      - 定范围(近3年/同类场景)
      - AI批量初扫
      - 人工抽查2家
      - 空隙即定位
    toolMappings:
      claudeCode: 每个竞品一个子任务
      codex: 同左
      deepseekHarness: 编排
    successSignals:
      - 矩阵能直接回答"差异在哪"
    failureSignals:
      - 被评委问出一个没听过的名字
    transferScenarios:
      - 技术选型
      - 报价对比
    depth30s: 范围+维度+抽查=竞品矩阵。
    depth3m: 缺陷列最值钱——你的定位藏在竞品的缺陷里。每列必须有出处链接。
    depth10m: 矩阵加"我们"一行做gap分析；答辩时直接投影这一行。
    relatedSkillIds:
      - org.aggregation
      - loop.evidence_loop
  - id: kc_c_contract_page
    title: 把形容词翻译成验收标准
    domain: task_contract
    trigger: event
    problem: 做漂亮点、好用一点等模糊需求导致扯皮
    wrongPattern: 接受模糊需求直接开干
    correctBehavior: 翻译成可测指标：首屏≤1秒/3步完成/错误提示文案清单
    why: 形容词无法验收，指标才能
    steps:
      - 抓出形容词
      - 问"什么算达成"
      - 写成数字或清单
      - 双方确认
    toolMappings:
      generic: 验收清单
    successSignals:
      - 交付时无"我觉得不行"式争议
    failureSignals:
      - 反复返工改"感觉"
    transferScenarios:
      - 外包
      - 设计需求
    depth30s: 每个形容词都欠一张验收单。
    depth3m: 常用翻译：漂亮→首屏/配色/栅格规则；好用→步数/时长/错误率；稳定→崩溃率/恢复方案。
    depth10m: 建"需求翻译表"模板：原话/翻译/指标/验收方式。需求会上当场填。
    relatedSkillIds:
      - tc.scope_control
      - tc.execution_rules
      - tc.stop_condition
  - id: kc_c_regression
    title: 回归测试：演示的安全带
    domain: verification
    trigger: first_failure
    problem: 新功能上线把老功能改坏，演示当场翻车
    wrongPattern: 只测新功能，旧的不看
    correctBehavior: 把演示路径写成自动化回归，每次改动必跑
    why: 改动的影响面永远大于意图
    steps:
      - 列出演示关键路径
      - 转成自动化用例
      - 每次改动后全量跑
      - 红了先修再合
    toolMappings:
      claudeCode: 让Agent写回归脚本
      codex: 同左
      deepseekHarness: CI配置
    successSignals:
      - 演示前最后一次全绿
    failureSignals:
      - 彩排翻车修不完
    transferScenarios:
      - 上线发布
      - 重构
    depth30s: 新功能会咬旧功能。回归是安全带。
    depth3m: 回归清单=演示路径+核心边界情况；跑一轮5分钟，救一场演示。
    depth10m: 回归进CI；任何人(包括AI)的提交不过回归不许合并——写进AGENTS.md。
    relatedSkillIds:
      - verification.regression
  - id: kc_c_data_consistency
    title: 跨材料数据对表
    domain: verification
    trigger: event
    problem: 申报书92%、PPT 85%、Demo 78%
    wrongPattern: 各写各的，最后没人对
    correctBehavior: 建立"唯一数字表"：每个指标只有一个值+口径注释，三处引用它
    why: 评委只需要抓到一次不一致，可信度就清零
    steps:
      - 列出所有对外数字
      - 标注来源与口径
      - 统一改齐
      - 交付前三人互查
    toolMappings:
      generic: 数字表资产
    successSignals:
      - 三处材料数字一致
    failureSignals:
      - 评委指出数字打架
    transferScenarios:
      - 融资BP
      - 学术海报
    depth30s: 一个数字只说一次真话。
    depth3m: 口径三要素：定义/样本/时间窗。“78%(n=120,三轮均值)”比“78%”可信十倍。
    depth10m: 数字表加版本：每次改动记录谁/何时/为何——审计轨迹就是诚信证明。
    relatedSkillIds:
      - verification.data_consistency
  - id: kc_c_adversarial
    title: 对抗预演：先替评委打自己
    domain: verification
    trigger: skill_unlock
    problem: 答辩被没准备过的问题问穿
    wrongPattern: 只背自己想讲的
    correctBehavior: 让AI扮演最刻薄的评委，三轮对抗问答
    why: 稿子覆盖你想讲的，预演覆盖他们会问的
    steps:
      - 让AI以评委身份攻击
      - 记录卡壳问题
      - 写应答卡
      - 再来一轮
    toolMappings:
      claudeCode: 角色扮演prompt
      codex: 同左
      deepseekHarness: 同左
    successSignals:
      - 现场无全新问题
    failureSignals:
      - 被问"这个你们想过吗"时沉默
    transferScenarios:
      - 面试
      - 融资路演
    depth30s: 被自己打倒一次，赛场就打不倒你。
    depth3m: 三个必问角度：数据真实吗/和现有什么区别/去掉AI你们还剩什么。
    depth10m: 应答卡格式：问题/一句立场/一个证据/一句边界承认。每题不超过四句。
    relatedSkillIds:
      - verification.adversarial_review
  - id: kc_c_mvp_scope
    title: MVP=最小可演示
    domain: goal
    trigger: event
    problem: 功能越加越多，核心流程还有bug
    wrongPattern: 以功能数量感动评委
    correctBehavior: Goal只写"可演示的最小闭环"，其余进愿望清单
    why: 评委投的是“问题解决了吗”，不是“功能多不多”
    steps:
      - 定义演示脚本N步
      - Goal判据=脚本全通过
      - 新想法进清单不进代码
    toolMappings:
      generic: 愿望清单文件
    successSignals:
      - 演示脚本一次跑通
    failureSignals:
      - 核心流程带病上场
    transferScenarios:
      - 产品迭代
      - 作业项目
    depth30s: 能演示的一件事 > 做了一半的十件事。
    depth3m: MVP判据写死为演示脚本；任何新需求问"它在脚本第几步"。
    depth10m: 愿望清单也是资产：赛后它就是roadmap，别浪费。
    relatedSkillIds:
      - goal.completion
  - id: kc_c_rehearsal_timing
    title: 路演时间盒
    domain: loop
    trigger: event
    problem: 8分钟讲了12分钟，最后仓促跳页
    wrongPattern: 不砍内容靠语速
    correctBehavior: 按评分权重分配秒数，超时砍低权重段
    why: 时间是路演的硬约束，权重是内容的优先级
    steps:
      - 列出评分权重
      - 按权重分秒数
      - 彩排计时
      - 超时砍低分项
    toolMappings:
      generic: 计时器+分秒表
    successSignals:
      - 8分钟内含提问缓冲
    failureSignals:
      - 被计时器打断
    transferScenarios:
      - 汇报
      - 演讲
    depth30s: 秒数跟着权重走，不跟着感情走。
    depth3m: 背景/意义永远可砍；演示与数据出处是得分点，加时长。
    depth10m: 每页PPT标注"可砍"标记；现场根据前组超时情况动态再砍。
    relatedSkillIds:
      - loop.content_loop
      - loop.stop_rule
  - id: kc_c_ai_disclosure
    title: AI使用要留台账
    domain: verification
    trigger: event
    problem: 评委问"哪些是AI做的"，答不上或前后矛盾
    wrongPattern: 隐瞒AI使用，或一句"辅助"带过
    correctBehavior: 台账：工具/用途/人工核验方式/修改量
    why: 如实披露AI使用是诚信，也是展示你工作量的机会
    steps:
      - 记录每次AI参与
      - 标注核验人
      - 申报书专节说明
    toolMappings:
      generic: 台账文档
    successSignals:
      - 被追问时越答越有底气
    failureSignals:
      - 被戳出隐瞒
    transferScenarios:
      - 课程作业
      - 职场交付
    depth30s: AI贡献记账，诚信也是加分项。
    depth3m: 台账让“AI做的”变成“我指挥AI做的”——主动权在台账里。
    depth10m: 台账配合抽查记录，证明"AI产出经过人的验证"，这是最被看重的工程素养。
    relatedSkillIds:
      - verification.human_check
  - id: kc_c_debug_root
    title: 先复现，再修bug
    domain: loop
    trigger: first_failure
    problem: AI"修复"把功能删了
    wrongPattern: 让AI直接改，不看根因
    correctBehavior: 复现→定位根因→最小修复→回归验证
    why: 不明根因的修复是掷骰子
    steps:
      - 稳定复现步骤
      - 读报错定位
      - 提出根因假设
      - 最小修复+回归
    toolMappings:
      claudeCode: 契约写明先复现
      codex: 同左
      deepseekHarness: 同左
    successSignals:
      - bug绝迹而非转移
    failureSignals:
      - 修一个坏两个
    transferScenarios:
      - 任何故障处理
    depth30s: 没复现就修，等于没修。
    depth3m: 让AI修bug的契约格式：复现步骤+期望vs实际+约束(不许删功能)。
    depth10m: 建立"bug档案"：现象/根因/修复/教训。第三次同类bug出现前你就能拦住它。
    relatedSkillIds:
      - loop.debugging
  - id: kc_c_git_basics
    title: 比赛代码也要上Git
    domain: environment
    trigger: event
    problem: 压缩包合并丢代码
    wrongPattern: 压缩包传文件
    correctBehavior: Git+两条分支规则：main可演示/feature随便造
    why: 版本控制=后悔药+并行协作的基础
    steps:
      - init+首次提交
      - 建分支规则
      - 每个功能一个分支
      - 合并前跑测试
    toolMappings:
      generic: git/GitHub
    successSignals:
      - 任何时刻可回滚
    failureSignals:
      - 代码丢失/覆盖
    transferScenarios:
      - 一切代码工作
    depth30s: zip会丢代码，Git会救你。
    depth3m: 两条规则起步：main永远可演示；改东西先开分支。
    depth10m: 提交信息写“为什么改”而非“改了什么”；打tag标记演示版本。
    relatedSkillIds:
      - environment.config_file
  - id: kc_c_demo_data
    title: 演示数据可以造，口径不能骗
    domain: verification
    trigger: event
    problem: Demo里空空如也，演示没说服力
    wrongPattern: 造假数据还暗示是真实用户
    correctBehavior: 生成模拟数据但在材料中明确标注"演示数据"
    why: 演示需要氛围，诚信需要边界——标注能同时满足
    steps:
      - 生成模拟数据
      - 界面角落标注演示库
      - 材料注明
      - 被问时坦然
    toolMappings:
      generic: 标注+台账
    successSignals:
      - 被问数据来源时理直气壮
    failureSignals:
      - 被问"这些用户授权怎么拿的"
    transferScenarios:
      - 产品Demo
      - 原型测试
    depth30s: 造可以，标必须。
    depth3m: 演示数据四个字成本为零，救的是整场答辩的可信度。
    depth10m: 数据脚本存档：生成规则可复现，说明你们连假数据都造得严谨。
    relatedSkillIds:
      - verification.human_check
  - id: kc_c_backup_plan
    title: 演示B计划
    domain: verification
    trigger: event
    problem: 现场网络/设备/依赖导致Demo放不出来
    wrongPattern: 赌现场一切正常
    correctBehavior: 录屏+备机+双U盘+离线依赖四件套
    why: 现场环境是不可控变量，B计划把不可控变可控
    steps:
      - 录制完整演示视频
      - 准备备用设备
      - 双份拷贝
      - 离线打包依赖
    toolMappings:
      generic: 清单
    successSignals:
      - 任何单点故障可切换
    failureSignals:
      - 现场抓瞎
    transferScenarios:
      - 发布会
      - 答辩
    depth30s: 网络会背叛你，录屏不会。
    depth3m: B计划演练一遍才算数——U盘里只有视频没播放器是经典惨案。
    depth10m: B计划清单进检查单：赛前一小时逐项打勾。
    relatedSkillIds:
      - verification.file_integrity
  - id: kc_c_team_charter
    title: 分工表是防散伙的
    domain: agent_organization
    trigger: first_failure
    problem: 三个人各干各的，最后拼不起来
    wrongPattern: 放养式管理
    correctBehavior: 分工表：职责/交付标准/不许做/集成方式
    why: 温柔的模糊分工是内讧的温床
    steps:
      - 按模块切边界
      - 每人写交付标准
      - 明确禁区
      - 定集成节奏
    toolMappings:
      generic: 文档+群置顶
    successSignals:
      - 集成日无大冲突
    failureSignals:
      - 互相甩锅
    transferScenarios:
      - 小组作业
      - 联合项目
    depth30s: 分工表越具体，散伙越晚来。
    depth3m: 关键是"不许做"栏：技术不许不做测试，设计不许编数据。
    depth10m: 加"冲突解决条款"：分歧当天说，队长终裁。写在表尾，全员签名。
    relatedSkillIds:
      - org.role_definition
      - org.review_agent
      - org.delegation
  - id: kc_c_budget
    title: 比赛预算纪律
    domain: environment
    trigger: event
    problem: 前期乱花钱，决赛资源紧张
    wrongPattern: 一冲动全款买配置
    correctBehavior: 免费层跑通→确定需求→按需付费，记流水
    why: 钱是约束不是排面
    steps:
      - 列必选项
      - 找免费层
      - 记录每笔支出
      - 决赛期留备用金
    toolMappings:
      generic: 记账表
    successSignals:
      - 决赛期有钱应急
    failureSignals:
      - 中途没钱续费
    transferScenarios:
      - 创业成本控制
    depth30s: 先免费跑通，再谈付费。
    depth3m: 云服务免费层覆盖90%比赛场景；付费发生在“确认需要”而非“可能需要”。
    depth10m: 流水表含"为什么买"列——复盘时它过滤掉一半冲动消费。
    relatedSkillIds:
      - environment.failure_diag
  - id: kc_c_material_early
    title: 材料期前置
    domain: goal
    trigger: npc_advice
    problem: 最后三天狂赶申报书，数据没时间核
    wrongPattern: 材料放最后
    correctBehavior: 材料与Demo并行：边做边记素材，数据从数字表引用
    why: 材料的原料是过程记录，事后补的素材必掺水
    steps:
