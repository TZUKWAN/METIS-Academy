  - id: r_end_excellent
    campaign: research
    title: 《优秀开题》
    mainResult: 开题答辩优秀通过
    requirements:
      kind: and
      conditions:
        - { kind: state, key: progress, op: gte, value: 74 }
        - { kind: state, key: academicDebt, op: lte, value: 45 }
        - { kind: flag, key: defense_done }
    priority: 88
    tier: main
    baseText: |
      答辩室里，你合上最后一页幻灯片。
      吴教授在纸上写了什么，然后抬头："研究问题很清楚。第十二页的证据链——你自己核过吗？"
      你点头。这一次，你确实核过。每一页。
    growthVariantRules:
      - dimension: independence
        variants:
          - { gte: 70, text: "整个准备过程中，你逐渐学会了自己判断什么时候该信AI、什么时候必须自己查证。" }
          - { lte: 45, text: "评委注意到你的产出质量，也注意到汇报时你眼睛里有一丝不确定——那不是关于数据，是关于'多少是你自己的'。" }
      - dimension: evidenceDiscipline
        variants:
          - { gte: 75, text: "每一处引用你都能指出原文页码。吴教授抽查了三条，三条全中。" }
          - { lte: 50, text: "有几处引用，你其实没回头翻过原文。今天它们没惹祸。" }
      - dimension: execution
        variants:
          - { gte: 70, text: "十个里程碑，九个准点。剩下那个，你提前申请了调整——有理有据，没人反对。" }
    characterEpilogueRules:
      - characterId: r_mentor
        positive: 陈教授把你拉进了他的国家级课题：“来，你的方法正好用得上。”
        neutral: 陈教授在组会上宣布：你的开题入选了学院优秀案例。
        negative: 陈教授只说：“保持。明年这时候，我要看到论文。”
      - characterId: r_senior_theory
        positive: 林师姐把你的概念辨析表加进了她的“新生必读”清单，署了你的名字。
        neutral: 林师姐说：“概念功夫扎实。毕业论文照这个标准来。”
        negative: 林师姐挑眉：“优秀是优秀……你肯定有偷懒的地方，下次组会我查。”
      - characterId: r_evaluator_b
        positive: 郑老师在评审表“创新性”一栏写了全组唯一的“突出”。
        neutral: 郑老师评价：问题意识清晰，方法可行。
        negative: 郑老师提了一个你现在还答不上来的问题。记下了吧。
    projectFutureRules:
      - { key: strong, condition: { kind: state, key: progress, op: gte, value: 85 }, text: "这份开题报告后来成了你硕士论文的第一章。几乎没改。" }
      - { key: stable, condition: { kind: always }, text: "研究计划进入执行阶段，前路还长，但方向已经钉死。" }
    specialFlagSections:
      - { flag: citation_fixed_in_time, text: "第二十六天，你亲手拆掉了那颗雷。评委会后说：'那条引用我本来准备问的。'" }
      - { flag: ach_r_asset_index, text: "你的资产索引制度被师姐全盘搬走。她说这叫'可复现的自己'。" }
    specialTags: [good, excellent]
    reflection: 优秀不是完美，是每一处薄弱都事先知道自己薄弱。
    lessonHint: 证据纪律决定研究能走多远

  - id: r_end_true_growth
    campaign: research
    title: 《低完成，高成长》
    mainResult: 完成度一般，但研究品格真正成形
    requirements:
      kind: and
      conditions:
        - { kind: state, key: progress, op: lte, value: 60 }
