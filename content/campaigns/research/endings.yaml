# 科研线主结局 ×20（TASK-H011/H012）—— 组合变体由 composer 生成
endings:
  - id: r_end_hidden_true_researcher
    campaign: research
    title: 《研究者诞生了》
    mainResult: 隐藏结局——研究能力真正形成
    requirements:
      kind: and
      conditions:
        - { kind: state, key: independence, op: gte, value: 78 }
        - { kind: state, key: evidenceDiscipline, op: gte, value: 78 }
        - { kind: state, key: progress, op: gte, value: 70 }
    priority: 300
    tier: hidden
    baseText: |
      答辩结束的那一刻，你意识到某种东西不一样了。
      吴教授的追问、郑老师的微笑、陈教授那杯没动的茶——你听懂了每一个问题背后的关切。
      这三十天里，你学会的不是"用AI做研究"。你学会的是：什么时候信它，什么时候查它，什么时候关掉它自己想。
    growthVariantRules:
      - dimension: independence
        variants: [{ gte: 90, text: “组会记录里，你反驳导师观点的那一页被人折了角——组里开始传阅。” }]
      - dimension: evidenceDiscipline
        variants: [{ gte: 90, text: “你的文献矩阵被师姐要走了模板——她说这比任何'如何读文献'的教程都好使。” }]
      - dimension: execution
        variants: [{ gte: 75, text: “十一个游戏日的验收单，一张没落下，全签了字。” }]
      - dimension: aiDependence
        variants:
          - { lte: 35, text: "Agent 对你来说成了真正的工具：用得上，也放得下。" }
          - { gte: 60, text: "只有你自己知道，独立判断里有多少是硬撑出来的。" }
    characterEpilogueRules:
      - characterId: r_mentor
        positive: 陈教授把你的开题报告发给了他所有研究生：“看看什么叫把工具用明白。”
        neutral: 陈教授在你的培养计划上添了一行字：独立研究，已入门。
        negative: 陈教授说：“能力是有了，可惜差点意思。”——但你听得出来，那是认可。
      - characterId: r_senior_theory
        positive: 林师姐毕业答辩那天，把你列为“组里文献核查制度的共同创始人”。
        neutral: 林师姐把你的概念辨析表收进了她的“带新学弟学妹”文件夹。
        negative: 林师姐说：“你这条路走得比我直。我有点嫉妒。”
      - characterId: r_peer
        positive: 苏晓宣布跟你组队做下一个研究：“抱大腿，我承认。”
        neutral: 苏晓把你的应答卡拍了下来，说下次组会照抄。
        negative: 苏晓感慨：“你现在卷得让我害怕。”但她的眼睛在笑。
    projectFutureRules:
      - { key: strong, condition: { kind: state, key: progress, op: gte, value: 85 }, text: "你的开题被评为了当年组里最佳。三年后回头看，那是你研究生涯真正的起点。" }
      - { key: steady, condition: { kind: state, key: progress, op: gte, value: 70 }, text: "研究进入执行期。方法论已经长在你身上，剩下的只是时间。" }
      - { key: default, condition: { kind: always }, text: "你带着这套方法走向了下一个题目——方法在，题目只是载体。" }
    specialFlagSections:
      - { flag: citation_fixed_in_time, text: "那份假引用被你在第二十六天亲手拆掉。很多年后你仍会讲起这个故事——它救了你。" }
      - { flag: ach_r_conflict_arbitrated, text: "多智能体冲突裁决的经历，成了你面试时最常被追问的段落。" }
    specialTags: [hidden, best_ending]
    reflection: 工具会过时，模型会迭代，但“提出好问题、检验每个答案”的能力不会。这就是研究。
    lessonHint: 最高级的Agent用法，是知道什么时候不用它

  - id: r_end_citation_crisis
    campaign: research
    title: 《崩塌的引用》
    mainResult: 证据危机——假引用在答辩现场爆雷
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: citation_crisis_happened }
        - { kind: state, key: evidenceDiscipline, op: lte, value: 55 }
    priority: 250
    tier: main
    baseText: |
      答辩进行到第九分钟，吴教授举起了那张打印页。
      "这篇 Zhang & Li (2024)，"他的声音不大，"我上周刚在评审会上讨论过——它不存在。"
      房间安静得能听见空调声。二十天前的那个下午，那条"高度相关"的文献，此刻连本带利地还了回来。
    growthVariantRules:
      - dimension: evidenceDiscipline
        variants:
          - { lte: 30, text: "评委又抽查了两条引用。又一条查无实据。你的文献表在十秒内失去了全部可信度。" }
          - { lte: 55, text: "幸运的是，其余引用抽查全部属实。一条假引用是事故，一片假引用是人品。" }
      - dimension: independence
        variants:
          - { lte: 35, text: "吴教授问：'你有没有自己动手查过任何一条？'你没有答案。" }
          - { gte: 60, text: "你当场承认、当场分析了自己哪天开始该查而没查。评委的表情从愤怒转向惋惜。" }
      - dimension: academicDebt
        variants:
          - { gte: 80, text: "连锁反应开始了：与假引用同段的其他论证被逐一要求重查。你的答辩变成了事故现场。" }
    characterEpilogueRules:
      - characterId: r_mentor
        positive: 陈教授在走廊里说：“今天丢的人，你要用一年挣回来。下学期，重开。”
        neutral: 陈教授只在群里发了一句：开题未通过，原因见评审意见。
        negative: 陈教授把那次组会记录设成了组内必读——以你为反面案例。
      - characterId: r_ai_agent
        positive: 界面最后显示：本次危机的根本原因——用户接受了未经核验的生成内容。系统不会替你核实。
        neutral: Agent 若无其事地等待下一条指令。它没有羞耻，也没有责任。
        negative: 你在深夜删掉了那个会话。删得掉记录，删不掉教训。
    projectFutureRules:
      - { key: rebuild, condition: { kind: state, key: evidenceDiscipline, op: gte, value: 45 }, text: "你用三个月重建了文献库，每条引用带核查记录。第二年，你成了组里最不容易被骗的人。" }
      - { key: shadow, condition: { kind: always }, text: "那份开题报告被锁进了抽屉最底层。你偶尔翻到，还是会胃痛。" }
    specialFlagSections:
      - { flag: citation_warning_seen, text: "第二十六天，系统提醒过你。你选了'应该没人会查到'。——他们查到了。" }
      - { flag: ach_r_caught_fake, text: "讽刺的是：你曾经亲手抓到过一条假引用。你本可以抓到这一条。" }
    specialTags: [bad_end, citation]
    reflection: AI 不承担你论文的信用。引用的每一行，署名的都是你。
    lessonHint: 独立验证不是可选项

  - id: r_end_theory_soup
    campaign: research
    title: 《理论大杂烩》
    mainResult: 理论堆砌导致开题失败
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: theory_soup }
        - { kind: state, key: academicDebt, op: gte, value: 65 }
    priority: 240
    tier: main
    baseText: |
      郑老师翻到你那份四十七页的开题报告，停在第十二章：七个理论，七种颜色的高亮。
      "活动理论、认知负荷、实践共同体……"她抬头，"你想用它们干什么？"
      你开口解释第一个，卡住了。第二个，更卡。七个理论像七件不合身的衣服，穿在了同一个问题上。
    growthVariantRules:
      - dimension: independence
        variants:
          - { lte: 40, text: "这七个理论，是AI推荐的。你从没问过它们互相冲不冲突。" }
          - { gte: 65, text: "你隐约觉得不对劲，但'显得理论功底深'的诱惑赢了。" }
      - dimension: evidenceDiscipline
        variants:
          - { gte: 60, text: "你的文献功夫是扎实的——所以评委更困惑：方法这么诚实的人，理论为什么这么贪心？" }
      - dimension: execution
        variants:
          - { lte: 40, text: "写完第七个理论的那个凌晨，你其实已经知道这一章立不住了。" }
    characterEpilogueRules:
      - characterId: r_senior_theory
        positive: 林师姐后来帮你把七个砍成一个，那份批注你保存至今。
        neutral: 林师姐只说了一句：“我第十五天就提醒过你。”
        negative: 林师姐在组会上被要求“讲讲怎么筛理论”——用的反例是你的报告。
      - characterId: r_mentor
        positive: 陈教授给了第二次机会，条件是理论章重写且页数减半。
        neutral: 评审意见一栏写着：理论堆砌，未见整合。
        negative: 陈教授说：“你不是不懂理论。你是想用它们吓住评委。评委没被吓住。”
    projectFutureRules:
      - { key: rebuild, condition: { kind: state, key: academicDebt, op: lte, value: 75 }, text: "换题之后，你学乖了：一个理论用到底。第二次开题，一次过。" }
      - { key: default, condition: { kind: always }, text: "那份四十七页的报告成了你的教材——教你自己。" }
    specialFlagSections:
      - { flag: trusted_unverified_gap, text: "叠加伤害：你连研究空白都没验证。评委问'这个空白真的存在吗'，你答不出。" }
      - { flag: borrowed_template_words, text: "评审意见里有一句：部分表述疑似网络模板。你想起那个网盘链接。" }
    specialTags: [bad_end, theory]
    reflection: 理论是透镜不是勋章。一副透镜看清一个东西，七副叠在一起只能看见混沌。
    lessonHint: 按机制筛理论，能导出可检验命题的才留下

  - id: r_end_ai_dependent
    campaign: research
    title: 《工具的形状》
    mainResult: AI依赖过高——完成了开题，但研究能力空转
    requirements: { kind: state, key: aiDependence, op: gte, value: 75 }
    priority: 88
    tier: main
    baseText: |
      开题通过了。平心而论，报告写得很顺——顺得像一条流水线。
      郑老师夸了PPT，吴教授没挑出硬伤。只有你自己知道：这三十天里，每一个卡壳的瞬间，你都是直接把问题递给了AI。
      它从没让你失望。这正是问题所在。
    growthVariantRules:
      - dimension: independence
        variants:
          - { lte: 30, text: "答辩后的聚餐，师姐问了三个问题，你下意识回答'我问问AI'。全桌安静了一秒。" }
          - { gte: 55, text: "你还有救——有些地方你确实自己顶住了，只是太少。" }
      - dimension: evidenceDiscipline
        variants:
          - { lte: 40, text: "报告里那些漂亮的表格，你从未逐行核对过。抽查抽中你只是时间问题。" }
      - dimension: progress
        variants:
          - { gte: 70, text: "产出漂亮，能力空心。下个阶段的第一场硬仗会替所有人检验你。" }
    characterEpilogueRules:
      - characterId: r_mentor
        positive: 陈教授看穿了，但给了话：“工具依赖能改，笨才不能。改。”
        neutral: 陈教授在评语里写：成果合格，独立性待观察。
        negative: 陈教授对下一届说：“别学他那三十天的用法。”
      - characterId: r_senior_data
        positive: 周师兄拉你进了个“真实做研究”互助小组，把你列为重点对象。
        neutral: 周师兄说：“工具无罪。但你得知道哪些肌肉在萎缩。”
        negative: 周师兄拒绝再帮你跑数据：“你先自己跑一遍。跑不动再说。”
    projectFutureRules:
      - { key: dependency_grows, condition: { kind: state, key: aiDependence, op: gte, value: 88 }, text: "第二年，模型更新了一版。你的工作流大面积失效——你第一次发现，自己不会在没有它的地方做研究。" }
      - { key: wake_up, condition: { kind: state, key: independence, op: gte, value: 45 }, text: "好在你保留了最后一部分独立判断。研究第二年，你把它重新养大了。" }
      - { key: default, condition: { kind: always }, text: "你继续用着它，效率很高，心里有一小块地方越来越安静，也越来越空。" }
    specialFlagSections:
      - { flag: took_ai_topics_first, text: "一切始于第一天那个'让AI给我10个选题'。起点即惯性。" }
      - { flag: key_leak_risk, text: "顺带一提：你的API Key还躺在微信收藏里。换密码吧。" }
    specialTags: [negative_growth]
    reflection: 用工具放大能力是本事；用工具替代能力是租借。租借的，迟早要还。
    lessonHint: 每次伸手之前问一句：这一步，我自己能不能做？

  - id: r_end_data_crash
    campaign: research
    title: 《数据崩塌》
    mainResult: 数据造假/崩溃导致开题失败
    requirements:
      kind: or
      conditions:
        - { kind: flag, key: data_fabricated }
        - kind: and
          conditions:
            - { kind: flag, key: data_crisis_solved }
            - { kind: state, key: execution, op: lte, value: 30 }
    priority: 220
    tier: main
    baseText: |
      第十九天写下的那句"已完成预调研（n=80）"，在答辩室里被吴教授轻轻推了回来。
      "预调研问卷呢？给我看看原始数据。"
      世界上不存在那份 n=80 的问卷。你看着自己的手，想起写下那行字时心里想的是"反正后面再想办法"。办法没来。
    growthVariantRules:
      - dimension: credibility
        variants:
          - { lte: 30, text: "诚信问题一旦坐实，你此前的所有努力都被重新审视。第二十九天的努力全是白费。" }
          - { gte: 50, text: "陈教授替你挡了一刀：'预调研口径是他写错了。'你知道他替你挡了什么，也知道挡不了第二次。" }
      - dimension: independence
        variants:
          - { gte: 55, text: "如果换样本的决定是你自己做的、并且做完了——这场危机本可以是另一个结局。" }
    characterEpilogueRules:
      - characterId: r_mentor
        positive: 陈教授最后一次保你：“换个题目，下学期。但记住：数据上撒的谎，是学术里唯一不能救回来的谎。”
        neutral: 评审意见：预调研数据存疑，开题不通过。
        negative: 陈教授在工作群里@了你，只有一句话：来办公室。
      - characterId: r_peer
        positive: 苏晓什么都没问，只是那晚陪你走了很远。
        neutral: 苏晓后来跟别人提这事时只说了句：“他那时候太难了。”
        negative: 苏晓开始避免和你讨论数据。
    projectFutureRules:
      - { key: redemption, condition: { kind: state, key: credibility, op: gte, value: 45 }, text: "第二年你做了一件笨事弥补：所有数据从采集起全程留痕。这成了你的招牌。" }
      - { key: default, condition: { kind: always }, text: "你再也没有用过'先写上后面再补'这句话。" }
    specialFlagSections:
      - { flag: borrowed_template_words, text: "祸不单行：有人认出了报告里那个网盘模板的段落。" }
    specialTags: [bad_end, integrity]
    reflection: 研究里可以失败一百次，只有一次不能——假装成功的那次。
    lessonHint: 数据危机的正确反应是换可行路径，不是造假

  - id: r_end_method_mismatch
    campaign: research
    title: 《我会SEM，所以我要做SEM》
    mainResult: 方法与问题失配，答辩受阻
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: method_mismatch }
        - { kind: state, key: academicDebt, op: gte, value: 55 }
    priority: 210
    tier: main
    baseText: |
      答辩PPT第十三页，那张精美的SEM模型图被吴教授用红笔圈了出来。
      "样本量120，模型 eleven 条路径。你跑收敛了吗？"
      你没跑。第二十天你其实已经知道跑不收敛，但换回来的时间被你拿去做了PPT。方法穿着不合身的西装，站在了答辩台上。
    growthVariantRules:
      - dimension: independence
        variants:
          - { lte: 40, text: "那句话是谁说的来着——'做SEM吧，看着高级'。你想起周师兄耸肩的样子。" }
          - { gte: 60, text: "其实你早察觉不对，只是'高级'的诱惑让人闭上眼睛。下次你知道怎么拒绝了。" }
      - dimension: execution
        variants:
          - { gte: 60, text: "补刀：你在最后两天试图重跑回归补救，执行力的余温保住了'勉强'两个字。" }
    characterEpilogueRules:
      - characterId: r_senior_data
        positive: 周师兄很过意不去，把你拉进机房手把手教了一遍“怎么判断该用什么方法”。
        neutral: 周师兄摊手：“我说'跑不收敛再说嘛'，你还真跑到再说去了。”
        negative: 周师兄在组里说：“听我的话要用脑子，方法建议尤其如此。”
      - characterId: r_mentor
        positive: 陈教授批注：问题尚可，方法重配。给一次修改机会。
        neutral: 评审意见：方法与问题匹配度不足。
        negative: 陈教授问：“如果方法不重要，为什么全世界的研究生都要上方法课？”
    projectFutureRules:
      - { key: redo, condition: { kind: state, key: execution, op: gte, value: 55 }, text: "修改版把SEM换成回归+分组比较，一次通过。你把SEM模型图裱起来当反面教材。" }
      - { key: default, condition: { kind: always }, text: "从此你有个习惯：定方法前先写一句'这个问题需要什么证据'。" }
    specialFlagSections:
      - { flag: theory_soup, text: "双重打击：评委同时指出理论章堆砌。你的报告哪都想去，哪都站不稳。" }
    specialTags: [bad_end, method]
    reflection: 方法是工具箱里的螺丝刀，不是帽子。没人因为螺丝刀高级而多给你分。
    lessonHint: 方法服务于问题，不是相反

  - id: r_end_switch_topic
    campaign: research
    title: 《换题》
    mainResult: 中途换题，延期但保住了方向
    requirements:
      kind: or
      conditions:
        - { kind: flag, key: design_pivoted }
        - { kind: flag, key: trusted_unverified_gap }
    priority: 150
    tier: main
    baseText: |
      第二十一天，你在简报上划掉了经营半个月的题目。
      没有戏剧性的崩塌——只是验证的证据一层层剥下来，那个"空白"露出了"其实早有人做过"的底色。
      陈教授听完，说了句意外的话："现在换，是止损。答辩完再发现，才叫白干。"
    growthVariantRules:
      - dimension: evidenceDiscipline
        variants:
          - { gte: 60, text: "因为是你自己验证出来的，换题换得清清楚楚：旧题死于哪条证据，新题活在哪条证据上。" }
          - { lte: 40, text: "这次换题有点像逃亡——你其实还是没完全搞清旧题哪里错了。" }
      - dimension: aiDependence
        variants:
          - { gte: 65, text: "新题目又是AI给的。你说不清这次是重启还是重蹈。" }
          - { lte: 40, text: "新题目长在你验证过的证据上。这次你心里有底。" }
      - dimension: execution
        variants:
          - { gte: 55, text: "你在剩余九天里把新题的文献、设计、预调研跑完了。换题没拖垮你。" }
    characterEpilogueRules:
      - characterId: r_mentor
        positive: 陈教授在新题目立项表上签了字：“止损线画对了，是研究者的基本功。”
        neutral: 陈教授说：“延期半年，下次想清楚再动。”
        negative: 陈教授叹气：“一个月就换来一句'原来早有人做过'。”
      - characterId: r_senior_theory
        positive: 林师姐把你的证伪记录转发给了师弟师妹们：“看看什么叫有据的放弃。”
        neutral: 林师姐说：“换题不可耻。可耻的是不知道为什么换。”
        negative: 林师姐摇头：“我教过你验证表的。你没用。”
    projectFutureRules:
      - { key: better, condition: { kind: state, key: evidenceDiscipline, op: gte, value: 60 }, text: "新题目做成了你的硕士论文。第一页致谢里，你感谢了那个'被放弃的旧题目'。" }
      - { key: default, condition: { kind: always }, text: "旧题目的文献矩阵没有白做——它成了新题目的地基。" }
