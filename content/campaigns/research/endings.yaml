    priority: 88
    tier: special
    baseText: |
      答辩的最后，郑老师问了那个惯例问题："未来研究计划？"
      你深吸一口气，讲了十分钟——不是导师给的方向，是你从三十天的证据里自己长出来的问题。陈教授在台下听完，对旁边的吴教授说了句什么。后来你才知道，那句话是："这孩子要出师了。"
    growthVariantRules:
      - dimension: aiDependence
        variants:
