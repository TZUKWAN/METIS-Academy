        - { kind: flag, key: defense_done }
    priority: 85
    tier: special
    baseText: |
      开题"有条件通过"。会议室里的你知道，报告还有一堆洞。
      但走出大门时，你心里有种奇异的踏实：这三十天你抓过假引用、推翻过假空白、拒绝过错误的方法。进度没跑赢所有人，判断力跑赢了从前的自己。
    growthVariantRules:
      - dimension: execution
        variants:
          - { lte: 40, text: "你的判断力长在了前面，手脚还没跟上。导师说这叫'眼高手低的前期'——是好事，但得赶紧让手跟上。" }
          - { gte: 55, text: "判断与执行正在合流。下一个题目，你会是组里最快的那种人。" }
      - dimension: aiDependence
        variants:
          - { lte: 40, text: "你和AI的关系是健康的：它快，你稳，谁也不替谁思考。" }
    characterEpilogueRules:
      - characterId: r_mentor
        positive: 陈教授说了句罕见的话：“报告一般，人可以。我等你的论文。”
        neutral: 陈教授说：“慢是慢了点，走得正。”
        negative: 陈教授提醒：“判断力不能当饭吃。下学期补进度。”
      - characterId: r_senior_theory
        positive: 林师姐说：“你会成为一个好研究者。速度是我这种没天赋的人最不在意的东西。”
        neutral: 林师姐点评：基本功的种子都在，缺的是熟练。
        negative: 林师姐叹息：“可惜了这身功夫，用在一个仓收尾的题目上。”
    projectFutureRules:
      - { key: late_bloom, condition: { kind: always }, text: "第二年，你的第一个小论文一次录用。审稿人的评语是：'论证链条完整，引用全部可溯。'" }
    specialFlagSections:
      - { flag: ach_r_caught_fake, text: "你抓假引用的那晚，日记里写：'原来我可以不信它。'——这三十天真正学会的就是这一句。" }
    specialTags: [growth]
    reflection: 完成度衡量这三十天，品格衡量未来三年。
    lessonHint: 判断力是复利，进度是单利

