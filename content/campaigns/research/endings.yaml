        neutral: 林师姐发了份“开题修改清单模板”给你。
        negative: 林师姐说：“我预审时提过的问题，你一个都没真改。”
    projectFutureRules:
      - { key: grow, condition: { kind: state, key: independence, op: gte, value: 50 }, text: "研究第二年你开窍了。回看这次开题，你觉得当时的自己像个陌生人。" }
      - { key: default, condition: { kind: always }, text: "你把它称作'最低限度胜利'。它确实是。" }
