    specialTags: [good]
    reflection: 师承的最高形式，是长出师门没有的东西。
    lessonHint: 独立判断的终点是独立的问题

  - id: r_end_new_discovery
    campaign: research
    title: 《意外的新发现》
    mainResult: 在验证途中撞见更有价值的现象
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: surprise_finding }
        - { kind: state, key: progress, op: gte, value: 50 }
        - { kind: flag, key: defense_done }
    priority: 88
    tier: special
    baseText: |
      做数据清洗的深夜，你看到了那个异常值集群——不该出现在这个分组里的回答模式，规律得像有人在敲门。
      你本来应该删掉它们的。你盯着看了两个小时，然后把它写进了开题报告的"计划外发现"一节。郑老师在答辩时把这节划了重点："这一段，比你整个主体都有意思。"
    growthVariantRules:
      - dimension: evidenceDiscipline
        variants:
          - { gte: 65, text: "你没有急着宣称发现。你为它单独建了验证记录——什么样的异常才配叫现象，你已经有标准了。" }
          - { lte: 45, text: "你说不清这个异常是数据污染还是真现象。好在诚实标注救了你。" }
      - dimension: independence
        variants:
          - { gte: 60, text: "是验证假引用的那股劲，让你没有顺手删掉这些'碍事'的数据。好奇心站在了纪律的肩膀上。" }
    characterEpilogueRules:
      - characterId: r_senior_data
        positive: 周师兄连夜帮你写了异常检测脚本：“这种事，十个选题里遇不见一个。”
        neutral: 周师兄说：“先别声张，复现一遍再说。”
        negative: 周师兄泼了冷水：“多半是脏数据。别激动。”
      - characterId: r_mentor
        positive: 陈教授为这个“计划外发现”单独立了个小课题——负责人，你。
        neutral: 陈教授的批注只有四个字：留心，存证。
        negative: 陈教授皱眉：“主线还没走稳，别被岔道勾走。”
    projectFutureRules:
      - { key: new_line, condition: { kind: always }, text: "第二年，那个异常成了你论文的第四章——也是最常被引用的一章。" }
    specialFlagSections:
      - { flag: data_crisis_solved, text: "换来的新样本里，藏着你原本永远遇不见的模式。危机的另一面是门。" }
    specialTags: [good, serendipity]
    reflection: 发现偏爱有准备的纪律：先保证不出假，意外才有资格被当真。
    lessonHint: 异常值是数据在敲门

  - id: r_end_to_competition
    campaign: research
    title: 《转战赛场》
    mainResult: 研究成果转化为竞赛项目
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: defense_done }
        - { kind: state, key: progress, op: gte, value: 55 }
        - { kind: flag, key: transfer_competition }
    priority: 82
    tier: special
    baseText: |
      开题通过的那晚，苏晓转发了条推送：全校AI创新竞赛开始报名。
      "你那个'AI辅助写作与论证质量'——做个检测工具，不就是现成的参赛项目？"她眼睛发亮。
      你看着自己三十天攒下的文献矩阵和机制链，第一次意识到：研究里的每一分严谨，在赛场都是别人抄不走的护城河。
    growthVariantRules:
      - dimension: execution
        variants:
          - { gte: 60, text: "两周后，你们队的 Demo 跑通了第一版论证质量评分——算法逻辑就是你的机制链。" }
          - { lte: 45, text: "热情抵不住工程量。你知道研究怎么做，但离'做得出来'还有一段距离。" }
      - dimension: evidenceDiscipline
        variants:
          - { gte: 60, text: "别的队用AI编数据，你们队用真预调研。决赛答辩时，这份底气谁都听得出来。" }
    characterEpilogueRules:
      - characterId: r_peer
        positive: "苏晓在团队介绍里给自己印的名片是：'首席吹牛官'——但所有牛皮都有你兜底。"
        neutral: 苏晓负责报名材料和日程，意外地靠谱。
        negative: 苏晓中途退出了——比赛节奏不是她想要的。
      - characterId: r_mentor
        positive: 陈教授批了你的参赛申请：“研究该做做，奖该拿拿。别本末倒置就行。”
        neutral: 陈教授说：“别耽误正事。”
        negative: 陈教授不太高兴：“你的开题还没走完，凑什么热闹。”
    projectFutureRules:
      - { key: award, condition: { kind: state, key: execution, op: gte, value: 60 }, text: "省赛银奖。证书背面你写了一行小字：根子在开题报告第 12 页。" }
      - { key: default, condition: { kind: always }, text: "竞赛结束了，你的研究还在继续。两者共享同一副骨头。" }
    specialTags: [good, transfer]
    reflection: 研究与竞赛不是两条路，是同一份严谨的两种赛场。
    lessonHint: 严谨是最强的竞争力

  - id: r_end_to_venture
    campaign: research
    title: 《从实验室到市场》
    mainResult: 研究洞察转化为创业方向
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: defense_done }
        - { kind: state, key: progress, op: gte, value: 55 }
        - { kind: flag, key: transfer_venture }
    priority: 83
    tier: special
    baseText: |
      预调研里有个副产品：78% 的受访者抱怨"AI帮写完就忘了自己写过什么"，并愿意为"训练自己而非替代自己"的工具付钱。
      答辩通过那晚，你没关电脑。你新建了一个文件夹——名字不是研究，是产品。
    growthVariantRules:
      - dimension: userUnderstanding
        variants:
          - { gte: 55, text: "调研时你问了'上次是什么时候'而不是'你会不会用'。这个习惯即将在市场上救你三次。" }
          - { lte: 35, text: "你还分不清'受访者说想买'和'真的会买'。这堂课市场会教你，但学费不便宜。" }
      - dimension: execution
        variants:
          - { gte: 60, text: "两周后，第一个内测版上线。论证书里的机制链，成了产品的核心算法。" }
    characterEpilogueRules:
      - characterId: r_mentor
        positive: 陈教授的态度出乎意料：“研究做扎实的人创业，比风口的草莽多一样东西：证据。去吧。”
        neutral: 陈教授说：“学业为先。别让我打第二个电话。”
        negative: 陈教授罕见地生了气：“三个月！我给你三个月收心！”
      - characterId: r_peer
        positive: 苏晓成了你的第一位“合伙人”——虽然她的股份是靠一顿火锅谈下来的。
        neutral: 苏晓帮你转发了朋友圈：“我同学做的！都来捧场！”
        negative: 苏晓婉拒了：“我只想按时毕业，你懂的。”
    projectFutureRules:
      - { key: startup, condition: { kind: state, key: execution, op: gte, value: 60 }, text: "一年后，产品有了第一千个用户。开题报告的第一页，被你印在了公司官网的'我们为什么出发'栏目。" }
      - { key: default, condition: { kind: always }, text: "产品失败了两次。第三次，你学乖了：先卖再做。但那是另一个故事。" }
    specialTags: [good, transfer]
    reflection: 研究教你求真，市场教你求存。两者都要的时候，先求真。
    lessonHint: 证据比创意值钱

  - id: r_end_high_complete_low_independence
    campaign: research
    title: 《精美的空壳》
    mainResult: 高完成度、低独立性——评委的犹豫
    requirements:
      kind: and
      conditions:
        - { kind: state, key: progress, op: gte, value: 68 }
        - { kind: state, key: independence, op: lte, value: 32 }
        - { kind: flag, key: defense_done }
    priority: 78
    tier: special
    baseText: |
      评审表上出现了一个罕见的组合：质量分，优秀；独立性一栏，两位评委商量了很久。
      郑老师最后问出了那个问题："这一切都很好。但我想知道——去掉你的AI工具，这个设计里哪一部分完全属于你？"
      你张了张嘴。三十天的产出在脑中列队而过，你竟一时找不到那个"完全属于你"的部分。
    growthVariantRules:
      - dimension: evidenceDiscipline
        variants:
          - { gte: 60, text: "好在你的证据全部真实。空壳是空壳，但不是纸糊的。评委给了'有条件通过'。" }
          - { lte: 40, text: "如果此时再抽查出一条假引用，这个结局会滑向彻底的崩塌。运气不站在依赖者这边第二次。" }
      - dimension: mentorTrust
        variants:
          - { gte: 60, text: "陈教授替你回答了一半：'他第三十天和第一天比，是有变化的。我看人。'" }
    characterEpilogueRules:
      - characterId: r_mentor
        positive: 陈教授后来给你定了规矩：每周组会必须讲一个“不用AI想出来的想法”。
        neutral: 陈教授在评语栏写：产出优秀，独立思考待证。
        negative: 陈教授私下叹气：“最好的手艺，长在别人（别的什么）手上。”
      - characterId: r_ai_agent
        positive: 会话日志里，你的每次提问都被存着。有一天你重读它们，第一次看出了自己偷懒的形状。
        neutral: Agent 完成了任务。它对“独立性”这个概念没有建模。
        negative: 你把会话历史导出备份了——不是舍不得删，是不敢看。
    projectFutureRules:
      - { key: awakening, condition: { kind: state, key: evidenceDiscipline, op: gte, value: 55 }, text: "那个问题在你脑子里住了一个暑假。九月开学，你退掉了两个自动化插件。" }
      - { key: default, condition: { kind: always }, text: "你通过了开题，也留下了一个只有你自己听得见的问号。" }
    specialTags: [warning]
    reflection: 借来的肌肉举得起重物，但体检时会被查出来。
    lessonHint: 完成度和独立性是两把尺子

  - id: r_end_low_complete_high_growth
    campaign: research
    title: 《慢就是快》
    mainResult: 完成度偏低但方向与方法已内化
    requirements:
      kind: and
      conditions:
        - { kind: state, key: progress, op: lte, value: 52 }
        - { kind: state, key: execution, op: gte, value: 60 }
        - { kind: state, key: independence, op: gte, value: 60 }
        - { kind: flag, key: defense_done }
    priority: 75
    tier: special
    baseText: |
      "有条件通过。"加上一句罕见的补充："这位同学的答辩比他的报告好。"
      郑老师解释了评委们为什么这么写："报告还有很多洞，但他对每个洞的成因说得清清楚楚。知道自己哪里不会——这是开题阶段最稀缺的能力。"
    growthVariantRules:
      - dimension: execution
        variants:
          - { gte: 70, text: "你的三十天里没有一天在摸鱼。慢，是因为你在每一步都做了自己该做的验证。" }
          - { gte: 60, text: "执行在平均线以上，只是起步的方向绕了远路。绕路也是路。" }
      - dimension: academicDebt
        variants:
          - { lte: 40, text: "你没有欠账。每一页写下的东西都真实——所以修改起来飞快。" }
    characterEpilogueRules:
      - characterId: r_mentor
        positive: 陈教授把你的“洞清单”要走了：“知道哪里不会的人，我放心让他碰真课题。”
        neutral: 陈教授说：“下学期把洞补上。你补得动。”
        negative: 陈教授提醒：“态度好不能一直当进度差的原因。”
      - characterId: r_peer
        positive: 苏晓在朋友圈发：“我室友开题被夸'答辩比报告好'，配图是他的洞清单。酸了。”
        neutral: 苏晓说：“你这种慢，我学不来。”
        negative: 苏晓劝你：“差不多得了，别跟自己较劲。”
    projectFutureRules:
      - { key: compounding, condition: { kind: always }, text: "第二年，你的进度开始反超。那些在开题期就建立的验证习惯，让返工次数变成了全组最低。" }
    specialTags: [growth]
    reflection: 三十天的产出可以慢，三十天的习惯不能歪。
    lessonHint: 对自己的诚实是最快的路

  - id: r_end_time_up
    campaign: research
    title: 《三十天到了》
    mainResult: 时间耗尽的开放式结算
    requirements: { kind: always }
    priority: 1
    tier: main
    baseText: |
      第三十天，23:59。
      有些故事在答辩室里结束，有些故事在日历上结束。你的这一次，属于后者——时间到了，故事停在了它此刻的样子。
      说不清是没做完，还是没开始做。但三十天是真实流逝的，你做了什么、没做什么，都在记录里。
    growthVariantRules:
      - dimension: execution
        variants:
          - { gte: 55, text: "至少，你的每一步都有记录。时间不够的人很多，有账可查的人很少。" }
          - { lte: 35, text: "三十天像水一样流过去。回头看，连一条像样的痕迹都难找。" }
      - dimension: evidenceDiscipline
        variants:
          - { gte: 60, text: "简报、矩阵、机制链——你的资产库里躺着下次出发的全部行囊。" }
      - dimension: aiDependence
        variants:
          - { gte: 65, text: "AI 记得这三十天的每一个细节。可惜它不能替你长大。" }
    characterEpilogueRules:
      - characterId: r_mentor
        positive: 陈教授说：“重开一次。这次我知道你会用不同的方式过这三十天。”
        neutral: 陈教授在日历上圈了新的日期。
        negative: 陈教授的耐心和你的三十天一起到期了。
      - characterId: r_peer
        positive: 苏晓说：“下一周目……呸，下学期，一起加油。”
        neutral: 苏晓耸肩：“时间对谁都是三十天。”
        negative: 苏晓已经走到了你前面很远的地方。
    projectFutureRules:
      - { key: again, condition: { kind: always }, text: "新的周目在等你。这次你知道：第一天该做什么。" }
    specialTags: [neutral, time_up]
    reflection: 时间不评判人，它只是流逝。评判你的，是你用这段时间做了什么。
    lessonHint: 游戏可以重来，学期不能
