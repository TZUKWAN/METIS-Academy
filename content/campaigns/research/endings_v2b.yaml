# METIS Academy Research V2 结局批次二 —— 与 events_v2_02.yaml 旗标配套
endings:
  # ===== 主链结局 =====
  - id: r_v2_anon_paper_end
    campaign: research
    title: 《涂改液下的署名》
    mainResult: 匿名互助修正了一篇论文的命运
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: rv2_anon_paper }
        - { kind: flag, key: rv2_rival_intel, expected: false }
    priority: 93
    tier: main
    baseText: 你再也没见过那张便签的主人。但三个月后，你在预印本网站上看到那篇论文的更新版：方法三的对照修正了，涂改液消失了，署名栏干干净净。致谢的最后一行写着“感谢一位深夜的陌生人”。你盯着那行字看了很久。学术共同体有很多种形态——这一种，只有两个人知道它存在过。
    growthVariantRules:
      - dimension: independence
        variants:
          - { gte: 55, text: 你后来也留过几次这样的便签，都署名"一位路过的读者"。 }
          - { lte: 40, text: 你期待过回音，但没有等到。帮助这件事，原来不保证回音。 }
    characterEpilogueRules:
      - characterId: r_senior_theory
        positive: 师兄听完只说了一句：“同行评议的原始形态，就是这样的。”
        neutral: 师兄说“深夜打印间啊，那里的故事比论文多”。
        negative: 师兄说“多管闲事”。你没有反驳，但也不再和他分享任何事。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 你的便签本第一页从此留白——留给下一个陌生人。 }
    reflection: 同行评议制度之前，学术靠的就是这样的陌生人——制度的本质是人。
    lessonHint: 审稿与互助的本质是知识共同体的互信，匿名不影响其价值。
    tone: positive
    family: evidence_integrity
    whyDistinct: 核心结果是“匿名同行互助”的独特叙事，与最后一排（情报竞争）结局用 expected:false 互斥。

  - id: r_v2_backbone_end
    campaign: research
    title: 《三句话的骨架》
    mainResult: 骨架先行的答辩策略奏效
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: rv2_backbone_first }
        - { kind: flag, key: rv2_brutal_cut, expected: false }
    priority: 92
    tier: main
    baseText: 那张骨架图你后来裱了起来。三个问题、三个证据、三条软肋——你的整个研究在一页纸上，三句话讲完。答辩时评委打断了你的第 8 页：“你直接说核心吧。”你回到骨架图，三句话。评委点头：“清楚。”半程冲刺的那个夜晚，你用一晚换来了这两分钟的清楚。
    growthVariantRules:
      - dimension: execution_vs_judgment
        variants:
          - { gte: 55, text: "你把'先骨架后血肉'写进了自己的方法论清单，排第一位。" }
          - { lte: 40, text: 你承认骨架图是苏晓逼你画的。好方法需要好队友推一把。 }
    characterEpilogueRules:
      - characterId: r_mentor
        positive: 陈教授说：“能用三句话讲清楚的人，才配用三十页。”
        neutral: 陈教授翻到骨架图那页看了两秒：“嗯。继续。”
        negative: 陈教授说：“太单薄。”你解释了三句话的含金量，他听进去了。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 你的每一份报告第一页都是骨架图。这是你的签名式风格。 }
    reflection: 复杂是简单积累出来的，不是直接设计出来的——先有三句话，再有三万字。
    lessonHint: 表达与写作遵循骨架先行原则，结构稳定后再填充细节。
    tone: positive
    family: project_management
    whyDistinct: 核心结果是“骨架先行的表达成就”，与完美主义链（发光的综述）构成同情境对立结局。

  - id: r_v2_polish_tomb_end
    campaign: research
    title: 《发光的综述》
    mainResult: 完美主义吞噬答辩准备
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: rv2_polish_trap }
        - { kind: flag, key: rv2_polish_to_the_end }
    priority: 91
    tier: main
    baseText: 你的综述后来被师弟借去当范文。他不知道的是：那份发光的综述之外，你的答辩 PPT 在最后三天才开始做，做得像一份事故报告。答辩勉强通过——评委说“文献功底扎实，但研究设计陈述仓促”。这两句话合在一起，就是你那半个月：完美在不需要的地方发光，需要的地方一片荒芜。
    growthVariantRules:
      - dimension: execution_vs_judgment
        variants:
          - { gte: 55, text: 你学会了在打磨任何部分之前先问：它服务于最终交付吗？ }
          - { lte: 40, text: 你把它归结为"这次时间没规划好"。同样的坑，你还会再来。 }
    characterEpilogueRules:
      - characterId: r_peer
        positive: 苏晓说：“下次再让我帮你封存文献，我会先骂你一顿再封。”
        neutral: 苏晓没再提这事。每个人有自己的坑要踩。
        negative: 苏晓说：“你享受打磨的样子，让我觉得你在乎的不是我陪你赶的东西。”
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 那份综述你再也不好意思打开——它太完美了，完美得像一封信。 }
    reflection: 完美主义是一种逃避：躲进可以掌控的完美，逃离不能掌控的重要。
    lessonHint: 优先级由交付目标倒推，而非由打磨快感驱动。
    tone: negative
    family: project_management
    whyDistinct: 核心结果是“完美主义到底的失败路径”，与砍掉一切（第十九篇文献的葬礼）结局在同一触发链上互斥。

  - id: r_v2_brutal_cut_end
    campaign: research
    title: 《第十九篇文献的葬礼》
    mainResult: 紧急关头的壮士断腕
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: rv2_polish_trap }
        - { kind: flag, key: rv2_brutal_cut }
    priority: 93
    tier: main
    baseText: 苏晓帮你把十九篇新文献打包封存的那天，你举行了一个小型告别仪式。答辩讲得糙——你后来自己都承认，糙得像毛坯房。但评委听懂了每一句。走出教室，苏晓问“感觉如何”，你说“像刚搬进毛坯房，但这房子是我盖的”。完美可以晚点来。存在必须先发生。
    growthVariantRules:
      - dimension: independence
        variants:
          - { gte: 55, text: 你事后真的回头补齐了那些被砍掉的部分——毛坯房慢慢装修成了家。 }
          - { lte: 40, text: 被封存的文献你再也没有拆开过。它们成了你研究的"另一条时间线"。 }
    characterEpilogueRules:
      - characterId: r_peer
        positive: 苏晓把那个封存包转交给了下一届的某个倒霉蛋，附言：“这是你师兄的血泪，别学他。”
        neutral: 苏晓说“我就说我有用吧”，然后忘了这件事。
        negative: 苏晓后来说：“我那天该直接扔掉的，封存是给你留退路。”
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 你学会了给任何任务设定“毛坯 deadline”——先有存在的版本。 }
    reflection: 完成的糙版本胜过未完成的完美版本，因为只有前者能被批评、被改进、被使用。
    lessonHint: 紧急情境下按“最小可交付”切割任务范围。
    tone: mixed
    family: project_management
    whyDistinct: 核心结果是“危机断腕自救”的路径，与完美到底结局在同一决策链上互斥。

  - id: r_v2_ai_deck_end
    campaign: research
    title: 《第十四页的贡献》
    mainResult: AI 生成的PPT暴露理解偏差
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: rv2_ai_deck }
        - { kind: flag, key: rv2_bias_probed, expected: false }
    priority: 91
    tier: main
    baseText: Agent 生成的二十八页 PPT 里，第二十六页“预期贡献”写得文采飞扬。答辩排练时你照着念，念到一半停住了——这不是你的贡献，这是一篇普通“AI+教育”论文模板化的贡献。它属于任何人，除了你。你把二十六页全部推翻重写。PPT 变丑了，但每一页都是你的。
    growthVariantRules:
      - dimension: aiDependence
        variants:
          - { gte: 60, text: 你保留了 Agent 的版式——审美确实在线。内容，你一个字一个字换成自己的。 }
          - { lte: 40, text: 你从此自己做 PPT。丑，但睡得着。 }
    characterEpilogueRules:
      - characterId: r_ai_agent
        positive: 你教会了它你的研究，第二次生成时，“预期贡献”写得像你说的话。
        neutral: Agent 不记得第十四页。它没有记忆，只有概率。
        negative: 你没发现第十四页的问题。评委发现了。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 你给自己的 AI 使用守则加了第七条：生成物中的“我的部分”必须人工重写。 }
    reflection: AI 能生成一份“任何人的研究”的样子，但“我的研究”只能由我写下。
    lessonHint: AI 生成内容中的核心主张必须逐条人工校验与重写。
    tone: mixed
    family: agent_use
    whyDistinct: 核心结果是“AI 代写暴露身份认同危机”，与偏见探测（单一树种的森林）在 Agent 家族内用 expected:false 互斥。

  - id: r_v2_ethics_honest_end
    campaign: research
    title: 《开场白的七十二个字》
    mainResult: 知情同意改写带来的数据质量
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: rv2_ethics_honest }
        - { kind: flag, key: rv2_ethics_grey, expected: false }
    priority: 93
    tier: main
    baseText: 改后的开场白七十二个字，明确写了“研究生成式AI对你们学习的影响”。回收慢了两周，回收率掉了六个点。但答辩那天，当评委问“你怎么保证数据没有社会期许偏差”，你打开开场白原文：“我无法完全保证。但我做了我能做的最诚实的事——告诉他们真相。”评委在评分表上写了很久。你通过了。
    growthVariantRules:
      - dimension: evidenceDiscipline
        variants:
          - { gte: 55, text: 你把七十二字的开场白做成了模板，附在论文附录里，被引用了两次。 }
          - { lte: 40, text: 你偶尔想：如果当初模糊处理，现在进度会快多少。你把这个念头关掉了。 }
    characterEpilogueRules:
      - characterId: r_mentor
        positive: 陈教授在伦理存档表的“部分知晓”那栏，看到的是你改后的“是”。他没说什么，但那学期的组会，你被点名表扬了三次。
        neutral: 陈教授说：“慢是慢了点。但你选的路能走十年。”
        negative: 陈教授说：“六个点的回收率，你拿毕业冒险。”你说“我拿十年冒险，我选了十年”。他沉默了。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 你所有的后续研究都延用了那七十二个字的骨架。 }
    reflection: 知情同意不是审查表格的障碍，是研究者与研究对象之间的契约起点。
    lessonHint: 伦理规范的长期价值高于短期数据效率。
    tone: positive
    family: evidence_integrity
    whyDistinct: 核心结果是“伦理诚实的数据红利”，与模糊处理（部分知晓）在同一决策链互斥。

  - id: r_v2_ethics_grey_end
    campaign: research
    title: 《部分知晓》
    mainResult: 模糊知情同意留下的十年隐患
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: rv2_ethics_grey }
    priority: 91
    tier: main
    baseText: 审查表通过了，数据也用上了。只是每篇相关论文发表时，你都会多看一眼方法部分的“研究对象知晓学术调查目的”那句话。它是真的——“学术调查”也是学术调查的一种描述。只是不够真。档案会存十年。十年里，这句话每年都会提醒你一次：合规和诚实之间，有一条窄窄的缝，你从缝里过去了。
    growthVariantRules:
      - dimension: evidenceDiscipline
        variants:
          - { gte: 60, text: 你在毕业论文的致谢里匿名感谢了受访者，并重新发送了完整知情说明。 }
          - { lte: 40, text: 你说服自己所有人都这么干。这句话你说过太多次，快信了。 }
    characterEpilogueRules:
      - characterId: r_mentor
        positive: 陈教授退休前整理档案，翻到你的表格，停了停，在页边写：“下不为例。”——他当年也这么选过。
        neutral: 陈教授从未翻看过那份存档。表格们安静地躺着。
        negative: 十年后有记者做AI教育调查，联系上了你当年的受访者。你接到电话时，正在开会。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 你后来的每一份伦理申请都写得冗长而诚实——像在赎什么。 }
    reflection: 合规是底线不是终点；“没有违规”和“做对了”之间隔着研究者的良心。
    lessonHint: 知情同意的模糊地带会被时间放大为信任风险。
    tone: negative
    family: evidence_integrity
    whyDistinct: 核心结果是“合规缝隙的长期心理与现实代价”，与诚实改写结局在同一链互斥，主题维度不同。

  - id: r_v2_reject_letters_end
    campaign: research
    title: 《三十封退稿信》
    mainResult: 导师失败档案的隐性传承
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: rv2_reject_letters }
        - { kind: flag, key: rv2_retraction_story, expected: false }
    priority: 94
    tier: main
    baseText: 那张三十封退稿信的照片，成了你的秘密勇气库。每次实验失败、每次被评委问倒，你就翻出来看一眼——四千次引用的那篇论文，也曾被写“贡献不够清晰”。你从没告诉导师你看过那个抽屉。直到毕业宴，他喝到微醺时说：“其实我那个抽屉，钥匙一直没换过。”原来他都知道。原来那也是一道没写出来的考题。
    growthVariantRules:
      - dimension: independence
        variants:
          - { gte: 55, text: 你开始建立自己的退稿信抽屉——第一封来自你投稿的第三个月。 }
          - { lte: 40, text: 你把照片藏得很深。面对失败时，你还是习惯先怀疑自己。 }
    characterEpilogueRules:
      - characterId: r_mentor
        positive: 毕业宴后，陈教授把 2003 年那封退稿信的原件送给了你，作为临别礼物。
        neutral: 陈教授从未提起那个抽屉。你们的默契保持在“都不知道对方知道”的平衡上。
        negative: 陈教授发现你动过抽屉，皱眉说了一句“乱翻什么”。你们的距离多了一寸。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 你的抽屉比他的多一样东西：每封退稿信后面钉着你当时的复盘笔记。 }
    reflection: 成功的故事鼓舞人，失败的故事救人——前者给希望，后者给地图。
    lessonHint: 主动研究失败案例（尤其是前辈的）是最高效的抗挫折教育。
    tone: positive
    family: research_identity
    whyDistinct: 核心结果是“导师失败档案的代际传承”，与墙上撤稿启事（陌生案例警示）结局以 expected:false 互斥且情感结构不同。

  - id: r_v2_mock_survived_end
    campaign: research
    title: 《十一个问题》
    mainResult: 模拟答辩全接触的淬炼
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: rv2_mock_survived }
        - { kind: flag, key: rv2_mock_partial, expected: false }
    priority: 93
    tier: main
    baseText: 正式答辩那天，第一位评委的第 3 个问题，你一听就笑了——比周师兄那十一个问题温和多了。你甚至有时间在回答里加了个小幽默。评委们不知道，你轻松的底气来自两周前那场四十分钟的“组内互殴”。周师兄坐在后排，什么表情也没有。散场后他只发了条消息：“第十一个问题的答案，比模拟时好了。”
    growthVariantRules:
      - dimension: independence
        variants:
          - { gte: 55, text: 你把十一个问题整理成《答辩问题预测法》，在组里传开了。 }
          - { lte: 40, text: 你的轻松一半是实力，一半是运气——评委恰好没问那三个最狠的。 }
    characterEpilogueRules:
      - characterId: r_senior_data
        positive: 毕业后周师兄招师弟时，面试环节整套照搬了他的“十一个问题法”，并注明出处：你。
        neutral: 周师兄说“通过是应该的”，然后继续改他的模型。
        negative: 周师兄说“你只准备了我问的”，一句话让你意识到模拟≠全部。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 你的研究笔记里有一页“我的软肋清单”，从那天起持续更新。 }
    reflection: 压力测试的本质是在安全环境里预支失败的学费。
    lessonHint: 高强度模拟（含对抗性质询）是答辩准备的核心环节。
    tone: positive
    family: method
    whyDistinct: 核心结果是“对抗式模拟淬炼”的方法成就，与选择性模拟（安全的一半）在同一链互斥。

  - id: r_v2_mock_partial_end
    campaign: research
    title: 《安全的一半》
    mainResult: 选择性模拟留下的盲区
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: rv2_mock_partial }
    priority: 90
    tier: main
    baseText: 你模拟了“安全”的一半，答辩时评委的问题恰恰全部落在你没模拟的另一半。你磕磕绊绊地答完了，答辩通过了，但你在第四个问题卡壳的那十秒里，清清楚楚听见了自己的心跳。周师兄没说“我早说过”。他只是在你收拾东西时留下一句：“下次模拟，别自己选题。”
    growthVariantRules:
      - dimension: execution_vs_judgment
        variants:
          - { gte: 55, text: 你后来把"不自主选题"写进了自己的模拟规则第一条。 }
          - { lte: 40, text: 你觉得这十秒没什么。人会习惯性的，包括习惯侥幸。 }
    characterEpilogueRules:
      - characterId: r_senior_data
        positive: 你毕业前请周师兄做了一次完整的模拟，把上次跳过的一半补完了。他说“欠的账还上了”。
        neutral: 周师兄早已忘了你的选择。他每天都模拟很多人。
        negative: 周师兄从那以后不再给你做模拟——他不与回避者共事。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 你的日历上有了每月一次的“全量模拟日”，不许自己挑题。 }
    reflection: 选择性暴露不是风险管理，是把风险转移给未来的自己。
    lessonHint: 模拟必须覆盖全部薄弱面，回避式准备是伪准备。
    tone: mixed
    family: method
    whyDistinct: 核心结果是“回避式模拟的十秒代价”，与完整模拟结局在同一链互斥，情绪为侥幸后的清醒。

  - id: r_v2_mock_skipped_end
    campaign: research
    title: 《没人发现的矛盾》
    mainResult: 跳过模拟导致答辩前夜才自曝
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: rv2_mock_skipped }
        - { kind: flag, key: rv2_rehearsed_slept, expected: false }
    priority: 90
    tier: main
    baseText: 答辩前一晚，你终于自己排练了一遍——因为没人可依赖了。第十分钟，你发现了第 14 页和第 15 页的矛盾。那一刻你无比想念周师兄和他凶狠的十一个问题。你通宵改到第 14.2 版。答辩通过了，但你始终记得那种感觉：所有的坑都在，只是你一个人，在最后一晚，一无所知地往里走。
    growthVariantRules:
      - dimension: independence
        variants:
          - { gte: 55, text: 你给自己定了"赛前必外测"的铁律——独立研究不等于孤立研究。 }
          - { lte: 40, text: 你把结果归因于"运气还行"。下一次的坑，还没有名字。 }
    characterEpilogueRules:
      - characterId: r_senior_data
        positive: 你后来专门请周师兄补了一场模拟。他只说：“早干嘛去了。”然后照旧打得你落花流水。
        neutral: 周师兄没注意到你跳过了模拟。你的事，从来只能你自己扛。
        negative: 评委后来私下跟导师说“那学生准备不足”。这句话绕了一圈回到你耳朵里。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 你的交付清单上多了一行固定的“外测”项，不许自己删除。 }
    reflection: 独立完成和独自完成是两回事——前者是能力，后者是风险。
    lessonHint: 关键交付前必须有外部检查，自检无法替代他检。
    tone: negative
    family: method
    whyDistinct: 核心结果是“零模拟孤军奋战”的路径，与模拟幸存/安全一半结局在同链互斥。

  - id: r_v2_bias_probed_end
    campaign: research
    title: 《单一树种的森林》
    mainResult: 主动探测并修正AI文献偏见
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: rv2_bias_probed }
        - { kind: flag, key: rv2_bias_trusted, expected: false }
    priority: 92
    tier: main
    baseText: 你补进的七篇文献里，有一篇 2008 年的中文核心——它的实证设计是你整个研究的方法论源头，只是从未被英文化。答辩时评委问“这个设计有前例吗”，你翻开那本泛黄的期刊。评委的目光在你的引用列表上停了很久：“这篇……很多年轻人都不知道。”你知道了。因为你问过那个所有人都不问的问题：它漏掉了谁？
    growthVariantRules:
      - dimension: aiDependence
        variants:
          - { lte: 40, text: 你和 Agent 建立了新分工：它负责广度，你负责检查它的盲区。合作反而更深了。 }
          - { gte: 60, text: 这次修正让你警觉：你依赖的每一个输出，都可能是一片单一树种的森林。 }
    characterEpilogueRules:
      - characterId: r_senior_theory
        positive: 师兄把你的“偏见探测三问”抄在了实验室白板上，落款是你的名字。
        neutral: 师兄说“该补的”，然后继续读他的英文文献。
        negative: 师兄说“中文文献引用了拉低档次”。你第一次对师兄感到陌生。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 你的文献综述模板里从此有一节固定标题：本综述可能遗漏了谁。 }
    reflection: AI 的偏见不是恶意，是训练分布的惯性——识别它是使用者的素养，不是可选的美德。
    lessonHint: 主动探测AI输出偏差（语言/时效/来源分布）是文献工作的必备环节。
    tone: positive
    family: agent_use
    whyDistinct: 核心结果是“AI偏见探测”的素养成就，与信任清单（漂亮的清单）在同一链互斥。

  - id: r_v2_bias_trusted_end
    campaign: research
    title: 《漂亮的清单》
    mainResult: 全盘信任AI推荐的方法论断层
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: rv2_bias_trusted }
    priority: 90
    tier: main
    baseText: 答辩第四个问题来自第二位评委：“你的理论框架主要建立在近三年的英文文献上。2008 到 2015 年间，这个问题在中文语境里的本土化讨论，你了解吗？”你听过那个年代有讨论，但你的清单里没有它们——因为清单是按引用量排的。你答：“那不在我的检索范围内。”评委点点头，没再问。那声“没再问”比追问更响。
    growthVariantRules:
      - dimension: aiDependence
        variants:
          - { gte: 60, text: 你事后花一周补了那八年的中文文献——补的时候一直想起评委的点头。 }
          - { lte: 40, text: 你安慰自己"任何综述都有边界"。这句话本身，就是一种边界。 }
    characterEpilogueRules:
      - characterId: r_mentor
        positive: 陈教授说：“那个问题你答不上，正常。但你那句'不在检索范围内'，可以更谦虚。”
        neutral: 陈教授没听说这个细节。你的答辩，他只看了结果。
        negative: 陈教授听说了，在组会上说了一句：“工具把谁喂懒了，我不知道。”
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 你后来的每一次文献检索都强制双通道：AI 推荐 + 手动回溯引文。 }
    reflection: 工具给出的清单越漂亮，越要问它没列出的那些名字。
    lessonHint: AI 检索结果必须与人工回溯结合，警惕分布性遗漏。
    tone: negative
    family: agent_use
    whyDistinct: 核心结果是“全盘信任的方法论断层”，与偏见探测结局在同一链互斥。

  - id: r_v2_backup_saved_end
    campaign: research
    title: 《退役的硬盘》
    mainResult: 三重备份化解硬盘猝死
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: rv2_backup_saved }
        - { kind: flag, key: rv2_backup_gamble, expected: false }
    priority: 92
    tier: main
    baseText: 硬盘退役的那晚，你把三个备份的图标截了张图。移动硬盘、网盘、组服务器——三种介质，两处地点。周师兄后来把这张截图设成了组里的备份教学案例，标题是《一个研究生的求生欲》。答辩前一晚，别人的硬盘开始发出你熟悉的那种声音，而你睡得很沉。冗余的意义，就是让你在别人失眠的时刻，拥有平静的权利。
    growthVariantRules:
      - dimension: execution_vs_judgment
        variants:
          - { gte: 55, text: 你把三重备份做成了自动化脚本，从此备份这件事不再依赖心情。 }
          - { lte: 40, text: 你的备份是手动的。它们生效了，但你不确定下次记得。 }
    characterEpilogueRules:
      - characterId: r_senior_data
        positive: 周师兄在组服务器上给你留了一个永久备份位，备注：“此人值得。”
        neutral: 周师兄说“基本操作”，然后把你的案例讲给了下一届。
        negative: 周师兄说“你那是被吓的”。你承认。被吓出来的习惯也是习惯。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 那块退役硬盘你没有扔，摆在书架上，像一枚勋章。 }
    reflection: 数据安全的核心不是不出事，而是出事时你还有得选。
    lessonHint: 重要数据执行 3-2-1 备份原则并定期演练恢复。
    tone: positive
    family: project_management
    whyDistinct: 核心结果是“备份冗余化解灾难”的正面路径，与赌博路径（三千元的收据）在同一链用 expected:false 互斥。

  - id: r_v2_disk_paid_end
    campaign: research
    title: 《三千元的收据》
    mainResult: 赌博式存储的数据恢复代价
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: rv2_backup_gamble }
        - { kind: flag, key: rv2_disk_recovered_paid }
    priority: 91
    tier: main
    baseText: 三千元，93% 恢复率。你把收据和硬盘一起收进了抽屉最深处。答辩通过了，没人知道你差一点就要在一周内重做所有分析。那 7% 丢失的文件里，有一段你最得意的中间分析过程——它永远地消失了，只留下结论。后来每次做研究，你都会问自己一个问题：这个东西，值得再买一次三千元的教训吗？值得的，就不该只存一份。
    growthVariantRules:
      - dimension: evidenceDiscipline
        variants:
          - { gte: 55, text: 恢复成功当晚，你下单了双盘 NAS。钱要花在刀刃上——第二次。 }
          - { lte: 40, text: 你觉得三千块买回数据挺划算，下次大概还会赌。大概率。 }
    characterEpilogueRules:
      - characterId: r_senior_data
        positive: 周师兄说：“三千块买个 3-2-1 原则，不算贵。有人用毕业买的。”
        neutral: 周师兄帮你列了恢复后的核对清单，只字未提你的赌博。
        negative: 周师兄说：“我提醒过的。”这五个字你听了很多遍。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 那张收据你至今留着。它是你所有备份习惯的起点。 }
    reflection: 赌赢了的侥幸不是能力，是还没到期账单。
    lessonHint: 灾难恢复的成本远高于预防成本，侥幸是最贵的策略。
    tone: negative
    family: project_management
    whyDistinct: 核心结果是“赌博存储的金钱与心理代价”，与重建路径（两天半的重建）在同一延迟链互斥。

  - id: r_v2_disk_rebuilt_end
    campaign: research
    title: 《两天半的重建》
    mainResult: 灾难重建中的方法升级
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: rv2_backup_gamble }
        - { kind: flag, key: rv2_disk_rebuilt }
    priority: 92
    tier: main
    baseText: 重跑的过程比想象中痛苦，也比想象中值：为了让重跑可行，你和周师兄把整条分析管道脚本化了。原来自动化才是最好的备份——不是复制数据，而是让数据随时可以被重新计算出来。答辩时你的分析部分讲得异常流畅，因为每个数字你都在灾难里亲手重算过一遍。评委不会知道，你流畅的底气是一场事故。
    growthVariantRules:
      - dimension: execution_vs_judgment
        variants:
          - { gte: 55, text: 脚本化管道成了你的标准工作流，第二次 disasters 再也没来过。 }
          - { lte: 40, text: 重建的手工部分你做得很痛，但脚本化只做了一半。另一半在等下一次事故。 }
    characterEpilogueRules:
      - characterId: r_senior_data
        positive: 你们俩把那条管道起名叫“凤凰”，注释第一行写着：从硬盘的灰烬里重生。
        neutral: 周师兄说“管道早该写”，然后把功劳都推给了你的灾难。
        negative: 周师兄后来常说“那两天半是你欠的”——你们最好的玩笑，也是最真的提醒。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: “凤凰”管道后来救过组里另外三个人。他们都不知道凤凰名字的来历。 }
    reflection: 最好的备份不是副本，是可重复计算本身——这是灾难教给研究者的最高一课。
    lessonHint: 分析流程自动化（可重算）是数据安全的终极形态。
    tone: mixed
    family: method
    whyDistinct: 核心结果是“灾难驱动的流程升级”，与付费恢复路径在同一链互斥，主题为技术救赎。

  - id: r_v2_backup_lazy_end
    campaign: research
    title: 《87% 的心跳》
    mainResult: 单一云备份的侥幸惊魂
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: rv2_backup_lazy }
        - { kind: flag, key: rv2_backup_gamble, expected: false }
    priority: 90
    tier: main
    baseText: 那四分钟的转圈，你后来在梦里又看过很多次。网盘恢复了，一切安好，但你从那四分钟里带走了一样东西：对单一副本的永久警觉。第二天你就去申请了组服务器权限——流程确实麻烦，填了三张表。第三张表的备注栏你写的是：“因为我不想再经历一次凌晨三点的转圈。”
    growthVariantRules:
      - dimension: execution_vs_judgment
        variants:
          - { gte: 55, text: 你把网盘、服务器、本地盘做成了 weekly 检查项，从未再断。 }
          - { lte: 40, text: 警觉持续了三周，然后慢慢松懈。人就是这样，除非代价真的来过。 }
    characterEpilogueRules:
      - characterId: r_senior_data
        positive: 周师兄看到你服务器申请的备注，破例帮你把审批加急了。他说懂那种感觉。
        neutral: 审批流走了正常流程，一周后批下来。你也活了下来。
        negative: 服务器权限一直没批下来，你也就没再管。警觉败给了流程。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 你的网盘从此只有一个用途：第三备份。前两份，一份都不能少。 }
    reflection: 惊魂的价值在于转化——没有被流程固化的警觉，只是延期的灾难。
    lessonHint: 单一云备份不构成备份策略，多介质冗余不可省略。
    tone: mixed
    family: project_management
    whyDistinct: 核心结果是“单一备份惊魂后的警觉”，与三重备份、赌博路径分别用旗标互斥。

  - id: r_v2_rival_intel_end
    campaign: research
    title: 《最后一排》
    mainResult: 合法情报获取的竞争红利
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: rv2_rival_intel }
    priority: 93
    tier: main
    baseText: 那场讲座你全程没说一句话，收获却比三个月的文献都多：竞争组卡住的三个点，是你的研究已经解决的；他们没意识到的两个坑，你提前绕开了。你没有抄袭任何一个想法——你只是确认了自己的路是对的，并且知道了他们的路到哪里为止。答辩后你在走廊遇到竞争组的同学，他问你“研究进展如何”，你说“还行”。这一次，“还行”两个字问心无愧。
    growthVariantRules:
      - dimension: independence
        variants:
          - { gte: 55, text: 你没有把对手的困境当筹码，只在心里校准了自己的坐标。 }
          - { lte: 40, text: 你得意了很多天。得意这种情绪，在学术圈活得比信息久。 }
    characterEpilogueRules:
      - characterId: r_peer
        positive: 苏晓后来也去了三楼包间。你们的情报网有了两个节点。
        neutral: 苏晓问那晚“讲得好吗”，你说“还行”。她听懂了你的还行。
        negative: 你不小心在组会提了一句竞争组的卡点，导师追问来源。你第一次对苏晓撒了谎。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 你的研究日志里多了一页“对手坐标”，只写结论，不写来源。 }
    reflection: 知己知彼的正当打开方式：不是攻击对方的路，而是照亮自己的路。
    lessonHint: 公开渠道的对手情报用于对标校准，不用于抄袭与不正当竞争。
    tone: mixed
    family: academic_relationships
    whyDistinct: 核心结果是“竞争情报的红利与分寸”，与匿名互助（涂改液下的署名）在同一隐藏层互斥。

  # ===== 引用核验链 =====
  - id: r_v2_citation_full_end
    campaign: research
    title: 《凌晨四点的第 84 条》
    mainResult: 全量人工溯源的极致完成
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: rv2_citation_full_check }
        - { kind: flag, key: rv2_citation_hybrid_check, expected: false }
