    tier: main
    baseText: 凌晨四点，第 84 条核对完成。你的文献列表从此拥有一种奇特的质感——每一条，你都能说出它讲了什么、在第几页、你为什么引它。答辩时评委随手点了第 47 条：“这篇的核心论点？”你答了，连作者的反驳者是谁都提了一句。评委笑了：“很久没见到把自己的文献列表背下来的学生了。”那一夜少睡的四小时，变成了一种别人拿不走的东西。
    growthVariantRules:
      - dimension: evidenceDiscipline
        variants:
          - { gte: 55, text: 你把"全量溯源"坚持成了习惯——每一次综述更新，都重新核一遍。 }
          - { lte: 40, text: 通宵的代价你记了很久。第二次更新文献列表时，你用了漏斗法。 }
    characterEpilogueRules:
      - characterId: r_mentor
        positive: 陈教授在组会上说：“文献工作做到这个程度，才算入门。”
        neutral: 陈教授翻着你的报告说：“核得细。”两个字，是他能给的较高评价。
        negative: 陈教授皱眉：“通宵？我不需要你用命核文献，我需要你用脑子做研究。”
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 那份你倒背如流的文献列表，成了你学术品味的起点。 }
    reflection: 对文献的彻底掌握是一种奢侈——它贵在时间，也贵在别人无法复制。
    lessonHint: 关键研究的文献溯源投入应与论文权重匹配。
    tone: positive
    family: evidence_integrity
    whyDistinct: 核心结果是“全量人工溯源”的极致路径，与混合漏斗（漏斗与终审）、抽查（第 41 条）在同一链互斥。

  - id: r_v2_citation_hybrid_end
    campaign: research
    title: 《漏斗与终审》
    mainResult: 人机分工的引用核验范式
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: rv2_citation_hybrid_check }
        - { kind: flag, key: rv2_citation_full_check, expected: false }
    priority: 92
    tier: main
    baseText: Agent 筛出 11 条低置信引用，你逐一复核，抓出 2 条编造的。整个过程 2.5 小时——全手工要 5.6 小时。但你真正记住的不是省了 3 小时，是那个分工的感觉：机器跑量，人做判断；机器给嫌疑名单，人下最终结论。你在笔记里画了一张漏斗图，旁边写了一行字：“以后所有核查类工作，都长这样。”
    growthVariantRules:
      - dimension: aiDependence
        variants:
          - { gte: 60, text: 你给漏斗的第一层加了自己的规则：让 Agent 标注置信度理由，而不只是分数。 }
          - { lte: 40, text: 你复核那 11 条时用了均速 13 分钟一条——真情况、假情况，你都见过后，手快了很多。 }
    characterEpilogueRules:
