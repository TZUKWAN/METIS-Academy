    tier: hidden
    baseText: 导师的三十封退稿信的照片，和墙上那页撤稿启事——你的“失败博物馆”有了两件镇馆之藏。一件教你失败可以重启，一件教你失败不可挽回。每次数据不够、每次想走捷径，你就把两件藏品并排看一眼：左边那件说“再试一次”，右边那件说“有些门只有一次”。你的研究伦理，不是从课本学来的，是从这座两个人的博物馆里长出来的。
