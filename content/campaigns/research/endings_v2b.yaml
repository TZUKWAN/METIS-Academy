          - { lte: 40, text: 两件藏品你看得越来越多，做得越来越好——但你从没想过，自己也能成为展品。 }
    characterEpilogueRules:
      - characterId: r_mentor
        positive: 毕业前，导师在你的博物馆清单上补了第三件藏品的名字——他自己 1997 年的一次学术错误。手写的。
        neutral: 陈教授不知道你的博物馆。收藏是你一个人的修行。
        negative: 你把博物馆讲给了一位师弟听。他说“好阴暗”。你不再讲了。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 你的博物馆后来有了第四、第五件藏品。策展人一生无奖，但一生受益。 }
    reflection: 研究者的品格里，一半由成功喂养，一半由他人的失败喂养——关键是你要去收藏。
    lessonHint: 系统化收藏失败案例（含自己的）是研究伦理与韧性的双料疫苗。
    tone: mixed
    family: hidden_longterm
    whyDistinct: 核心结果是“双失败档案并置的伦理内化”，需撤稿线与退稿线同时达成，与单件藏品的两个源结局均不同。

  - id: r_v2_weakness_map_end
