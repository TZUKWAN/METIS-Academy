          - { lte: 40, text: 第一页纸的角落，你画了个小小的笑脸。暴露了一点点，就一点点。 }
    characterEpilogueRules:
      - characterId: r_peer
        positive: 苏晓后来在打印间也捡到过一张便签。她没告诉你。你们的网络，各自生长。
        neutral: 苏晓对这些“看不见的线”一无所知。有些浪漫注定孤本。
