        neutral: Agent 完成了初筛。它不知道自己抓到了什么，也不需要知道。
        negative: 有一条幽灵引用，Agent 给了高置信。你抽查时才抓到它——漏斗也有漏网。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 那张漏斗图被你做成了组里的核验 SOP，沿用至今。 }
    reflection: 人机协作的最优解不是谁替代谁，而是把两者都放在各自最不可替代的位置。
    lessonHint: 大批量核验任务采用 AI 初筛 + 人工终审的漏斗结构。
    tone: positive
    family: agent_use
    whyDistinct: 核心结果是“人机核验分工范式”的建立，与全量人工、抽查路径在同一链互斥。

  - id: r_v2_ghost41_end
    campaign: research
