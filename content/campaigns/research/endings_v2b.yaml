    tone: negative
    family: evidence_integrity
    whyDistinct: 核心结果是“抽查盲区惊魂”的侥幸避险叙事，与全量/混合核验结局在同一链互斥。

  # ===== 答辩日链 =====
  - id: r_v2_rehearsed_slept_end
    campaign: research
    title: 《14 分 55 秒》
    mainResult: 计时排练加睡眠的临场掌控
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: rv2_rehearsed_slept }
        - { kind: flag, key: rv2_allnighter, expected: false }
    priority: 92
    tier: main
    baseText: 答辩计时器显示 14 分 55 秒时，你讲完了最后一页。评委提问环节的第一个问题，你在排练时想过——第 9 个。你答得不快不慢，声音没有抖。讲完下台，导师在台下看了你三秒，点了一下头。那五秒的富余、那七个小时的睡眠、那三个被删掉的华丽过渡句——所有看不见的准备，在 14 分 55 秒里完成了一次总决算。
    growthVariantRules:
      - dimension: execution_vs_judgment
        variants:
          - { gte: 55, text: 你发现排练时被删掉的那些"华丽"，其实都是没有信息量的自我感动。 }
          - { lte: 40, text: 你还是紧张了，从第 3 分钟抖到第 13 分钟。但你的内容托住了你的声音。 }
    characterEpilogueRules:
      - characterId: r_mentor
        positive: 陈教授对下一届说：“上一届有人 14 分 55 秒讲完了一场答辩。学学他怎么删东西的。”
        neutral: 陈教授点头的那三秒，是你们之间最接近拥抱的一次。
        negative: 陈教授说“讲得比排练时糙”。你说“我把嗓子留给回答问题”。他愣了一下。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 你的计时器保留了 14:55 这个记录，像一条赛道上的个人最好成绩。 }
    reflection: 临场表现是准备工作的最后一步核算——没有富余的准备，撑不住任何意外。
    lessonHint: 排练必须计时并留出时间余量，睡眠是认知资源的最后储备。
    tone: positive
    family: project_management
    whyDistinct: 核心结果是“计时排练的临场掌控”，与通宵路径（凌晨五点的完美记忆）在同一链互斥。

  - id: r_v2_allnighter_end
    campaign: research
    title: 《凌晨五点的完美记忆》
    mainResult: 通宵硬撑的临场代价
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: rv2_allnighter }
    priority: 90
    tier: main
    baseText: 凌晨五点，你能背出每一页。下午三点，你站在讲台上，发现自己的短期记忆像被格式化过——第 11 页讲完，你想不起第 5 页说过什么，只能现场圆场。答辩通过了，靠的是你的基础和PPT本身的质量，而不是你那晚背下的任何一句话。那晚背的所有东西，一个字都没有被用到。你在成绩单公布那天算了笔账：收益为零，成本是答辩当天的自己。
    growthVariantRules:
      - dimension: execution_vs_judgment
        variants:
          - { gte: 55, text: 你后来再也不用通宵换安全感。安全感应该来自排练，不来自疲劳。 }
          - { lte: 40, text: 你把失败归因于"体质不行，撑不住通宵"——这个归因让你错过真正的问题。 }
    characterEpilogueRules:
      - characterId: r_peer
        positive: 苏晓说：“你凌晨五点发的那条'背完了'，配图黑眼圈到颧骨。下次我把你手机没收。”
        neutral: 苏晓不知道你通宵了。你装得很好。
        negative: 你答辩时的卡顿被做成了组里的反面教材。苏晓安慰你的方式是请了你三顿饭。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 你再也没有通宵过。不是做不到，是算清了账。 }
    reflection: 疲劳是记忆与判断的隐形税——临场前的每一分睡眠，都是答题时的每一分清晰。
    lessonHint: 高认知任务前必须保证睡眠，通宵准备得不偿失。
    tone: negative
    family: project_management
    whyDistinct: 核心结果是“通宵准备的临场崩溃”，与计时排练结局在同一链互斥。

  - id: r_v2_honest_nervous_end
    campaign: research
    title: 《准备完了，还紧张》
    mainResult: 承认紧张获得的师生和解
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: rv2_honest_nervous }
        - { kind: flag, key: rv2_fake_calm, expected: false }
    priority: 93
    tier: main
    baseText: "'紧张。但准备完了。'——这七个字说出口的瞬间，走廊里安静了两秒。导师看你的眼神变了：不是学生面对老师的紧张，是一个研究者对另一个研究者的坦白。多年后你也带了自己的学生，在他们答辩前的走廊里，你说了同样的话：'紧张是尊重。进去吧。'那一刻你想起了没听清的那句耳语。原来那就是答案。"
    growthVariantRules:
      - dimension: independence
        variants:
          - { gte: 55, text: 你的坦白不是示弱，是评估——你知道自己的准备值得被信任。 }
          - { lte: 40, text: 你说完就想收回。坦白对你来说仍是一次冒险，而不是一种表达。 }
    characterEpilogueRules:
      - characterId: r_mentor
        positive: 陈教授后来在教师节收到你的卡片，上面只写了那七个字。他把它夹在了工作证后面。
        neutral: 陈教授当天就忘了这场对话。但你的坦白，他其实听进去了。
        negative: 陈教授说“紧张就别进去”。你第一次意识到，不是所有关系都能接住诚实。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 你把“紧张但准备完了”设为了自己面对一切大场的固定开场白——对自己说。 }
    reflection: 承认脆弱需要实力作底——这不是鸡汤，是师生关系里最诚实的一次对表。
    lessonHint: 情绪诚实是高质量师徒关系的信号，前提是准备充分。
    tone: positive
    family: research_identity
    whyDistinct: 核心结果是“答辩走廊的师生和解”，与装酷路径（就那样吧）在同一链互斥，主题为身份传承。

  - id: r_v2_fake_calm_end
    campaign: research
    title: 《就那样吧》
    mainResult: 用装酷错过的最后窗口
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: rv2_fake_calm }
    priority: 90
    tier: main
    baseText: “就那样吧。”你听见自己说这三个字时，走廊的风刚好吹过。导师没接话。你的手心全是汗，声音在发抖，而你用三个字把这一切都盖住了。答辩你发挥得不错，导师也点了头。只是很多年后你才明白，那十分钟本来可以是另一段关系的起点——他在窗边站了十分钟，等的就是一句真话。你给了他一句台词。
    growthVariantRules:
      - dimension: independence
        variants:
          - { gte: 55, text: 你后来专门找了个机会补上了那句真话。迟到的坦白也是坦白。 }
          - { lte: 40, text: 你安慰自己"反正结果一样"。结果一样，故事不一样。 }
    characterEpilogueRules:
      - characterId: r_mentor
        positive: 毕业宴上导师喝多了，说：“你们这届，就你装得最像。”你们笑着碰杯，各自心领神会。
        neutral: 那十分钟的风，导师早忘了。心结只有一个人系着，就只有一个人解。
        negative: “就那样吧”后来成了你们之间的全部语气。毕业合影时，你们隔着半个人。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 你再也没在任何人面前说过“就那样吧”——除了对镜子里的自己。 }
    reflection: 防御性的酷是一种自我隔离——你保护了面子，错过了人心。
    lessonHint: 关键关系节点上，真实表达的机会窗口有限且不可逆。
    tone: negative
    family: research_identity
    whyDistinct: 核心结果是“防御性表演的关系代价”，与坦白结局在同一链互斥。

  # ===== 隐藏层结局 =====
  - id: r_v2_anon_community_end
    campaign: research
