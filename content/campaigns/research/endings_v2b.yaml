    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 多年后有人告诉你，那篇被便签救活的论文，作者成了一位著名教授。你合上手机，笑而不语。 }
    reflection: 学术共同体的最深一层，由无数不求相认的善意组成——制度是它的骨架，匿名的人是它的血。
