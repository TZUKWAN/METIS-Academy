        negative: 陈教授说“你好像什么都知道”。你笑了笑。这句评价让你脊背发凉。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 你带学生后，第一课永远是交一份带红点的计划。传统从他的 2003 年开始。 }
    reflection: 周目给你的不是预知，是共情的能力——看得见别人的恐惧，是最高级的情报。
    lessonHint: NG+ 的关系线价值在于用记忆换取对授权者的深层理解。
    tone: positive
    family: hidden_longterm
    whyDistinct: 核心结果是“跨周目读懂导师”的关系成就，NG+ 限定且与遮掩路径互斥。

  - id: r_v2_ngplus_mask_end
    campaign: research
    title: 《样板间》
    mainResult: NG+ 中仍选择表演的错过
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: rv2_ngplus_mentor_mask }
    priority: 96
    ngPlus: true
    tier: special
    baseText: 你交出了打磨过的版本。导师点头放行，说了那句熟悉的“别让我失望”。上一世你听过一次，这一世你第二次听到。你明明知道他的恐惧来自哪里，知道那个抽屉里躺着什么，知道一句真话可以打开什么——你还是交了样板间。完美得无可挑剔，也隔得无懈可击。有些机会在两个周目里长着一模一样的脸。你都错过了。
    growthVariantRules:
      - dimension: independence
        variants:
          - { gte: 55, text: 你在深夜复盘时承认：不是不知道，是不敢。知识从来不自动变成勇气。 }
          - { lte: 40, text: 你说服自己这是"稳妥"。稳妥这个词，你越用越熟练，越熟练越警惕。 }
    characterEpilogueRules:
      - characterId: r_mentor
        positive: 直到毕业你都没能走进那个抽屉的故事。它在你心里成了一道永远解不完的题。
        neutral: 陈教授对你的印象停留在“靠谱”。有些距离，两个周目都走不完。
        negative: 你发现导师对另一个师弟讲了 2003 年的事。你坐在旁边，像局外人。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 你的样板间计划书一直没删。它提醒你：信息可以重来，勇气必须当场。 }
    reflection: 知道答案却不敢作答，是所有周目里最昂贵的浪费。
    lessonHint: NG+ 情报不自动转化为关系突破，行动勇气仍是必要条件。
    tone: negative
    family: hidden_longterm
    whyDistinct: 核心结果是“拥有记忆仍选择表演”的悲剧路径，与镜像结局在同一 NG+ 链互斥。

  - id: r_v2_ngplus_two_rehearsals_end
    campaign: research
    title: 《两代人的排练》
    mainResult: NG+ 完整闭环的师生共振
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: rv2_ngplus_mentor_mirror }
        - { kind: flag, key: rv2_rehearsed_slept }
    priority: 97
    ngPlus: true
    tier: special
    baseText: 答辩前夜你排练到 14 分 55 秒，然后睡了七个小时。答辩当天导师在窗边问“紧张吗”，你说“紧张，但准备完了”。他笑了——这一世他笑了。你后来想，如果把两个周目叠起来看：一个人在走廊里学会了说真话，另一个人在排练室里学会了删台词；而这两个人是同一个你。周目的意义至此闭合：不是重来一次，是活成两遍，然后把两遍的好处，长在同一个身上。
    growthVariantRules:
      - dimension: independence
        variants:
          - { gte: 60, text: 两个周目的你相互印证：记忆给了你判断，排练给了你底气。缺一个，都到不了这里。 }
          - { lte: 40, text: 你说不清这份从容是天赋还是复利。周目外的人永远无法验证，也无法反驳。 }
    characterEpilogueRules:
      - characterId: r_mentor
        positive: 那天他多问了一句：“你好像不太像第一次答辩的人。”你说：“做过两遍梦。”他没追问。
        neutral: 陈教授的笑维持了三秒。三秒对你来说，够本了。
        negative: 这份从容让导师高估了你的天赋。他开始给你不可能的任务。从容成了甜蜜的负担。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 你把“排练-睡眠-坦白”三件事称为答辩三部曲，教给了每一届学生。 }
    reflection: 成长是把自己活成两遍，然后合并同类项。
    lessonHint: NG+ 成就的最高形态是跨周目能力与关系的双重闭环。
    tone: positive
    family: hidden_longterm
    whyDistinct: 核心结果是“NG+ 能力与关系双闭环”的终极整合叙事，需 NG+ 镜像线与排练线同时达成。

  # ===== 超稀有结局 =====
  - id: r_v2_drawer_heir_end
    campaign: research
    title: 《抽屉的传人》
    mainResult: 三线交汇——失败档案的正式传承
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: rv2_reject_letters }
        - { kind: flag, key: rv2_mock_survived }
        - { kind: flag, key: rv2_honest_nervous }
    priority: 99
    tier: hidden
    ultraRare: true
    baseText: 毕业宴那天，导师把你留下了。他从公文包里取出那三十封退稿信——原件，不是照片。“我那个抽屉，钥匙一直没换，”他说，“但我一直在等一个配拿的人。”你想起模拟答辩里你答上的第十一个问题，想起走廊里那句“紧张但准备完了”，想起通宵核对文献的那晚。他看的不是你的成绩单。他看的，是你面对失败、质疑和紧张的方式。你双手接过了那个文件夹。里面最后一页是空白的，标题写着：第三十一封起，归你。
    growthVariantRules:
      - dimension: independence
        variants:
          - { gte: 60, text: 多年后你的抽屉满了。你也开始等一个配拿的人。传承这件事，原来是一场接力。 }
          - { lte: 40, text: 那个文件夹你锁进了保险柜。你怕弄丢它，也怕自己还不配打开它。 }
    characterEpilogueRules:
      - characterId: r_mentor
        positive: 陈教授退休演讲的最后一页PPT是那个空抽屉的照片。他说：“最好的传承，是把失败传下去。”
        neutral: 陈教授照常退休，照常旅行。文件夹的故事，只属于你们两个人。
        negative: 你后来听说导师把文件夹给了别人。你错过了什么，永远没有答案。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 第三十一封退稿信在你毕业后的第十四个月到来。你笑着收下了它，按年份码好。 }
    reflection: 学术的传承不在论文署名里，在失败档案的交接仪式里——被托付失败史的人，才是真正的关门弟子。
    lessonHint: 三线交汇（失败档案+对抗淬炼+情绪诚实）象征研究者身份的完整传承。
    tone: positive
    family: hidden_longterm
    whyDistinct: 核心结果是“三线交汇的传承仪式”，需失败档案、对抗模拟、情绪诚实三条独立线同时达成，为本线最高稀有度的身份结局。
