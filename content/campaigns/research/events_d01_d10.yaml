    next: r_d10_compact

  - id: r_d10_compact
    campaign: research
    day: 10
    type: decision
    keyDecision: true
    trigger: { kind: manual }
    purpose: { learning: 五段式 Compact：已确认/未确认/范围/关键材料/下一步 }
    scene: { location: workbench, characters: [r_ai_agent] }
    choices:
      - id: structured_compact
        text: 五段式压缩：已确认事实/待确认/当前范围/关键文献/下一任务
        visibleResponse: |
          压缩产物不到一页，但四问全能答上：
          研究什么？数据从哪来？哪些已证？下一步干嘛？
          你把它存为 compact_checkpoint_01，开新会话继续。
        hiddenEffects:
          - { kind: add, key: execution, value: 6 }
          - { kind: addAsset, assetType: compact_checkpoint, name: compact_checkpoint_01, description: 五段式压缩检查点, content: "已确认/待确认/范围/关键文献/下一步（见正文）" }
        unlockKnowledge: [kc_r_compact]
      - id: casual_summary
        text: 让AI“总结一下我们聊过的”
        visibleResponse: 摘要写得很文艺，但丢了两条硬约束。新会话里 Agent 又开始自由发挥。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 5 }]
    learningPoint: 压缩保事实与约束，扔过程

