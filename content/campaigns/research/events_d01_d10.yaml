    dialogue:
      - { speaker: Agent, text: "已读取研究状态。基于当前范围，我建议从矩阵中的三处矛盾切入……", mood: pleased }
    terminal: true

  # ============ DAY 10 ============
  - id: r_d10_bloat
    campaign: research
    day: 10
    type: story
    trigger: { kind: day, day: 10, phase: start }
    purpose: { narrative: 上下文膨胀, learning: Compact 是结构化压缩，不是随便总结 }
    scene: { location: workbench, characters: [r_ai_agent] }
