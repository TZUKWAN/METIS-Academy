  - id: r_e02_15_hypothesis_draft
    campaign: research
    day: 15
    type: decision
    trigger: { kind: day, day: 15, phase: end }
    purpose: { learning: 假设要可证伪：写出'什么结果算我错' }
    scene: { location: dorm, characters: [] }
    setup: [“你写下假设H1：'AI辅助写作与论证质量正相关'。师姐的老问题又来了——什么结果算这条假设错了？”]
    choices:
      - id: falsifiable_rewrite
        text: 补上判据：'若相关系数r<0.2且置信区间跨0，H1不成立'
        visibleResponse: 判据写下的瞬间，假设从愿望变成了承诺。你也顺手预登记了分析思路——这步棋预审时被郑老师点名表扬。
        hiddenEffects:
          - { kind: add, key: evidenceDiscipline, value: 8 }
          - { kind: setFlag, key: preregistered_analysis }
          - { kind: addAsset, assetType: hypothesis_board, name: 假设板 v1, description: H1-H3与证伪判据, content: "H1: 正相关（判据 r≥0.2, CI不含0）\nH2/H3 待补" }
      - id: vague_hypothesis
        text: 差不多就行，统计上显著就算支持
        visibleResponse: “显著”两个字能容下太多东西。跑数据那天，你会对着不显著的结果发呆，不知该认输还是该再跑一次。
        hiddenEffects:
          - { kind: add, key: academicDebt, value: 7 }
          - { kind: setFlag, key: vague_criteria }
    learningPoint: 不可证伪的假设是装饰品

  # ---- D9 补充 ----
