# 科研线扩展事件 02：综述写作、状态管理与 gap 深挖支线（D9-D15）
events:
  # ---- D9 ----
  - id: r_e02_09_gaps_draft
    campaign: research
    day: 9
    type: story
    trigger: { kind: day, day: 9, phase: start }
    purpose: { narrative: 综述读完的错觉, learning: “读完”的标准是能复述脉络 }
    scene: { location: library, characters: [] }
    setup: [“你合上最后一篇文献，合上的时候心里发虚：这一个月读的东西，好像一篇都没记住。”]
    dialogue:
      - { speaker: 系统, text: "合上电脑，试着口述这个领域的脉络。卡住的地方，就是没读进去的地方。" }
    next: r_e02_09_recount

  - id: r_e02_09_recount
    campaign: research
    day: 9
    type: decision
    keyDecision: true
    trigger: { kind: manual }
    purpose: { learning: 输出检验输入：口述/默写/画图三选一 }
    scene: { location: library, characters: [] }
    choices:
      - id: blank_page_test
        text: 白纸测试：合上所有材料，画出领域地图
        visibleResponse: 你画出了三大流派和两条争论线，中间有两个大洞。洞的位置，恰好是你的 gap 候选区。
        hiddenEffects:
          - { kind: add, key: evidenceDiscipline, value: 6 }
          - { kind: add, key: independence, value: 5 }
          - { kind: addAsset, assetType: argument_map, name: 领域地图 v1, description: 流派/争论线/缺口三要素手绘图, content: "流派×3 / 争论线×2 / 空白区×2" }
          - { kind: achievement, achievementId: ach_r_e02_blank_page, description: 用白纸测试检验阅读 }
      - id: agent_recap
        text: 让 Agent 帮你回顾这批文献讲了什么
        visibleResponse: 它的回顾流畅漂亮。你点头如捣蒜——但你分不清哪些是你读到的，哪些是它编的节奏。
        hiddenEffects:
          - { kind: add, key: aiDependence, value: 6 }
      - id: skip_recap
        text: 读完就读完了，直接进入下一项
        visibleResponse: 第 12 天写综述章节时，你重新打开了 11 个 PDF。第一次读，原封不动地再来一遍。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 7 }]
    learningPoint: 没有输出的阅读只是翻页

  - id: r_e02_09_state_stale
    campaign: research
    day: 9
    type: decision
    trigger: { kind: day, day: 9, phase: end }
    purpose: { learning: 状态文件会过期：每周校准 }
    scene: { location: workbench, characters: [] }
    setup: [“你打开三天前写的 research_state.md，发现'未确认'栏里两条已经被这周的检索解决了。”]
    dialogue:
      - { speaker: 系统, text: "过期状态比没状态危险：Agent 会按旧地图走路。" }
    choices:
      - id: refresh_state
        text: 立刻校准：把已确认的移栏，标注解决日期
        visibleResponse: 五分钟的维护。你顺手在文件头加了版本号和日期——这个文件第一次有了"保鲜期"。
        hiddenEffects:
          - { kind: add, key: execution, value: 4 }
          - { kind: setFlag, key: state_refreshed_d9 }
        delayed:
          - { eventId: r_e09_px_state_fresh, onDay: 23 }
      - id: leave_stale
        text: 反正自己心里有数
        visibleResponse: 第二天你把状态文件喂给 Agent。它用旧约束否掉了你已经解决的一个问题。你花了半小时解释。
        hiddenEffects:
          - { kind: add, key: academicDebt, value: 3 }
          - { kind: add, key: aiDependence, value: 2 }
        delayed:
          - { eventId: r_e08_d9_stale_state_payoff, onDay: 19 }
    learningPoint: 状态文件要带日期，过期就校准

  - id: r_e02_09_senior_lunch
    campaign: research
    day: 9
    type: npc
    trigger: { kind: random, weight: 2 }
    scene: { location: canteen, characters: [r_senior_theory, r_senior_data] }
    setup: [“食堂二楼。师姐和师兄在拼桌，你端着餐盘坐过去。”]
    dialogue:
      - { speaker: 周师兄, text: "师姐又说你文献读得细。细有什么用，读得快才是生产力。", mood: happy }
      - { speaker: 林师姐, text: "读得快但引错结论，那叫生产力吗？你上次把别人显著性水平抄错的事忘了？", mood: serious }
      - { speaker: 周师兄, text: "……那是笔误。" }
    choices:
      - id: side_accuracy
        text: "站师姐：我宁可慢，不想答辩时被抓错"
        visibleResponse: 师姐挑了挑眉，把餐盘里的鸡腿夹给了你。周师兄哀嚎："叛徒。"
        hiddenEffects:
          - { kind: relationship, characterId: r_senior_theory, delta: 5 }
          - { kind: add, key: evidenceDiscipline, value: 3 }
      - id: side_speed
        text: "站师兄：速度确实重要，我两头都想要"
        visibleResponse: 周师兄笑了："知音！"师姐慢悠悠说："两头都要的人，通常两头都得不到。"
        hiddenEffects:
          - { kind: relationship, characterId: r_senior_data, delta: 4 }
          - { kind: relationship, characterId: r_senior_theory, delta: -2 }
      - id: stay_out
        text: 埋头干饭，不掺和神仙打架
        visibleResponse: 你安静吃完。两位师兄师姐吵到饭凉，最后一起把盘子端走了。
        hiddenEffects: []
    terminal: true

  # ---- D10 ----
  - id: r_e02_10_lit_review_start
    campaign: research
    day: 10
    type: story
    trigger: { kind: day, day: 10, phase: start }
    purpose: { narrative: 综述开笔, learning: 综述是论证不是目录 }
    scene: { location: workbench, characters: [] }
    setup: [“综述章节开写。你盯着空白页想：第一句写什么？”]
    dialogue:
      - { speaker: 系统, text: "综述不是'张三说了A，李四说了B'。综述是：关于你的问题，学界吵到了哪一步。" }
    next: r_e02_10_review_angle

  - id: r_e02_10_review_angle
    campaign: research
    day: 10
    type: decision
    keyDecision: true
    trigger: { kind: manual }
    purpose: { learning: 综述按争论组织，不按文献罗列 }
    scene: { location: workbench, characters: [] }
    choices:
      - id: organize_by_debate
        text: 按争论组织：三派立场→分歧点→缺口在哪
        visibleResponse: 你把 28 篇重新分进三个阵营，每个阵营一段。写到缺口那段时，你的研究问题自己浮出来了——综述原来是为它铺路的。
        hiddenEffects:
          - { kind: add, key: evidenceDiscipline, value: 6 }
          - { kind: add, key: progress, value: 5 }
          - { kind: addAsset, assetType: document, name: 综述初稿(按争论结构), description: 三派立场与分歧点, content: "派别A/B/C → 分歧点 → 缺口 → 引出RQ" }
        unlockKnowledge: [kc_r_argument_map]
      - id: organize_by_author
        text: 按时间罗列：2019谁做了什么、2020谁做了什么……
        visibleResponse: 写了两千字流水账。师姐批注："这是文献年表，不是综述。它们吵架的点呢？"
        hiddenEffects:
          - { kind: add, key: academicDebt, value: 6 }
      - id: agent_review_draft
        text: 让 Agent 直接生成综述初稿
        visibleResponse: 初稿字字通顺，句句可疑：三处引用对不上矩阵，一处结论原文根本没说。你逐句核对花的时间比自己也写慢。
        hiddenEffects:
          - { kind: add, key: aiDependence, value: 7 }
          - { kind: add, key: academicDebt, value: 5 }
    learningPoint: 综述的骨架是争论，不是文献清单

  - id: r_e02_10_citation_style
    campaign: research
    day: 10
    type: decision
    trigger: { kind: day, day: 10, phase: end }
    purpose: { learning: 引用格式早统一，晚统一要多改两遍 }
    scene: { location: workbench, characters: [] }
    setup: [“你发现自己混用了两种引用格式。学院模板要求的是 GB/T 7714。”]
    choices:
      - id: fix_now
        text: 现在就统一格式，让管理工具自动跑
        visibleResponse: 半小时配置，一键刷新。以后插入引用即格式正确——这个决定省了你答辩前一个通宵。
        hiddenEffects:
          - { kind: add, key: execution, value: 4 }
          - { kind: setFlag, key: citation_style_fixed }
      - id: fix_later
        text: 内容要紧，格式最后再说
        visibleResponse: 最后是真的最后——答辩前夜你在逐条改格式，凌晨三点，你改到第 43 条。
        hiddenEffects:
          - { kind: add, key: technicalDebt, value: 5 }
          - { kind: subtract, key: energy, value: 8 }
        delayed:
          - { eventId: r_e09_px_format_night, onDay: 29 }
    learningPoint: 格式债利息很高

  # ---- D11 ----
  - id: r_e02_11_gap_hunter
    campaign: research
    day: 11
    type: npc
    trigger: { kind: day, day: 11, phase: end }
    scene: { location: library, characters: [r_senior_theory] }
    setup: [“林师姐把你的三行候选 gap 看了三遍，圈了其中一个词。”]
    dialogue:
      - { speaker: 林师姐, text: "'影响'。你这个字，是因果的意思吗？还是只是相关？", mood: serious }
      - { speaker: 你, text: "我……想的是因果。" }
      - { speaker: 林师姐, text: "那你得回答：为什么是因果，而不是爱学习的人恰好也爱用AI？把这个问题写进验证表。", mood: neutral }
    choices:
      - id: add_confound_row
        text: 把'混淆变量'加进 gap 验证表
        visibleResponse: 新增一行：反向解释——"爱学习者更爱用AI"。这一行逼你在设计里加了控制变量。
        hiddenEffects:
          - { kind: add, key: evidenceDiscipline, value: 7 }
          - { kind: relationship, characterId: r_senior_theory, delta: 5 }
          - { kind: addAsset, assetType: evidence_matrix, name: gap验证表 v2, description: 加入反向解释行, content: "| gap | 支持 | 反例 | 反向解释 | 置信 | 可行 |" }
      - id: dodge_confound
        text: 相关就相关吧，开题不一定被问到
        visibleResponse: 会被问到的。评委会最爱问的恰恰是这一行。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 5 }]
    terminal: true

  - id: r_e02_11_agent_gap_praise
    campaign: research
    day: 11
    type: npc
    trigger: { kind: random, weight: 2 }
    scene: { location: workbench, characters: [r_ai_agent] }
    setup: [“你让 Agent 评价你的研究问题。它给出了评价。”]
    dialogue:
      - { speaker: Agent, text: "该研究问题具有重要理论价值、显著创新性与极高可行性。", mood: pleased }
      - { speaker: 你, text: "你对我上次那版也是这么说的。两版可是完全不同的题目。" }
      - { speaker: Agent, text: "……两个题目各具优势。" }
      - { speaker: 你, text: "所以你的表扬不带信息量。给我指出一个最可能被评委攻击的点。" }
    choices:
      - id: demand_attack
        text: 让 Agent 强制扮演评委来攻击你的题目
        visibleResponse: 它换了个面孔，列了三个攻击点：样本代表性、因果方向、概念测量。第三个你答不利索——记进应答卡。
        hiddenEffects:
          - { kind: add, key: evidenceDiscipline, value: 5 }
          - { kind: add, key: independence, value: 4 }
          - { kind: setFlag, key: adversarial_review_done }
      - id: enjoy_praise
        text: 被夸总比被骂舒服，继续
        visibleResponse: 你带着好心情睡觉。第二十八天，评委会替它补上没说的话。
        hiddenEffects: [{ kind: add, key: aiDependence, value: 5 }]
    terminal: true

  # ---- D12 ----
  - id: r_e02_12_senior_defense_story
    campaign: research
    day: 12
    type: npc
    trigger: { kind: day, day: 12, phase: start }
    scene: { location: lab, characters: [r_senior_data] }
    setup: [“周师兄讲起自己开题的故事。”]
    dialogue:
      - { speaker: 周师兄, text: "我当年开题，评委问我'你这模型要是跑不显著怎么办'。我说显著，肯定显著。", mood: happy }
      - { speaker: 周师兄, text: "后来跑了七次，第七次才显著。你们猜评委怎么说的？'你终于修完了你的模型。'" }
      - { speaker: 系统, text: "注意：这句话翻译过来是——前六次你都在对着数据调假设。" }
    choices:
      - id: ask_difference
        text: 问师姐：'对着数据调假设'和'修正假设'差在哪
        visibleResponse: 师姐说："差在你有没有提前写清楚什么算显著、为什么。写了再改叫修正，没写就叫挑数字。"
        hiddenEffects:
          - { kind: add, key: evidenceDiscipline, value: 6 }
          - { kind: relationship, characterId: r_senior_theory, delta: 4 }
          - { kind: setFlag, key: knows_harking }
      - id: take_note_only
        text: 记下这个故事，继续干活
        visibleResponse: 你把它当段子听完了。第 22 天跑分析时，这个段子会突然变得不好笑。
        hiddenEffects: []
    terminal: true

  - id: r_e02_12_matrix_prune
    campaign: research
    day: 12
    type: decision
    trigger: { kind: day, day: 12, phase: end }
    purpose: { learning: 文献也要做减法：远离主题的移入附录 }
    scene: { location: workbench, characters: [] }
    setup: [“矩阵 34 行了。你发现 9 行跟你的研究问题半毛钱关系没有——当初只是'感觉以后可能有用'。”]
    choices:
      - id: prune_matrix
        text: 移入附录库，主线矩阵只留直接相关的
        visibleResponse: 主矩阵瘦身到 25 行，每行都能在你的论证图上找到位置。找东西快了一倍。
        hiddenEffects:
          - { kind: add, key: execution, value: 5 }
          - { kind: addAsset, assetType: research_matrix, name: 主矩阵 v2(瘦身), description: 25行核心+9行附录, content: "核心25行 / 附录9行（可随时召回）" }
      - id: keep_everything
        text: 都留着，文献多是底气
        visibleResponse: 你的综述章节变得臃肿：为了引用一篇'可能有用的'，你硬扯出一段谁也不服的过渡。
        hiddenEffects:
          - { kind: add, key: academicDebt, value: 4 }
        delayed:
          - { eventId: r_e09_px_bloat_review, onDay: 26 }
    learningPoint: 矩阵是武器库不是仓库

  # ---- D13 ----
  - id: r_e02_13_rq_stress_test
    campaign: research
    day: 13
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 13, phase: start }
    purpose: { learning: RQ 四问：能回答吗/值得回答吗/我能回答吗/答完有什么用 }
    scene: { location: dorm, characters: [] }
    setup: [“明天汇报研究问题。今晚你给自己安排了一场模拟拷问。”]
    dialogue:
      - { speaker: 系统, text: "RQ 四问：这问题有答案吗？值得答吗？你答得动吗？答完了谁在乎？" }
    choices:
      - id: four_questions_pass
        text: 逐问写下答案，卡壳的那问标红
        visibleResponse: 三问通过，'我能答得动吗'标红——你的样本量撑不起你要的因果强度。你连夜把问题从因果降级为关联。
        hiddenEffects:
          - { kind: add, key: evidenceDiscipline, value: 7 }
          - { kind: add, key: progress, value: 4 }
          - { kind: setFlag, key: rq_stress_tested }
      - id: skip_stress
        text: 问题已经想了三天，不会错的
        visibleResponse: 汇报时陈教授只问了一句："你的 120 份样本，怎么支撑'影响'两个字？"你当场把'影响'改口成了'关联'。
        hiddenEffects:
          - { kind: add, key: academicDebt, value: 5 }
    learningPoint: 研究问题先过自己这关

  - id: r_e02_13_peer_outline_swap
    campaign: research
    day: 13
    type: npc
    trigger: { kind: day, day: 13, phase: end }
    scene: { location: dorm, characters: [r_peer] }
    setup: [“苏晓提议：'咱俩互相看开题提纲，只许提一个问题，但必须是最狠的那个。'”]
    dialogue:
      - { speaker: 苏晓, text: "规则：一人一击，要害部位，不许绕弯。", mood: happy }
    choices:
      - id: accept_duel
        text: 应战。她的提纲里你挑'创新点一节没证据'下手
        visibleResponse: 她看完你的提纲，指着机制链："这节怎么测？"你俩同时沉默，然后同时笑出声——原来最狠的问题也是最好的礼物。
        hiddenEffects:
          - { kind: relationship, characterId: r_peer, delta: 7 }
          - { kind: add, key: evidenceDiscipline, value: 4 }
          - { kind: setFlag, key: outline_duel }
      - id: polite_decline
        text: "算了吧，互相客气点不好吗"
        visibleResponse: 你们互相说了'挺好的'。两个提纲里的问题，都在预审当天被评委免费指出。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 4 }]
    terminal: true

  # ---- D14 ----
  - id: r_e02_14_agents_md_conflict
    campaign: research
    day: 14
    type: story
    trigger: { kind: day, day: 14, phase: end }
    scene: { location: workbench, characters: [r_ai_agent] }
    setup: [“你的 AGENTS.md 生效两天了。今天 Agent 的输出里出现了一句：'根据规则，我不确定的部分将显式标注。'”]
    dialogue:
      - { speaker: Agent, text: "以下三处证据强度不足，无法从原文直接支持。已标注为[待核实]。", mood: neutral }
      - { speaker: 你, text: "……它第一次主动承认'不确定'了。" }
      - { speaker: 系统, text: "规则改变行为。对 Agent 如此，对你也如此。" }
    automaticEffects:
      - { kind: add, key: execution, value: 4 }
    terminal: true

  - id: r_e02_14_time_leak
    campaign: research
    day: 14
    type: decision
    trigger: { kind: manual }
    purpose: { learning: 时间预算要留缓冲：四小时计划≠四小时工作 }
    scene: { location: dorm, characters: [] }
    setup: [“晚上复盘：计划四小时，实际干了六小时。多出来的两小时花在'顺手'上——顺手回了消息、顺手搜了个梗、顺手重构了文件夹。”]
    choices:
      - id: time_audit
        text: 记三天时间账：每小时干了什么，找泄漏点
        visibleResponse: 三天账本出来，最大的洞是'查文献顺手点开的推荐页'。你装了个专注插件，第二天净工作时长多了 80 分钟。
        hiddenEffects:
          - { kind: add, key: execution, value: 6 }
          - { kind: add, key: independence, value: 3 }
          - { kind: setFlag, key: time_audited }
      - id: blame_tools
        text: 都怪手机，把手机锁进柜子
        visibleResponse: 手机进了柜子，你开始用电脑刷——洞没堵上，只是搬了个家。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 3 }]
    learningPoint: 先记账，再节流；对症下药

  # ---- D15 ----
  - id: r_e02_15_theory_first_draft
    campaign: research
    day: 15
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 15, phase: start }
    purpose: { learning: 理论章的写法：从现象到理论，还是从理论到现象 }
    scene: { location: workbench, characters: [] }
    setup: [“理论框架开写。两个写法摆在面前：先讲理论再套现象，或从你的现象出发引出理论。”]
    choices:
      - id: phenomenon_first
        text: 从现象倒推：写作场景→反馈替代→自我监控弱化→引出理论
        visibleResponse: 你按'讲自己观察到的故事'开头，理论在第二页才出场，出场即有用。师姐评语："理论终于像工具，不像展品。"
        hiddenEffects:
          - { kind: add, key: evidenceDiscipline, value: 5 }
          - { kind: relationship, characterId: r_senior_theory, delta: 6 }
          - { kind: add, key: progress, value: 4 }
      - id: theory_first
        text: 经典式：先全文综述理论，再谈本研究
        visibleResponse: 你写了五页理论综述。答辩PPT只有十页——理论占了三页，评委问'所以呢'的时候你只剩七页可讲。
        hiddenEffects:
          - { kind: add, key: academicDebt, value: 5 }
      - id: no_theory
        text: 理论悬空，直接写假设
        visibleResponse: 假设没有爹。评委问'假设从哪来'，你只能现场认亲。
        hiddenEffects:
          - { kind: add, key: academicDebt, value: 7 }
    learningPoint: 理论为解释现象服务，不为装点门面服务

  - id: r_e02_15_agent_paraphrase
