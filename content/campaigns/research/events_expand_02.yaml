      - id: quiz_and_go
        text: 错了就错了，口头纠正继续干活
        visibleResponse: 你纠正了它。三小时后它把样本量又说错了——口头纠正的保质期撑不过一次任务。
        hiddenEffects:
          - { kind: add, key: aiDependence, value: 3 }
          - { kind: add, key: academicDebt, value: 2 }
