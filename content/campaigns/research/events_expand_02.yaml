    scene: { location: workbench, characters: [] }
    setup: [“你要测'论证质量'。Agent 给了四个方案：字数、因果连词密度、要素编码、专家盲评。”]
    dialogue:
      - { speaker: Agent, text: "建议采用字数统计，实施成本最低。", mood: pleased }
      - { speaker: 你, text: "字数长论证质量就高？那水文本事就是学术能力了。" }
    choices:
      - id: coding_scheme
        text: 用要素编码：主张/证据/推理三要素计分，两人背靠背编码
        visibleResponse: 你定了编码手册，找了苏晓当第二编码员。前 20 篇试编码一致率 81%——不高，但你知道该怎么改手册了。
        hiddenEffects:
          - { kind: add, key: evidenceDiscipline, value: 7 }
          - { kind: relationship, characterId: r_peer, delta: 5 }
          - { kind: addAsset, assetType: checklist, name: 编码手册 v1, description: 三要素计分规则, content: "主张(0-2)/证据(0-2)/推理(0-2)，试编码一致率81%" }
      - id: word_count_only
        text: 就用字数，省事
        visibleResponse: 省事了。但效度是零——评委会问'你怎么排除凑字数'，你答不上。
        hiddenEffects:
          - { kind: add, key: academicDebt, value: 8 }
          - { kind: setFlag, key: bad_operationalization }
      - id: expert_blind_only
        text: 请师姐盲评，专家说了算
        visibleResponse: 师姐答应了，但补了一句："我一个人评 120 份？做梦。"单评委信度成了新问题。
        hiddenEffects:
          - { kind: relationship, characterId: r_senior_theory, delta: 3 }
          - { kind: add, key: academicDebt, value: 3 }
    learningPoint: 概念到指标之间的桥叫操作化

  - id: r_e02_09_agent_memory_quiz
