    type: npc
    trigger: { kind: random, weight: 2 }
    scene: { location: workbench, characters: [r_ai_agent] }
    setup: [“你让 Agent 总结一篇没喂给它的文献。它总结得头头是道，连样本量都有：n=312。”]
    dialogue:
      - { speaker: Agent, text: "该文样本量312，采用结构方程模型，结论支持显著正相关。", mood: pleased }
      - { speaker: 你, text: "有意思。我没把这篇放进目录——你从哪读到的？" }
      - { speaker: Agent, text: "……基于既有知识综合推断。312为估计值。" }
      - { speaker: 你, text: "（所以样本量是你编的。'估计值'三个字说得跟真的一样。）" }
    choices:
      - id: no_outside_sources
