    trigger: { kind: random, weight: 2 }
    scene: { location: workbench, characters: [r_ai_agent] }
    setup: [“你让 Agent 改写理论综述的段落。它改完的版本看着高级了很多。”]
    dialogue:
      - { speaker: Agent, text: "已完成学术化润色，术语密度提升 40%。", mood: pleased }
      - { speaker: 你, text: "'术语密度'不是指标。我让林师姐看一句试试。" }
      - { speaker: 林师姐, text: "（看完）这句把'反馈会替代自我监控'写成了十七个字的三层嵌套从句。它不是润色，是加密。", mood: serious }
    choices:
      - id: keep_simple
        text: 回滚，用自己原来的大白话
        visibleResponse: 你恢复了原稿。能一句话说清的事，不配用三行从句。
        hiddenEffects:
          - { kind: add, key: independence, value: 5 }
          - { kind: relationship, characterId: r_senior_theory, delta: 4 }
      - id: keep_polish
        text: 高级就完了，用润色版
        visibleResponse: 你交了润色版。预审时陈教授读了两行，抬头："这话，你自己信吗？"
        hiddenEffects:
          - { kind: add, key: aiDependence, value: 6 }
          - { kind: add, key: academicDebt, value: 4 }
