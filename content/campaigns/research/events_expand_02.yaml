  - id: r_e02_11_matrix_conflict
    campaign: research
    day: 11
    type: npc
    trigger: { kind: random, weight: 2 }
    scene: { location: workbench, characters: [r_ai_agent] }
    setup: [“矩阵里两行打架：同一年份、同一主题，两篇论文结论相反。”]
    dialogue:
      - { speaker: Agent, text: "建议采信样本量更大的一篇（n=2000 对 n=87）。", mood: pleased }
      - { speaker: 你, text: "样本大就一定对？2000 份那份是什么人群？" }
      - { speaker: Agent, text: "……是线上众包工人。" }
      - { speaker: 你, text: "我研究本科生。这不是谁对谁错，是人群不同。" }
    choices:
      - id: write_boundary
        text: 把结论改写成条件式：'在A人群中X，在B人群中未必'
        visibleResponse: 你把冲突变成了发现的一部分。综述里多了一段"边界条件"，预审时被认为是你最成熟的一页。
        hiddenEffects:
          - { kind: add, key: evidenceDiscipline, value: 8 }
          - { kind: add, key: progress, value: 3 }
          - { kind: setFlag, key: conditional_conclusion }
      - id: big_sample_wins
        text: 谁样本大听谁的
        visibleResponse: 你删掉了 n=87 那篇。它其实是你唯一的中文情境研究——两周后你把它从回收站捞了回来。
        hiddenEffects:
          - { kind: add, key: academicDebt, value: 5 }
    terminal: true

