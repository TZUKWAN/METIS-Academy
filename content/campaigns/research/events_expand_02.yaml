        text: 统一改名：日期+版本号，旧版进 archive 文件夹
        visibleResponse: 十分钟整理。三天后师姐问'上次那版'，你十秒定位——这是全项目回报率最高的十分钟。
        hiddenEffects:
          - { kind: add, key: execution, value: 5 }
          - { kind: add, key: evidenceDiscipline, value: 2 }
          - { kind: setFlag, key: version_discipline }
      - id: keep_naming_chaos
        text: 能分清，不用改
        visibleResponse: 你分得清——今天。D26 深夜改完第 9 版之后，你和'终版真最终修订2'正面相遇。
        hiddenEffects: [{ kind: add, key: technicalDebt, value: 5 }]
