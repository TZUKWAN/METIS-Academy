      - id: journal_only
        text: 学位论文不算正经文献，跳过
        visibleResponse: 期刊当然更硬。但量表从哪来、预调研怎么做——期刊正文不会教你，学位论文附录会。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 4 }]
