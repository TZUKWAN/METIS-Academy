          - { kind: add, key: evidenceDiscipline, value: 4 }
          - { kind: setFlag, key: power_written }
      - id: gut_number
        text: "150 就是个吉利数，到时候看缘分"
        visibleResponse: 缘分在评委席上不加分。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 4 }]
