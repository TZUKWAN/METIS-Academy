          - { kind: setFlag, key: zombie_fixed }
      - id: delete_claim
        text: 这句论断整个删掉，少个证据不致命
        visibleResponse: 你删得果断。论证链少了一环但每一环都真——这个交换，答辩前夜你会庆幸做过。
        hiddenEffects:
          - { kind: add, key: credibility, value: 4 }
      - id: keep_zombie
        text: 页码差不多得了，评委不会翻原文
        visibleResponse: 评委不翻原文——但吴教授的博士生恰好读过这篇。预审后他给你发了条私信，附了 134 页的照片。
        hiddenEffects:
          - { kind: subtract, key: credibility, value: 10 }
          - { kind: add, key: academicDebt, value: 6 }
          - { kind: setFlag, key: zombie_survived }
    learningPoint: 引用的页码是承诺书

