    scene: { location: workbench, characters: [] }
    setup: [“审计时你顺手点开自己最得意的那条引用——原文第 134 页根本没有那句话。文献存在，引文是鬼。”]
    dialogue:
      - { speaker: 系统, text: "这叫僵尸引用：文献活着，你引用的那句话死了。大概率是三周前快速摘记时张冠李戴。" }
    next: r_e05_27_zombie_fix

  - id: r_e05_27_zombie_fix
    campaign: research
    day: 27
    type: decision
    trigger: { kind: manual }
    purpose: { learning: 僵尸引用处置：改引/换证/删除 }
    scene: { location: workbench, characters: [] }
    choices:
      - id: re_anchor
        text: 重读原文，找到真正支持该论断的段落重新锚定
        visibleResponse: 你在原文第 141 页找到了意思相近但更严谨的表述，重新锚定并更新了页码。论断保住了，还更准了。
        hiddenEffects:
