    type: decision
    keyDecision: true
    trigger: { kind: manual }
    purpose: { learning: 交稿前参考文献全量审计 }
    scene: { location: workbench, characters: [] }
    setup: [“答辩前最后一次全量审计：42 条参考文献，每条都要过三关——存在/作者对/页码对。”]
    choices:
      - id: full_audit
        text: 42 条全查，建立'已核验'标记
        visibleResponse: 40 条干净。第 17 条作者名字母序错了，第 33 条页码区间写反。小毛病，但每一处都可能变成评委手里的一页纸。
        hiddenEffects:
          - { kind: add, key: evidenceDiscipline, value: 8 }
          - { kind: addAsset, assetType: checklist, name: 引用核验总表, description: 42条全部三关通过, content: "存在✓ 作者✓ 页码✓ / 修复2处" }
          - { kind: achievement, achievementId: ach_r_e05_ref_audit, description: 参考文献全量审计 }
      - id: spot_audit
        text: 抽查十条就行，都是管理工具导出的
        visibleResponse: 管理工具导出的是你录入时的错。你在管理工具里打错的一个字母，忠实地跟到了答辩现场。
        hiddenEffects:
          - { kind: add, key: academicDebt, value: 5 }
    learningPoint: 导出≠正确，录入的错会旅行

  - id: r_e05_27_zombie_citation
