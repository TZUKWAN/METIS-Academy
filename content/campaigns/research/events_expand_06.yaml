  - id: r_e06_30_mentor_last_word
    campaign: research
    day: 30
    type: npc
    trigger: { kind: manual }
    scene: { location: corridor, characters: [r_mentor] }
    setup: [“散场时陈教授在走廊叫住你，只说了一段话。”]
    dialogue:
      - { speaker: 陈教授, text: "今天你答得如何，评委说了算。但方法你带得走——下一个题目、下一个学生，都还要用。", mood: serious }
      - { speaker: 陈教授, text: "放假前把研究日志整理给我。写研究的过程，比研究本身值钱。" }
    choices:
      - id: promise_log
        text: "答应整理，并当场列出日志的三条主线"
        visibleResponse: 陈教授听完三条主线，点头走人。你站在走廊里，突然分不清是答辩结束了，还是真正的研究刚开场。
        hiddenEffects:
          - { kind: relationship, characterId: r_mentor, delta: 6 }
          - { kind: add, key: independence, value: 4 }
          - { kind: setFlag, key: log_promised }
      - id: just_nod
        text: 用力点头，一句多余的话不说
        visibleResponse: 他拍了拍你的肩。这个动作，三十天里是第一次。
        hiddenEffects:
          - { kind: relationship, characterId: r_mentor, delta: 3 }
    terminal: true

  - id: r_e06_30_self_review
    campaign: research
    day: 30
    type: decision
    keyDecision: true
    trigger: { kind: manual }
    purpose: { learning: 终局复盘：带走的不是PPT是方法 }
    scene: { location: dorm, characters: [] }
    setup: [“深夜，一切结束。你打开三十天前那个只有一句话的文档，开始写复盘。”]
    dialogue:
      - { speaker: 系统, text: "复盘三问：哪一步最值？哪一步最险？如果重来的话，哪天你会改？" }
    choices:
      - id: full_retrospective
        text: 写完整复盘：三问各答一段，附上方法清单
        visibleResponse: 你写了两千字。写到最后发现：真正值钱的不是那份通过的报告，是契约、核验、机制链、交接——它们对下一个题目百分之百可复用。
        hiddenEffects:
          - { kind: add, key: independence, value: 8 }
          - { kind: add, key: execution, value: 4 }
          - { kind: addAsset, assetType: session_summary, name: 30天复盘, description: 三问复盘+可复用方法清单, content: "最值:假引用核验习惯 / 最险:D21不显著夜 / 重来:D16早冻结设计" }
          - { kind: achievement, achievementId: ach_r_e06_retro, description: 完成30天复盘 }
      - id: skip_retro
        text: 累了，直接睡觉，复盘以后再说
        visibleResponse: “以后”通常等于“没有”。三个月后你接新题目时，会重新踩一遍今天已经付过学费的坑。
        hiddenEffects:
          - { kind: add, key: academicDebt, value: 4 }
    learningPoint: 经验不写下来就会过期

