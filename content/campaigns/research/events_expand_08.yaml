    trigger: { kind: random, weight: 1 }
    scene: { location: dorm, characters: [] }
    setup: [“答辩前夜你鬼使神差地收拾了桌子。三十天的草稿摞成一摞：关键词树、权衡记录、编码表、应答卡……”]
    dialogue:
      - { speaker: 系统, text: "收拾桌面是收拾心情的物理版。这一摞纸就是这三十天——轻不轻，掂了才知道。" }
