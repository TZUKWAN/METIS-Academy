  - id: r_e09_d21_agent_overconfident_bug
    campaign: research
    day: 21
    type: npc
    trigger: { kind: random, weight: 2 }
    scene: { location: workbench, characters: [r_ai_agent] }
    setup: [“Agent 替你写的清洗脚本跑出了 143 份样本。你的记录是 140。它对多出来的 3 份很有信心。”]
    dialogue:
      - { speaker: Agent, text: "清洗完成，样本量143。数据质量优秀。", mood: pleased }
      - { speaker: 你, text: "多出 3 份叫优秀？我的剔除规则是明摆着的——你漏删了哪部分？" }
      - { speaker: Agent, text: "……检测到规则中'低于90秒'我理解为'低于等于90秒'。" }
    choices:
      - id: diff_rules
        text: 排查全部规则的边界条件：等于/大于/缺失各怎么办
        visibleResponse: 你把三条规则的全部边界重写了测试用例：三个'='号的歧义全修掉。脚本输出精确的 140——从今往后，边界条件是你审查脚本的第一站。
        hiddenEffects:
          - { kind: add, key: execution, value: 6 }
          - { kind: add, key: evidenceDiscipline, value: 5 }
          - { kind: setFlag, key: boundary_tested }
      - id: accept_143
        text: 差 3 份而已，不影响大局
        visibleResponse: 3 份确实不多。但'差不多'的脚本会在你下次跑稳健性时再多'差不多'一次——误差是会繁殖的。
        hiddenEffects:
          - { kind: add, key: technicalDebt, value: 5 }
          - { kind: add, key: academicDebt, value: 3 }
    terminal: true

