# 科研线扩展事件 09：全阶段收尾补齐（D1-D30）
events:
  # ---- 选题阶段 ----
  - id: r_e09_d3_topic_ladder
    campaign: research
    day: 3
    type: decision
    trigger: { kind: day, day: 3, phase: start }
    purpose: { learning: 选题三级跳：领域→方向→问题 }
    scene: { location: library, characters: [] }
    setup: [“你的题目还停在'AI对写作的影响'——这是领域不是问题。你试着往下跳两级。”]
    choices:
      - id: three_level_jump
        text: 三级跳：教育技术→AI辅助写作→'AI反馈替代自我监控对论证的影响'
        visibleResponse: 每跳一级，文献变少、可行变高。落到第三级时你已经能说出数据从哪来了——能回答'数据从哪来'的题目才是能做的题目。
        hiddenEffects:
          - { kind: add, key: independence, value: 5 }
          - { kind: add, key: progress, value: 3 }
          - { kind: setFlag, key: topic_ladder_done }
      - id: stay_broad
        text: 停在领域级，显得视野宏大
        visibleResponse: 宏大到没法开工。你的检索继续捞出上万条结果，每一都相关，每一都没法用。
        hiddenEffects:
          - { kind: add, key: academicDebt, value: 5 }
    learningPoint: 题目落不到数据层就等于没落

  - id: r_e08_d31_supervisor_agenda
    campaign: research
    day: 3
    type: npc
    trigger: { kind: random, weight: 2 }
    scene: { location: corridor, characters: [r_mentor] }
    setup: [“陈教授随口提了句：'组里明年想申个AI教育方向的题。'你心里一动。”]
    dialogue:
      - { speaker: 系统, text: "导师的议程和你的兴趣有重叠区。重叠区选题：资源多、指导足——但要想清楚你是不是真的想做。" }
    choices:
      - id: align_interest
        text: 找重叠区：'我对AI反馈机制那部分最感兴趣，能往那靠吗'
        visibleResponse: 陈教授难得直接答了："能。反馈机制是核心，你做深一点。"方向、资源、兴趣三点一线——这是三十天里你最贵的一次走廊对话。
        hiddenEffects:
          - { kind: relationship, characterId: r_mentor, delta: 7 }
          - { kind: add, key: progress, value: 3 }
          - { kind: setFlag, key: agenda_aligned }
      - id: chase_grant_only
        text: 全按导师议程来，资源为王
        visibleResponse: 资源确实来了。但每次读文献你的兴趣都在打瞌睡——不感兴趣的方向，坚持是高耗能模式。
        hiddenEffects:
          - { kind: relationship, characterId: r_mentor, delta: 4 }
          - { kind: add, key: academicDebt, value: 4 }
    terminal: true

  # ---- 文献阶段 ----
  - id: r_e09_d6_citation_graph
    campaign: research
    day: 6
    type: decision
    trigger: { kind: manual }
    purpose: { learning: 可视化文献网络：找枢纽文献与学派边界 }
    scene: { location: workbench, characters: [] }
    setup: [“你把 40 篇文献的引用关系画成一张网。图上立刻浮出三个抱团的小圈子，和一座连接两圈的桥。”]
    dialogue:
      - { speaker: 系统, text: "那座'桥'文献连接了两个互不引用的学派——它通常就是综述章的枢纽。" }
    choices:
      - id: bridge_first
        text: 精读那篇桥文献，两个学派各挑一篇代表作
        visibleResponse: 桥文献果然是你的综述章主轴。两派代表作各读一篇后，你写的对比段落第一次有了'两边各是什么、分歧在哪'的骨架。
        hiddenEffects:
          - { kind: add, key: literatureCount, value: 3 }
          - { kind: add, key: evidenceDiscipline, value: 4 }
          - { kind: setFlag, key: bridge_found }
      - id: random_read
        text: 不看结构了，按顺序挨篇读
        visibleResponse: 顺序阅读让你在学派A里泡了四天，出圈时你已经忘了A和B为什么吵架——网没画，路就走成迷宫。
        hiddenEffects:
          - { kind: add, key: academicDebt, value: 4 }
    learningPoint: 引用网络是文献的地图仪

  - id: r_e09_d9_annotation_habit
    campaign: research
    day: 9
    type: decision
    trigger: { kind: manual }
    purpose: { learning: 批注三色法：证据/疑问/金句 }
    scene: { location: library, characters: [] }
    setup: [“你的PDF批注一片黄——全划了'重要'。等于什么都没标。”]
    choices:
      - id: three_colors
        text: 改三色制：黄=证据、红=疑问、绿=可引用句
        visibleResponse: 三色制之后，写综述时你按颜色收割：黄列进矩阵、红列进验证表、绿列进素材库。批注从'划线'变成了'加工'。
        hiddenEffects:
          - { kind: add, key: execution, value: 5 }
          - { kind: add, key: evidenceDiscipline, value: 3 }
          - { kind: setFlag, key: three_color_notes }
      - id: keep_yellow
        text: 黄就黄吧，划了总比不划强
        visibleResponse: 批注里“都重要”等于都不重要。写作期毫无检索价值——你重新读了一遍那 28 篇。第二次读比第一次快，但第一次的时间也回不来了。
        hiddenEffects:
          - { kind: add, key: academicDebt, value: 3 }
    learningPoint: 批注的价值在检索时兑现

  # ---- 理论阶段 ----
  - id: r_e09_d14_theory_ladder_check
    campaign: research
    day: 14
    type: npc
    trigger: { kind: day, day: 14, phase: start }
    scene: { location: library, characters: [r_senior_theory] }
    setup: [“师姐抽查你的理论与假设的连接：'你的H1是从理论第几页推出来的？'”]
    dialogue:
      - { speaker: 你, text: "呃……理论说了反馈很重要，所以H1说相关……" }
      - { speaker: 林师姐, text: "中间跳了三步。理论说的是'反馈影响学习'，你的H1是'AI使用与质量相关'——反馈在哪里？学习在哪里？把每一步补上，H1才有爹妈。", mood: serious }
    choices:
      - id: derive_chain
        text: 写三步推导：理论命题→情境代入→可检验假设
        visibleResponse: 三步写完，H1 从'感觉相关'变成了'由命题2+情境条件推得'。假设终于有了出生证明——评委查户口时一查一个准。
        hiddenEffects:
          - { kind: add, key: evidenceDiscipline, value: 6 }
          - { kind: relationship, characterId: r_senior_theory, delta: 5 }
          - { kind: setFlag, key: hypothesis_derived }
      - id: intuitive_jump
        text: 理论摆在那就行，假设凭直觉提
        visibleResponse: 直觉提的假设在预审被追问推导时当场断链。'所以理论怎么推出来的？'——那句你永远答不出的'所以'。
        hiddenEffects:
          - { kind: add, key: academicDebt, value: 6 }
    terminal: true

  - id: r_e09_d16_contrarian_theory
    campaign: research
    day: 16
    type: decision
    trigger: { kind: day, day: 16, phase: end }
    purpose: { learning: 竞争性理论：给对手留位置反而显严谨 }
    scene: { location: workbench, characters: [] }
    setup: [“你发现有个理论和你的认知负荷预测相反：它认为AI反馈会促进学习。两个理论对着你的数据虎视眈眈。”]
    choices:
      - id: include_rival
        text: 把对立理论写进理论章：'若数据支持X则A胜，支持Y则B胜'
        visibleResponse: 你把对决写明了。讨论章因此有了张力：数据站在A一边但只是温和地站。评委最吃这一套——你不是在护短，是在设擂台。
        hiddenEffects:
          - { kind: add, key: evidenceDiscipline, value: 7 }
          - { kind: add, key: credibility, value: 5 }
          - { kind: setFlag, key: rival_included }
      - id: omit_rival
        text: 不提对立理论，显得立场不坚定
        visibleResponse: 评委知道那个理论——所有人都知道。他们问'为什么只字不提'，你的沉默替你回答了。
        hiddenEffects:
          - { kind: subtract, key: credibility, value: 8 }
          - { kind: add, key: academicDebt, value: 5 }
    learningPoint: 回避对立理论等于举手承认心虚

  # ---- 方法与数据阶段 ----
  - id: r_e09_d19_consent_logistics
    campaign: research
    day: 19
    type: decision
    trigger: { kind: day, day: 19, phase: end }
    purpose: { learning: 数据收集的现场物流：入口/提示/时长预估 }
    scene: { location: classroom, characters: [] }
    setup: [“课上五分钟收数现场。投影出二维码后，前两排同学开始填，后排有人问'要填多久'——你没准备答案，场面开始乱。”]
    choices:
      - id: logistics_checklist
        text: 事后复盘，建立收数物流单：话术/时长/常见问答
        visibleResponse: 你补了物流单：开场一句话、预计两分钟、卡的同学找前排代填、老师Q&A两条。第二次现场，五分钟安静收完 52 份。
        hiddenEffects:
          - { kind: add, key: execution, value: 5 }
          - { kind: setFlag, key: logistics_ready }
      - id: improvise_again
        text: 每次现场随机应变
        visibleResponse: 你随机应变了两场，每场都丢一部分后排样本。应变的花费是真实的数据。
        hiddenEffects:
          - { kind: add, key: academicDebt, value: 3 }
    learningPoint: 现场发挥是最贵的数据收集方式

  - id: r_e09_d20_scale_length_tradeoff
    campaign: research
    day: 20
    type: decision
    keyDecision: true
    trigger: { kind: manual }
    purpose: { learning: 量表长度与填写质量的权衡 }
    scene: { location: workbench, characters: [r_ai_agent] }
    setup: [“你的问卷目前 58 题，预计填答 14 分钟。Agent 提醒：'每增加一分钟，弃填率约上升3%。'”]
    dialogue:
      - { speaker: Agent, text: "建议保留全部题项以最大化信息。", mood: pleased }
      - { speaker: 你, text: "信息最大化，完成率最小化。你的建议互相打架。" }
    choices:
      - id: cut_to_35
        text: 砍到 35 题核心量表，填答压到 8 分钟
        visibleResponse: 你删掉重复维度和装饰题。8 分钟版本弃填率明显下降，数据质量跟着上升——少即是多是句俗话，也是句统计事实。
        hiddenEffects:
          - { kind: add, key: execution, value: 5 }
          - { kind: add, key: evidenceDiscipline, value: 4 }
          - { kind: setFlag, key: scale_trimmed }
      - id: keep_58
        text: 58 题都要，信息完备要紧
        visibleResponse: 完备是完备了。后半段 23 题的作答时间断崖式下跌——你知道那不是效率，是敷衍。
        hiddenEffects:
          - { kind: add, key: academicDebt, value: 6 }
          - { kind: setFlag, key: fatigue_contamination }
    learningPoint: 问卷的长度就是填答者的耐心刻度

  - id: r_e09_d22_double_entry
    campaign: research
    day: 22
    type: decision
    trigger: { kind: day, day: 22, phase: end }
    purpose: { learning: 关键数据双人独立核对 }
    scene: { location: lab, characters: [r_peer] }
    setup: [“清洗完的数据要定稿。苏晓提议：'我抽你两成数据跟原始问卷核一遍，你抽我的。'”]
    choices:
      - id: cross_check
        text: 互相抽核 20%，签核后锁定
        visibleResponse: 你核她的，她核你的。各抓出两处录入手误——不大，但要是留到分析后才被抓，所有数字都得重跑。四道手误，四十分钟，值。
        hiddenEffects:
          - { kind: add, key: evidenceDiscipline, value: 6 }
          - { kind: relationship, characterId: r_peer, delta: 5 }
          - { kind: setFlag, key: cross_checked }
        delayed:
          - { eventId: r_e09_px_crosscheck_dividend, onDay: 26 }
      - id: solo_final
        text: 自己核过一遍了，定稿
        visibleResponse: 自己核自己的检出率约等于零——你会用同样的方式看错两遍。那两处手误跟着数据进了所有分析。
        hiddenEffects:
          - { kind: add, key: academicDebt, value: 5 }
    learningPoint: 自己查自己是查不出错觉的

  # ---- 分析阶段 ----
  - id: r_e09_d23_coffee_break_stats
    campaign: research
    day: 23
    type: npc
    trigger: { kind: random, weight: 2 }
    scene: { location: canteen, characters: [r_senior_data] }
    setup: [“周师兄看到你在笔记本上手抄回归输出，像抄经。”]
    dialogue:
      - { speaker: 周师兄, text: "抄它干嘛？" }
      - { speaker: 你, text: "抄一遍记得住哪些数字重要。" }
      - { speaker: 周师兄, text: "记住数字没用，记住结构有用：每个模型就五件事——样本、变量、系数、区间、诊断。抄一百张表不如背一遍这个结构。", mood: serious }
    automaticEffects:
      - { kind: add, key: evidenceDiscipline, value: 4 }
      - { kind: relationship, characterId: r_senior_data, delta: 3 }
    terminal: true

  - id: r_e09_d25_interpret_courage
    campaign: research
    day: 25
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 25, phase: start }
    purpose: { learning: 解释是研究者的工作：AI可以列事实，判断必须你签 }
    scene: { location: workbench, characters: [r_ai_agent] }
    setup: [“讨论章的解读段落，Agent 给了四个候选解释，每个都写得有模有样。”]
    dialogue:
      - { speaker: Agent, text: "解释一：替代效应。解释二：技能侵蚀。解释三：测量偏差。解释四：样本特性。请选择。", mood: neutral }
      - { speaker: 你, text: "你说'请选择'——可这是我的研究。选择权在你手里的话，署名该给谁？" }
    choices:
      - id: judge_with_data
        text: 回数据裁断：哪个解释能被你的分组结果支持就写哪个，其余如实排除
        visibleResponse: 你的分组结果支持'替代效应'、排除'测量偏差'，'技能侵蚀'证据不足——讨论章写了两个半解释，每个都有出处和排除理由。这是你的判断，签字画押。
        hiddenEffects:
          - { kind: add, key: independence, value: 7 }
          - { kind: add, key: evidenceDiscipline, value: 6 }
          - { kind: add, key: progress, value: 4 }
          - { kind: setFlag, key: interpretation_owned }
      - id: pick_flattering
        text: 挑写得最漂亮的那个解释
        visibleResponse: 最漂亮的解释是'技能侵蚀'——也是你的数据最不支持的那个。漂亮的错误比朴素的正确传播得快，尤其在答辩现场。
        hiddenEffects:
          - { kind: add, key: academicDebt, value: 7 }
          - { kind: add, key: aiDependence, value: 4 }
    learningPoint: 解释权是署名的责任状

  - id: r_e09_d26_null_discussion
    campaign: research
    day: 26
    type: decision
    trigger: { kind: day, day: 26, phase: end }
    purpose: { learning: 不显著的讨论写法：三种解释+设计反思 }
    scene: { location: dorm, characters: [] }
    setup: [“你的次要假设H2不显著。讨论章要给它写一段体面的告别。”]
    choices:
      - id: three_explanations
        text: 写三条：真无效/统计功效不足/测量失灵——各配证据
        visibleResponse: 你逐条排查：功效够、测量信度在、那就剩'真无效或效应更小'。这段诚实的排查被师姐评为全文最专业的一页。
        hiddenEffects:
          - { kind: add, key: evidenceDiscipline, value: 7 }
          - { kind: add, key: credibility, value: 5 }
          - { kind: setFlag, key: null_discussed }
      - id: bury_h2
        text: H2一笔带过，别引人注意
        visibleResponse: 评委会注意的。'H2呢？'——三个字就能让你在台上重新挖出整段你想埋掉的内容。
        hiddenEffects:
          - { kind: add, key: academicDebt, value: 5 }
    learningPoint: 不显著的结果需要更认真的讨论

  # ---- 写作阶段 ----
  - id: r_e09_d24_abstract_last
    campaign: research
    day: 24
    type: decision
    trigger: { kind: manual }
    purpose: { learning: 摘要五句模板：背景/目的/方法/结果/结论 }
    scene: { location: workbench, characters: [] }
    setup: [“你脑子发热想先写摘要。那可是全文最难的五个句子。”]
    choices:
      - id: five_sentence_template
        text: 用五句模板压出摘要，压完再检查每句有没有数字
        visibleResponse: 五句话，一百八十字，其中三句带具体数字。摘要交师姐看，她回了句：'有数字的摘要才有骨头。'
        hiddenEffects:
          - { kind: add, key: execution, value: 4 }
          - { kind: addAsset, assetType: document, name: 摘要 v1, description: 五句结构含数据, content: "背景/目的/方法(n=140,β=0.19)/结果/结论与局限" }
      - id: vague_abstract
        text: 摘要写得气势磅礴，不带数字
        visibleResponse: 磅礴的摘要被陈教授批了四个字：'空话连篇'。你重写时才明白：摘要是全文的压缩饼干，不是彩页宣传单。
        hiddenEffects:
          - { kind: add, key: academicDebt, value: 3 }
    learningPoint: 摘要的骨头是数字

  - id: r_e09_d27_read_aloud_edit
    campaign: research
    day: 27
    type: decision
    trigger: { kind: day, day: 27, phase: end }
    purpose: { learning: 朗读校对：耳朵能抓住眼睛滑过去的坑 }
    scene: { location: dorm, characters: [] }
    setup: [“你把报告读出声给自己听。读到第 4 页，舌头打了结——那句 47 字的长句，眼睛看着没事，嘴巴拒绝合作。”]
    choices:
      - id: read_aloud_pass
        text: 全文朗读一遍，卡壳处全部动刀
        visibleResponse: 你抓出 9 处卡壳：4 处超长句、3 处绕口搭配、2 处漏字。朗读是最便宜的校对员——零工资，零情面。
        hiddenEffects:
          - { kind: add, key: execution, value: 4 }
          - { kind: add, key: progress, value: 2 }
          - { kind: setFlag, key: read_aloud_done }
      - id: silent_proofread
        text: 默读校对就够了
        visibleResponse: 默读时大脑自动补全漏字、自动滑过长句。你以为的通顺，是大脑替原文档写的自传。
        hiddenEffects:
          - { kind: add, key: academicDebt, value: 3 }
    learningPoint: 嘴巴是第二双校对的眼

  - id: r_e09_d28_backup_final
    campaign: research
    day: 28
    type: decision
    trigger: { kind: day, day: 28, phase: start }
    purpose: { learning: 终稿的多重备份与版本封存 }
    scene: { location: workbench, characters: [] }
    setup: [“终版即将定稿。你现在拥有的版本：本地终.docx、桌面终2.docx、邮箱里发师姐的那版、U盘里不知哪版。”]
    choices:
      - id: version_freeze
        text: 定 FINAL：哈希+日期+三处异地备份，其余全归档
        visibleResponse: 你给终版文件重命名加日期、上传云盘、拷U盘、发邮箱，共四处。合上电脑那一刻，'丢稿恐惧'这个三十年的老朋友第一次没来。
        hiddenEffects:
          - { kind: add, key: execution, value: 5 }
          - { kind: setFlag, key: final_backed_up }
        delayed:
          - { eventId: r_e09_px_backup_calm, onDay: 30 }
      - id: copy_paste_chaos
        text: 反正哪都有备份，不用管
        visibleResponse: 到处都有备份的意思是不知道哪份对。答辩当天早上你打印了旧版——幸好你在门口翻页时发现了目录对不上。
        hiddenEffects:
          - { kind: add, key: technicalDebt, value: 4 }
    learningPoint: 备份的意义是确定性，不是数量

  # ---- Agent 使用补充 ----
  - id: r_e09_d05_verify_sla
    campaign: research
    day: 5
    type: decision
    trigger: { kind: manual }
