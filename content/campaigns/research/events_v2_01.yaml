    choices:
      - id: confess_redo
        text: 承认没做，求他带我用半天补一个
        visibleResponse: 他叹了口气，拉了把椅子坐到你旁边："半小时建模，今晚收数，明早分析。这次我盯着你做完。"
        hiddenEffects:
