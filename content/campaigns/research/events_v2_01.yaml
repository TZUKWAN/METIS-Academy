    keyDecision: true
    trigger: { kind: delayed }
    purpose: { narrative: SEM陷阱结算, learning: 方法错配的沉没成本最会骗人 }
    scene: { location: lab, characters: [r_senior_data] }
    setup: [“SEM第九天。模型拟合度还是不达标，你已经三天没动研究问题了。”]
    dialogue:
      - { speaker: 系统, text: "提醒：你的研究问题里没有潜变量。" }
    choices:
      - id: escape_fit
        text: 承认错配，换回原设计
        visibleResponse: 你删掉了SEM工程。一小时后，原设计的分析跑完了——原来它一直这么简单。
        hiddenEffects:
          - { kind: setFlag, key: rv2_method_fit_paid }
          - { kind: add, key: evidenceDiscipline, value: 4 }
      - id: sunk_cost
        text: 都学九天了，再调调参数
        visibleResponse: 你继续调模型。拟合度在0.91附近反复横跳，你的问题在九天前就迷失了。
        hiddenEffects:
          - { kind: setFlag, key: rv2_sem_trapped }
          - { kind: add, key: academicDebt, value: 8 }
    learningPoint: 沉没成本不是继续的理由，问题是唯一的锚

