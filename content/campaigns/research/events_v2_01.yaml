      - { speaker: 陈教授, text: "（拿起来又看了一遍，没说话，但把那一页折了个角。）" }
    choices:
      - id: template_share
        text: 把老格式整理成模板分享给全组
        visibleResponse: 你注明了格式出处（1998年讲义）。陈教授折角的那一页，后来出现在他研究生的培养计划附件里。
        hiddenEffects:
          - { kind: setFlag, key: rv2_basement_paid }
          - { kind: add, key: mentorTrust, value: 5 }
      - id: keep_silent_edge
        text: 不说来源，当自己的独门手艺
        visibleResponse: 你没提那间地下室。手艺是你的了，来历没人知道。
        hiddenEffects:
          - { kind: add, key: independence, value: 2 }
    terminal: true

  - id: r_v2_d21_sem_trap
