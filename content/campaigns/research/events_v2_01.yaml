# 科研线 V2 扩展事件 · 第一批（D2-D14）—— 决策链起点 / 延迟后果 / 隐藏事件 / NG+周目
events:
  # ============ DAY 2 ============
  - id: r_v2_d02_brief
    campaign: research
    day: 2
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 2, phase: start }
    purpose: { narrative: 研究简报的第一次拖延测试, learning: 简报是研究的地基，拖一天利息一天 }
    scene: { location: dorm, characters: [] }
    setup: [“新建文档，标题打了四个字：研究简报。”]
    dialogue:
      - { speaker: 系统, text: "文档下面还什么都没有。光标在闪。" }
    choices:
      - id: ai_dump
        text: 让AI先写一版，我在上面改
        visibleResponse: AI 十分钟给了你三千字。你扫了两眼，觉得……好像还挺像回事？
        hiddenEffects:
          - { kind: add, key: aiDependence, value: 6 }
          - { kind: add, key: academicDebt, value: 4 }
        next: r_v2_d02_ai_brief
      - id: clarify_myself
        text: 自己列三个必须澄清的问题再动笔
        visibleResponse: 你写了四十分钟，只挤出了三个问题。但每一个都问到了点子上。
        hiddenEffects:
          - { kind: add, key: independence, value: 4 }
          - { kind: add, key: evidenceDiscipline, value: 3 }
          - { kind: add, key: progress, value: 2 }
          - { kind: setFlag, key: rv2_vanilla }
        next: r_v2_d02_clarify_win
      - id: stall
        text: 先存着，明天状态好了再弄
        visibleResponse: 文档存进了文件夹。文件夹合上的那一声轻响，你当时没在意。
        hiddenEffects:
          - { kind: setFlag, key: rv2_brief_stalled }
          - { kind: add, key: academicDebt, value: 3 }
        delayed:
          - { eventId: r_v2_d09_brief_nudge, onDay: 9 }
    learningPoint: 研究简报拖不得——它是后面所有决定的参照物

  - id: r_v2_d02_ai_brief
    campaign: research
    day: 2
    type: story
    trigger: { kind: manual }
    scene: { location: dorm, characters: [r_ai_agent] }
    setup: [“你盯着那三千字，越看越觉得哪里不对。”]
    dialogue:
      - { speaker: Agent, text: "本简报已覆盖研究背景、意义、方法与预期成果，可直接使用。", mood: pleased }
      - { speaker: 你, text: "……‘直接影响’到底是正向还是负向？全文一次都没提。" }
      - { speaker: Agent, text: "该问题不影响简报完整性。" }
    terminal: true

  - id: r_v2_d02_clarify_win
    campaign: research
    day: 2
    type: story
    trigger: { kind: manual }
    scene: { location: dorm, characters: [] }
    setup: [“三个问题写在便签上，贴在了屏幕边框。”]
    dialogue:
      - { speaker: 系统, text: "对谁的影响？比较什么？‘影响’指好事还是坏事？——三个问题，值三天。", }
    terminal: true

  # ============ DAY 3 ============
  - id: r_v2_d03_prompt
    campaign: research
    day: 3
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 3, phase: start }
    purpose: { narrative: Agent用法的第一次定型, learning: 提示词是研究资产，用法决定产出质量 }
    scene: { location: workbench, characters: [r_ai_agent] }
    setup: [“Agent 工作台搭好了。第一件正事：怎么使唤它。”]
    dialogue:
      - { speaker: Agent, text: "请下达指令。我会以最优方式完成。", mood: pleased }
    choices:
      - id: iterate_prompts
        text: 每次都改提示词，改完存版本
        visibleResponse: 你建了个 prompt 文件夹。第一版只有一行，但它是你的第一版。
        hiddenEffects:
          - { kind: setFlag, key: rv2_prompt_evolved }
          - { kind: add, key: evidenceDiscipline, value: 3 }
        delayed:
          - { eventId: r_v2_d13_prompt_payoff, onDay: 13 }
      - id: babysit
        text: 每一步都盯着它，错了立刻纠正
        visibleResponse: 你成了人肉监视器。它效率还行，你眼睛很酸。
        hiddenEffects:
          - { kind: setFlag, key: rv2_agent_babysat }
          - { kind: subtract, key: energy, value: 5 }
        delayed:
          - { eventId: r_v2_d13_prompt_payoff, onDay: 13 }
      - id: default_run
        text: 默认设置跑就行，它一直挺聪明
        visibleResponse: 你把所有输入都原样扔了进去。省心。暂时。
        hiddenEffects:
          - { kind: add, key: aiDependence, value: 6 }
    learningPoint: 提示词是可迭代的研究资产，不是一次性指令

  - id: r_v2_h03_dump
    campaign: research
    day: 3
    type: story
    hidden: true
    trigger: { kind: manual }
    purpose: { narrative: 旧书摊的十块钱, learning: 旧书是便宜的时间机器 }
    scene: { location: dorm, characters: [] }
    setup: [“楼下夜市。旧书摊的灯泡在风里晃。”]
    dialogue:
      - { speaker: 旁白, text: "摊主：'这些书论斤卖。这本研究方法，十块。'" }
    choices:
      - id: buy_oldbook
        text: 十块钱，买了
        visibleResponse: 回宿舍翻到第37页，一页讲透了你在网上搜三天没搜明白的抽样。你愣了很久。
        hiddenEffects:
          - { kind: setFlag, key: rv2_oldbook_found }
          - { kind: add, key: literatureCount, value: 2 }
          - { kind: add, key: evidenceDiscipline, value: 2 }
          - { kind: subtract, key: money, value: 10 }
      - id: buy_pancake
        text: 只买了个煎饼
        visibleResponse: 煎饼很香。方法书明天再说。
        hiddenEffects:
          - { kind: add, key: energy, value: 5 }
    terminal: true

  # ============ DAY 4 ============
  - id: r_v2_d04_pilot
    campaign: research
    day: 4
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 4, phase: start }
    purpose: { narrative: 预实验的两难, learning: 预实验是给正式数据上的保险 }
    scene: { location: dorm, characters: [] }
    setup: [“正式问卷还没影。周师兄说：先跑个预实验试试水温？”]
    dialogue:
      - { speaker: 系统, text: "预实验要两天。这两天可以多读六篇文献。" }
    choices:
      - id: skip_pilot
        text: 跳过预实验，直接铺文献
        visibleResponse: 你把两天投给了文献。文献很乖，从不给你异常分布。
        hiddenEffects:
          - { kind: setFlag, key: rv2_skipped_pilot }
          - { kind: add, key: literatureCount, value: 4 }
        delayed:
          - { eventId: r_v2_d12_anomaly, onDay: 12 }
      - id: do_pilot
        text: 花两天跑个小预实验
        visibleResponse: 两天后你拿到了23份预问卷。有三道题的措辞明显有问题——你改掉了。
        hiddenEffects:
          - { kind: setFlag, key: rv2_did_pilot }
          - { kind: add, key: evidenceDiscipline, value: 6 }
          - { kind: subtract, key: energy, value: 8 }
        next: r_v2_d04_pilot_done
      - id: ask_senior
        text: 先问周师兄预实验到底要多久
        visibleResponse: 周师兄：'两小时建模，两天收数，一小时分析。你怕的不是两天，是麻烦。'
        hiddenEffects:
          - { kind: relationship, characterId: r_senior_data, delta: 4 }
        next: r_v2_d04_ask_zhou
    learningPoint: 预实验花的两天，会在第12天连本带利还给你

  - id: r_v2_d04_pilot_done
    campaign: research
    day: 4
    type: story
    trigger: { kind: manual }
    scene: { location: dorm, characters: [] }
    setup: [“预问卷的数据躺在表格里，安安静静。”]
    dialogue:
      - { speaker: 系统, text: "第7题和第12题被三个人在同一个地方误解。正式问卷里，它们不会再咬你了。" }
    terminal: true

  - id: r_v2_d04_ask_zhou
    campaign: research
    day: 4
    type: npc
    trigger: { kind: manual }
    scene: { location: lab, characters: [r_senior_data] }
    setup: [“实验室里周师兄正在跑他自己的模型。”]
    dialogue:
      - { speaker: 周师兄, text: "预实验不是走过场。它是你唯一一次能在正式数据前犯错的机会。", mood: serious }
      - { speaker: 周师兄, text: "我这有份跑废的数据，你要看就拿去——废数据也是数据。" }
    choices:
      - id: take_waste
        text: 接过那份废数据
        visibleResponse: 你翻开了那份跑废的数据。散点图上有一个明显的离群点，注释写着：'这就是没做预实验的下场'。
        hiddenEffects:
          - { kind: relationship, characterId: r_senior_data, delta: 3 }
          - { kind: add, key: evidenceDiscipline, value: 2 }
    terminal: true

  - id: r_v2_h04_morning
    campaign: research
    day: 4
    type: story
    hidden: true
    trigger: { kind: manual }
    purpose: { narrative: 清晨的空教室, learning: 把目标写出来的仪式感是真的有用 }
    scene: { location: classroom, characters: [] }
    setup: [“你居然起早了。空教室只有你和灰尘。”]
    dialogue:
      - { speaker: 旁白, text: "黑板右下角还留着上一节课没擦净的公式。" }
    choices:
      - id: write_countdown
        text: 在黑板角落写下“30天倒计时：还剩26”
        visibleResponse: 粉笔灰落在袖口上。写下来的那一刻，三十天忽然变得很具体。
        hiddenEffects:
          - { kind: setFlag, key: rv2_blackboard_countdown }
          - { kind: add, key: execution, value: 4 }
      - id: photo_leave
        text: 拍张照就走
        visibleResponse: 照片存在相册里，再也没打开过。
        hiddenEffects:
          - { kind: add, key: progress, value: 1 }
    terminal: true

  - id: r_v2_d04_plan
    campaign: research
    day: 4
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 4, phase: end }
    purpose: { narrative: 三十天怎么排, learning: 计划的价值在对照，不在完美 }
    scene: { location: dorm, characters: [] }
    setup: [“空白甘特图。三十个格子，五个任务块。”]
    dialogue:
      - { speaker: 系统, text: "文献两周、数据两周、写作两周——加起来六周。你只有三十天。" }
    choices:
      - id: plan_shelve
        text: 排完就存起来，走一步看一步
        visibleResponse: 计划表做得很漂亮。你心满意足地合上了它。
        hiddenEffects:
          - { kind: setFlag, key: rv2_plan_rot }
          - { kind: add, key: execution, value: 2 }
        delayed:
          - { eventId: r_v2_d19_plan_rot, onDay: 19 }
      - id: plan_buffer
        text: 只排七成，留三成缓冲，每周日晚对照
        visibleResponse: 你把每块任务砍到七成满。剩下三十percent的白，看着让人安心。
        hiddenEffects:
          - { kind: setFlag, key: rv2_buffer_kept }
          - { kind: add, key: execution, value: 5 }
        delayed:
          - { eventId: r_v2_d19_plan_rot, onDay: 19 }
      - id: plan_copy
        text: 直接抄苏晓的模板，一字不改
        visibleResponse: 苏晓的模板第三行写着'此处按自己情况改'。你没改。
        hiddenEffects:
          - { kind: relationship, characterId: r_peer, delta: 2 }
          - { kind: setFlag, key: rv2_plan_copy }
    learningPoint: 计划不是许愿池——留缓冲、定期对照才算数

  # ============ DAY 5 ============
  - id: r_v2_d05_habit
    campaign: research
    day: 5
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 5, phase: start }
    purpose: { narrative: 证据习惯的建立, learning: 证据要留存自己的副本 }
    scene: { location: workbench, characters: [r_ai_agent] }
    setup: [“文献矩阵第一版成型。Agent 问你：引用来源怎么存档？”]
    dialogue:
      - { speaker: Agent, text: "建议：仅存链接即可，节省空间。" }
    choices:
      - id: screenshot_all
        text: 每条引用截图+存PDF，双备份
        visibleResponse: 半小时后你多了四十张截图。手酸，但心里踏实。
        hiddenEffects:
          - { kind: setFlag, key: rv2_screenshot_habit }
          - { kind: add, key: evidenceDiscipline, value: 5 }
        delayed:
          - { eventId: r_v2_d16_screenshot_save, onDay: 16 }
      - id: link_only
        text: 就存链接吧，简洁
        visibleResponse: 矩阵清爽得像新的。链接死活，无人知晓。
        hiddenEffects:
          - { kind: add, key: technicalDebt, value: 4 }
      - id: agent_archives
        text: 让Agent帮我管档案
        visibleResponse: Agent 建了一个它自己的归档系统。你看不懂，但觉得很厉害。
        hiddenEffects:
          - { kind: add, key: aiDependence, value: 4 }
    learningPoint: 链接会失效，截图和PDF不会——证据要有自己的副本

  - id: r_v2_d05_report
    campaign: research
    day: 5
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 5, phase: end }
    purpose: { narrative: 第一次汇报的口径, learning: 坏消息要带着核实过程一起报 }
    scene: { location: corridor, characters: [r_mentor] }
    setup: [“走廊里撞见陈教授。他停下了脚步。”]
    dialogue:
      - { speaker: 陈教授, text: "这几天有进展吗。" }
      - { speaker: 你, text: "……" }
    choices:
      - id: good_news_only
        text: 只报进展顺利的部分
        visibleResponse: 你挑了三件最体面的事说了。陈教授点了点头，走了。你松了口气。
        hiddenEffects:
          - { kind: setFlag, key: rv2_only_good_news }
          - { kind: add, key: mentorTrust, value: 2 }
        delayed:
          - { eventId: r_v2_d18_group_meeting, onDay: 18 }
      - id: bad_news_first
        text: 报进展，也报卡住的地方，附上我核实过的原因
        visibleResponse: 你讲了十分钟，包括一个你自己查出来的错误。陈教授听完只说了一句：“继续。”
        hiddenEffects:
          - { kind: setFlag, key: rv2_bad_news_habit }
          - { kind: add, key: mentorTrust, value: 5 }
          - { kind: relationship, characterId: r_mentor, delta: 4 }
        delayed:
          - { eventId: r_v2_d18_group_meeting, onDay: 18 }
      - id: delay_report
        text: 含糊两句，等有完整结果再说
        visibleResponse: “进展还行”四个字打发了这次偶遇。陈教授的眼神在你脸上停了一秒。
        hiddenEffects:
          - { kind: add, key: academicDebt, value: 3 }
          - { kind: relationship, characterId: r_mentor, delta: -2 }
    learningPoint: 主动汇报坏消息并附核实过程，是导师信任的首付

  # ============ DAY 6 ============
  - id: r_v2_d06_footnote
    campaign: research
    day: 6
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 6, phase: start }
    purpose: { narrative: 综述里的怪脚注, learning: 异常细节是线索，不是噪音 }
    scene: { location: library, characters: [] }
    setup: [“综述写到一半。第14页的脚注有点怪：一条引用指向一篇没有期刊名的文献。”]
    dialogue:
      - { speaker: 系统, text: "那条脚注的格式和其他都不一样。像是从别的文档里带来的。" }
    choices:
      - id: open_footnote
        text: 点开那条奇怪的脚注
        visibleResponse: 文档深层的一个附录弹了出来。你直觉告诉你：这里面有东西。
        hiddenEffects:
          - { kind: add, key: evidenceDiscipline, value: 2 }
        requirements: { kind: state, key: literatureCount, op: gte, value: 5 }
        requirementHint: 文献阅读量达到5篇后，你才会对引用格式这么敏感
        next: r_v2_h06_ghost_find
      - id: ignore_footnote
        text: 无视它，继续补综述
        visibleResponse: 脚注静静躺在第14页。你往后翻了一页。
        hiddenEffects:
          - { kind: add, key: academicDebt, value: 2 }
      - id: agent_handle
        text: 让Agent处理这个脚注
        visibleResponse: Agent 说"已修复"。你没问它修成了什么样。
        hiddenEffects:
          - { kind: add, key: aiDependence, value: 3 }
    learningPoint: 格式异常的引用值得多看一眼——它可能是编造的痕迹

  - id: r_v2_h06_ghost_find
    campaign: research
    day: 6
    type: decision
    keyDecision: true
    hidden: true
    trigger: { kind: manual }
    purpose: { narrative: 附录幽灵初次现身, learning: 来源不明的引用是定时炸弹 }
    scene: { location: library, characters: [] }
    setup: [“附录B。一条引用的格式是'私人通信，2024'。”]
    dialogue:
      - { speaker: 系统, text: "谁和谁的私人通信？你顺藤摸瓜查了十分钟，查无此人。这条'通信'的口吻……很像AI。" }
    choices:
      - id: log_it
        text: 把它记进“待查”清单，设好提醒
        visibleResponse: 清单第一行：'附录B-私人通信-存疑'。你给这条定了闹钟。
        hiddenEffects:
          - { kind: setFlag, key: rv2_ghost_seen }
          - { kind: add, key: evidenceDiscipline, value: 3 }
        delayed:
          - { eventId: r_v2_d15_ghost, onDay: 15 }
      - id: close_it
        text: 关掉页面，当作没看见
        visibleResponse: 页面关了。附录B沉回文档深处，像什么都没发生过。
        hiddenEffects:
          - { kind: setFlag, key: rv2_ghost_ignored }
          - { kind: add, key: academicDebt, value: 4 }
    learningPoint: 来源不明的引用，要么查透，要么删除——不能放着

  # ============ DAY 7 ============
  - id: r_v2_d07_topic
    campaign: research
    day: 7
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 7, phase: start }
    purpose: { narrative: 选题聚焦, learning: 窄题才有深耕的空间 }
    scene: { location: dorm, characters: [] }
    setup: [“两个方向都写了两页。合并？取舍？”]
    dialogue:
      - { speaker: 系统, text: "方向A：对学习的影响。方向B：对工作方式的影响。两个都舍不得。" }
    choices:
      - id: keep_both
        text: 两个都写进开题，显出视野
        visibleResponse: 开题框架变成了两条腿。走起来应该……很稳吧？
        hiddenEffects:
          - { kind: setFlag, key: rv2_topic_fork_temp }
          - { kind: add, key: progress, value: 3 }
          - { kind: add, key: academicDebt, value: 4 }
        delayed:
          - { eventId: r_v2_d19_fork_crack, onDay: 19 }
      - id: narrow_own
        text: 收窄成一个窄题，并把它改写成“我的问题”
        visibleResponse: 你删掉了方向B，把方向A改成了只有你能问出口的那个问法。
        hiddenEffects:
          - { kind: setFlag, key: rv2_narrow_pick }
          - { kind: setFlag, key: rv2_own_question_pick }
          - { kind: add, key: independence, value: 5 }
        delayed:
          - { eventId: r_v2_d19_narrow_vindication, onDay: 19 }
          - { eventId: r_v2_d25_ownq_echo, onDay: 25 }
      - id: mentor_decide
        text: 发消息让导师帮我定
        visibleResponse: 陈教授回了四个字："你想要什么？"你盯着屏幕看了很久。
        hiddenEffects:
          - { kind: relationship, characterId: r_mentor, delta: 2 }
    learningPoint: 选题先问“我想答什么”，再问“什么答得动”

  - id: r_v2_h07_labnote
    campaign: research
    day: 7
    type: story
    hidden: true
    trigger: { kind: manual }
    purpose: { narrative: 师兄的实验记录本, learning: 记录格式本身就是方法论 }
    scene: { location: lab, characters: [r_senior_data] }
    setup: [“周师兄从抽屉里拿出一个牛皮纸封面的本子。”]
    dialogue:
      - { speaker: 周师兄, text: "我的记录本。每页四栏：做了什么、预期、实际、为什么差。看可以，别外传。", mood: pleased }
    choices:
      - id: borrow_format
        text: 借格式抄一套自己的
        visibleResponse: 当晚你就建了同款四栏表。填第一行时你发现：'为什么差'那一栏最难写，也最有用。
        hiddenEffects:
          - { kind: setFlag, key: rv2_labnote_borrowed }
          - { kind: add, key: evidenceDiscipline, value: 4 }
          - { kind: relationship, characterId: r_senior_data, delta: 3 }
      - id: glance_cover
        text: 看了看封面还回去
