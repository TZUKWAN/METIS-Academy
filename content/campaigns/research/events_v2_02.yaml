# METIS Academy Research V2 事件批次二 —— D14-D30 收官链、隐藏线深化、NG+ 补完
# 旗标前缀 rv2_，与 events_v2_01.yaml 及 endings_v2.yaml / endings_v2b.yaml 配套
events:
  # ============ D14 隐藏：深夜打印间 ============
  - id: r_v2_h14_printroom
    campaign: research
    day: 14
    type: decision
    keyDecision: true
    hidden: true
    trigger: { kind: manual }
    purpose: { narrative: 深夜打印间的匿名论文, learning: 预印本与同行评议的灰色地带 }
    scene: { location: lab, characters: [] }
    setup: [“深夜十一点，打印间的机器还在吐纸。出纸口躺着一叠刚打印的预印本论文，署名栏被涂改液盖住了一角。”]
    choices:
      - id: take_look
        text: 翻开看看这篇没人认领的论文
        requirements:
          kind: and
          conditions:
            - { kind: flag, key: rv2_ghost_seen }
        requirementHint: 你追查过幽灵引用，对可疑文本有职业敏感
        visibleResponse: 方法部分有一段和你导师五年前的idea惊人地像。扉页空白处有铅笔字：“投了三次都被拒，问题出在哪？”
        hiddenEffects:
          - { kind: setFlag, key: rv2_anon_paper }
          - { kind: add, key: evidenceDiscipline, value: 4 }
        unlockKnowledge: [kc_r_preprint_norms]
        next: r_v2_h14_anon_reply
      - id: leave_it
        text: 不碰别人的东西，回工位
        visibleResponse: 你把论文放回出纸口，关灯离开。走廊尽头，打印机的待机灯像一只没睡的眼睛。
        hiddenEffects:
          - { kind: add, key: independence, value: 2 }
    learningPoint: 预印本公开可查但未经同行评议，引用与借鉴都要标注清楚

  - id: r_v2_h14_anon_reply
    campaign: research
    day: 14
    type: story
    hidden: true
    trigger: { kind: manual }
    purpose: { narrative: 匿名求助的回应, learning: 学术互助可以完全匿名 }
    scene: { location: lab, characters: [] }
    dialogue:
      - { speaker: 旁白, text: "你在论文首页夹了张便签：'方法三的对照设置有偏，样本自选择。'——第二周，你发现便签下多了一行回信：'改了，录了。谢谢你。署名栏那块涂改液，是我自己盖的。'" }
      - { speaker: 系统, text: "没有人知道你们是谁。但你们互相知道：对方是认真的人。" }
    next: r_v2_d15_sprint

  # ============ D15 冲刺期决策链 ============
  - id: r_v2_d15_sprint
    campaign: research
    day: 15
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 15, phase: start }
    purpose: { narrative: 半程冲刺的资源分配, learning: 冲刺期先保骨架再填肉 }
    scene: { location: dorm, characters: [] }
    setup: [“日历翻过半程。距离开题答辩还有十五天，你的进度条停在 62%。”]
    dialogue:
      - { speaker: 系统, text: "十五天。理论上够用两次。理论上。" }
    choices:
      - id: backbone_first
        text: 先搭答辩骨架：三个问题三个证据
        visibleResponse: 你用一晚上画出了答辩的骨架图：研究问题、方法、初步发现，每个节点只留三句话的位置。
        hiddenEffects:
          - { kind: add, key: progress, value: 8 }
          - { kind: setFlag, key: rv2_backbone_first }
        next: r_v2_d15_skeleton_done
      - id: polish_first
        text: 先把文献综述打磨到完美
        visibleResponse: 你又补了十九篇文献。综述在发光，骨架还不存在。
        hiddenEffects:
          - { kind: add, key: academicDebt, value: 6 }
          - { kind: setFlag, key: rv2_polish_trap }
        delayed:
          - { eventId: r_v2_d24_perfection_crash, onDay: 24 }
      - id: outsource_design
        text: 让 Agent 生成答辩 PPT 框架
        visibleResponse: Agent 十分钟给出一套二十八页的模板，审美在线。你盯着第 14 页的“预期贡献”，发现它写的不是你的贡献。
        hiddenEffects:
          - { kind: add, key: aiDependence, value: 6 }
          - { kind: add, key: progress, value: 3 }
          - { kind: setFlag, key: rv2_ai_deck }
    learningPoint: 冲刺期资源分配：骨架 > 内容 > 表皮

  - id: r_v2_d15_skeleton_done
    campaign: research
    day: 15
    type: story
    trigger: { kind: manual }
    purpose: { narrative: 骨架先行的好处, learning: 结构先行降低返工 }
    scene: { location: dorm, characters: [] }
    dialogue:
      - { speaker: 你, text: "三个问题，三个证据，三条可能被挑战的软肋。……原来我的研究就这么点东西？" }
      - { speaker: 系统, text: "就这么点东西。但每一句都站得住。" }
    next: r_v2_d16_ethics_form

  # ============ D16 伦理审查 ============
  - id: r_v2_d16_ethics_form
    campaign: research
    day: 16
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 16, phase: start }
    purpose: { narrative: 伦理审查表上的灰色选项, learning: 知情同意不是走过场 }
    scene: { location: lab, characters: [r_mentor] }
    setup: [“伦理审查表第 7 栏：'研究对象是否知晓研究目的？'你的问卷开场白用的是'学术调查'，没提'生成式AI'。”]
    dialogue:
      - { speaker: 陈教授, text: "这栏很多人选'部分知晓'。你自己决定。但记住——审查表会存档十年。" }
    choices:
      - id: revise_script
        text: 改问卷开场白，如实告知研究主题
        visibleResponse: 你改了开场白，重发了问卷。回收速度慢了，但每个数据点都站在阳光下。
        hiddenEffects:
          - { kind: setFlag, key: rv2_ethics_honest }
          - { kind: add, key: evidenceDiscipline, value: 6 }
          - { kind: relationship, characterId: r_mentor, delta: 4 }
        delayed:
          - { eventId: r_v2_d26_honest_payoff, onDay: 26 }
      - id: keep_vague
        text: 保持模糊，先过审查再说
        visibleResponse: 你选了“部分知晓”。表格通过得很快，快得让你想回头再看一眼那句话。
        hiddenEffects:
          - { kind: setFlag, key: rv2_ethics_grey }
          - { kind: add, key: academicDebt, value: 5 }
        delayed:
          - { eventId: r_v2_d26_grey_echo, onDay: 26 }
      - id: ask_agent_ethics
        text: 让 Agent 分析三种填法的风险
        visibleResponse: Agent 给出了一份结构清晰的风险矩阵，最后补了一句：“以上不构成伦理咨询建议。”你笑了，笑完自己填了表。
        hiddenEffects:
          - { kind: add, key: aiDependence, value: 3 }
          - { kind: unlockKnowledge, knowledgeId: kc_r_ethics }
    learningPoint: 知情同意的核心是研究对象的真实理解，不是表格合规

  # ============ D17 隐藏：退稿信抽屉 ============
  - id: r_v2_h17_reject_drawer
    campaign: research
    day: 17
    type: decision
    keyDecision: true
    hidden: true
    trigger: { kind: manual }
    purpose: { narrative: 导师的退稿信收藏, learning: 失败记录是最诚实的教材 }
    scene: { location: lab, characters: [] }
    setup: [“帮导师找 2019 年的项目材料，你在文件柜最底层拉出一个抽屉。里面不是材料——是三十多封退稿信，按年份码得整整齐齐。”]
    choices:
      - id: read_three
        text: 读三封年份最早的
        requirements:
          kind: and
          conditions:
            - { kind: relationship, characterId: r_mentor, op: gte, value: 55 }
        requirementHint: 与导师的信任让你坦然面对这个抽屉
        visibleResponse: 2003 年的那封写着“本文贡献不够清晰”。你认出那是导师最有名的论文——如今被引四千次的那篇。
        hiddenEffects:
          - { kind: setFlag, key: rv2_reject_letters }
          - { kind: add, key: independence, value: 5 }
        next: r_v2_h17_after_reject
      - id: close_drawer
        text: 轻轻关上抽屉，假装没看见
        visibleResponse: 你把抽屉推回去。有些东西不属于被看见，也许。你猜。
        hiddenEffects:
          - { kind: add, key: academicDebt, value: 2 }
    learningPoint: 顶尖研究者与普通研究者的区别，常常只是被拒后的重启次数

  - id: r_v2_h17_after_reject
    campaign: research
    day: 17
    type: story
    hidden: true
    trigger: { kind: manual }
    purpose: { narrative: 抽屉的启示, learning: 拒稿是流程不是判决 }
    scene: { location: lab, characters: [] }
    dialogue:
      - { speaker: 旁白, text: "你把抽屉推回去之前，用手机拍了一张照片。三十封退稿信的照片，后来成了你手机相册里最私密的收藏。" }
      - { speaker: 系统, text: "被拒不是研究的反义词。停止才是。" }
    next: r_v2_d18_method_review

  # ============ D18 方法自查 ============
  - id: r_v2_d18_method_review
    campaign: research
    day: 18
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 18, phase: start }
    purpose: { narrative: 中期方法自查, learning: 方法缺陷要在答辩前暴露给自己 }
    scene: { location: lab, characters: [r_senior_data] }
    setup: [“周师兄提议搞一次'模拟答辩'：组内互殴，专挑软肋打。”]
    dialogue:
      - { speaker: r_senior_data, text: "现在被我打疼，好过答辩时被评委打疼。参加吗？" }
    choices:
      - id: full_mock
        text: 完整模拟，把他想象成最凶的评委
        visibleResponse: 四十分钟里周师兄问出了十一个问题，三个你答不出来。你把这三个问题钉在墙上——它们就是你接下来三天的全部日程。
        hiddenEffects:
          - { kind: setFlag, key: rv2_mock_survived }
          - { kind: add, key: evidenceDiscipline, value: 5 }
          - { kind: relationship, characterId: r_senior_data, delta: 5 }
        delayed:
          - { eventId: r_v2_d25_weakness_fixed, onDay: 25 }
      - id: partial_mock
        text: 只模拟自认为薄弱的一半
        visibleResponse: 你挑了“安全”的部分模拟。周师兄注意到了你的挑选，什么也没说。
        hiddenEffects:
          - { kind: setFlag, key: rv2_mock_partial }
          - { kind: add, key: academicDebt, value: 4 }
      - id: skip_mock
        text: 时间太紧，跳过模拟直接打磨
        visibleResponse: 你把三天堂成了三十页。没人告诉你它们站不站得住。
        hiddenEffects:
          - { kind: setFlag, key: rv2_mock_skipped }
          - { kind: add, key: academicDebt, value: 7 }
        delayed:
          - { eventId: r_v2_d25_defense_rehearsal_crash, onDay: 25 }
    learningPoint: 主动暴露弱点是最好的防御工事

  # ============ D19 隐藏：Agent 的训练数据偏好 ============
  - id: r_v2_h19_agent_bias
    campaign: research
    day: 19
    type: decision
    keyDecision: true
    hidden: true
    trigger: { kind: manual }
    purpose: { narrative: 发现 Agent 的文献偏好偏见, learning: AI 输出的分布偏见需要主动探测 }
    scene: { location: dorm, characters: [] }
    setup: [“让 Agent 推荐二十篇核心文献做最后查漏。你数了数：十四篇英文、十八篇顶会、十六篇近三年。你的领域里那些发在中文核心、被实际应用引用最多的'老古董'，一篇都没出现。”]
    choices:
      - id: probe_bias
        text: 追问 Agent：为什么没有中文文献和经典老文
        visibleResponse: Agent 承认推荐分布偏向“高引用英文近期文献”。你手动补了七篇——其中两篇后来在答辩里成了你最有力的论据。
        hiddenEffects:
          - { kind: setFlag, key: rv2_bias_probed }
          - { kind: add, key: evidenceDiscipline, value: 6 }
          - { kind: add, key: aiDependence, value: -4 }
        unlockKnowledge: [kc_r_bias]
      - id: trust_agent
        text: 顶会近三年文献够用了，继续下一步
        visibleResponse: 你合上文献清单。清单很漂亮，像一个只有一种树种的森林。
        hiddenEffects:
          - { kind: add, key: aiDependence, value: 5 }
          - { kind: setFlag, key: rv2_bias_trusted }
    learningPoint: AI 推荐存在分布偏见，主动探测偏见是使用者的责任

  # ============ D20 数据备份风暴 ============
  - id: r_v2_d20_backup
    campaign: research
    day: 20
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 20, phase: start }
    purpose: { narrative: 答辩前数据备份, learning: 冗余备份是研究者的保险 }
    scene: { location: lab, characters: [] }
    setup: [“硬盘发出了昨天没有的声音。像秒针，又比秒针慢半拍。”]
    choices:
      - id: triple_backup
        text: 立即三重备份：移动硬盘 + 网盘 + 组服务器
        visibleResponse: 备份跑了两小时。当晚，硬盘的声音停了——它退役了，比预计寿命早了两年。你看着三个备份，第一次理解“冗余”这个词的温度。
        hiddenEffects:
          - { kind: setFlag, key: rv2_backup_saved }
          - { kind: add, key: execution, value: 4 }
      - id: cloud_only
        text: 传个网盘就行，服务器申请流程太麻烦
        visibleResponse: 网盘同步完成度 87% 时你睡着了。凌晨 3 点，你惊醒，爬起来看到最后一格进度条终于走完。
        hiddenEffects:
          - { kind: setFlag, key: rv2_backup_lazy }
          - { kind: add, key: academicDebt, value: 3 }
        delayed:
          - { eventId: r_v2_d27_cloud_fright, onDay: 27 }
      - id: ignore_sound
        text: 硬盘而已，应该还能撑到答辩
        visibleResponse: “应该。”你在心里说了一遍这个词，把它和答辩时间放在一起，没有再想。
        hiddenEffects:
          - { kind: setFlag, key: rv2_backup_gamble }
          - { kind: add, key: academicDebt, value: 8 }
        delayed:
          - { eventId: r_v2_d27_disk_death, onDay: 27 }
    learningPoint: 数据备份遵循 3-2-1 原则：三份拷贝、两种介质、一份异地

  # ============ D21 隐藏：三楼包间 ============
  - id: r_v2_h21_room301
    campaign: research
    day: 21
    type: decision
    keyDecision: true
    hidden: true
    trigger: { kind: manual }
    purpose: { narrative: 竞争对手组的内部讲座, learning: 公开活动里的隐蔽信息 }
    scene: { location: canteen, characters: [r_peer] }
    setup: [“苏晓搞到两张三楼包间的入场券：一个外部专家的小型讲座，隔壁竞争组全员出席。主题恰好和你的研究问题相邻。”]
    choices:
      - id: attend_quiet
        text: 去坐在最后一排，只听不说
        requirements:
          kind: and
          conditions:
            - { kind: flag, key: rv2_canteen_intel }
        requirementHint: 食堂情报网的人才知道这场讲座的存在
        visibleResponse: 你听到了竞争组的问题清单——他们卡住的三个点，恰好是你已经解决的三个。你没记笔记。你在脑子里记的。
        hiddenEffects:
          - { kind: setFlag, key: rv2_rival_intel }
          - { kind: add, key: independence, value: 4 }
        unlockKnowledge: [kc_r_info]
      - id: skip_it
        text: 不去，专注自己的进度
        visibleResponse: 你把晚上留给了数据。那晚你多跑完了两组分析。包间里发生了什么，与你无关。大概。
        hiddenEffects:
          - { kind: add, key: progress, value: 4 }
    learningPoint: 公开活动中的对手信息合法且宝贵，关键分寸在于不抄袭只对标

  # ============ D22 NG+：导师的第二张面孔 ============
  - id: r_v2_ng22_mentor_past
    campaign: research
    day: 22
    type: decision
    keyDecision: true
    ngPlus: true
    trigger:
      kind: state
      condition:
        kind: and
        conditions:
          - { kind: ngPlus }
          - { kind: state, key: day, op: gte, value: 22 }
    purpose: { narrative: NG+ 中认出导师当年的困境, learning: 导师的严厉源于经历 }
    scene: { location: lab, characters: [r_mentor] }
    setup: [“上一世的第 24 天，你在导师抽屉里见过那份 2003 年的退稿信。这一世，当导师再次用'别让我失望'开场时，你听出了另一层东西：恐惧。他比你更怕你搞砸——因为你搞砸的样子，像极了他 2003 年。”]
    dialogue:
      - { speaker: 陈教授, text: "还有八天。计划给我看看。" }
    choices:
      - id: show_real_plan
        text: 交出真实计划，包括没做完的部分
        visibleResponse: 你圈出了三个红点。导师盯着看了很久，说：“知道哪里没做完的人，才做得完。”这是他第一次没有说“别让我失望”。
        hiddenEffects:
          - { kind: setFlag, key: rv2_ngplus_mentor_mirror }
          - { kind: relationship, characterId: r_mentor, delta: 8 }
      - id: show_polished
        text: 打磨过的版本，藏起红点
        visibleResponse: 计划完美得像样板间。导师点头放行。你错过了一次被真正看见的机会——你知道，因为你上辈子见过他的红点。
        hiddenEffects:
          - { kind: setFlag, key: rv2_ngplus_mentor_mask }
          - { kind: add, key: academicDebt, value: 4 }
    learningPoint: NG+ 洞察：理解授权者的恐惧，能解锁更深层的信任

  # ============ D23 引用终审 ============
  - id: r_v2_d23_citation_final
    campaign: research
    day: 23
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 23, phase: start }
    purpose: { narrative: 答辩前引用终审, learning: 最后一轮逐条溯源 }
    scene: { location: library, characters: [] }
    setup: [“开题报告定稿在即。文献列表 84 条。你决定做最后一轮逐条溯源。”]
    dialogue:
      - { speaker: 系统, text: "84 条。平均每条 4 分钟，需要 5.6 小时。你的夜晚属于谁？" }
    choices:
      - id: full_manual
        text: 全部手工核，通宵也认了
        visibleResponse: 凌晨四点，第 84 条核完。你揪出两条幽灵引用和一条页码错误。窗外天快亮了，你的文献列表第一次完全属于你。
        hiddenEffects:
          - { kind: setFlag, key: rv2_citation_full_check }
          - { kind: add, key: evidenceDiscipline, value: 8 }
          - { kind: add, key: energy, value: -10 }
      - id: agent_cross_check
        text: Agent 初筛 + 人工复核可疑项
        visibleResponse: Agent 标出 11 条“置信度低”的引用，你逐条查证，其中 2 条确实是编的。总耗时 2.5 小时。你学会了让机器做漏斗，让人做终审。
        hiddenEffects:
          - { kind: setFlag, key: rv2_citation_hybrid_check }
          - { kind: add, key: aiDependence, value: 3 }
          - { kind: add, key: evidenceDiscipline, value: 5 }
      - id: spot_check
        text: 抽查 20 条，概率上够用了
        visibleResponse: 你抽查了 20 条，全对。剩下的 64 条以 95% 的信心通过——但幽灵引用从来不是均匀分布的。
        hiddenEffects:
          - { kind: setFlag, key: rv2_citation_spot_check }
          - { kind: add, key: academicDebt, value: 5 }
        delayed:
          - { eventId: r_v2_d27_citation_timebomb, onDay: 27 }
    learningPoint: 引用核验可分层：机器初筛、人工终审，但不可省略

  # ============ D24 完美主义崩溃（延迟回收）============
  - id: r_v2_d24_perfection_crash
    campaign: research
    day: 24
    type: story
    trigger: { kind: delayed }
    purpose: { narrative: 完美主义的账单到期, learning: 完美是进度的敌人 }
    scene: { location: dorm, characters: [] }
    setup: [“两周前的决定今天回来讨债：综述在发光，骨架还不存在。距答辩六天。”]
    dialogue:
