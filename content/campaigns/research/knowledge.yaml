# 科研线知识卡（TASK-F005，kc_r_ 前缀）
knowledge:
  - id: kc_r_task_framing
    title: 模糊需求先拆解，再开工
    domain: task_contract
    trigger: first_failure
    problem: “看看有什么能研究的”这类一句话需求直接开干，产出必然跑偏
    wrongPattern: 把模糊需求原样扔给AI，指望它替你理解导师
    correctBehavior: 拆成已确认/待澄清/下一步三栏，先补齐第二栏
    why: AI会用最可能的假设填补空白，而最可能的往往不是你导师想要的
    steps:
      - 列出需求原文
      - 分三栏拆解
      - 拿澄清问题去问人
      - 更新后才开始检索
    toolMappings:
      claudeCode: 把三栏放进简报文件让Agent先读
      codex: 同左
      deepseekHarness: 契约附简报
    successSignals:
      - 三天内拿到关键澄清
    failureSignals:
      - 第二周还在换方向
    transferScenarios:
      - 接兼职需求
      - 社团任务
    depth30s: 模糊进=垃圾出。先拆，再干。
    depth3m: 已确认/待澄清/下一步。待澄清栏写满你的问题，拿去问人——问完才开工。
    depth10m: 模板化：任何新需求先复制三栏模板；24小时内消灭待澄清栏；此后所有Agent任务引用这份简报。
    relatedSkillIds:
      - task_contract.basics
      - tc.constraints
      - tc.report_format
      - tc.uncertainty
  - id: kc_r_candidate_fact
    title: AI选题：候选≠事实
    domain: verification
    trigger: event
    problem: AI给出的研究方向“看起来都很新”
    wrongPattern: 挑顺眼的直接立项
    correctBehavior: 逐条检索验证：有人做过吗/概念清楚吗/数据存在吗
    why: 模型生成的是“像研究方向的东西”，不是经过查证的空白
    steps:
      - 列出候选
      - 每条检索2-3个数据库
      - 记录证据
      - 再决定去留
    toolMappings:
      generic: 检索结果贴回给AI让它复核
    successSignals:
      - 立项后很少换方向
    failureSignals:
      - 频繁“发现早有人做过”
    transferScenarios:
      - 竞赛选题
      - 产品方向
    depth30s: AI给的选题，先查再爱。
    depth3m: 三问过滤：已有人做？概念含混？数据可得？三问全过才进候选池。
    depth10m: 建候选跟踪表：候选/三问结果/证据/去留原因。这表本身就是开题报告的素材。
    relatedSkillIds:
      - verification.source_check
  - id: kc_r_env_setup
    title: Agent环境的四件套
    domain: environment
    trigger: skill_unlock
    problem: 工具装了但每次用都在重新折腾
    wrongPattern: 想起来才配置，配置散落在聊天记录里
    correctBehavior: 一次性配好：工作目录/工具检测/模型/Key安全存储
    why: 环境是复利资产；每次重配都在烧时间
    steps:
      - 建项目目录
      - 检测CLI版本
      - 配模型
      - Key进安全存储
    toolMappings:
      claudeCode: claude --version
      codex: codex --version
      deepseekHarness: dsh --version
    successSignals:
      - 新会话开工零配置
    failureSignals:
      - 每周都在修环境
    transferScenarios:
      - 新课程项目
      - 团队协作
    depth30s: 目录/检测/模型/Key，一次配齐。
    depth3m: 项目一个目录，Agent只认启动目录；先测version再干活；Key永远不进聊天和代码。
    depth10m: 写成环境档案资产，含复现步骤；换电脑按档案10分钟恢复。
    relatedSkillIds:
      - environment.working_dir
      - environment.install_detect
      - environment.api_key
      - environment.permissions
  - id: kc_r_contract
    title: 任务契约五要素
    domain: task_contract
    trigger: event
    problem: “帮我研究一下这些”产出混乱
    wrongPattern: 用自然语言随手描述任务
    correctBehavior: 背景/目标/约束/交付/验收五段写清
    why: 缺哪段，Agent就在哪段自由发挥
    steps:
      - 写背景
      - 写目标
      - 列约束
      - 定交付物
      - 列验收清单
    toolMappings:
      claudeCode: 契约存为文件在任务里引用
      codex: 同左
      deepseekHarness: contract模板
    successSignals:
      - 一次任务到位率高
    failureSignals:
      - 反复“不是我要的”
    transferScenarios:
      - 外包沟通
      - 团队分工
    depth30s: 五要素：背景/目标/约束/交付/验收。
    depth3m: 验收是契约的灵魂：写成可勾选清单，Agent交活前自查。
    depth10m: 为高频任务建契约模板库；每次复用后微调，模板越来越准。
    relatedSkillIds:
      - task_contract.basics
      - tc.objective
  - id: kc_r_keyword
    title: 学术检索的关键词树
    domain: environment
    trigger: first_failure
    problem: 日常用词搜不出学术文献
    wrongPattern: 只用日常语言反复搜索
    correctBehavior: 核心/同义/上位/相邻四层扩展成树
    why: 学术数据库吃术语，不吃口语
    steps:
      - 定核心词
      - 扩同义词
      - 找上位词
      - 补相邻概念
      - 分层组合检索
    toolMappings:
      generic: 检索式存档可复现
    successSignals:
      - 检索结果量级上来且相关
    failureSignals:
      - 结果全是新闻和公众号
    transferScenarios:
      - 竞品调研
      - 行业报告
    depth30s: 换学术黑话，搜两遍。
    depth3m: 每个概念找同义词和上位词；中英各建一份；检索式存档保证可复现。
    depth10m: 关键词树+检索日志（库/式/日期/命中数），这就是检索策略资产。
    relatedSkillIds:
      - environment.network
  - id: kc_r_filtering
    title: 分层筛选代替全读
    domain: loop
    trigger: event
    problem: 一百多篇文献读不完
    wrongPattern: 全读，或只看引用量
    correctBehavior: 综述打底+代表作看脉络+近三年实证看进展
    why: 不同文献承担不同功能，混着读效率最低
    steps:
      - 综述2篇建框架
      - 代表作6篇看源头
      - 近三年实证20篇看进展
    toolMappings:
      generic: 分组标签管理
    successSignals:
      - 两周内建立领域地图
    failureSignals:
      - 读了一个月还没框架
    transferScenarios:
      - 进入新行业
      - 学习新技术
    depth30s: 综述打底、经典看根、新文看尖。
    depth3m: 先摘要定去留；高被引看经典，但本领域近年才爆发时近三年优先。
    depth10m: 精读池28篇上限；每篇按六维提取进矩阵；每周清一次待读池。
    relatedSkillIds:
      - loop.content_loop
  - id: kc_r_batch
    title: 批量阅读要拆维度
    domain: loop
    trigger: npc_advice
    problem: 让AI“读完50篇告诉我答案”产出张冠李戴
    wrongPattern: 一次性全量任务
    correctBehavior: 每篇按问题/方法/数据/发现/局限提取，分批交，抽查
    why: 大批量单轮任务的错误率随批量上升，必须分批+抽检
    steps:
      - 定提取模板
      - 分批7篇一批
      - 每批抽查2篇
      - 发现偷懒打回重做
    toolMappings:
      claudeCode: 每批一个任务，结果进矩阵文件
      codex: 同左
      deepseekHarness: 批处理脚本
    successSignals:
      - 矩阵每行可回溯原文
    failureSignals:
      - 抽查发现两篇结论串了
    transferScenarios:
      - 简历筛选
      - 评论分析
    depth30s: 批量任务=模板+分批+抽查。
    depth3m: 维度拆解让输出可比；抽查让偷懒现形；批间留检查点。
    depth10m: 建立“批量任务SOP”：模板/批次/抽检率/返工规则，形成可复用资产。
    relatedSkillIds:
      - loop.iteration_cap
      - loop.build_test_fix
  - id: kc_r_fake_citation
    title: AI会编造文献
    domain: verification
    trigger: first_failure
    problem: AI给出的参考文献查无实据
    wrongPattern: 直接复制进文献表
    correctBehavior: 每条引用回原始数据库核对，查不到=不存在
    why: 模型生成“像引用的文本”，不是数据库查询
    steps:
      - 复制标题与DOI
      - 数据库反查
      - 比对作者年份期刊
      - 查不到标记证伪
    toolMappings:
      claudeCode: 规则文件写死“只引用verified.md”
      codex: 同左
      deepseekHarness: 附已核实清单
    successSignals:
      - 文献表全部可检索
    failureSignals:
      - 评审指出引用不存在
    transferScenarios:
      - 报告引用
      - 新闻事实
    depth30s: 查不到=不存在。先查，再引。
    depth3m: 假引用特征：DOI解析失败/作者领域不符/期刊卷期错位。三处有一个就 deep check。
    depth10m: 建三清单（已核实/待核实/已证伪）；规则文件写死引用白名单；交付前抽查三成。
    relatedSkillIds:
      - verification.citation_check
  - id: kc_r_statefile
    title: 状态文件：Agent的“续集前情提要”
    domain: context
    trigger: skill_unlock
    problem: 会话长了Agent忘记研究范围与约束
    wrongPattern: 每次人肉重复交代
    correctBehavior: 维护 research_state.md：范围/已确认/未确认/关键文献
    why: 会话记忆不可靠，文件是唯一稳定的外部记忆
    steps:
      - 建状态文件
      - 每次开工先喂
      - 状态变化即更新
      - 每周复核
    toolMappings:
      claudeCode: 放在项目根目录自动可见
      codex: 同左
      deepseekHarness: 附在任务上下文
    successSignals:
      - 新会话第一次输出就在正轨
    failureSignals:
      - 重复纠正同一问题
    transferScenarios:
      - 长期项目
      - 换人接手
    depth30s: 状态进文件，别进记忆。
    depth3m: 四段式：范围/已确认/未确认/关键文献。未确认栏是防跑偏的护栏。
    depth10m: 状态文件+规则文件+handoff三件套是长项目标配；状态过期比没有更危险。
    relatedSkillIds:
      - context.state_file
  - id: kc_r_compact
    title: 五段式Compact
    domain: context
    trigger: event
    problem: 上下文将满，随便总结丢失硬约束
    wrongPattern: 总结一下我们聊过的
    correctBehavior: 已确认事实/待确认/当前范围/关键材料/下一步
    why: 压缩的目的是保留约束与事实，丢弃过程
    steps:
      - 列硬约束
      - 列已确认事实
      - 列未确认
      - 列关键材料
      - 写下一步
    toolMappings:
      claudeCode: /compact 或手动五段
      codex: 五段摘要
      deepseekHarness: compact
    successSignals:
      - 压缩后行为不退化
    failureSignals:
      - 压缩后重犯老错
    transferScenarios:
      - 长会话
      - 项目交接
    depth30s: 压缩保约束，扔过程。
    depth3m: 写完自查：新会话拿这段能答“研究什么/数据哪来/已证什么/下一步”吗？
    depth10m: compact产物存为checkpoint文件；这是回滚点，也是交接素材。
    relatedSkillIds:
      - context.compact
      - context.summaries
  - id: kc_r_gap_validation
    title: 研究空白要建验证表
    domain: verification
    trigger: event
    problem: AI宣称的“尚无研究”未必是真的
    wrongPattern: 相信AI宣布的gap直接立项
    correctBehavior: 五列验证表：gap/支持文献/反例/置信度/可行性
    why: “没人做”有三种：不值得/做不了/真空白，只有第三种值得
    steps:
      - 抄下gap原文
      - 检索支持与反例
      - 评置信度
      - 评可行性
    toolMappings:
      generic: 验证表存为资产
    successSignals:
      - 立项后不再发现“早有人做”
    failureSignals:
      - 开题后被评委指出相关研究
    transferScenarios:
      - 专利检索
      - 竞品分析
    depth30s: 空白先验证，再立项。
    depth3m: 反例优先：先找“已经有人做”的证据，找不到再信。
    depth10m: 验证表含检索式与日期，可复现；证伪的gap进“证伪档案”，是成果不是污点。
    relatedSkillIds:
      - verification.reverse_verification
  - id: kc_r_gap_refute
    title: 被推翻的空白是进度
    domain: verification
    trigger: event
    problem: 验证推翻了自己的候选gap，感觉白干了
    wrongPattern: 沮丧后偷偷换gap不记录原因
    correctBehavior: 把证伪过程完整记录进验证表
    why: 证伪档案证明你验证过，也防止将来重蹈
    steps:
      - 记录反例文献
      - 写明当时为何误判
      - 归档
      - 迁移到下一候选
    toolMappings:
      generic: 证伪档案进简报附录
    successSignals:
      - 同样的错不犯第二次
    failureSignals:
      - 反复栽在同一类“空白”上
    transferScenarios:
      - 实验失败复盘
      - 产品方向证伪
    depth30s: 证伪一条，剩下的更真。
    depth3m: 每次证伪问一句：当时为什么信？——那是你认知偏差的地图。
    depth10m: 组建“证伪博物馆”：每条含claim/反例/教训。一年后它比任何方法论书都好用。
    relatedSkillIds:
      - verification.reverse_verification
      - verification.release_gate
  - id: kc_r_rq_tradeoff
    title: 研究问题是权衡题
    domain: goal
    trigger: event
    problem: 想找一个“完美的”研究问题
    wrongPattern: 让AI直接给“最佳研究问题”
    correctBehavior: 在稳妥/激进/宽/窄/数据友好/理论强之间做有意识的取舍
    why: 没有完美RQ，只有符合你资源与目标的RQ
    steps:
      - 列出3-5个候选
      - 每个标注代价
      - 对照资源与时间选
      - 记录取舍理由
    toolMappings:
      generic: 取舍表进简报
    successSignals:
      - 能说清“为什么是这个问题”
    failureSignals:
      - 答不出“为什么不选那个”
    transferScenarios:
      - 选题决策
      - 职业选择
    depth30s: RQ没有最优，只有取舍。
    depth3m: 稳妥=好毕业创新弱；激进=出彩风险高；窄=好答辩天花板低。选你能承受的。
    depth10m: 用“资源×时间×风险偏好”三轴评估候选；把取舍理由写进简报，答辩被问时不慌。
    relatedSkillIds:
      - goal.final_state
  - id: kc_r_agents_md
    title: AGENTS.md/CLAUDE.md怎么写
    domain: initialization
    trigger: event
    problem: Agent反复忘记格式/引用/范围要求
    wrongPattern: 在对话里反复重复
    correctBehavior: 写项目规则文件：目标/范围/来源规则/引用规则/工作流/验收
    why: 规则文件每次会话自动加载，是对抗遗忘的唯一手段
    steps:
      - 收集重复交代的要求
      - 六段写入AGENTS.md
      - 新会话验证生效
      - 违规即补规则
    toolMappings:
      claudeCode: CLAUDE.md 同步维护
      codex: AGENTS.md 默认读取
      deepseekHarness: rules路径
    successSignals:
      - 新会话自查复述规则
    failureSignals:
      - 第四次纠正同一问题
    transferScenarios:
      - 团队规范
      - 开源项目
    depth30s: 说过两遍的规矩，进规则文件。
    depth3m: 短而硬的规则最好用：禁令+白名单+验收单。长篇大论没人读。
    depth10m: 规则文件月度修剪：删失效、并重复、补新坑。版本记录保留。
    relatedSkillIds:
      - init.create_agents_md
      - init.project_rules
      - init.read_before_write
      - init.scan_repo
      - init.readme
      - init.run_command
  - id: kc_r_theory_filter
    title: 按机制筛理论
    domain: verification
    trigger: event
    problem: AI一次推荐七个理论
    wrongPattern: 全用上显功底
    correctBehavior: 只留能推出可检验机制链的1-2个
    why: 理论的价值在解释力，不在数量
    steps:
      - 逐个问“它说机制是什么”
      - 能否变成假设
      - 与RQ对表
      - 其余进附录
    toolMappings:
      generic: 筛选记录留档
    successSignals:
      - 理论章每段都服务于假设
    failureSignals:
      - 理论章与设计两张皮
    transferScenarios:
      - 分析框架选择
    depth30s: 理论是透镜不是勋章。
    depth3m: 一个理论用到底。它能导出你的假设吗？能，就留；不能，进附录。
    depth10m: 理论-假设-方法对齐表：三列对不齐就是设计漏洞。
    relatedSkillIds:
      - verification.acceptance_criteria
      - verification.checklist
  - id: kc_r_concept_table
    title: 概念辨析表
    domain: verification
    trigger: npc_advice
    problem: 不同文献对同一概念定义不同
    wrongPattern: 混用定义
    correctBehavior: 表格列出：概念/出处/定义/测法，选定操作性定义
    why: 你测什么取决于你定义什么
    steps:
      - 收集定义
      - 对比差异
      - 选操作性定义
      - 声明局限
    toolMappings:
      generic: 概念表进附录
    successSignals:
      - 一句话说清“我测的是什么”
    failureSignals:
      - 被问定义时卡壳
    transferScenarios:
      - 需求分析
      - 指标设计
    depth30s: 定义先行，测量后行。
    depth3m: 操作性定义=可观测行为+测量方式。写不出测法的定义不能用。
    depth10m: 概念表的“局限”列是答辩加分项：主动声明比被查出体面得多。
    relatedSkillIds:
      - verification.factual_claims
      - verification.independent_check
  - id: kc_r_mechanism_map
    title: 从理论名词到机制链
    domain: goal
    trigger: event
    problem: 理论只出现在“本文基于XX理论”
    wrongPattern: 名词式引用理论
    correctBehavior: 写五节链：actor/condition/mechanism/outcome/evidence
    why: 机制链是理论与方法的桥，每节都应可检验
    steps:
