# 创业线主结局（TASK-J013/J014）
endings:
  - id: v_end_hidden_pm
    campaign: venture
    title: 《产品经理人诞生》
    mainResult: 隐藏结局——验证方法论内化
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: first_paid_user }
        - { kind: state, key: userUnderstanding, op: gte, value: 70 }
        - { kind: state, key: evidenceDiscipline, op: gte, value: 70 }
        - { kind: flag, key: unit_econ_negative }
        - { kind: flag, key: pivot_focus }
    priority: 300
    tier: hidden
    baseText: |
      结算那一刻你笑了：收入不到一百块，账面还是亏的。可你比30天前富有了——你拥有了"知道下一步该干什么"的能力。
      信号池、假设板、单位经济表、第一个付费用户的名字。这四样东西摆在一起，就是一张产品经理的出生证明。
      罗哥说得对：能干净收尾的人不多。你就是其中一个。
    growthVariantRules:
      - dimension: userUnderstanding
        variants: [{ gte: 85, text: "你能脱口而出核心用户的三个具体名字、他们的活动频率和上次卡壳的按钮。这比任何商业计划书都值钱。" }]
      - dimension: evidenceDiscipline
        variants: [{ gte: 80, text: "从信号分类到单位经济，你的每一步决策都有数据出处。有人问'凭什么'，你翻表比翻白眼快。" }]
      - dimension: independence
        variants: [{ gte: 70, text: "拒绝200块的副业单、顶住'再等等'的诱惑、亲自打回访电话——每个节点都是你自己的签名。" }]
    characterEpilogueRules:
      - characterId: v_mentor
        positive: 罗哥把你拉进了社群的导师轮值表："下期新人，你来讲'先卖再做'。"
        neutral: 罗哥说："路子对了。剩下的交给时间和现金流。"
        negative: 罗哥摇头："可惜，方法都会了，就是差点运气和狠劲。"
      - characterId: v_partner
        positive: 阿斌问下个项目什么时候开始——"这次我全职。"
        neutral: 阿斌说："合作愉快。下次有想法还找我，先看数据。"
        negative: 阿斌早就走了。你对着他留下的测试代码说了声谢谢。
      - characterId: v_user_club
        positive: 老K在下学期社团动员会上推荐了你的工具："这是我用过的唯一听人话的。"
        neutral: 老K继续用着工具，偶尔提需求，像个真正的用户。
        negative: 老K的工具账号静悄悄。他忙，你也是。
    projectFutureRules:
      - { key: next_venture, condition: { kind: always }, text: "三个月后，你用同一套方法开跑了第二个项目。这次，第1天你就去约了访谈。" }
    specialFlagSections:
      - { flag: cost_optimized, text: "你优化过成本结构——这让'继续'从赌博变成了计算。" }
      - { flag: refund_handled_well, text: "那次退款事故的口碑，后来带来了两个转介绍用户。" }
    specialTags: [hidden, best_ending]
    reflection: 第一个付费用户买的不是你的功能，是你对问题的理解。
    lessonHint: 验证方法论是可迁移的资产

  - id: v_end_no_users
    campaign: venture
    title: 《无人问津》
    mainResult: 30天没有找到真实用户
    requirements:
      kind: and
      conditions:
        - { kind: state, key: users, op: lte, value: 2 }
        - { kind: flag, key: v_final_done }
    priority: 80
    tier: main
    baseText: |
      30天到了。注册用户：2个。周活：0。
      你做了东西，发了帖子，等了又等。世界没有恶意——它只是没有注意到你。
      复盘写到最后一条，你写下：'我从头到尾没有真正搞清楚，用户现在是怎么解决这个问题的。'
    growthVariantRules:
      - dimension: userUnderstanding
        variants:
          - { lte: 35, text: "访谈做了几次就停了。你其实是在对着空气做产品。" }
          - { gte: 55, text: "你访谈了不少，但都停在'听'——没有追到行为细节。差半层窗户纸。" }
      - dimension: execution
        variants:
          - { gte: 55, text: "东西做得不差。差的是从'做出来'到'递到用户手里'的那段路——它没有捷径。" }
    characterEpilogueRules:
      - characterId: v_mentor
        positive: 罗哥帮你把复盘拆成了三条可执行项："下个项目，从第一条开始。"
        neutral: 罗哥说："没人用是常态。被使用才是意外。"
        negative: 罗哥叹气："让你做访谈你不做，让你发渠道你不发。 "
      - characterId: v_family
        positive: 妈妈说："回家吃饭，项目的事不急。"你哭了，然后睡了这30天最沉的一觉。
        neutral: 妈妈问“成功了吗”，你说“还没有”。她说“哦，那你先吃饭”。
        negative: 你跟妈妈说"挺好的"。挂了电话，宿舍安静得可怕。
    projectFutureRules:
      - { key: retry, condition: { kind: state, key: independence, op: gte, value: 55 }, text: "两个月后你重开了这个项目——这次你先访谈了15个人。用户数从第5天开始涨。" }
      - { key: default, condition: { kind: always }, text: "仓库归档。README里只有一句：它解决了我以为存在的问题。" }
    specialFlagSections:
      - { flag: weakDemandEvidence, text: "证据链早就提示过你：'会不会用'的回答不算数。你当时记下了weakDemandEvidence，然后没有然后。" }
    specialTags: [bad_end]
    reflection: 没有用户的产品不是产品，是作品——而观众不会因为你的用心而出现。
    lessonHint: 获客是被设计的，不是被等待的

  - id: v_end_no_payment
    campaign: venture
    title: 《掌声与空钱包》
    mainResult: 有人用，无人付费
    requirements:
      kind: and
      conditions:
        - { kind: state, key: users, op: gte, value: 5 }
        - { kind: flag, key: no_first_paid }
        - { kind: flag, key: v_final_done }
    priority: 85
    tier: main
    baseText: |
      数据看着心酸又好笑：注册 14 人，周活 6 人，收到感谢 9 次，收到付款 0 次。
      "挺好的""有用""支持你"——这些话像一阵风。30天结束，你的产品被喜欢着，你的钱包空着。
    growthVariantRules:
      - dimension: evidenceDiscipline
        variants:
          - { gte: 60, text: "你在复盘里冷静拆解：付费页转化 0/8。问题可能在价格、在支付路径、在'可要可不要'的价值感。三条都写进了下期假设。" }
          - { lte: 40, text: "你把原因归结于'学生没钱'。这个解释最舒服，也最危险。" }
      - dimension: userUnderstanding
        variants:
          - { gte: 55, text: "有用户私下跟你说实话：'不是不值得，是流程太麻烦了。'你记下了——这是最贵的反馈。" }
    characterEpilogueRules:
      - characterId: v_user_shop
        positive: 王姐说了句大实话："小伙子，让他们掏钱的事，你得让他们先离不开。"
        neutral: 王姐的微信没回。她忙着卖奶茶，没空研究你为什么不收费。
        negative: 王姐说："看吧，免费的东西没人珍惜。"
    projectFutureRules:
      - { key: repack, condition: { kind: state, key: userUnderstanding, op: gte, value: 50 }, text: "你把免费工具改成了'服务+工具'的付费包。第一个月，两个社团付了费。" }
      - { key: default, condition: { kind: always }, text: "工具还在免费跑着。它是个不错的作品——下一个项目，你要做个生意。" }
    specialFlagSections:
      - { flag: avoid_pricing, text: "第21天你选了'不敢收费'。掌声与空钱包之间，隔着一个没敢按下去的按钮。" }
    specialTags: [warning]
    reflection: 喜欢≠付费。被使用是荣耀，被付费才是生意。
    lessonHint: 付费意愿要用支付按钮验证

  - id: v_end_first_paid
    campaign: venture
    title: 《成人礼》
    mainResult: 拿到第一个付费用户
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: first_paid_user }
        - { kind: state, key: revenue, op: lte, value: 60 }
        - { kind: flag, key: v_final_done }
    priority: 120
    tier: main
    baseText: |
      ¥9.5。你盯着支付后台的第一条记录看了很久。
      它买不了什么，但它证明了一整条链路：真实的问题、真实的人、真实的价值、真实的钱。30天，从0到1。
      剩下的路很长，但1到100比0到1简单——这是罗哥说的，现在你信了。
    growthVariantRules:
      - dimension: execution
        variants:
          - { gte: 65, text: "从工具上线到收到付款只用了4天。快，是因为每一环都提前验证过。" }
          - { lte: 45, text: "这单子有点运气成分——你知道的。把它变成可重复，是下个30天的题。" }
      - dimension: independence
        variants:
          - { gte: 60, text: "没有导师发题，没有系统推荐。这个问题是你从信号池里亲手捞出来的。" }
    characterEpilogueRules:
      - characterId: v_user_club
        positive: 老K说："第一单是我付的。别让我亏。"——这句丑话成了你最好的KPI。
        neutral: 老K的备注是"短信通知快点做"。你做到了。
        negative: 老K付完款再没登录过。付费≠留存，你又上一课。
      - characterId: v_ai_agent
        positive: 会话日志里存着你们30天的1000次对话。第1001次，它说："需要我做什么？"
        neutral: Agent 无喜无悲。它不知道自己参与了一个人的成人礼。
        negative: 你把那次"生成三个垃圾点子"的对话截图打印了出来——贴在墙上当反面教材。
    projectFutureRules:
      - { key: repeatable, condition: { kind: state, key: execution, op: gte, value: 60 }, text: "第二个月，你复现了收费：3单。可重复，才算模式。" }
      - { key: default, condition: { kind: always }, text: "那张 ¥9.5 的订单截图，你设成了手机壁纸。" }
    specialFlagSections:
      - { flag: real_interview_done, text: "回到第5天：你把'会不会用'改成了'上次什么时候'。一切的种子在那个改口里。" }
    specialTags: [good]
    reflection: 第一个付费用户是分水岭：之前的都是排练。
    lessonHint: 0到1靠验证，1到100靠复制

  - id: v_end_small_profit
    campaign: venture
    title: 《小而盈利》
    mainResult: 实现小额稳定盈利
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: first_paid_user }
        - { kind: flag, key: cost_optimized }
        - { kind: flag, key: cac_low }
        - { kind: flag, key: v_final_done }
    priority: 160
    tier: special
    baseText: |
      月账单出来那天，你反复核了三遍：收入 ¥412，变动成本 ¥168，净 +¥244。
      不多。但这是"活着"的钱——每服务一个用户，都在赚钱。单位经济为正的那一刻，创业从赌博变成了经营。
    growthVariantRules:
      - dimension: execution
        variants:
          - { gte: 70, text: "成本优化+低CAC+聚焦定价——你的盈利是三件小事做对的复利。" }
          - { lte: 50, text: "盈利很薄，一场服务器故障就能吃掉一个月利润。你需要护城河。" }
      - dimension: evidenceDiscipline
        variants:
          - { gte: 70, text: "成本台账一天没断过。这份报表是全校最诚实的创业数据。" }
    characterEpilogueRules:
      - characterId: v_user_shop
        positive: 王姐听说了你的盈利，主动来问："帮我也弄一个？这回我付钱。"——你拒绝了非核心需求，但记下了市场信号。
        neutral: 王姐说："能赚钱就行，比你们学校那些烧钱的强。"
        negative: 王姐撇嘴：“才两百多？还没我一天赚得多。”你说：“但它每天都会赚。”
    projectFutureRules:
      - { key: compounding, condition: { kind: always }, text: "你把利润的三分之一固定投入新渠道测试。小生意开始有了自己的发动机。" }
    specialFlagSections:
      - { flag: coffee_budget, text: "别忘了第一笔'投资'：那些12块的奶茶。它们换来的洞察，是这244块的种子。" }
    specialTags: [good]
    reflection: 小而盈利是创业里最被低估的成就：它证明整条链路是通的。
    lessonHint: 单位经济为正，才谈增长

  - id: v_end_growth_loss
    campaign: venture
    title: 《增长的幻觉》
    mainResult: 增长迅速但亏损扩大
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: cac_high }
        - { kind: state, key: users, op: gte, value: 10 }
        - { kind: flag, key: v_final_done }
    priority: 89
    tier: special
    baseText: |
      用户曲线很漂亮：30天注册破30。成本曲线更漂亮：¥780的支出，收入 ¥54。
      你用钱买来了热闹。热闹散场后，账本上一行字浮出来：'获客成本 ¥25/人，用户价值 ¥1.7/人。'
    growthVariantRules:
      - dimension: evidenceDiscipline
        variants:
          - { gte: 60, text: "你在CAC第一次超过阈值时就发现了问题——只是当时选择了'先冲量'。数据给过你机会。" }
          - { lte: 40, text: "你从没算过CAC。直到今天，你才第一次打开那张表。" }
    characterEpilogueRules:
      - characterId: v_mentor
        positive: 罗哥没骂你，只发来一个链接，标题是《增长杀手：正反馈的陷阱》。
        neutral: 罗哥说："每个创业者都要交这门学费。你的学费¥780，不算贵。"
        negative: 罗哥说："我第26天就提醒过你。你没听。"
    projectFutureRules:
      - { key: fix_leak, condition: { kind: flag, key: retention_improved }, text: "幸好你修过留存。漏桶补好了，新用户开始沉淀——增长终于有了意义。" }
      - { key: default, condition: { kind: always }, text: "你关掉了广告投放。增长回到了口碑的速度——慢，但真实。" }
    specialTags: [warning]
    reflection: 没有单位经济为正的增长，是给市场打工。
    lessonHint: CAC必须小于用户价值

  - id: v_end_unit_economy_crash
    campaign: venture
    title: 《收入1000，成本1300》
    mainResult: 单位经济崩溃，规模即灾难
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: unit_econ_negative }
        - { kind: flag, key: cost_bloated }
        - { kind: state, key: users, op: gte, value: 15 }
        - { kind: flag, key: v_final_done }
    priority: 130
    tier: main
    baseText: |
      第28天的报表：本月收入 ¥1,020，成本 ¥1,314。
      你做成了"大家都在用"的东西——然后发现每多一个人用，你就多亏一点钱。规模没有拯救你，规模杀死了你。
      罗哥那句话在耳边响：现金流、现金流、还是现金流。
    growthVariantRules:
      - dimension: evidenceDiscipline
        variants:
          - { lte: 40, text: "如果你第11天就建成本台账……如果第25天就正视那张表……你写了五个'如果'，然后把报表设成了手机壁纸。" }
          - { gte: 60, text: "你其实早就看见了悬崖——只是刹车装在'下个月'。下个月永远不会来。" }
      - dimension: independence
        variants:
          - { gte: 55, text: "你没有甩锅给市场。复盘第一行：'定价和成本结构，是我亲自定的。'" }
    characterEpilogueRules:
      - characterId: v_family
        positive: 你跟妈妈说了实话。她第二天打来 ¥2000："不算投资，算吃饭钱。"你含着泪立了新账本。
        neutral: 妈妈不知道数字，只知道你瘦了。她寄来一箱吃的。
        negative: 你还是说了"挺好的"。有些账，最后只有自己看得见。
    projectFutureRules:
      - { key: rebuild, condition: { kind: flag, key: pivot_focus }, text: "聚焦策略下，你砍掉了80%的服务器负载，单位经济第一次转正。刹车踩到底之后，车重新发动了。" }
      - { key: default, condition: { kind: always }, text: "你把那张'1020 vs 1314'的报表裱了起来。它比任何成功学都提神。" }
    specialFlagSections:
      - { flag: creative_accounting, text: "如果把奶茶和学费都记成'学习投入'……报表确实好看了30天。然后现实来对账了。" }
    specialTags: [bad_end, finance]
    reflection: 收入1000成本1300的生意，做得越大，死得越快。
    lessonHint: 先让单位经济为正，再谈规模

  - id: v_end_feature_graveyard
    campaign: venture
    title: 《功能坟场》
    mainResult: 需求照单全收，产品死于功能堆砌
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: feature_graveyard_path }
        - { kind: state, key: technicalDebt, op: gte, value: 55 }
        - { kind: flag, key: v_final_done }
    priority: 135
    tier: main
    baseText: |
      第28天，你数了数：20条需求，做了17条，做完的9条，做完且有人用的3条。
      产品像一个塞满家具的房间，找不到门。核心报名流程上个月那个小bug，还躺在那里——它排在需求清单第21位，而你永远没有第21个"行动点"。
      老K发来最后一条消息："工具越来越厉害，越来越不像原来那个好用的了。"
    growthVariantRules:
      - dimension: execution
        variants:
          - { gte: 60, text: "你的开发速度其实很快——快到来不及问'该不该做'。勤奋放大了方向错误。" }
          - { lte: 40, text: "17条需求做了一半扔一半。每一半都是沉没成本在向你招手。" }
      - dimension: independence
        variants:
          - { gte: 55, text: "复盘时你说：'没有人逼我。是我把每一条需求都当成了圣旨。'" }
    characterEpilogueRules:
      - characterId: v_user_club
        positive: 老K最后说："你要是回到原来那个能合并报名表的版本，我还能再用十年。"
        neutral: 老K换回了Excel。他说那玩意虽然土，但"知道自己是干嘛的"。
        negative: 老K在群里问"工具有没有精简版"，没人回答。他退群了。
    projectFutureRules:
      - { key: epitaph, condition: { kind: always }, text: "需求清单v_req_01~20变成了墓志铭：每一行都写着'有人要的'，没有一行写着'值得做的'。" }
    specialFlagSections:
      - { flag: triage_by_easy, text: "第19天你按'简单'挑了4条需求。坟场的墓碑，就是那天立的第一块。" }
      - { flag: triage_by_core, text: "（本结局的遗憾：你其实会正确的做法。）" }
    specialTags: [bad_end]
    reflection: 功能坟场不埋葬懒人，专埋葬不懂拒绝的老好人。
    lessonHint: 需求过滤=核心用户×核心场景

  - id: v_end_pivot_users
    campaign: venture
    title: 《换一片森林》
    mainResult: 成功转型用户群
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: pivot_audience }
        - { kind: flag, key: v_final_done }
    priority: 125
    tier: special
    baseText: |
      你把工具从"给社团用"转成了"给学生会统一采购"。签约流程慢了两周，但一个合同=过去十个社团。
      第29天，学生会盖章的那刻，你想起第28天罗哥的 Five Options。你选了最难走的那条，走通了。
    growthVariantRules:
      - dimension: riskTolerance
        variants:
          - { gte: 65, text: "换人群是推倒重来的勇气。你的访谈、演示、定价全部重做了一遍——这次更快，因为方法论还在。" }
