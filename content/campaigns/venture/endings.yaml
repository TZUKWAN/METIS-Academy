  - id: v_end_time_up
    campaign: venture
    title: 《30天，刚起步》
    mainResult: 时间耗尽的开放式结算
    requirements: { kind: always }
    priority: 1
    tier: main
    baseText: |
      30天到了。故事停在它此刻的样子——也许刚做完产品，也许刚找到方向，也许刚搞清楚问题是什么。
      创业没有 deadline，但30天是一面镜子：你做了什么、没做什么，现在都摆在假设板上。
    growthVariantRules:
      - dimension: execution
        variants:
          - { gte: 55, text: "你的信号池、访谈纪要、假设板、报表——样样有账。时间不够不可怕，账目不清才可怕。" }
          - { lte: 35, text: "30天像一场没醒的梦。好在，假设板还空着——它就是你的新起点。" }
      - dimension: aiDependence
        variants:
          - { gte: 65, text: "AI帮你想了很多。但方向、取舍、付钱的人——从头到尾都是你。" }
    characterEpilogueRules:
      - characterId: v_mentor
        positive: 罗哥说："下个项目见。记得：先卖再做。"
        neutral: 罗哥说："30天算什么。我第一个项目做了两年才有一分钱。"
        negative: 罗哥没有回复你的总结消息。也许在忙，也许在失望。
    projectFutureRules:
      - { key: again, condition: { kind: always }, text: "新的周目已经开放。这次，第1天你就知道：观察、访谈、验证——然后才是做。" }
    specialTags: [neutral, time_up]
    reflection: 创业的第一个30天，结局从来不是重点，方法才是。
    lessonHint: 每一天都是验证，每一天都是积累
