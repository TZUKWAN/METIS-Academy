    baseText: "'我懂我的用户——他们的痛点我亲手摸过。'这句话说完，你自己都愣了一下。三十天前你说不出这话：那时你有的只是一份竞品分析和六个'惊艳'的功能设想。现在你有的是 47 场访谈、240 条亲手回复的反馈、五个流失用户的酒后真言、和一张被你改了七版的付费墙。导师说得对，这话三个月前你说不出来。摸过用户的手，和读过用户报告的手，写出来的产品不一样。"
    growthVariantRules:
      - dimension: independence
        variants:
          - { gte: 55, text: “懂”字你说得平静。真正的理解不需要声调来撑——你知道它值多少。 }
          - { lte: 40, text: 说完你有半秒的心虚：上个月流失的那批人，你其实还没来得及摸。 }
    characterEpilogueRules:
      - characterId: v_user_student
        positive: 散场时你收到那位学生的消息：“学长，感觉你真的懂我们要什么。需要兼职吗？”
        neutral: 用户们不知道你的这句话。你懂他们，这件事本身就是全部的意义。
        negative: “摸过”两个字有点自欺——访谈你是做了，但流失用户的深访你还欠着两场。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 你把这句话写进了每一份 BP 的第一页。它是你的初心条款，也是你的审计标准。 }
    reflection: 创业者的终极护城河不是功能，是对用户的具体理解——具体到能说出他们的星期二晚上在做什么。
    lessonHint: 用户理解的深度决定产品的 correctness，终局自信用它作答。
    tone: positive
    family: user_understanding
    whyDistinct: 核心结果是“以用户理解收束”的终局认同，与数字自信终局在同一链互斥。

  - id: v2_final_numbers_end
    campaign: venture
    title: 《拆开的 45%》
    mainResult: 以数据诚实收束三十天
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: kv_final_numbers_confidence }
        - { kind: flag, key: kv_final_users_confidence, expected: false }
    priority: 92
    tier: main
    baseText: 你当场拆了那个 45%。渠道 A 61%，渠道 B 22%，渠道 C 新上——31%，还没到.comment 周期。导师的笔在本子上停了停：“大部分人给我看的都是 45%。”你说了实话：“我上周还只会看 45%。是分群救了我。”他说：“比会讲故事重要的，是敢拆自己的故事。”合上本子的时候，你发现三十天的所有数据课，最终考的都是同一道题：你敢不敢对自己诚实。
    growthVariantRules:
      - dimension: evidenceDiscipline
        variants:
          - { gte: 55, text: 拆数的那两分钟，你的手很稳。练过 47 场访谈的手，和练过 47 页 PPT 的手不一样。 }
          - { lte: 40, text: 拆到渠道 C 的 31% 时你语速快了——那是你自己引入的渠道，数据不好看。 }
    characterEpilogueRules:
      - characterId: v_mentor
        positive: 导师后来把“敢拆自己的故事”写进了推荐信。他说这是他见过最高的数据素养。
        neutral: 导师收起本子，说了句“不错”。你知道那两个字在他那里的兑换率。
        negative: 同场路演的另一个团队讲了个漂亮故事，掌声比你的拆解多。你花了一晚上才消化掉。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 你所有的汇报都从“构成拆解”开始。45% 这样的平均数，从此只是你的第一页，不是全部。 }
    reflection: 数据素养的终点不是会算，是敢拆——拆开自己的漂亮数字，需要比讲故事更大的勇气。
    lessonHint: 数据诚实是融资与团队信任的底层资产。
    tone: positive
    family: unit_economics
    whyDistinct: 核心结果是“以数据拆解收束”的终局认同，与用户理解终局在同一链互斥。

  # ===== 隐藏层 =====
  - id: v2_rival_alliance_end
