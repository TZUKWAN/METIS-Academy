    baseText: 均值慢慢变好了，像你祈祷的那样。可每次见投资人，你都会在心里先排练一遍“如果他问起分群”。他一直没问。你的季报越来越漂亮，你睡得越来越差。阿哲说你“最近有点轴”，他说得对——知道一半真相的人，说任何话都像在称重。直到某天你意识到：那句没说出口的话，你已经对它付了太多利息，本金却还在涨。
    growthVariantRules:
      - dimension: independence
        variants:
          - { gte: 55, text: 半年后你终于说出了那句话。迟到的坦白没有让你解脱，但让你睡了整觉。 }
          - { lte: 40, text: 你学会了带着它生活。有些创业者就是这样学会说谎的——一句一句，都不算谎。 }
    characterEpilogueRules:
      - characterId: v_mentor
        positive: 你最终向导师坦白了这件事。他说：“你现在明白为什么尽调叫'尽职'了——尽职的对象首先是自己的良心。”
        neutral: 这件事你谁都没说。它成了你和镜子之间的秘密。
        negative: DD 时投资人自己发现了分群数据。谈话结束时，他说了句“我们再联系”。没有再联系。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 那句没说出口的话，改变了你对所有“漂亮的均值”的第一反应：先怀疑。 }
    reflection: 隐瞒是有息贷款——债主是自己，利息是安宁，而本金永远在涨。
    lessonHint: 知情不报的心理成本随时间复利，主动披露越早成本越低。
    tone: negative
    family: unit_economics
    whyDistinct: 核心结果是“知情不报的心理负债”，与主动纠错结局在同一链互斥，主题为内心代价。

  # ===== 终局自信 =====
  - id: v2_final_users_end
