# METIS Academy Venture V2 结局批次二 —— 与 events_v2_02.yaml 的 kv_* 旗标配套
endings:
  # ===== G 链：合伙人分工 =====
  - id: v2_written_split_end
    campaign: venture
    title: 《一页纸章程》
    mainResult: 书面分工治理撑过压力测试
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: kv_written_split }
        - { kind: flag, key: kv_ghost_unresolved, expected: false }
    priority: 93
    tier: main
    baseText: 毕业路演那天，投资人问你们“合伙人怎么分工”。你和阿哲相视一笑，把那页纸投上屏幕——签名的日期是第 5 天。投资人后来私下说，那天十几个项目里，只有你们两个在第一天就“吵过架”。吵架的人才知道章程值钱。阿哲把那页纸复印了一份，贴在他工位上，标题是他加的：《第 5 天的我们比第 25 天的我们聪明》。
    growthVariantRules:
      - dimension: independence
        variants:
          - { gte: 55, text: 章程后来修订过三次。每一次修订，你们的关系都更深一层。 }
          - { lte: 40, text: 章程你起草的，阿哲签的。他戏称“卖身契”，你听了有点在意。 }
    characterEpilogueRules:
      - characterId: v_partner
        positive: 阿哲在庆功宴上说：“那天你坚持写下来，我记一辈子。”
        neutral: 阿哲说“还行，写了就写了”，然后干了一杯。
        negative: 阿哲说“要不是那页纸，我早就退了”。你们都沉默了三秒。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 那页章程成了你们公司的“宪法第一页”，新合伙人入职都要读。 }
    reflection: 治理结构不是对关系的不信任，是让关系能穿越压力的骨架。
    lessonHint: 合伙创业第一天就应书面化分工、对账与裁决机制。
    tone: positive
    family: founder_team
    whyDistinct: 核心结果是“书面治理的前置建立”，与口头分工的崩塌路径互斥。

  - id: v2_ghost_tasks_end
    campaign: venture
    title: 《23 条未读》
    mainResult: 口头分工导致的用户反馈真空
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: kv_verbal_split }
        - { kind: flag, key: kv_ghost_unresolved }
    priority: 90
    tier: main
    baseText: “23 条未读反馈像 23 块墓碑。你们谁都没承认是自己的错，白板擦了又写，写了又擦。两周后产品关站，导流页的访问量还有每天两百多——人们还在来，只是找不到说话的人。阿哲在复盘文档里写了一句话：'我们不是输给了产品，是输给了”我以为“。'”
    growthVariantRules:
      - dimension: independence
        variants:
          - { gte: 55, text: 下一次创业，你在第 1 天就写了章程。学费只交一次才是本事。 }
          - { lte: 40, text: 你把责任归为“阿哲应该多问一句”。同样的真空，还会出现。 }
    characterEpilogueRules:
      - characterId: v_partner
        positive: 阿哲后来给你发了篇讲“任务真空”的文章，附言：“下个项目，别再让我们当反面教材。”
        neutral: 阿哲没再提这事。项目结束后你们很少联系。
        negative: 阿哲逢人就说“那次是他没接住客服”。你们的名字从此绑在一个事故上。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: “23”成了你们之间的敏感数字。有意识避开的，和无意识避开的，都是疤痕。 }
    reflection: “我以为”是创业公司最贵的一句话——它把责任变成悬空，把悬空变成真空。
    lessonHint: 口头分工必然产生任务真空，反馈渠道必须有明确 owner。
    tone: negative
    family: founder_team
    whyDistinct: 核心结果是“分工真空导致反馈失守”，与章程结局在同一链互斥。

  - id: v2_emergency_charter_end
    campaign: venture
    title: 《白板章程》
    mainResult: 危机中紧急建立治理
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: kv_emergency_charter }
    priority: 92
    tier: main
    baseText: 那场架吵到第 40 分钟，你突然停下来说：“我们把它写下来吧。”白板上，23 条无人认领的消息变成了一张任务矩阵。吵到最凶的时候立规矩，是创业公司的成人礼。阿哲签完名嘟囔：“早知道这样，第 5 天就该写。”你说：“第 5 天写是章程，今天写是赎罪券。”他大笑，笑完把“赎罪券”三个字也写在了白板角上。
    growthVariantRules:
      - dimension: independence
        variants:
          - { gte: 55, text: 你学会了在冲突的最高点提出结构性方案——那是所有人最想改变的时刻。 }
          - { lte: 40, text: 章程立了，但你和阿哲都清楚，感情账户上那 40 分钟的赤字还在。 }
    characterEpilogueRules:
      - characterId: v_partner
        positive: 阿哲把那张白板拍了照。他说这是“我们的《五月花号公约》”。
        neutral: 阿哲签得很快，像在赶时间。章程有效，仪式感为零。
        negative: 阿哲说“写这个有什么用，该吵还是吵”。一个月后他们真的又吵了。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 白板照片后来进了你们公司的文化墙，标题：《迟到的第 5 天》。 }
    reflection: 危机是治理最好的助产士——但助产士的存在，不代表你应该等到临产。
    lessonHint: 冲突爆发点是建立团队机制的窗口期，把握它胜过等冷静。
    tone: mixed
    family: founder_team
    whyDistinct: 核心结果是“危机催生治理”的迟来修复，与第 5 天前置章程结局在同一链上但时机与主题不同。

  # ===== H 链：平台依赖 =====
  - id: v2_platform_clamp_end
    campaign: venture
    title: 《第 41 名》
    mainResult: 全押平台被政策重击
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: kv_all_in_platform }
        - { kind: flag, key: kv_private_sprint, expected: false }
    priority: 90
    tier: main
    baseText: 从类目第 3 名到第 41 名，只隔了一纸公告。你盯着后台的流量断崖——那是你“all in”换来的全部。增长曲线像一场高烧退去：第 7 天的四倍用户，第 18 天只剩零头。你终于懂了那句老话的重量：平台给你的，平台随时可以收回去。而你，从来没有问过“如果收回去呢”。
    growthVariantRules:
      - dimension: independence
        variants:
          - { gte: 55, text: 你在复盘里写下“单渠道依赖是慢性自杀”，贴在了下一家公司的墙上。 }
          - { lte: 40, text: 你开始研究“下一个流量洼地”——你学会的只是换一个篮子，不是留住鸡蛋。 }
    characterEpilogueRules:
      - characterId: v_mentor
        positive: 导师说：“第 7 天你差点说服我。这 11 天的落差，就是学费的价格。”
        neutral: 导师看着断崖曲线说“_platform_，都是这样”。你不知道他经历过几次。
        negative: 导师说“我提醒过你私域”。你记得提醒，也记得自己当时没听。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 你的手机里存着那张断崖截图。每次有平台许诺流量，你都先看一遍它。 }
    reflection: 依赖的可怕不在失去的那一刻，而在得到的那一刻你就已经失去了议价权。
    lessonHint: 渠道增长必须同步建设自有触点，评估封禁风险敞口。
    tone: negative
    family: acquisition
    whyDistinct: 核心结果是“平台全押的政策崩塌”，与多渠道/私域路径在同一链互斥。

  - id: v2_private_sprint_end
    campaign: venture
    title: 《1200 人的搬家》
    mainResult: 平台崩塌后私域重建成功
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: kv_all_in_platform }
        - { kind: flag, key: kv_private_sprint }
    priority: 92
    tier: main
    baseText: 平台公告发布后的第 3 个小时，你和阿哲开始“搬家”。他挨个导流，你写欢迎语，两周搬了 1200 人进自己的群。搬家第 30 天，群里的日活超过了平台崩塌前的日活——你们失去了一个渠道，拥有了一个社区。导师在复盘会上说了一句话：“这不是运气的逆转，是你第 7 天留的那半张底牌，终于翻了面。”
    growthVariantRules:
      - dimension: independence
        variants:
          - { gte: 55, text: 你把搬家过程写成了 SOP。第二个月，你们再也不怕任何平台的任何公告。 }
          - { lte: 40, text: 1200 人是搬进来了，但你心里清楚：如果不是被逼到墙角，你们不会动手。 }
    characterEpilogueRules:
      - characterId: v_partner
        positive: 阿哲说：“搬家那两周，是我们配合最好的两周。”
        neutral: 阿哲说“累死了，别再有下次”。
        negative: 阿哲后来反对再接任何平台合作。你们为“错过的增长”争论过三次。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 那个群后来长成了你们的第一个真正的社区。 anniversary 那天，群里会刷屏。 }
    reflection: 用户从来不是平台的，也不该只是你的——当用户成为彼此的，你才真正拥有了增长。
    lessonHint: 平台危机中的用户资产私有化是最高优先级自救动作。
    tone: positive
    family: acquisition
    whyDistinct: 核心结果是“崩塌后的私域重建”，与全押沉没路径互斥，主题为危机韧性。

  - id: v2_multi_channel_end
    campaign: venture
    title: 《先手》
    mainResult: 多渠道+私域的对冲策略
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: kv_multi_channel }
        - { kind: flag, key: kv_refuse_platform, expected: false }
    priority: 93
    tier: main
    baseText: 大清洗那天，你的私信箱里躺着三条消息：平台经理的道歉、竞品创始人求救的咨询、还有你自己一周前写给团队的那句“幸好”。你只拿了一半推荐位，把另一半时间花在了 300 人的种子群里——当时有人笑你“捡了芝麻丢了西瓜”。现在，西瓜碎了，芝麻长成了田。增长慢一半的代价，换来了永不归零的底气。
    growthVariantRules:
      - dimension: independence
        variants:
          - { gte: 60, text: 你的“半仓原则”后来写进了团队手册：任何渠道，最多投入一半资源。 }
          - { lte: 40, text: 你承认当时只是胆子小。胆小的人偶尔因祸得福，但你更想把它变成方法论。 }
    characterEpilogueRules:
      - characterId: v_mentor
        positive: 导师把你的案例加进了他的课：“'对冲'不是不激进，是把命押在自己身上。”
        neutral: 导师说“稳健”，然后转向了下一个项目。
        negative: 导师说“如果你当年全押，现在估值三倍”。你们对'命'的定义不同。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 你的 300 人种子群后来长到 30000。第一天的 300 个人，ID 你都记得。 }
    reflection: 对冲的本质不是避险，是把最重要的资产——用户关系——握在自己手里。
    lessonHint: 渠道红利期就要启动自有触点建设，对冲单点依赖。
    tone: positive
    family: acquisition
    whyDistinct: 核心结果是“红利期的对冲先手”，与全押、全拒路径在同一链互斥。

  - id: v2_refuse_platform_end
    campaign: venture
    title: 《走自己的路，慢一点》
    mainResult: 拒绝平台条件的独立代价
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: kv_refuse_platform }
    priority: 90
    tier: main
    baseText: 你拒绝了平台。增长曲线平得让人心慌，同期的竞品坐上推荐位，用户数是你的六倍。你在第 20 天动摇过，第 25 天失眠过。但第 30 天复盘时你发现：你的用户留存是竞品的三倍——没有推荐位“捡来”的用户，每一个都是自己找上门的。慢，但每一层都扎实。独立从来不是免费的，它收费的方式是让你天天怀疑自己。
    growthVariantRules:
      - dimension: independence
        variants:
          - { gte: 60, text: 你坚持的独立在别人眼里是固执。你学会了区分：数据会说哪一天固执变成了远见。 }
          - { lte: 40, text: 你好几次差点回头去求平台。坚持的成本，你付得很勉强。 }
    characterEpilogueRules:
      - characterId: v_mentor
        positive: 导师说：“拒绝的时候你不知道对不对。30 天后你知道了——这就是判断力长出来的过程。”
        neutral: 导师说“选了就别回头”，然后没再多说。
        negative: 竞品拿了融资。你盯着新闻看了很久，那句“判断力”没能安慰你。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 你的产品文档里有一页“我们为什么不……”，第一行就是那次拒绝。 }
    reflection: 独立日是一场没有现场的考试——判卷人是你自己，出成绩要等很多年。
    lessonHint: 拒绝平台红利需要用留存与用户质量来验证选择。
    tone: mixed
    family: acquisition
    whyDistinct: 核心结果是“拒绝平台后的独立验证”，与半仓对冲互斥，情绪为迟疑中的自证。

  # ===== I 链：客服 =====
  - id: v2_sla_dike_end
    campaign: venture
    title: 《24 小时的堤坝》
    mainResult: SLA 承诺构建口碑飞轮
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: kv_sla_commit }
        - { kind: flag, key: kv_support_debt, expected: false }
    priority: 93
    tier: main
    baseText: 那张“半夜提 bug 早上八点收到回复”的截图，后来被转发出你的第一批自然增长。投资人在尽调时特意翻了你的反馈看板：“61 条，61 条都有回复时间和处理人。”他合上电脑说：“产品可以改，这个习惯改不了。”你每晚 90 分钟的回复，从来不只是客服——那是你在向第一批用户证明：你们选的不是一个产品，是一群人。
    growthVariantRules:
      - dimension: execution_vs_judgment
        variants:
          - { gte: 55, text: SLA 你坚持了整整一年。第三百天，它已经不需要坚持——它成了习惯。 }
          - { lte: 40, text: 用户过千之后你有点撑不住了。你开始培训阿哲接手，交接做得磕磕绊绊。 }
    characterEpilogueRules:
      - characterId: v_user_club
        positive: 社团的那位用户后来成了你的兼职运营。他说“我就是被那条回复圈进来的”。
        neutral: 用户们习惯了快速回复，很快视为理所当然。堤坝的意义就是被忘记。
        negative: 有一条反馈你漏回了。那位用户后来成了竞品的铁杆——你知道是哪一条。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 那块反馈看板你一直用着。第 10000 条反馈的处理时间和第 1 条一样。 }
    reflection: 早期客服不是成本，是你与市场签订的第一份信任契约。
    lessonHint: 早期 SLA 是留存与口碑的第一杠杆，必须投入人力守住。
    tone: positive
    family: retention
    whyDistinct: 核心结果是“SLA 口碑飞轮”，与客服欠债路径在同一链互斥。

  - id: v2_support_debt_end
    campaign: venture
    title: 《240 条墓志铭》
    mainResult: 客服欠债导致的沉默流失
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: kv_support_debt }
        - { kind: flag, key: kv_concierge_week, expected: false }
    priority: 90
    tier: main
    baseText: 第 19 天你终于打开那张表格。240 条未读，按时间排列，像一部倒放的产品史：前面的还在提建议，中间的开始抱怨，最后几条只有一句话——“算了吧。”你从头读到尾用了两个小时，像给自己办了一场追悼会。流失是沉默的：没有一篇檄文，没有一场告别，用户只是安静地、一个一个地，不再打开。
    growthVariantRules:
      - dimension: independence
        variants:
          - { gte: 55, text: 你把 240 条全部导出，做了一份《流失时间线》。它成了你下一个产品的第一份需求文档。 }
          - { lte: 40, text: 你删掉了那张表格。删掉的那一刻，轻松了 0.5 秒，后悔了很久。 }
    characterEpilogueRules:
      - characterId: v_mentor
        positive: 导师说：“至少你读完了。大部分人连读的勇气都没有。”
        neutral: 导师没多说什么。沉默是他最重的评语。
        negative: 导师说“这不叫教训，这叫渎职”。你无法反驳。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: “算了吧”三个字，你再也没有对新用户的产品体验无动于衷过。 }
    reflection: 沉默的流失比激烈的投诉更致命——投诉还是在乎，沉默已经告别。
    lessonHint: 反馈积压即流失倒计时，客服欠债不可展期。
    tone: negative
    family: retention
    whyDistinct: 核心结果是“客服真空的沉默流失”，与 SLA 堤坝、管家周重建路径在同一链互斥。

  - id: v2_concierge_end
    campaign: venture
    title: 《管家周》
    mainResult: 人工管家周挽回收缩信任
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: kv_concierge_week }
    priority: 92
    tier: main
    baseText: 一周，240 条，你和阿哲全部手工回复。第 31 位回来的用户留言：“我不是回来用产品的，是回来看你们的。”那一刻你懂了：客服的终极形态不是解决问题，是让人看见“有人在”。管家周结束后，你们的周留存曲线拐了个弯。阿哲在复盘会上说：“原来道歉是免费的，且最贵——因为要用真心付。”
    growthVariantRules:
      - dimension: execution_vs_judgment
        variants:
          - { gte: 55, text: 管家周后来制度化：每月第一周，全员回客服。这是你们公司最贵的仪式。 }
          - { lte: 40, text: 一周后你们就退回了原来的节奏。拐弯的曲线，第二个月又开始下滑。 }
    characterEpilogueRules:
      - characterId: v_partner
        positive: 阿哲把管家周的第一条回复截了图当手机壁纸。那是他这辈子打过最长的一段话。
        neutral: 阿哲说“下周谁来值管家周？”轮值从那天开始。
        negative: 阿哲累病了。你意识到真诚不该以健康为代价，但你醒悟得太晚。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: “管家周”成了你们的公司黑话：任何客服危机，先上管家周再说。 }
    reflection: 规模化可以复制效率，复制不了被看见的感觉——所以最关键的阶段要用人来做。
    lessonHint: 信任危机的人工补救窗口有限，真诚响应优先于效率工具。
    tone: positive
    family: retention
