    lessonHint: B端业务尽早将定制需求抽象为标准化模块。
    tone: positive
    family: unit_economics
    whyDistinct: 核心结果是“定制地狱的标准化突围”，与切回 C 端路径在同一链互斥。

  - id: v2_pivot_back_end
