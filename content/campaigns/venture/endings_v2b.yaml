          - { lte: 40, text: 实验的样本量你没算清。结论碰巧对了——但你的实验设计课，还欠一次补考。 }
    characterEpilogueRules:
      - characterId: v_partner
        positive: 阿哲成了全组最支持 A/B 测试的人。他说：“被数据说服，比被说服更舒服。”
        neutral: 阿哲接受了结果。团队的决策文化往前挪了一格。
        negative: 实验期间少赚的钱阿哲算过账。他说“学费从我的提成里扣”——玩笑，但你们都听见了。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 你们的定价决策从此必须带实验数据。这条规矩的编号是 001。 }
    reflection: 说服的最高形态是让数据开口——你提供的是问题设计，不是答案。
    lessonHint: NG+ 记忆最好转化为实验假设而非直接结论。
    tone: positive
    family: pricing
    whyDistinct: 核心结果是“NG+ 教训的实验化路径”，仅 NG+ 可达，与直接应用结局互斥。

  - id: v2_ng_ledger_end
    campaign: venture
    title: 《先算的账单》
    mainResult: NG+ 成本推演前置
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: kv_ng_ledger_first }
        - { kind: flag, key: kv_ng_capped_free, expected: false }
    priority: 96
    ngPlus: true
    tier: special
    baseText: 那张成本推演表救了你们：4200/月的 API 账单，在承诺之前就被看见了。阿哲看着表格说“改成限量 10 家”时的表情，和上辈子第 19 天看到账单时的表情一模一样——只是这次，晚了 8 天变成了早了 8 天。创业的账单永远会来，区别只在于它是被推演出来的，还是被撞上的。你选了前者。痛感一样，体面不同。
    growthVariantRules:
      - dimension: evidenceDiscipline
        variants:
          - { gte: 55, text: 成本推演成了你们的立项流程第一步。表格模板的名字叫“第 19 天备忘录”。 }
          - { lte: 40, text: 你只推演了 API 成本。带宽、客服、退款的账单还在暗处排队——世界不止一张账单。 }
    characterEpilogueRules:
      - characterId: v_partner
        positive: 阿哲把那张推演表裱了起来——用的是上辈子他摔键盘那张桌子的角度。他说：“这次咱们赢在桌上。”
        neutral: 阿哲说“早算早好”，语气平常。他不知道你为什么这么在意这张表。
        negative: 推演让企业单迟了一周签。阿哲嘀咕“想太多也是一种成本”。你们各对了一半。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 你的所有免费策略都先过“第 19 天测试”：如果它是全量放开，账单会在哪天爆炸？ }
    reflection: 预算里的每个数字都是未来某天的自己——先算账，是与未来的自己和解。
    lessonHint: 免费与补贴策略必须前置成本推演。
    tone: mixed
    family: unit_economics
    whyDistinct: 核心结果是“NG+ 成本推演的前置应用”，仅 NG+ 可达，与用量封顶路径互斥。

  - id: v2_ng_capped_free_end
    campaign: venture
    title: 《有限制的免费》
    mainResult: NG+ 用量封顶策略的反直觉成功
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: kv_ng_capped_free }
        - { kind: flag, key: kv_ng_ledger_first, expected: false }
    priority: 96
    ngPlus: true
    tier: special
    baseText: “超出就降速”的规则上线后，你担心的投诉没有来。企业用户反而说：“有限制的免费才可信——说明你们算过成本，活得下去。”上一世，无上限的免费差点烧穿你们；这一世，封顶的免费成了专业度的证明。你看着这半步之差，忽然理解了 NG+ 的深层规则：同样的牌，换一个出牌顺序，世界给的反应完全不同。
    growthVariantRules:
      - dimension: evidenceDiscipline
        variants:
          - { gte: 55, text: 封顶阈值你设在了“成本红线”的 80%。那 20% 的缓冲，是你从上一世的火烧连营里省下来的。 }
          - { lte: 40, text: 降速的体验有点糙。用户原谅了你，但你知道那是宽容，不是设计。 }
    characterEpilogueRules:
      - characterId: v_partner
        positive: 阿哲说：“免费还能免费得这么有底气，服。”
        neutral: 企业们平静地接受了规则。商业世界对“有边界的善意”一向友好。
        negative: 有两家企业在降速期流失了。你的封顶线画得略低——上一世的经验，差半个身位。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: “有限制的免费”成了你们的定价哲学。它在商业计划书的第 3 页，标了加粗。 }
    reflection: 免费的可信度不在于慷慨的程度，在于约束的清晰——限界本身就是承诺。
    lessonHint: NG+ 经验应用于策略设计时，注意保留当世验证。
    tone: positive
    family: unit_economics
    whyDistinct: 核心结果是“NG+ 封顶策略的反直觉红利”，仅 NG+ 可达，与账单推演路径互斥。

  - id: v2_ng_burn_map_end
    campaign: venture
    title: 《烧掉的地图》
    mainResult: NG+ 拒用记忆的孤证实验
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: kv_ng_burn_map }
    priority: 96
    ngPlus: true
    tier: special
    baseText: 你烧掉了旧地图——刻意不用上辈子的任何经验，想验证“裸奔”能不能行。结果：本能把你带回了同一个坑边。第 7 天，你站在那个熟悉的错误面前，笑出了声。区别是，这一次你在坑边停住了。烧地图的实验让你得到一个珍贵的结论：经验不能替代，但觉醒可以。你没有省掉坑，你省掉的是掉进去之后再爬出来的那 20 天。
    growthVariantRules:
      - dimension: independence
        variants:
          - { gte: 60, text: 你把“裸奔实验”写进了个人方法论：经验要定期接受裸测，防止它僵化成教条。 }
          - { lte: 40, text: 你不确定这次停住是成长还是运气。下一个坑，你还是会带地图。 }
    characterEpilogueRules:
      - characterId: v_partner
        positive: 阿哲说：“你有时候会在坑边突然停下，像被什么东西绊住。”你说：“是被上辈子的我绊住。”
        neutral: 阿哲没发现你的实验。你的两个周目，只在你的意识里重叠。
        negative: 裸奔让你错过了几个只有记忆能给的先机。你在深夜算过：这买卖，亏了。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 你的笔记本第一页画着一张烧掉一角的地图。没有人知道那是什么意思。 }
    reflection: NG+ 的终极问题：带着记忆重活，算不算真的重活？烧地图的人至少给了自己一个答案。
    lessonHint: NG+ 玩家的元选择：依赖记忆 vs 刻意归零，两者都是有效的成长设计。
    tone: negative
    family: hidden_longterm
    whyDistinct: 核心结果是“NG+ 归零实验”的元叙事，仅 NG+ 可达，与记忆应用路径互斥。

  # ===== 超稀有 =====
  - id: v2_fellowship_fire_end
    campaign: venture
    title: 《黑暗森林的篝火》
    mainResult: 双隐藏线交汇的生态位共建
    requirements:
      kind: and
      conditions:
        - { kind: flag, key: kv_rival_alliance }
        - { kind: flag, key: kv_platform_tip_saved }
    priority: 99
    tier: hidden
    ultraRare: true
    baseText: 大清洗那天，你给竞品创始人发了那条平台经理的预警——在他被封之前六小时。他赶在下架潮前改完了合规声明，成了幸存的 12 家之一。当晚他打电话给你：“你知道你在黑暗森林里点了一堆篝火吗？”你说：“知道。火堆旁边站的人越多，森林越安全。”三个月后，你们发起了“幸存者联盟”：信息互通，市场互让，生态共建。那片森林里，篝火连成了灯。
    growthVariantRules:
      - dimension: independence
        variants:
          - { gte: 60, text: 你在联盟章程里写下了“预警互通”条款。这是你第一次把道德写进合同。 }
          - { lte: 40, text: 你犹豫过要不要告诉他——毕竟少一个幸存者，多一分份额。你为自己犹豫过而羞愧。 }
    characterEpilogueRules:
      - characterId: v_mentor
        positive: 导师在行业峰会上引用了你们的案例：“竞争的终点不是垄断，是共同把市场做安全。”
        neutral: 行业里对你们联盟的解读五花八门。你和那位创始人相视一笑，不解释。
        negative: 联盟半年后被质疑“价格串谋”。你发现：做好事的难度，一半在做事，一半在自证。
    projectFutureRules:
      - { key: a, condition: { kind: always }, text: 幸存者联盟后来有 21 家成员。每一家的合规自查表，都是同一天更新。 }
    reflection: 商业的黑暗森林里，第一个把火把举起来的人，照亮的是所有人的路——包括自己的。
    lessonHint: 双隐藏线交汇：预警共享与竞品结盟的生态位共建，是最高阶的生存策略。
    tone: positive
    family: hidden_longterm
    whyDistinct: 核心结果是“双隐藏线交汇的生态共建叙事”，需竞品结盟与先兆行动两条独立隐藏线同时达成，为本线最高稀有度的生态结局。
