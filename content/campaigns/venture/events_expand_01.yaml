# 创业线扩展事件 01（机会观察/问题日志/访谈/用户行为/用户细分）
events:
  - id: v_e01_d01_walk_route
    campaign: venture
    day: 1
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 机会观察要选场景：人流处找效率问题，抱怨处找情绪证据 }
    scene: { location: dorm, characters: [] }
    setup: ["下午没课，你打算去校园里转一小时，专门看别人的麻烦。三条路线："]
    choices:
      - id: canteen_route
        text: 食堂路线：人流最大，效率问题最密集
        visibleResponse: 一小时你记了6条：找座位绕圈、错峰排队长、打包保温难。都是高频场景。
        hiddenEffects: [{ kind: add, key: userUnderstanding, value: 3 }, { kind: setFlag, key: route_canteen }]
      - id: wall_route
        text: 表白墙路线：翻半小时帖子，收集抱怨原话
        visibleResponse: 你截图了9条抱怨，带原话。情绪浓度高，但哪条愿意付钱，还看不出来。
        hiddenEffects: [{ kind: add, key: userUnderstanding, value: 2 }, { kind: setFlag, key: route_wall }]
      - id: print_route
        text: 打印店路线：老板娘嗓门最大的地方，痛点最多
        visibleResponse: 半小时你听到3次“格式又乱了”。老板娘一边骂一边收钱——一边骂一边收钱，这是个好信号。
        hiddenEffects: [{ kind: add, key: userUnderstanding, value: 3 }, { kind: setFlag, key: route_print }]
    learningPoint: 观察不是逛街，是带着问题清单去看
    terminal: true

  - id: v_e01_d01_log_habit
    campaign: venture
    day: 1
    type: story
    trigger: { kind: day, day: 1, phase: end }
    purpose: { learning: 问题日志：每天固定记录，别靠脑子存 }
    scene: { location: dorm, characters: [] }
    setup: ["你在备忘录新建了一页，标题三个字：问题日志。规则只有一条——每天至少记3条别人的麻烦，写清谁、在哪、卡在哪一步。"]
    automaticEffects:
      - { kind: add, key: evidenceDiscipline, value: 3 }
      - { kind: setFlag, key: pain_log_started }
    dialogue:
      - { speaker: 系统, text: "记录工具不重要，重要的是“谁/在哪/卡在哪”这三栏。脑子会骗人，日志不会。" }
    terminal: true

  - id: v_e01_d02_print_shop
    campaign: venture
    day: 2
    type: story
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 机会观察：付费发生的地方藏着真需求 }
    scene: { location: shop, characters: [] }
    setup: ["打印店。一个女生举着U盘：“师兄，这个PDF帮我转Word，论文明天要交。”老板娘头也不抬：“五块。”女生付了五块。"]
    automaticEffects:
      - { kind: add, key: userUnderstanding, value: 3 }
      - { kind: addAsset, assetType: document, name: 问题日志（打印店）, description: 格式转换付费现场, content: "PDF转Word/¥5/明天截止——付费发生在截止日期前" }
    dialogue:
      - { speaker: 系统, text: "注意这个瞬间：她没有比价，没有犹豫。截止日期是付费意愿的放大器。" }
    terminal: true

  - id: v_e01_d02_express_peak
    campaign: venture
    day: 2
    type: story
    trigger: { kind: random, weight: 2 }
    scene: { location: shop, characters: [] }
    setup: ["傍晚快递站。取件队伍拐了两个弯，有人喊：“能否送到楼下？我加钱！”柜员：“人手不够，加钱也不送。”"]
    purpose: { learning: 有人愿意加钱但供给接不住，是供需错配信号 }
    automaticEffects:
      - { kind: add, key: userUnderstanding, value: 2 }
    dialogue:
      - { speaker: 系统, text: "“愿意加钱”和“有人接单”之间，隔着一个没人干的活。这就是机会的形状——也可能是运力的墙。" }
    terminal: true

  - id: v_e01_d03_laundry
    campaign: venture
    day: 3
    type: story
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 观察要区分“麻烦”和“可付费的麻烦” }
    scene: { location: dorm, characters: [] }
    setup: ["洗衣房。三台机器，一台坏了半个月没人修。等位的同学刷着手机骂了一句，然后继续等。"]
    automaticEffects: [{ kind: add, key: userUnderstanding, value: 2 }]
    dialogue:
      - { speaker: 你, text: "（记：洗衣房排队40分钟，无人愿组织拼机或预约）" }
      - { speaker: 系统, text: "骂完继续等=痛但不痛到掏钱。低优先级信号，归档。" }
    terminal: true

  - id: v_e01_d03_log_trim
    campaign: venture
    day: 3
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 3, phase: end }
    purpose: { learning: 问题日志要定期做减法，删掉不可达和低频 }
    scene: { location: dorm, characters: [] }
    setup: ["问题日志记到第11条。你发现有几条当时觉得有戏，现在看着发虚：比如“全校修电脑”，比如“给流浪猫建档案”。"]
    choices:
      - id: trim_log
        text: 砍掉够不着和低频的，留下5条高频且人找得到的
        visibleResponse: |
          砍完剩5条：社团收表、考研资料、打印格式、表白墙代做PPT、王姐排班。
          每条旁边你标了“找谁验证”。日志瘦了，可信度高了。
        hiddenEffects: [{ kind: add, key: evidenceDiscipline, value: 5 }, { kind: add, key: independence, value: 3 }]
      - id: keep_all
        text: 都留着，以后说不定有用
        visibleResponse: 日志变成仓库。三天后你打开它，每条都觉得“也行”，反而一条都定不下来。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 3 }]
    learningPoint: 选项越多，行动越少——日志也要做减法
    terminal: true

  - id: v_e01_d03_log_tool
    campaign: venture
    day: 3
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 记录工具够用就好，流程比工具重要 }
    scene: { location: dorm, characters: [] }
    setup: ["你纠结问题日志用什么记：同学安利了笔记软件，功能强大，学习成本半小时起。"]
    choices:
      - id: plain_note
        text: 手机自带备忘录+固定三栏：谁/在哪/卡在哪
        visibleResponse: 三栏备忘录用了一周，零上手成本，随想随记。工具没让你多记一条，也没少记一条。
        hiddenEffects: [{ kind: add, key: execution, value: 2 }, { kind: setFlag, key: simple_tools }]
      - id: fancy_app
        text: 上专业笔记软件，建数据库、加标签、做看板
        visibleResponse: 你折腾了两天模板，字段定义改了5版。第三天想记信号时，先想了想“该归哪个视图”——然后没记。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 3 }]
    learningPoint: 先有记录习惯，再谈记录工具
    terminal: true

  - id: v_e01_d04_wall_stats
    campaign: venture
    day: 4
    type: story
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 用频次统计代替印象：爬帖计数是穷人的市场调研 }
    scene: { location: dorm, characters: [] }
    setup: ["你花40分钟翻了表白墙本月带“代做”的帖子：代做PPT 31条、代抄笔记12条、代排队7条、代写周报5条。"]
    automaticEffects:
      - { kind: add, key: userUnderstanding, value: 3 }
      - { kind: addAsset, assetType: document, name: 表白墙代做帖统计, description: 月度频次计数, content: "PPT31/笔记12/排队7/周报5——PPT代做是显性需求" }
    dialogue:
      - { speaker: 系统, text: "31条代做PPT=有人在真金白银地懒。但注意：代做是你的对手，工具要跟人抢这份钱。" }
    terminal: true

  - id: v_e01_d04_note_copy
    campaign: venture
    day: 4
    type: npc
    trigger: { kind: random, weight: 2 }
    scene: { location: canteen, characters: [v_user_student] }
    setup: ["午饭。你看见小蔡对着手机拍同学的笔记。"]
    dialogue:
      - { speaker: 你, text: "干嘛呢？" }
      - { speaker: 小蔡, text: "学霸的笔记不外借，只准拍。我回去自己抄……第4遍了这学期。", mood: worried }
      - { speaker: 你, text: "拍下来不就行了？" }
      - { speaker: 小蔡, text: "拍下来是图片啊，翻起来费劲，还没法搜。要能变文字还有目录就好了——别推荐我用啥，我不学新软件。", mood: neutral }
    automaticEffects:
      - { kind: add, key: userUnderstanding, value: 4 }
      - { kind: addAsset, assetType: interview_notes, name: 访谈纪要·小蔡（笔记）, description: 图片笔记整理需求+不用新软件, content: "手抄4遍/图片难检索/拒绝学习成本" }
    terminal: true

  - id: v_e01_d05_aunt_phone
    campaign: venture
    day: 5
    type: npc
    trigger: { kind: random, weight: 2 }
    scene: { location: home, characters: [v_family] }
    setup: ["回家。邻居张阿姨正好来串门，拉着你说：“小 AI，你上次说能教我手机挂号？医院那个APP我点不明白。”"]
    dialogue:
      - { speaker: 张阿姨, text: "我儿女教我三遍了，转头就忘。你写个纸条一步步来，行不？" }
      - { speaker: 你, text: "（记：要的不是APP，是带得走的操作纸条；挂号每月1-2次，低频）" }
      - { speaker: 系统, text: "低频+高怕错=愿意为“别出错”付费。方向和你的学生市场很远，先记下。" }
    automaticEffects:
      - { kind: add, key: userUnderstanding, value: 3 }
      - { kind: addAsset, assetType: interview_notes, name: 访谈纪要·张阿姨, description: 低频高怕错场景, content: "手机挂号/怕点错/要纸条化指引" }
    terminal: true

  - id: v_e01_d05_reject_tactics
    campaign: venture
    day: 5
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 拦截式访谈成功率低，预约式质量高 }
    scene: { location: canteen, characters: [] }
    setup: ["食堂门口。你鼓起勇气想拦人问问题，前两个直接摆手走了。第三个停下来了，但眼神在找退路。"]
    choices:
      - id: short_pitch
        text: “耽误你90秒，就问一个问题：上次交社团表格折腾了多久？”
        visibleResponse: 90秒承诺兑现，对方答完反而多聊了两分钟。具体的问题+明确时限=拦截访谈的通行证。
        hiddenEffects: [{ kind: add, key: userUnderstanding, value: 4 }, { kind: add, key: execution, value: 2 }]
      - id: buy_snack
        text: 先请瓶水再开口，缓一缓尴尬
        visibleResponse: 水花了3元，对方喝着水聊了5分钟。成本高了，但信息密度也高。
        hiddenEffects: [{ kind: subtract, key: money, value: 3 }, { kind: add, key: userUnderstanding, value: 5 }]
      - id: give_up_today
        text: 算了，回宿舍线上发问卷
        visibleResponse: 问卷发出去了，回收3份，2份全选B。线上问卷躲开了尴尬，也躲开了真话。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 3 }]
    terminal: true

  - id: v_e01_d06_wangjie_ledger
    campaign: venture
    day: 6
    type: npc
    trigger: { kind: random, weight: 2 }
    scene: { location: shop, characters: [v_user_shop] }
    setup: ["下午三点，奶茶店空档。王姐在算账，计算器按得飞快。"]
    dialogue:
      - { speaker: 你, text: "王姐，现在用的啥记账？" }
      - { speaker: 王姐, text: "纸上记，晚上输到手机里。一天一百多单，输到眼花。", mood: neutral }
      - { speaker: 你, text: "为啥不直接用收银系统？" }
      - { speaker: 王姐, text: "收银系统一年一千八，还要换打印机。我这本子免费，就是费眼睛。小伙子，你能弄个几十块一年的不？", mood: happy }
      - { speaker: 系统, text: "重要线索：小微商户嫌月费贵，嫌学习难，但“几十块一年”在她们的付费射程内。" }
    automaticEffects:
      - { kind: add, key: userUnderstanding, value: 5 }
      - { kind: addAsset, assetType: interview_notes, name: 访谈纪要·王姐（记账）, description: 小微商户价格锚：几十块一年, content: "纸上记+晚间录入/嫌系统贵/可接受几十元一年" }
    terminal: true

  - id: v_e01_d06_teacher_view
    campaign: venture
    day: 6
    type: story
    trigger: { kind: day, day: 6, phase: end }
    purpose: { learning: 侧听旁观者：老师看学生的苦,视角不同于学生 }
    scene: { location: lab, characters: [] }
    setup: ["你去问社团指导老师收表的事。老师叹气：“每年9月我邮箱塞满附件，几十个命名乱的压缩包。我让学生主席汇总，他再叹气。”"]
    automaticEffects:
      - { kind: add, key: userUnderstanding, value: 4 }
      - { kind: addAsset, assetType: interview_notes, name: 访谈纪要·指导老师, description: 旁观者视角：附件地狱, content: "9月附件地狱/层层转包给学生骨干" }
    terminal: true

  - id: v_e01_d07_past_payment
    campaign: venture
    day: 7
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 问过去的付费记录，比问未来意愿可信十倍 }
    scene: { location: canteen, characters: [v_user_student] }
    setup: ["访谈小蔡的研友小周。你想验证“考研资料整理有人愿意花钱”。"]
    choices:
      - id: ask_past_paid
        text: “你为考研资料花过钱吗？最近一次买的什么？”
        visibleResponse: 小周翻出订单：39元买了份押题整理，9.9元买过打印版。“疼就买，不疼不买。”——过去的行为，白纸黑字。
        hiddenEffects: [{ kind: add, key: userUnderstanding, value: 6 }, { kind: add, key: evidenceDiscipline, value: 4 }]
      - id: ask_would_pay
        text: “如果有自动整理工具，你愿意付多少钱？”
        visibleResponse: “30？50？看做好啥样吧。”——报价随口而出，跟不随口一样不可信。你把这条记成了弱证据。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 4 }]
    learningPoint: 付费记录是硬证据，付费意愿是空气
    terminal: true

  - id: v_e01_d07_friend_bias
    campaign: venture
    day: 7
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 7, phase: end }
    purpose: { learning: 样本偏差：熟人访谈全在舒适区 }
    scene: { location: dorm, characters: [] }
    setup: ["你盘了盘访谈记录：8个人里6个是室友、同学和老K的朋友。数据挺好看，可他们都不好意思说你坏话。"]
    choices:
      - id: cold_interview
        text: 补3个纯陌生访谈：隔壁班、贴吧、快递站随机约
        visibleResponse: |
          陌生人的嘴不留情：“这功能XX小程序早有了吧？”“免费我就试试。”
          难听，但这两句比你8场熟人访谈加起来都有用。
        hiddenEffects: [{ kind: add, key: userUnderstanding, value: 8 }, { kind: add, key: independence, value: 4 }, { kind: achievement, achievementId: ach_v_cold_interview }]
      - id: stay_comfy
        text: 熟人成本低，就先聊熟人
        visibleResponse: 舒适区的数据第17天上线时还了回来：真实用户的第一句反馈，比所有熟人反馈都刻薄。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 5 }, { kind: setFlag, key: sample_bias }]
    learningPoint: 熟人是访谈的止疼药，陌生人是检验
    terminal: true

  - id: v_e01_d08_gym_counter
    campaign: venture
    day: 8
    type: story
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 行为数据>口头抱怨：计数是最便宜的观察 }
    scene: { location: canteen, characters: [] }
    setup: ["健身房门口。你站着数了20分钟：进来41人，其中17人到前台问“今天团课几点”，前台把同一句回答重复了17遍。"]
    automaticEffects: [{ kind: add, key: userUnderstanding, value: 3 }]
    dialogue:
      - { speaker: 系统, text: "重复回答17遍=一张该贴墙上的纸。小痛点，但它教你一件事：数量化的观察才有说服力。" }
    terminal: true

  - id: v_e01_d08_studyroom
    campaign: venture
    day: 8
    type: story
    trigger: { kind: random, weight: 2 }
    scene: { location: dorm, characters: [] }
    setup: ["自习室。书包占座现象普遍，空位上全是书包，人不在。一个找座的同学转了两圈走了，嘴里骂骂咧咧。"]
    automaticEffects: [{ kind: add, key: userUnderstanding, value: 2 }]
    dialogue:
      - { speaker: 你, text: "（记：占座使座位利用率不到一半；学校有预约系统但没人用——为什么？）" }
      - { speaker: 系统, text: "追问“为什么没人用”比“要不要做个新的”更重要。已有方案失败的原因是免费的教训。" }
    terminal: true

  - id: v_e01_d09_quad
    campaign: venture
    day: 9
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 9, phase: end }
    purpose: { learning: 用户细分：频率×付费意愿四象限 }
    scene: { location: dorm, characters: [] }
    setup: ["访谈攒到12份。你把每个人往两个轴上放：问题频率（每天/每学期）、付费意愿（已付过/只动嘴）。"]
    choices:
      - id: draw_quad
        text: 画四象限，只锁定“高频+已付过”那一格
        visibleResponse: |
          高频+付过：老K、辩论队社长、王姐——3人，但每人背后是一群人。
          你把另外9人的纪要归档，格子外的人不再出现在你的文案里。
        hiddenEffects: [{ kind: add, key: userUnderstanding, value: 8 }, { kind: setFlag, key: quad_done }, { kind: achievement, achievementId: ach_v_quad }]
      - id: no_quad
        text: 都重要，四象限太机械了
        visibleResponse: 文案写出来谁都想覆盖，结果谁看了都觉得“跟我关系不大”。细分不是机械，是聚焦。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 4 }]
    learningPoint: 先服务付过钱的高频用户，再谈其他
    terminal: true

  - id: v_e01_d09_persona
    campaign: venture
    day: 9
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 用户画像卡：给用户起名，让团队对话有共同对象 }
    scene: { location: dorm, characters: [] }
    setup: ["你决定把目标用户写成一张卡，贴在显示器旁。"]
    choices:
      - id: write_persona
        text: “社长小陈”：管150人社/每月2场活动/最烦合并表格/预算几十到几百
        visibleResponse: 画像卡贴好了。之后每次犹豫“这功能做不做”，你就问：小陈会用吗？答案立刻清晰。
        hiddenEffects: [{ kind: addAsset, assetType: document, name: 用户画像·社长小陈, description: 目标用户卡, content: "150人社/月2场活动/烦合并/预算几十到几百" }, { kind: add, key: userUnderstanding, value: 4 }]
      - id: broad_persona
        text: 写宽点：“所有大学生”都是用户
        visibleResponse: 所有人=没有人。“所有大学生”这张卡贴上去三天，你自己都忘了看它。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 3 }]
    terminal: true

  - id: v_e01_d10_grad_handover
    campaign: venture
    day: 10
    type: story
    trigger: { kind: day, day: 10, phase: end }
    purpose: { learning: 边缘用户访谈：交接期的痛是年度性的深痛 }
