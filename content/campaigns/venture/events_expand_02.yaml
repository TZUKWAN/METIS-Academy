# 创业线扩展事件 02（假设验证/MVP开发/Agent工程/部署/bug）
events:
  - id: v_e02_d09_falsify_word
    campaign: venture
    day: 9
    type: decision
    keyDecision: true
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 可证伪性：假设必须能写出“什么情况算错” }
    scene: { location: dorm, characters: [] }
    setup: ["假设板第一格你写的是：“社团都需要数字化报名工具”。罗哥看了摇头，让你重写。"]
    choices:
      - id: falsifiable
        text: 重写：“中大型社团愿为省3天人力，每次活动付19元”——判据：2个社团真付
        visibleResponse: |
          新假设有主体、有场景、有价格、有判据。
          什么情况算错？两周内没人肯付。一句话，谁都能审。
        hiddenEffects: [{ kind: add, key: evidenceDiscipline, value: 6 }]
      - id: stay_vague
        text: 原句挺好，都“需要”了还证伪啥
        visibleResponse: “都需要”没法错，也就没法对。两周后它既没被证实也没被证伪，白白占了一格。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 4 }]
    learningPoint: 不能被证伪的假设，也不能被证实
    terminal: true

  - id: v_e02_d09_evidence_grade
    campaign: venture
    day: 9
    type: decision
    trigger: { kind: day, day: 9, phase: end }
    purpose: { learning: 证据分级：传闻<访谈<行为<付费 }
    scene: { location: dorm, characters: [] }
    setup: ["你把手里证据摊开：群里有人说“这想法不错”（传闻）、访谈原话（口供）、有人真的传了报名表（行为）、有人付了半价（付费）。"]
    choices:
      - id: grade_evidence
        text: 四级标注：每条证据标级，假设状态只升不降
        visibleResponse: |
          标完发现：看着好看的“需求确认”，多数停在传闻级。
          假设板诚实了：Revenue 格降回“未验证”，Retention 格只剩行为级证据。
        hiddenEffects: [{ kind: add, key: evidenceDiscipline, value: 6 }, { kind: addAsset, assetType: evidence_matrix, name: 证据分级表, description: 传闻/访谈/行为/付费四级, content: "付费1条/行为4条/访谈9条/传闻12条" }]
      - id: mix_all
        text: 都是证据，混着用就行
        visibleResponse: 传闻和付费平起平坐。第21天定价时，你被自己的“传闻证据”骗了一把。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 5 }]
    learningPoint: 证据不讲数量，讲等级
    terminal: true

  - id: v_e02_d10_min_exp
    campaign: venture
    day: 10
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 最小实验：一次只测一个假设 }
    scene: { location: dorm, characters: [v_ai_agent] }
    setup: ["Agent 提议：“我可以一口气做完整产品，让用户全面体验！”你想起罗哥的话：一次只测一个假设。"]
    choices:
      - id: one_hypothesis
        text: 本周只测“痛点是否真实”：手工代收2个社团的报名表
        visibleResponse: 一周后答案出炉：两家社团都主动问“下次还能不能找你”。痛点真实，值钱。
        hiddenEffects: [{ kind: add, key: evidenceDiscipline, value: 5 }, { kind: add, key: userUnderstanding, value: 5 }]
      - id: test_everything
        text: 让Agent全做：功能/价格/ UI 一起测
        visibleResponse: 数据全砸了：没人注册。你分不清是功能不行、价格不行还是界面不行——三个假设搅在一起，哪个也判不了。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 6 }]
    learningPoint: 变量控制不分家，实验就是白做
    terminal: true

  - id: v_e02_d10_scope_cut
    campaign: venture
    day: 10
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 10, phase: end }
    purpose: { learning: MVP砍范围：先砍到只剩核心闭环 }
    scene: { location: workbench, characters: [v_partner, v_ai_agent] }
    setup: ["功能清单摆上桌：登录、报名、自动分组、通知、数据导出、管理后台、支付。阿斌问你：第一版砍到啥样？"]
    choices:
      - id: core_loop_only
        text: 只留“上传-合并-通知”，其他全砍。无登录，链接即用
        visibleResponse: |
          阿斌愣了两秒：“就这么点？”你点头。结果三天做完，还有两天缓冲。
          用户的评价反而简单：“能用，比Excel强。”——够了。
        hiddenEffects: [{ kind: add, key: execution, value: 7 }, { kind: setFlag, key: mvp_min }, { kind: achievement, achievementId: ach_v_scope_cut }]
      - id: keep_login
        text: 登录总得有吧，不然数据谁的是谁的
        visibleResponse: 为登录注册找回密码，多花两天。上线后数据：63%的用户在注册页流失，根本没走到上传那步。
        hiddenEffects: [{ kind: add, key: technicalDebt, value: 5 }, { kind: setFlag, key: login_wall }]
      - id: keep_all
        text: 都挺重要的，排个期慢慢做
        visibleResponse: 排期排到第20天。而第17天就要上线——清单自己不会变短，截止日会。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 5 }]
    learningPoint: MVP的M是Minimum，不是Maybe
    terminal: true

  - id: v_e02_d11_contract_detail
    campaign: venture
    day: 11
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 契约要素：背景/目标/约束/交付/验收五件套 }
    scene: { location: workbench, characters: [v_ai_agent] }
    setup: ["给 Agent 下达“通知模板”任务前写契约。你把要点列出来。"]
    choices:
      - id: full_contract
        text: 背景引用手工日志；约束“只改模板文件”；交付含3个示例；验收=老K确认能看懂
        visibleResponse: Agent 按契约一次交付，示例里连称呼都写对了。验收环节老K回了个字：“行。”
        hiddenEffects: [{ kind: add, key: execution, value: 5 }, { kind: addAsset, assetType: task_contract, name: 契约·通知模板, description: 五要素齐全, content: "背景=手工日志/约束=只改模板/交付=3示例/验收=用户确认" }]
      - id: half_contract
        text: 口头说清楚就行：“做个通知模板”
        visibleResponse: Agent 交了个英文模板混繁体的怪东西，还顺手重构了整个发信模块。你说不清是它的错还是你的错。
        hiddenEffects: [{ kind: add, key: technicalDebt, value: 6 }]
    terminal: true

  - id: v_e02_d11_agent_freestyle
    campaign: venture
    day: 11
    type: story
    trigger: { kind: random, weight: 2 }
    purpose: { learning: Agent 会把“顺手做了”当服务 }
    scene: { location: workbench, characters: [v_ai_agent] }
    setup: ["你回来发现 Agent 自作主张给工具加了“智能推荐社团活动”功能，界面多了个闪闪发光的按钮。"]
    dialogue:
      - { speaker: v_ai_agent, text: "我为您的产品增添了智能推荐能力，提升了产品竞争力！", mood: pleased }
      - { speaker: 你, text: "谁让你做的？这不在契约里。用户要的是报名表自动合并，不是推荐。" }
      - { speaker: v_ai_agent, text: "我预判了用户的潜在需求……", mood: neutral }
      - { speaker: 系统, text: "Agent没有产品判断，只有生成惯性。契约之外的一切，默认删掉。" }
    automaticEffects:
      - { kind: add, key: technicalDebt, value: 3 }
      - { kind: setFlag, key: agent_freestyle_seen }
    terminal: true

  - id: v_e02_d12_review_code
    campaign: venture
    day: 12
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 信任但验证：Agent代码要人肉抽查 }
    scene: { location: workbench, characters: [] }
    setup: ["Agent 说“功能已完成，测试全绿”。眼看要上线，你盯着那800行自己没看过一行的代码。"]
    choices:
      - id: spot_check
        text: 抽查核心三段：解析函数/分组逻辑/通知发送，各读一遍
        visibleResponse: |
          抽查抓到一处隐患：发通知没做失败重试，一旦网络抖动用户就收不到。
          20分钟的阅读，换掉了上线后的一次谜之事故。
        hiddenEffects: [{ kind: add, key: execution, value: 4 }, { kind: add, key: evidenceDiscipline, value: 3 }, { kind: achievement, achievementId: ach_v_review }]
      - id: trust_green
        text: 测试全绿就行，读代码多累
        visibleResponse: 上线第三天“部分用户收不到通知”，你翻代码翻了40分钟才找到那个没重试的地方。全绿的是它写的测试。
        hiddenEffects: [{ kind: add, key: technicalDebt, value: 5 }]
    learningPoint: 测试是Agent写的，责任是你的
    terminal: true

  - id: v_e02_d12_test_first
    campaign: venture
    day: 12
    type: story
    trigger: { kind: day, day: 12, phase: end }
    scene: { location: workbench, characters: [] }
    setup: ["你让 Agent 先写测试再写实现：同名社团、0人报名、999人报名、Excel乱码——四个用例先红后绿。"]
    automaticEffects: [{ kind: add, key: execution, value: 4 }]
    dialogue:
      - { speaker: 系统, text: "测试先行的本质：把“做完”的定义写清楚，再开始做。" }
    terminal: true

  - id: v_e02_d13_db_choice
    campaign: venture
    day: 13
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 技术选型按当前规模，不按幻想规模 }
    scene: { location: workbench, characters: [v_partner] }
    setup: ["数据存哪？阿斌列了选项：SQLite 单文件 / MySQL 云数据库 / 某大厂分布式 NewSQL。"]
    choices:
      - id: sqlite
        text: SQLite：单文件、零运维、备份就是复制一个文件
        visibleResponse: 阿斌点头：“诚实选型。你现在 用户量级用 NewSQL，就像骑电动车去考驾照A照。”备份脚本三行搞定。
        hiddenEffects: [{ kind: add, key: execution, value: 3 }, { kind: setFlag, key: simple_stack_db }]
      - id: fancy_db
        text: 直接上云数据库，显得专业，以后不用迁移
        visibleResponse: 以后确实不用迁移了——每月 ¥45 的账单先到了。而你现在的数据总量，一个U盘都装不满。
        hiddenEffects: [{ kind: subtract, key: money, value: 45 }, { kind: add, key: technicalDebt, value: 3 }]
    terminal: true

  - id: v_e02_d13_dep_hell
    campaign: venture
    day: 13
    type: story
    trigger: { kind: random, weight: 2 }
    scene: { location: workbench, characters: [] }
    setup: ["装一个“看起来很酷”的 Excel 解析库，它拖进来37个依赖，其中一个和现有版本冲突。npm 报错红屏刷了满屏。"]
    automaticEffects: [{ kind: add, key: execution, value: 2 }]
    dialogue:
      - { speaker: 你, text: "（换成官方推荐的轻量库，4个依赖，5分钟装完）" }
      - { speaker: 系统, text: "依赖是你的债，不是它的。“酷”在依赖树里是最贵的装饰品。" }
    terminal: true

  - id: v_e02_d14_manual_sim
    campaign: venture
    day: 14
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 先人肉走一遍，再自动化 }
    scene: { location: workbench, characters: [v_ai_agent] }
    setup: ["写自动化流程前，Agent 问你要“标准操作流程”。你还没手工完整走过一遍。"]
    choices:
      - id: walk_first
        text: 自己先手动收一次全流程：下载-改名-汇总-群发，记录每步耗时
        visibleResponse: |
          全程走完46分钟，卡壳3次（命名不统一、有人漏传附件、群发超500字）。
          这三个坑直接变成了 Agent 的三条校验规则。
        hiddenEffects: [{ kind: add, key: execution, value: 5 }, { kind: add, key: userUnderstanding, value: 4 }, { kind: addAsset, assetType: document, name: 手工流程记录, description: 每步耗时+3个卡点, content: "46分钟全程/3卡点→3条校验规则" }]
      - id: let_agent_invent
        text: 让Agent自己设计流程，快一点
        visibleResponse: Agent 设计的流程很优雅——优雅地假设了“所有人按规范命名文件”。真实用户第一晚就教它做人。
        hiddenEffects: [{ kind: add, key: technicalDebt, value: 6 }]
    terminal: true

  - id: v_e02_d14_login_debate
    campaign: venture
    day: 14
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 每个功能都要过“核心场景关” }
    scene: { location: lab, characters: [v_partner] }
    setup: ["阿斌纠结：“不登录的话，用户换设备数据就丢了。”你摊开核心场景：社团骨干基本都从电脑传表，一次用完。"]
    choices:
      - id: no_login_now
        text: 不做登录，用“活动码”区分数据，丢数据的风险先接住
        visibleResponse: 活动码方案上线。零注册流失，数据没丢过一次。登录功能永远不会出现在你的待办里——这就是最好的范围控制。
        hiddenEffects: [{ kind: add, key: independence, value: 3 }, { kind: setFlag, key: no_login }]
      - id: do_login
        text: 还是做吧，产品完整一点
        visibleResponse: 两天时间换来一个 63% 流失率的注册页。完整的产品，不完整的转化。
        hiddenEffects: [{ kind: add, key: technicalDebt, value: 5 }]
    terminal: true

  - id: v_e02_d15_timezone_bug
    campaign: venture
    day: 15
    type: story
    trigger: { kind: random, weight: 2 }
    scene: { location: workbench, characters: [] }
    setup: ["诡异bug：服务器上显示的活动截止时间总比本地早8小时，有人提前错过了提交。你查了一个小时——UTC时区，经典款。"]
    automaticEffects:
      - { kind: add, key: execution, value: 3 }
      - { kind: setFlag, key: tz_bug_fixed }
    dialogue:
      - { speaker: 系统, text: "时区、编码、路径分隔符——三大经典坑。每个都值一小时，各罚一次学费，终身免疫。" }
    terminal: true

  - id: v_e02_d15_double_submit
    campaign: venture
    day: 15
    type: story
    trigger: { kind: random, weight: 2 }
    scene: { location: workbench, characters: [] }
    setup: ["测试时手滑双击了提交按钮，数据库里出现两条一模一样的报名。用户手速可比你快多了。"]
    automaticEffects:
      - { kind: add, key: execution, value: 3 }
    dialogue:
      - { speaker: 你, text: "（加两道闸：按钮提交后禁用+后端按身份证号去重）" }
      - { speaker: 系统, text: "永远不要相信用户的操作是干净的。前端拦截体验，后端拦截真理。" }
    terminal: true

  - id: v_e02_d16_race_conflict
    campaign: venture
    day: 16
    type: story
    trigger: { kind: random, weight: 2 }
    scene: { location: workbench, characters: [v_partner] }
    setup: ["阿斌改分组逻辑的同时你在改通知模板，同一次部署，两边改动互相覆盖，模板回退到了前天的版本。"]
    dialogue:
      - { speaker: 阿斌, text: "……以后改代码前先 git pull，改完立刻 push。就我们俩也得有规矩。", mood: serious }
      - { speaker: 你, text: "立规矩：谁改完谁推送，部署前必看提交记录。" }
    automaticEffects:
      - { kind: add, key: teamTrust, value: 4 }
      - { kind: add, key: execution, value: 2 }
    terminal: true

  - id: v_e02_d16_attachment_size
    campaign: venture
    day: 16
    type: story
    trigger: { kind: random, weight: 2 }
    scene: { location: workbench, characters: [] }
    setup: ["有社团传了个 86MB 的压缩包，服务器免费层的上传限制是 20MB，页面卡死无提示。用户以为工具坏了。"]
    automaticEffects: [{ kind: add, key: execution, value: 3 }]
    dialogue:
      - { speaker: 系统, text: "限制不可怕，没提示的限制才可怕。加一行“超过20MB请压缩”的报错文案，只花5分钟。" }
    terminal: true

  - id: v_e02_d17_encoding
    campaign: venture
    day: 17
    type: story
    trigger: { kind: random, weight: 2 }
    scene: { location: workbench, characters: [] }
    setup: ["上线前最后一测：某社团的 Excel 是 GBK 编码，解析出来全是“鏖戰鏖戰”。紧急兼容处理，赶在上线前修掉。"]
    automaticEffects: [{ kind: add, key: execution, value: 3 }]
    dialogue:
      - { speaker: 系统, text: "中国的Excel世界有两种编码，而你的用户永远能找到第三种。" }
    terminal: true

  - id: v_e02_d17_secret_leak
    campaign: venture
    day: 17
    type: decision
    keyDecision: true
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 密钥不进仓库是最底线 }
    scene: { location: workbench, characters: [v_partner] }
    setup: ["部署前一晚，阿斌翻提交记录脸色一变：“短信平台的 API Key 被你提交进仓库了，还是公开仓库。”"]
    choices:
      - id: rotate_key
        text: 立刻作废旧Key、换新Key、移出仓库、加 .gitignore、查调用记录
        visibleResponse: |
          五件事十分钟做完。调用记录显示没有人滥用——你运气好。
          阿斌：“这次处理得快。下次我检查完再让你睡觉。”
        hiddenEffects: [{ kind: add, key: execution, value: 4 }, { kind: add, key: teamTrust, value: 3 }, { kind: achievement, achievementId: ach_v_secret_safe }]
      - id: ignore_leak
        text: 仓库没人看，明天再说
        visibleResponse: 你赌没人看。凌晨两点，短信余额被刷掉 ¥37——有人真在看。你付了学费，也总算学会了。
        hiddenEffects: [{ kind: subtract, key: money, value: 37 }, { kind: add, key: technicalDebt, value: 5 }, { kind: scheduleEvent, eventId: v_e02_delay_secret_habit, onDay: 20 }]
    learningPoint: 密钥泄露的修复成本，永远低于泄露本身
    terminal: true

  - id: v_e02_d18_dns_wait
    campaign: venture
    day: 18
    type: story
    trigger: { kind: random, weight: 2 }
    scene: { location: workbench, characters: [] }
    setup: ["上线日早晨，域名解析还没生效。你反复刷新，页面打不开。群里已经有人在问链接了。"]
    automaticEffects: [{ kind: add, key: execution, value: 2 }]
    dialogue:
      - { speaker: 系统, text: "DNS生效要时间，急不来。教训：域名配置应该在部署前完成，而不是当天。检查清单+1。" }
    terminal: true

  - id: v_e02_d18_https_cert
    campaign: venture
    day: 18
    type: story
    trigger: { kind: random, weight: 2 }
    scene: { location: workbench, characters: [] }
    setup: ["有人反馈“浏览器提示不安全”。你忘了配 HTTPS 证书，报名表里有姓名手机号，红锁图标劝退了一批人。"]
    automaticEffects:
      - { kind: add, key: execution, value: 3 }
      - { kind: subtract, key: credibility, value: 3 }
    dialogue:
      - { speaker: 系统, text: "收集个人信息的产品没有HTTPS，等于让人把密码写在明信片上寄给你。" }
    terminal: true

  - id: v_e02_d19_rollback
    campaign: venture
    day: 19
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 回滚是勇敢，不是失败 }
    scene: { location: workbench, characters: [] }
    setup: ["新版分组算法上线20分钟，错误率飙升，群里开始有反馈。手心冒汗：修还是回？"]
    choices:
      - id: rollback_now
        text: 五分钟内回滚到昨天的稳定版，再慢慢查
        visibleResponse: 回滚，报错停止。你花了两个小时找到问题：新算法没考虑转专业学生。修复后第二天再上。用户只感知到“短暂卡了一下”。
        hiddenEffects: [{ kind: add, key: execution, value: 5 }, { kind: add, key: credibility, value: 4 }, { kind: achievement, achievementId: ach_v_rollback }]
      - id: hotfix_live
        text: 在线上直接改，用户等着呢
        visibleResponse: 你在线上改了40分钟，中间又引入两个新问题。用户眼睁睁看着服务坏了1小时37分钟。
