  - id: v_e03_d19_conversion_sheet
    campaign: venture
    day: 19
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 渠道要有转化数据，感觉靠不住 }
    scene: { location: workbench, characters: [] }
    setup: ["你同时在做5件事引流。室友问哪个渠道最有效，你张口结舌——从没分开统计过。"]
    choices:
      - id: track_channels
        text: 每个渠道带专属注册链接，建表统计：曝光/注册/激活
