    campaign: venture
    day: 18
    type: story
    trigger: { kind: random, weight: 2 }
    scene: { location: dorm, characters: [] }
    setup: ["惊喜：辩论队社长自己录了个使用视频发在社团圈——“给你们安利个神器，真的只要3分钟。”配了6张截图。"]
