  - id: v_e03_d17_free_friend
    campaign: venture
    day: 17
    type: decision
    trigger: { kind: random, weight: 2 }
    scene: { location: dorm, characters: [] }
    setup: ["老同学发消息：“听说你做了个工具？给我免费开个永久会员呗，兄弟。”"]
