# 创业线扩展事件 03（首批用户/获客/内容营销/社区/冷启动）
events:
  - id: v_e03_d17_seed_list
    campaign: venture
    day: 17
    type: decision
    keyDecision: true
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 种子用户名单：先列人，再上线 }
    scene: { location: dorm, characters: [] }
    setup: ["上线前夜。你不写开发计划了，改写一张名单：谁会是最想用这个工具的前20个人？"]
    choices:
      - id: write_names
        text: 逐个写名字和来源：老K系4人、访谈认识6人、群潜水观察8人、老K转介绍2人
        visibleResponse: |
          名单20人，每个名字后面写着“为什么是他”。
          上线当天你挨个私信，回复15个，注册9个——种子名单的转化率，是广撒网的五倍。
        hiddenEffects: [{ kind: add, key: users, value: 9 }, { kind: add, key: userUnderstanding, value: 4 }, { kind: achievement, achievementId: ach_v_seed_list }]
      - id: wait_for_users
        text: 不列名单，产品好自然有人来
        visibleResponse: 上线三天，后台安静得能听见风扇声。好产品不会自带喇叭，冷启动等不来风。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 5 }]
    learningPoint: 冷启动的答案在上线上线前就写好了
    terminal: true

  - id: v_e03_d17_cold_dm
    campaign: venture
    day: 17
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 冷私信三件套：你是谁/对你有啥用/90秒能试 }
    scene: { location: dorm, characters: [] }
    setup: ["你要给不认识的社团骨干发私信。第一条草稿：\"您好，我们是一款革命性的社团管理平台……\"。你删了。"]
    choices:
      - id: value_first
        text: 重写：一句他的场景+一个数字+“发我一份样表，3分钟还你合并结果”
        visibleResponse: |
          “师兄，听说你们收报名表要合并三天。发我一份空表，3分钟还你合并结果，免费。”
          发出10条，回7条，传表5个。冷私信的秘诀：先给再要。
        hiddenEffects: [{ kind: add, key: users, value: 5 }, { kind: add, key: execution, value: 3 }]
      - id: long_pitch
        text: 发长文介绍产品全貌，显得专业
        visibleResponse: 发出10条长文，回1条，回复内容是“谢谢，暂时不需要”。没人读陌生人的产品说明书。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 4 }]
    learningPoint: 冷启动的第一句话是给，不是要
    terminal: true

  - id: v_e03_d18_door_to_door
    campaign: venture
    day: 18
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 首批用户要上门服务，不是等人来 }
    scene: { location: lab, characters: [] }
    setup: ["摄影社注册了但没动静。你决定抱着电脑直接去他们活动室。"]
    choices:
      - id: on_site_setup
        text: 上门：帮他们把上周的报名表当场传上去，跑通全流程
        visibleResponse: |
          25分钟，当场跑通。社长看着合并结果：“哦？这就完了？”
          当晚摄影社的通知发出去了。第二天，他们隔壁街舞社也注册了。
        hiddenEffects: [{ kind: add, key: users, value: 2 }, { kind: add, key: userUnderstanding, value: 5 }, { kind: setFlag, key: onsite_won }]
      - id: send_manual
        text: 甩个教程链接过去，让他们自己琢磨
        visibleResponse: 三天后回访，社长：“哦那个啊，收藏了还没看。”收藏夹是互联网的坟墓。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 4 }]
    learningPoint: 前10个用户，值得你一个一个上门
    terminal: true

  - id: v_e03_d18_first_accompany
    campaign: venture
    day: 18
    type: story
    trigger: { kind: day, day: 18, phase: end }
    purpose: { learning: 首用陪跑：看用户卡在哪，比问用户强 }
    scene: { location: lab, characters: [v_user_club] }
    setup: ["老K首次完整使用，你全程在旁边看着，不说话，只记录。"]
    dialogue:
      - { speaker: 老K, text: "（自言自语）传哪儿……哦这儿。这个按钮是什么……先不管。诶，出来了。", mood: neutral }
      - { speaker: 你, text: "（记录：卡顿2处，用时4分半，中途想退出1次，最后说了句“行”）" }
      - { speaker: 系统, text: "4分半里藏着你的整个改进清单。沉默地看，比热心地指导值钱十倍。" }
    automaticEffects:
      - { kind: addAsset, assetType: user_feedback, name: 首用观察·老K, description: 无干扰陪跑记录, content: "2卡顿/4分30秒/1次想退出/最终认可" }
      - { kind: add, key: userUnderstanding, value: 5 }
    terminal: true

  - id: v_e03_d18_post_timing
    campaign: venture
    day: 18
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 渠道参数：连发帖时间都要测 }
    scene: { location: dorm, characters: [] }
    setup: ["准备在社团联合会群里发介绍帖。群消息高峰在午休和晚10点后，你现在是大下午3点。"]
    choices:
      - id: wait_peak
        text: 存草稿，晚上9:58发，蹭晚高峰
        visibleResponse: 晚10点档发出。当晚消息被顶到群上半区，收到6个私聊询问。同样的内容，黄金时段多一半回音。
        hiddenEffects: [{ kind: add, key: users, value: 3 }, { kind: setFlag, key: timing_tested }]
      - id: send_now
        text: 现在就发，等不了
        visibleResponse: 下午3点发出，20分钟后被课程通知和拼单消息顶没了。内容没错，时辰错了。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 3 }]
    terminal: true

  - id: v_e03_d19_tutorial_post
    campaign: venture
    day: 19
    type: decision
    keyDecision: true
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 内容营销：教程即软广 }
    scene: { location: workbench, characters: [v_ai_agent] }
    setup: ["你打算写点东西引流。Agent 建议写《XX工具：重新定义社团管理》。你把它按住了。"]
    choices:
      - id: write_case
        text: 写《我用3天收完72个社团的报名表（附方法）》，工具只在结尾露一面
        visibleResponse: |
          干货帖在两个群被转。有人评论区问“用的什么工具”，别人替你回答了。
          当天注册+7，全部来自看完方法后才想试的人——转化质量极高。
        hiddenEffects: [{ kind: add, key: users, value: 7 }, { kind: add, key: credibility, value: 5 }, { kind: achievement, achievementId: ach_v_content }]
      - id: write_ad
        text: 就写产品宣传文，直球营销
        visibleResponse: 帖子发出去石沉大海，仅有的1条评论是“广告吧”。用户要方法，不要形容词。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 4 }]
    learningPoint: 先给方法再提工具，广告才有人看
    terminal: true

  - id: v_e03_d19_fail_post
    campaign: venture
    day: 19
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 失败复盘是最好的信任内容 }
    scene: { location: dorm, characters: [] }
    setup: ["你手上有现成的素材：上线首日那次通知重复发送的事故，和你一小时救火的全过程。"]
    choices:
      - id: post_failure
        text: 发《我搞挂了自己的第一次付费通知，然后一小时赚回信任》
        visibleResponse: |
          帖子被一个创业群转了。评论区说“这比那些装完美的靠谱”。
          有两个社长因为这篇帖子来试用——真实感是最好的获客文案。
        hiddenEffects: [{ kind: add, key: credibility, value: 6 }, { kind: add, key: users, value: 2 }]
      - id: hide_failure
        text: 事故就压下去，别自己揭短
        visibleResponse: 压住了。但你的“内容库存”里从此全是四平八稳的产品文，没有一篇能打。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 2 }]
    terminal: true

  - id: v_e03_d20_build_group
    campaign: venture
    day: 20
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 用户群的价值是反馈速度，不是规模 }
    scene: { location: dorm, characters: [] }
    setup: ["用户过30了，零散反馈管理不过来。要不要建个用户群？"]
    choices:
      - id: build_small
        text: 建群，但只拉真实用过的20人，群名就叫“报名管家体验官”
        visibleResponse: |
          小群质量极高：当天问题当天反馈，你修完直接在群里@。
          一周后这个群产生了你的第一批“自来水”——他们拉来了6个新社团。
        hiddenEffects: [{ kind: add, key: users, value: 6 }, { kind: add, key: userUnderstanding, value: 6 }, { kind: setFlag, key: user_group }]
      - id: big_group
        text: 建大群，注册就拉，冲500人
        visibleResponse: 群冲到120人，然后开始讨论食堂和游戏。你发的更新公告淹没在斗图里。人数不等于社区。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 4 }]
    terminal: true

  - id: v_e03_d20_group_rules
    campaign: venture
    day: 20
    type: story
    trigger: { kind: day, day: 20, phase: end }
    scene: { location: dorm, characters: [] }
    setup: ["体验官群规三行：①问题随便提，截图最好 ②更新提前在这公告 ③扯皮去别处。第三行是老K建议加的。"]
    automaticEffects:
      - { kind: add, key: teamTrust, value: 2 }
      - { kind: setFlag, key: group_rules_set }
    dialogue:
      - { speaker: 系统, text: "社区的味道=群规的味道。前三条消息定调，比之后一百条管理都管用。" }
    terminal: true

  - id: v_e03_d21_group_quiet
    campaign: venture
    day: 21
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 群冷了要用钩子唤醒，不是用红包硬砸 }
    scene: { location: dorm, characters: [] }
    setup: ["体验官群连续4天没消息。打开一看，最后一条还是你发的更新公告。"]
    choices:
      - id: throw_topic
        text: 抛话题：“你们下次活动都什么时候？我把提醒功能排个优先级”
        visibleResponse: 群活了：8个社团报了时间，2个顺带提了新需求。用户不冷，是你没给他们说话的理由。
        hiddenEffects: [{ kind: add, key: userUnderstanding, value: 5 }, { kind: setFlag, key: group_revived }]
      - id: send_redpacket
        text: 发红包救场
        visibleResponse: 红包抢完了，群又冷了。红包买来的是手速，不是参与。
        hiddenEffects: [{ kind: subtract, key: money, value: 20 }, { kind: add, key: academicDebt, value: 2 }]
    terminal: true

  - id: v_e03_d21_koc
    campaign: venture
    day: 21
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: KOC>KOL：真实用户的日常推荐最有说服力 }
    scene: { location: canteen, characters: [v_user_club] }
    setup: ["老K随口说：“我隔壁几个社团问我用的啥工具，我说了名字。”你意识到老K就是最好的推广员。"]
    choices:
      - id: empower_k
        text: 给老K一批专属邀请码+他的社团永久9折，让他自己发挥
        visibleResponse: 老K在各社长群里自然安利，一周带来5个注册。他不是你的销售，是你的用户——这个区别就是说服力的区别。
        hiddenEffects: [{ kind: add, key: users, value: 5 }, { kind: add, key: credibility, value: 4 }, { kind: achievement, achievementId: ach_v_koc }]
      - id: pay_k
        text: 直接给老K钱，请他发推广文案
        visibleResponse: 老K把钱退了：“朋友之间搞这个没意思。文案我帮你发，钱你收回去。”差一点，你把用户处成了乙方。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 3 }, { kind: setFlag, key: k_refused_money }]
    terminal: true

  - id: v_e03_d22_referral_mech
    campaign: venture
    day: 22
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 转介绍机制：双向有奖才转得动 }
    scene: { location: workbench, characters: [] }
    setup: ["你想加“邀请新社团得优惠”功能。优惠怎么设计？"]
    choices:
      - id: double_reward
        text: 双向奖励：邀请方免单一次，被邀请方首单7折
        visibleResponse: 上线两周，7个注册来自邀请链接。双方都有实惠，介绍人才好开口——单边奖励总让人觉得在帮您赚钱。
        hiddenEffects: [{ kind: add, key: users, value: 7 }, { kind: setFlag, key: referral_double }]
      - id: one_side
        text: 只奖励邀请方，省点成本
        visibleResponse: 两周2个邀请注册。被邀请的觉得“你是来挣我钱的”，介绍人张不开这个口。
        hiddenEffects: [{ kind: add, key: users, value: 2 }, { kind: add, key: academicDebt, value: 3 }]
    terminal: true

  - id: v_e03_d22_booth
    campaign: venture
    day: 22
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 地推：一眼看懂+30秒演示才留得住人 }
    scene: { location: canteen, characters: [] }
    setup: ["社团招新季，你申请了摊位角落的一张桌子。传单怎么设计？"]
    choices:
      - id: demo_table
        text: 不要传单，桌上放笔记本电脑循环演示合并过程，扫码即用
        visibleResponse: |
          停留的人第一句话都是“这真的只要3分钟？”——眼见为实。
          当天扫码32人，注册19个。一张桌子赢了半层楼的传单。
        hiddenEffects: [{ kind: add, key: users, value: 19 }, { kind: subtract, key: money, value: 15 }, { kind: achievement, achievementId: ach_v_booth }]
      - id: flyers
        text: 印500张传单，写满功能优势
        visibleResponse: 传单发完，回收方式主要是垃圾桶。地上还有几张，印着你精心排版的“12大核心功能”。
        hiddenEffects: [{ kind: subtract, key: money, value: 80 }, { kind: add, key: users, value: 1 }, { kind: add, key: academicDebt, value: 3 }]
    terminal: true

  - id: v_e03_d23_poster_qr
    campaign: venture
    day: 23
    type: story
    trigger: { kind: random, weight: 2 }
    scene: { location: dorm, characters: [] }
    setup: ["尴尬事故：海报印出来才发现二维码少了一位数，500张海报全军覆没。你盯着那卷海报看了十分钟。"]
    automaticEffects:
      - { kind: subtract, key: money, value: 60 }
      - { kind: add, key: execution, value: 2 }
