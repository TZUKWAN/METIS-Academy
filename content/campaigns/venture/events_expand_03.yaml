    terminal: true

  - id: v_e03_d23_zhihu_answer
    campaign: venture
    day: 23
    type: decision
    trigger: { kind: random, weight: 2 }
    scene: { location: dorm, characters: [] }
    setup: ["你发现知乎有个老问题：“大学社团管理有什么好工具？”下面回答3年前就停更了。"]
    choices:
      - id: answer_serious
        text: 认真写答案：现有工具对比+你的方案+适用边界，诚实标注“自制小工具”
        visibleResponse: |
          答案成为问题下最高赞。长尾流量稳定：每周2-3个注册来自这条两年前的老问题。
          内容是一次投入，持续收租的资产。
        hiddenEffects: [{ kind: add, key: users, value: 3 }, { kind: add, key: credibility, value: 4 }, { kind: setFlag, key: zhihu_longtail }]
      - id: spam_answer
        text: 直接贴链接喊“快来用我的工具”
        visibleResponse: 被管理员删了，账号禁言7天。渠道也有脾气，不懂规矩的流量客被请出门。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 3 }]
    terminal: true

  - id: v_e03_d24_short_video
    campaign: venture
    day: 24
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 短视频前3秒决定生死 }
    scene: { location: workbench, characters: [v_ai_agent] }
    setup: ["你试拍短视频。第一版开头：“大家好，今天给大家介绍一款社团管理工具……”Agent 诚实地说：像课件。"]
    choices:
      - id: hook_first
        text: 重拍：开头直接上画面——3天变3分钟的合并过程实录，全程无解说
        visibleResponse: |
          屏录+字幕，20条视频发出去。最好一条播放4000，评论区全是“求链接”。
          没有开场白，是因为你的用户根本不认识你。
        hiddenEffects: [{ kind: add, key: users, value: 8 }, { kind: add, key: execution, value: 3 }, { kind: achievement, achievementId: ach_v_video }]
      - id: keep_talking
        text: 保持讲解风格，显得专业
        visibleResponse: 播放量最高的一条：87。其中30是你自己反复看的。专业感和完播率之间，用户选后者。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 3 }]
    terminal: true

