        hiddenEffects: [{ kind: add, key: independence, value: 3 }, { kind: add, key: users, value: 1 }]
      - id: give_free
        text: 免费给，都是兄弟
        visibleResponse: 你开了后门。两周后他同学问“凭什么他有免费版”，你发现特例的维护成本比想象高。
        hiddenEffects: [{ kind: setFlag, key: free_backdoor }, { kind: add, key: academicDebt, value: 3 }]
