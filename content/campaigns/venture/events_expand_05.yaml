# 创业线扩展事件 05（单位经济/API成本/基础设施/CAC/LTV/合伙人/竞争者/平台风险）
events:
  - id: v_e05_d22_gross_margin
    campaign: venture
    day: 22
    type: decision
    keyDecision: true
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 毛利=收入-直接变动成本，先单笔算清 }
    scene: { location: dorm, characters: [] }
    setup: ["你拆一笔¥19的订单：AI分类调用¥1.4、短信通知¥0.4、支付手续费¥0.12。毛利¥17.08，毛利率90%。"]
    choices:
      - id: margin_table
        text: 给每个付费档位都算一笔：单次/学生价/学期卡各自的毛利和毛利率
        visibleResponse: |
          学生价¥9.9毛利8元（81%），学期卡摊到每场活动毛利约¥15（76%）。
          三档全部健康。你终于能说清楚“每一块钱里多少是你的”。
        hiddenEffects: [{ kind: add, key: evidenceDiscipline, value: 6 }, { kind: addAsset, assetType: revenue_report, name: 分档毛利表, description: 三档定价的毛利拆解, content: "19档90%/9.9档81%/99档76%——全部健康" }, { kind: achievement, achievementId: ach_v_margin }]
      - id: rough_feel
        text: 差不多就行，反正收入在涨
        visibleResponse: 收入确实在涨。第28天迎新周高峰，AI调用量翻4倍，你的“差不多”变成了一笔看不懂的账。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 5 }]
    learningPoint: 看不懂毛利的增长，是失控的前奏
    terminal: true

  - id: v_e05_d22_breakeven
    campaign: venture
    day: 22
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 盈亏平衡点=固定成本÷单均毛利 }
    scene: { location: workbench, characters: [] }
    setup: ["你算盈亏平衡：月固定成本（服务器+域名+短信包底价）约¥95，单均毛利¥17。算下来每月6单保本。"]
    choices:
      - id: write_breakeven
        text: 把“6单保本”写在成本台账首页，每周对着数
        visibleResponse: “每月6单保本”成了你的北极星数字。现在每月19单——你第一次看清自己离生死线有多远。
        hiddenEffects: [{ kind: add, key: evidenceDiscipline, value: 5 }, { kind: setFlag, key: breakeven_known }, { kind: achievement, achievementId: ach_v_breakeven }]
      - id: avoid_breakeven
        text: 不算这个，算了自己吓自己
        visibleResponse: 不算就不存在吗？你看不见那条线，就只能凭感觉乱花。凭感觉的账，都是糊涂账。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 4 }]
    terminal: true

  - id: v_e05_d23_price_drop
    campaign: venture
    day: 23
    type: story
    trigger: { kind: random, weight: 2 }
    scene: { location: workbench, characters: [v_ai_agent] }
    setup: ["AI服务商宣布降价40%。你查了下用量台账：同样是每天600次调用，成本从¥11降到¥6.6。什么都没做，毛利涨了。"]
    dialogue:
      - { speaker: v_ai_agent, text: "建议保持成本结构不变，将差价计入利润。", mood: pleased }
      - { speaker: 你, text: "不。降价红利投给用户体验：把分类模型换成更准的。省下的钱不花在刀刃上，就只是账面数字。" }
    automaticEffects:
      - { kind: subtract, key: technicalDebt, value: 2 }
      - { kind: setFlag, key: model_upgrade }
    terminal: true

  - id: v_e05_d23_cache_first
    campaign: venture
    day: 23
    type: decision
    keyDecision: true
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 成本优化的第一刀永远是缓存 }
    scene: { location: workbench, characters: [] }
    setup: ["你发现60%的AI分类调用在重复处理相同格式的表头——“XX大学社团报名表(标准版)”这一个月被解析了800次。"]
    choices:
      - id: add_cache
        text: 加模板缓存：识别过的表头结构存下来，相同结构直接走本地规则，不调AI
        visibleResponse: |
          缓存上线：AI调用量从600次/日降到170次/日，成本¥11→¥3.1。
          而且缓存命中时解析速度快了3倍。省钱的尽头是省心。
        hiddenEffects: [{ kind: add, key: execution, value: 6 }, { kind: subtract, key: technicalDebt, value: 2 }, { kind: achievement, achievementId: ach_v_cache }]
      - id: no_cache
        text: 重构缓存逻辑太麻烦，先这样
        visibleResponse: 每天¥11里约有¥6.6在重复劳动。一个月下来，你的“怕麻烦”价值¥198——快赶上半个月服务器钱了。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 4 }]
    learningPoint: 重复的活儿交给缓存，AI只干新活儿
    terminal: true

  - id: v_e05_d24_batch_api
    campaign: venture
    day: 24
    type: decision
    trigger: { kind: random, weight: 2 }
    scene: { location: workbench, characters: [] }
    setup: ["Agent 提议：把非实时的分类任务攒到深夜批量跑，AI服务商的批处理接口价格是实时的一半。"]
    choices:
      - id: use_batch
        text: 采纳：实时任务走在线，后台整理走批量，价格对半
        visibleResponse: 用户感知无差别（谁在乎分类是半夜跑的），成本再降一半。工程思维：花在刀刃上的钱，是可以绕开刀背省出来的。
        hiddenEffects: [{ kind: add, key: execution, value: 4 }, { kind: setFlag, key: batch_api }]
      - id: stay_realtime
        text: 不折腾，实时就实时
        visibleResponse: 你错过的不是折扣，是一种思维：成本结构里每一项都该被问“能不能更便宜地达成同样效果”。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 3 }]
    terminal: true

  - id: v_e05_d24_usage_alert
    campaign: venture
    day: 24
    type: story
    trigger: { kind: random, weight: 2 }
    scene: { location: dorm, characters: [] }
    setup: ["半夜手机弹出告警：AI调用量1小时内冲到平日的8倍。你查了——某社团用脚本循环上传同一个文件，触发了2000次分类调用。"]
    automaticEffects:
      - { kind: add, key: execution, value: 3 }
      - { kind: setFlag, key: rate_limit_added }
    dialogue:
      - { speaker: 系统, text: "你加了频控：单用户每小时上限50次。成本告警的价值不是吓你，是给你止损的窗口。" }
    terminal: true

  - id: v_e05_d25_server_scale
    campaign: venture
    day: 25
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 扩容要贴着负载走，不贴着焦虑走 }
    scene: { location: workbench, characters: [] }
    setup: ["用户过了200，免费层服务器开始吃紧：高峰期响应3秒。服务商销售“恰好”发来优惠：年付¥600升级专业版。"]
    choices:
      - id: monthly_scale
        text: 先按月付最低档（¥30/月），压测后再决定要不要年付
        visibleResponse: |
          按月升级后高峰响应0.8秒，够用了。两个月后你发现凌晨负载极低，
          又加了定时降配——最终月成本¥22，比销售的年付方案省了一半多。
        hiddenEffects: [{ kind: subtract, key: money, value: 30 }, { kind: add, key: execution, value: 4 }, { kind: setFlag, key: smart_scaling }]
      - id: yearly_upfront
        text: 年付¥600，一步到位，省心
        visibleResponse: 确实省心了，省到月底你对账时发现：这个“专业版”的一半功能你根本用不上。一步到位，也一步多花了¥300。
        hiddenEffects: [{ kind: subtract, key: money, value: 600 }, { kind: add, key: academicDebt, value: 3 }]
    terminal: true

  - id: v_e05_d25_db_backup2
    campaign: venture
    day: 25
    type: story
    trigger: { kind: day, day: 25, phase: end }
    scene: { location: workbench, characters: [] }
    setup: ["你做了一次“灾难演练”：假装数据库丢了，用昨天的备份从零恢复。全程23分钟，恢复后数据完整。"]
    automaticEffects:
      - { kind: add, key: evidenceDiscipline, value: 4 }
      - { kind: setFlag, key: disaster_drilled }
    dialogue:
      - { speaker: 系统, text: "23分钟，是你未来某天最坏情况的时长上限。演练过的人，半夜才睡得着。" }
    terminal: true

  - id: v_e05_d26_cdn_slow
    campaign: venture
    day: 26
    type: story
    trigger: { kind: random, weight: 2 }
    scene: { location: workbench, characters: [] }
    setup: ["有用户反馈页面图片加载慢。你查了：活动海报原图直出，一张8MB，宿舍网络要加载半分钟。"]
    automaticEffects: [{ kind: add, key: execution, value: 3 }]
    dialogue:
      - { speaker: 系统, text: "压缩+缩略图，10行代码解决。性能优化里最常见的一课：不是系统慢，是你传的东西大。" }
    terminal: true

  - id: v_e05_d26_icp_filing
    campaign: venture
    day: 26
    type: story
    trigger: { kind: random, weight: 2 }
    scene: { location: dorm, characters: [] }
    setup: ["服务器服务商发来通知：网站需完成ICP备案，否则30天后停止接入。你打开备案流程，发现要填的东西比想象多。"]
    automaticEffects:
      - { kind: setFlag, key: icp_started }
      - { kind: add, key: academicDebt, value: 2 }
    dialogue:
      - { speaker: 你, text: "（个人备案材料：身份证、域名证书、核验单、拍照……预计7-20天审核）" }
      - { speaker: 系统, text: "合规流程的第一定律：启动时间永远比想象长。今天提交，就是在救30天后的自己。" }
    terminal: true

  - id: v_e05_d27_cac_table
    campaign: venture
    day: 27
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 27, phase: end }
    purpose: { learning: CAC要按渠道分层算，总账会骗人 }
    scene: { location: dorm, characters: [] }
    setup: ["你把本月获客拆开算：转介绍（奶茶¥12/2注册=¥6）、内容（时间成本忽略现金）、广告位（¥50/2=¥25）、地推摊位（¥95/19=¥5）。"]
    choices:
      - id: cac_by_channel
        text: 做分层CAC表，每个渠道单独一列，月度更新
        visibleResponse: |
          表做出来了：地摊竟是最低成本渠道（人力的时间被你忽略了，但学生时代时间比钱多）。
          广告位¥25/注册>单均毛利——这渠道每拉一人亏一笔。砍，毫不犹豫。
        hiddenEffects: [{ kind: add, key: evidenceDiscipline, value: 7 }, { kind: addAsset, assetType: revenue_report, name: 分渠道CAC表, description: 四渠道获客成本, content: "转介绍6/内容≈0/广告25/地摊5" }, { kind: achievement, achievementId: ach_v_cac_layer }]
      - id: total_only
        text: 算总账就行：总花费÷总注册
        visibleResponse: 总CAC ¥9.4，看着健康。但总账把“广告位每人亏¥16”藏在了“地摊每人赚¥12”背后——平均数是最大的谎言。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 5 }]
    learningPoint: 平均数里藏不住生意，分层才算数
    terminal: true

  - id: v_e05_d27_ads_test
    campaign: venture
    day: 27
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 付费投放：小额测试，设止损线 }
    scene: { location: dorm, characters: [] }
    setup: ["同学怂恿你投校园墙信息流：“¥100试试水，万一爆了呢？”你的单均毛利¥17。"]
    choices:
      - id: small_test
        text: 投¥30试水，止损线定死：注册<2人就停
        visibleResponse: ¥30换来1个注册，止损线触发，停。你用¥30验证了一个渠道不行——这钱花得比闷头投¥300便宜多了。
        hiddenEffects: [{ kind: subtract, key: money, value: 30 }, { kind: add, key: evidenceDiscipline, value: 4 }, { kind: setFlag, key: ads_stopped }]
      - id: big_bet
        text: 投¥100，搏一把大的
        visibleResponse: ¥100带来3注册，CAC¥33，每个都是亏的。“万一爆了”的万一，没有来。
        hiddenEffects: [{ kind: subtract, key: money, value: 100 }, { kind: add, key: users, value: 3 }, { kind: add, key: academicDebt, value: 4 }]
    learningPoint: 投放的纪律比投放的金额重要
    terminal: true

  - id: v_e05_d28_ltv_calc
    campaign: venture
    day: 28
    type: decision
    keyDecision: true
    trigger: { kind: random, weight: 2 }
    purpose: { learning: LTV=单均毛利×生命周期次数 }
    scene: { location: dorm, characters: [] }
    setup: ["你试着算一个社团的LTV：平均每学期办4场活动×毛利¥15.6×预计在校3年=约¥187。而获客成本平均¥9。"]
    choices:
      - id: ltv_vs_cac
        text: 算出LTV/CAC≈20倍，得出结论：值得为优质渠道多花获客成本
        visibleResponse: |
          20倍的比例让你敢做以前不敢的决定：给转介绍人免费的学期卡。
          送出¥99，换回8个新社团——用LTV思维看，白送都是投资。
        hiddenEffects: [{ kind: add, key: evidenceDiscipline, value: 6 }, { kind: add, key: users, value: 8 }, { kind: subtract, key: revenue, value: 99 }, { kind: achievement, achievementId: ach_v_ltv }]
      - id: ltv_dismiss
        text: LTV太虚了，我只看这个月收了多少钱
        visibleResponse: 你继续按月看钱，继续舍不得任何获客花费，继续靠转介绍的自然生长。数字没错，只是你少了副眼镜。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 4 }]
    learningPoint: LTV/CAC决定你敢花多少钱买增长
    terminal: true

  - id: v_e05_d28_ratio_review
    campaign: venture
    day: 28
    type: story
    trigger: { kind: day, day: 28, phase: end }
    scene: { location: dorm, characters: [] }
    setup: ["罗哥远程看了你的账：LTV/CAC 20倍。他难得夸了一句，但补了一刀。"]
    dialogue:
      - { speaker: 罗哥, text: "20倍说明你太省了，不敢投。但也别飘：你的LTV是算出来的，不是验证出来的。留存撑不到3年，这个数就是幻觉。", mood: serious }
      - { speaker: 你, text: "（在台账上补了一行：LTV假设待验证——当前实际数据仅覆盖0.5学期）" }
    automaticEffects:
      - { kind: relationship, characterId: v_mentor, delta: 4 }
      - { kind: add, key: evidenceDiscipline, value: 3 }
    terminal: true

  - id: v_e05_d22_equity_talk2
    campaign: venture
    day: 22
    type: decision
    keyDecision: true
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 合伙先小人：出力、分钱、退出，全写下来 }
    scene: { location: lab, characters: [v_partner] }
    setup: ["阿斌的投入越来越实：每周10小时代码+评审。你俩默契地从没谈过钱。今天他先开了口。"]
    dialogue:
      - { speaker: 阿斌, text: "我不要多，规则要清楚。丑话说在前面，才处得长。", mood: serious }
    choices:
      - id: write_agreement
        text: 写两页纸合伙备忘录：分工/分成比例/退出条款/决策权，各签一份
        visibleResponse: |
          备忘录两页，分成五五，退出需提前30天通知且代码留在项目里。
          写完阿斌说：“踏实了。”——口头兄弟都是气话，白纸黑字才是义气。
        hiddenEffects: [{ kind: add, key: teamTrust, value: 10 }, { kind: addAsset, assetType: document, name: 合伙备忘录, description: 分工/分成/退出条款, content: "五五分成/退出30天/决策以数据为准" }, { kind: achievement, achievementId: ach_v_prenup }]
      - id: avoid_paper
        text: 写协议太伤感情了，兄弟之间谈钱多俗
        visibleResponse: 你把话题岔开了。阿斌没再提，但那之后他的提交频率降了三成——没说出口的在意，都变成了冷淡。
        hiddenEffects: [{ kind: subtract, key: teamTrust, value: 6 }, { kind: setFlag, key: no_prenup }]
    learningPoint: 谈钱不伤感情，不谈钱才伤
    terminal: true

  - id: v_e05_d23_freerider
    campaign: venture
    day: 23
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 团队里的搭便车者：要么激活，要么请走 }
    scene: { location: lab, characters: [] }
    setup: ["社团里一个同学当初嚷嚷着要入伙，现在两周没产出，群消息也不回。但他的名字还在介绍页的团队栏里。"]
    choices:
      - id: straight_talk
        text: 直接谈：“这两周你这边没动静，是忙还是不想干了？不想干咱好聚好散。”
        visibleResponse: 他坦白：考研没时间，当初凑热闹。好聚好散，介绍页更新，群里公告。斩钉截铁的对话省下两个月的内耗。
        hiddenEffects: [{ kind: add, key: independence, value: 4 }, { kind: add, key: teamTrust, value: 3 }, { kind: setFlag, key: freerider_out }]
      - id: keep_warming
        text: 不好意思戳破，继续挂着他的名字
        visibleResponse: 名字挂了一个月。新用户问他“这位是负责什么的”，你替他圆了三次谎。挂名的成本是你自己的信誉。
        hiddenEffects: [{ kind: subtract, key: credibility, value: 4 }, { kind: add, key: academicDebt, value: 3 }]
    terminal: true

  - id: v_e05_d24_exit_clause
    campaign: venture
    day: 24
    type: story
    trigger: { kind: random, weight: 2 }
    scene: { location: lab, characters: [v_partner] }
    setup: ["阿斌拿到一个外地实习offer，6月起全职。他把备忘录翻出来：“按条款，我提前30天说。代码文档我这周整理完交接。”"]
    dialogue:
      - { speaker: 你, text: "（心里一沉，但备忘录就是干这个用的）好。交接清单我列，你核对。" }
      - { speaker: 阿斌, text: "（松了口气）谢谢你没搞悲情那套。说好的好聚好散。", mood: pleased }
      - { speaker: 系统, text: "第22天写下的退出条款，今天第一次生效——这就是它存在的意义：让离开不再像背叛。" }
    automaticEffects:
      - { kind: add, key: teamTrust, value: 4 }
      - { kind: setFlag, key: bin_exit_scheduled }
    terminal: true

  - id: v_e05_d25_rival_launch
    campaign: venture
    day: 25
    type: decision
    keyDecision: true
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 竞品上线：先拆解，再决定跟不跟 }
    scene: { location: dorm, characters: [] }
    setup: ["深夜刷到：隔壁校一个团队发布了“社团帮”，界面比你精美，免费，功能更像全家桶。群里已经有人转发。"]
    choices:
      - id: dissect_rival
        text: 冷静拆解：注册体验他们的产品，记功能/价格/目标用户，找他们没做的
        visibleResponse: |
          拆解报告：他们全而重（必须注册登录）、面向全国、无本地服务。
          你的差异点反而清晰了：免注册、轻量、你人就在学校能上门。
          恐慌变成了产品路线图。
        hiddenEffects: [{ kind: add, key: userUnderstanding, value: 6 }, { kind: addAsset, assetType: document, name: 竞品拆解·社团帮, description: 功能/定位/差异分析, content: "对手全而重/全国化/需注册——本地化+轻量是护城河" }, { kind: achievement, achievementId: ach_v_rival_scan }]
      - id: panic_feature
        text: 连夜加功能跟他们对标，他们有什么我们也要有！
        visibleResponse: 你熬了三夜模仿了三个功能，每个都比你对手的晚且糙。跟在别人身后的产品，永远只能捡剩饭。
        hiddenEffects: [{ kind: add, key: technicalDebt, value: 8 }, { kind: subtract, key: energy, value: 15 }, { kind: setFlag, key: panic_follow }]
    learningPoint: 对手定义赛道，不定义你的产品
    terminal: true

  - id: v_e05_d26_price_war
    campaign: venture
    day: 26
    type: decision
    trigger: { kind: random, weight: 2 }
