        hiddenEffects: [{ kind: add, key: execution, value: 6 }, { kind: add, key: independence, value: 5 }, { kind: setFlag, key: hybrid_model }, { kind: achievement, achievementId: ach_v_hybrid }]
      - id: pure_saas_road
