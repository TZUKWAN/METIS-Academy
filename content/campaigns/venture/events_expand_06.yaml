    scene: { location: lab, characters: [v_mentor, v_partner] }
    setup: ["学期末战略会。罗哥把三条路画在纸上：A纯接单工作室（现金流稳/无积累）B纯SaaS（有积累/现金流慢）C混合：SaaS打底+定制接单养现金流。"]
    choices:
