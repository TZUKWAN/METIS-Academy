# 创业线扩展事件 06（合作/B2B/B2C/pivot/开源/咨询/SaaS/工作室/收购）
events:
  - id: v_e06_d23_union_deal
    campaign: venture
    day: 23
    type: decision
    keyDecision: true
    trigger: { kind: random, weight: 2 }
    purpose: { learning: B2B合同条款：价可以谈，控制权不能送 }
    scene: { location: lab, characters: [] }
    setup: ["学生会拿出合作协议草稿：全校独家使用权，换¥299/学期。最后一行写着：“学生会可对本校数据进行管理和调阅。”"]
    choices:
      - id: strike_data_clause
        text: 划掉数据条款：“数据归各社团，你们只有使用和统计权。”独家可以谈，涨价到¥499
        visibleResponse: |
          对方讨价还价后接受了¥399+使用统计权。
          你守住了最重要的东西：一旦让学生会“管理”数据，其他社团再也不敢用你的工具。
        hiddenEffects: [{ kind: add, key: revenue, value: 399 }, { kind: add, key: credibility, value: 5 }, { kind: achievement, achievementId: ach_v_contract_neg }]
      - id: sign_as_is
        text: 全签。299拿下独家，数据条款无所谓
        visibleResponse: 合同签了。两周后有社团私聊问你：“学生会能看到我们的数据？”你解释了半小时，效果存疑。便宜的那100块，开始连本带利地还。
        hiddenEffects: [{ kind: add, key: revenue, value: 299 }, { kind: subtract, key: credibility, value: 6 }, { kind: setFlag, key: data_clause_signed }]
    learningPoint: B2B谈判里，数据主权比价格更值钱
    terminal: true

  - id: v_e06_d23_b2b_pilot
    campaign: venture
    day: 23
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: B2B试点：免费试可以，必须带转化条件 }
    scene: { location: dorm, characters: [] }
    setup: ["隔壁学院团委想“先免费试点一学期，好用再谈钱”。纯免费试点，还是设个条件？"]
    choices:
      - id: pilot_with_terms
        text: 同意试点，但白纸黑字：学期末按满意度结算，满意则签全年¥1200
        visibleResponse: |
          试点协议两页纸。学期末满意度92%，¥1200顺利落袋。
          免费可以，但免费的尽头必须是明确的付费决策点。
        hiddenEffects: [{ kind: add, key: revenue, value: 1200 }, { kind: setFlag, key: pilot_success }, { kind: achievement, achievementId: ach_v_b2b_pilot }]
      - id: free_no_terms
        text: 先免费着，关系处好了自然给钱
        visibleResponse: 免费用满一学期。到期谈钱时对方说“预算没批”，第二学期默认继续免费。没有退出条件的免费，是无限期免费。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 5 }]
    learningPoint: 没有转化条件的免费试点=慈善
    terminal: true

  - id: v_e06_d24_payment_cycle
    campaign: venture
    day: 24
    type: story
    trigger: { kind: random, weight: 2 }
    purpose: { learning: B2B回款周期：签约≠收款 }
    scene: { location: dorm, characters: [] }
    setup: ["学生会合同签了，财务流程启动了。然后你体验了什么叫对公流程：申请单→审批→盖章→财务排期……预计回款周期：45天。"]
    automaticEffects:
      - { kind: setFlag, key: b2b_payment_wait }
      - { kind: add, key: academicDebt, value: 2 }
    dialogue:
      - { speaker: 系统, text: "B端的钱像快递，签收前一直“运输中”。你的现金流计划里，B端收入永远要打对折再等两个月。" }
    terminal: true

  - id: v_e06_d24_custom_pull
    campaign: venture
    day: 24
    type: decision
    keyDecision: true
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 大客户的定制拉扯：用产品路线图挡，不用人情挡 }
    scene: { location: lab, characters: [] }
    setup: ["学生会又提需求了：“给我们做个大屏展示页，迎新周领导要看的。”做完这一个，下一个已经在路上了。"]
    choices:
      - id: roadmap_shield
        text: “大屏不在产品路线图里。可以定制开发，费用¥800，交付后归你们学院专属。”
        visibleResponse: 对方嫌贵放弃了。你保住了开发时间，也没得罪人——报价单是世上最礼貌的拒绝。
        hiddenEffects: [{ kind: add, key: independence, value: 5 }, { kind: setFlag, key: custom_priced_out }]
      - id: free_favor
        text: 算了，免费做了，就当维护关系
        visibleResponse: 大屏做了三天。对方很满意，然后提了第二个、第三个“顺便”。免费的定制，教会了客户“他什么都肯做”。
        hiddenEffects: [{ kind: add, key: technicalDebt, value: 5 }, { kind: subtract, key: energy, value: 8 }, { kind: setFlag, key: favor_loop }]
    learningPoint: 每一次免费定制，都是下三次的开始
    terminal: true

  - id: v_e06_d25_b2c_impulse
    campaign: venture
    day: 25
    type: story
    trigger: { kind: random, weight: 2 }
    purpose: { learning: B2C的冲动付费靠即时场景 }
    scene: { location: dorm, characters: [] }
    setup: ["你观察到一个规律：C端订单的下单时间高度集中在“活动前48小时内”，占73%。用户不是决定用不用，是被截止日推着用。"]
    automaticEffects:
      - { kind: add, key: userUnderstanding, value: 5 }
      - { kind: addAsset, assetType: user_feedback, name: C端下单时间分析, description: 73%集中在活动前48小时, content: "截止日驱动付费——提醒时机=转化杠杆" }
    dialogue:
      - { speaker: 系统, text: "你在“活动前3天”加了一站式提醒：“还没搞定报名？3分钟搞定”。当周转化+40%。卖水要在跑步道旁边卖。" }
    terminal: true

  - id: v_e06_d25_pivot_question
    campaign: venture
    day: 25
    type: decision
    keyDecision: true
    trigger: { kind: random, weight: 2 }
    purpose: { learning: pivot的合法理由：数据证伪，不是审美疲劳 }
    scene: { location: cafe, characters: [v_mentor] }
    setup: ["你跟罗哥说想换方向：“报名工具做腻了，AI心理陪伴感觉更大。”罗哥放下杯子。"]
    dialogue:
      - { speaker: 罗哥, text: "先回答三个问题：现有业务亏钱吗？用户在流失吗？新方向验证过吗？", mood: serious }
      - { speaker: 你, text: "……不亏、不流失、没验证。" }
      - { speaker: 罗哥, text: "那你换的不是方向，是心情。心情不好去打球。数据的证据不够，任何pivot都是逃逸。" }
    choices:
      - id: stay_by_data
        text: 留下。把“腻了”的能量换成“做深”：开俱乐部场景和新校区
        visibleResponse: 两周后俱乐部场景带来3个新客户——你差点因为无聊，错过一个还在增长的市场。无聊是创业的常客，不是信号。
        hiddenEffects: [{ kind: add, key: independence, value: 5 }, { kind: add, key: users, value: 3 }, { kind: achievement, achievementId: ach_v_stay_smart }]
      - id: pivot_mood
        text: 还是换！大方向比小生意重要！
        visibleResponse: 你把报名工具调成维护模式。一个月后：AI心理陪伴没有任何付费用户，而老工具的社群开始问“是不是不做了”。两头空。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 8 }, { kind: subtract, key: credibility, value: 5 }, { kind: scheduleEvent, eventId: v_e06_delay_pivot_bill, onDay: 29 }]
    learningPoint: pivot是数据逼出来的转向，不是情绪推出来的逃跑
    terminal: true

  - id: v_e06_d26_pivot_shrink
    campaign: venture
    day: 26
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 收缩式pivot：砍人群，不做减法会死在中间 }
    scene: { location: dorm, characters: [] }
    setup: ["数据复盘：你同时服务着社团、学生会、校外培训班、小卖部。四类客户，服务成本高得吓人，谁都没服务透。"]
    choices:
      - id: shrink_one
        text: 收缩：只服务社团和学生会，培训班和小卖部礼貌劝退
        visibleResponse: |
          劝退了3个非目标客户。服务成本直降，社团口碑反而变好——“他只做校园社团，最懂我们。”
          小而窄的定位，是你这个体量唯一的活法。
        hiddenEffects: [{ kind: add, key: execution, value: 5 }, { kind: add, key: credibility, value: 4 }, { kind: setFlag, key: niche_focus }]
      - id: keep_everyone
        text: 都留着，客户送上门哪有往外推的
        visibleResponse: 四类客户互相拉扯：培训班的定制拖慢了社团的更新，小卖部的需求把界面搞得四不像。什么都接，等于什么都没做。
        hiddenEffects: [{ kind: add, key: technicalDebt, value: 8 }, { kind: add, key: academicDebt, value: 5 }]
    learningPoint: 收缩不是失败，是把子弹上膛
    terminal: true

  - id: v_e06_d26_data_pivot
    campaign: venture
    day: 26
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 换人群式pivot：跟着付费数据走 }
    scene: { location: workbench, characters: [] }
    setup: ["数据给你指了条路：社团客单¥19-99，频次高；而买学期卡最爽的其实是学生会和学生组织联盟——单笔¥399，决策一次管全校。"]
    choices:
      - id: b2b2c_shift
        text: 加大B端权重：组建“校学生会联盟”销售线，C端保持低维护运转
        visibleResponse: |
          你用一学期跑了3所学校的学生会，签下2单，客单价翻了四倍。
          B2B2C不是抛弃C端，是让B端替你把C端一锅端进来。
        hiddenEffects: [{ kind: add, key: revenue, value: 798 }, { kind: setFlag, key: b2b2c }, { kind: achievement, achievementId: ach_v_b2b2c }]
      - id: ignore_signal
        text: 还是稳着来，只做C端
        visibleResponse: 稳没错，但你把一条明摆着的增长曲线让给了“稳”。数据举手的时候不看，它就不举了。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 3 }]
    terminal: true

  - id: v_e06_d27_open_core
    campaign: venture
    day: 27
    type: decision
    keyDecision: true
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 开源策略：开什么、留什么，要想清楚 }
    scene: { location: workbench, characters: [v_partner] }
    setup: ["有人在你帖子下留言：“建议开源！好东西就该共享！”阿斌问你：开吗？"]
    choices:
      - id: open_partial
        text: 开源核心解析库（不涉业务），托管代码和部署服务保持闭源收费
        visibleResponse: |
          解析库开源后收到3个PR和一群热心用户，产品本身付费不受影响——
          别人拿走引擎，造不出你的车，更留不住你的乘客。
        hiddenEffects: [{ kind: add, key: credibility, value: 8 }, { kind: add, key: users, value: 4 }, { kind: addAsset, assetType: code_project, name: 开源解析库, description: 核心表单解析引擎, content: "MIT协议/文档齐全/3个外部PR" }, { kind: achievement, achievementId: ach_v_opensource }]
      - id: open_all
        text: 全部开源，用爱发电
        visibleResponse: 全开了。一周后有人部署了你的代码改个logo就上线收费，定价比你低。情怀被上课了：开源没有商业模式，开源+服务才有。
        hiddenEffects: [{ kind: subtract, key: revenue, value: 40 }, { kind: add, key: academicDebt, value: 4 }]
    terminal: true

  - id: v_e06_d27_stars_no_cash
    campaign: venture
    day: 27
    type: story
    trigger: { kind: random, weight: 2 }
    scene: { location: dorm, characters: [] }
    setup: ["开源库上了GitHub趋势榜，217个star，评论区一片“牛”“感谢开源”。你看了眼付费后台：新增收入¥0。"]
    automaticEffects:
      - { kind: add, key: credibility, value: 5 }
      - { kind: setFlag, key: stars_not_cash }
    dialogue:
      - { speaker: 系统, text: "Star是掌声，不是门票。掌声能带来声誉和机会，但你得自己修好从掌声到收银台的通道。" }
    terminal: true

  - id: v_e06_d28_consult_invite
    campaign: venture
    day: 28
    type: decision
    keyDecision: true
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 咨询邀约：卖时间还是卖产品，想清楚再接 }
    scene: { location: cafe, characters: [] }
    setup: ["外校学生会主席私信：“我们想搞个类似的系统，你能不能来给我们做指导？一天也行，报酬好说。”"]
    choices:
      - id: consult_day
        text: 接一天咨询：¥300，讲架构、演示、避坑清单——只教，不代做
        visibleResponse: |
          一天咨询干完，对方拿去自己搭。两周后他们系统上线，用的是你的解析库付费版。
          教人钓鱼的人，卖鱼竿。这就是咨询+产品的复利。
        hiddenEffects: [{ kind: add, key: money, value: 300 }, { kind: add, key: revenue, value: 60 }, { kind: achievement, achievementId: ach_v_consult }]
      - id: do_it_for_them
        text: 帮他们做整套系统，收¥2000
        visibleResponse: ¥2000赚到了，代价是整整12天。你的产品停更12天，竞品发了两个新功能。卖时间最贵的地方在于：时间不可复用。
        hiddenEffects: [{ kind: add, key: money, value: 2000 }, { kind: add, key: academicDebt, value: 6 }, { kind: setFlag, key: sold_time }]
    learningPoint: 咨询可以接，但别用产品的时间贴补咨询的收入
    terminal: true

  - id: v_e06_d28_consult_trap
    campaign: venture
    day: 28
    type: story
    trigger: { kind: random, weight: 2 }
    scene: { location: dorm, characters: [] }
    setup: ["又一个咨询邀约，对方开口就是“先免费分享下你的完整方案PPT呗，我们看看再决定请不请你”。你盯着“免费”“完整”两个词。"]
    automaticEffects: [{ kind: add, key: independence, value: 3 }]
    dialogue:
      - { speaker: 系统, text: "你回了个大纲，正式内容“见面聊”。白嫖型邀约的识别标记：先要全部，再谈报酬。" }
    terminal: true

  - id: v_e06_d29_saas_trial
    campaign: venture
    day: 29
    type: decision
    keyDecision: true
    trigger: { kind: random, weight: 2 }
    purpose: { learning: SaaS订阅：把一次性买卖变成持续关系 }
    scene: { location: workbench, characters: [] }
    setup: ["你琢磨把学期卡改成“云端订阅”：¥15/月，数据云端保存、随时可退。订阅制意味着你要承诺长期可用。"]
    choices:
      - id: go_subscription
        text: 上订阅制，同时承诺“数据随时导出走人，不设障碍”
        visibleResponse: |
          订阅首月：38个付费用户，续订31个。退出门槛反而成了信任招牌——
          “随时能走”让用户更愿意留。订阅的本质是持续证明自己值得。
        hiddenEffects: [{ kind: add, key: revenue, value: 570 }, { kind: setFlag, key: subscription_live }, { kind: achievement, achievementId: ach_v_saas }]
      - id: keep_oneshot
        text: 保持一次性买卖，省心
        visibleResponse: 一次性买卖省心是真省心——每学期都要从头再卖一遍，也是真累。没有订阅，就没有复利的雪球。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 3 }]
    terminal: true

  - id: v_e06_d29_saas_churn_day
    campaign: venture
    day: 29
    type: story
    trigger: { kind: day, day: 29, phase: end }
    purpose: { learning: 订阅流失每天都在发生，别等月报才发现 }
    scene: { location: dorm, characters: [] }
    setup: ["订阅制上线后你加了条规则：有人取消订阅，10分钟内你会收到一条通知，附带他最近的使用记录。"]
    automaticEffects:
      - { kind: add, key: userUnderstanding, value: 4 }
      - { kind: setFlag, key: churn_alert_live }
    dialogue:
      - { speaker: 系统, text: "今天3人取消，原因分别是：毕业了、换工具了、忘记取消自动续费后生气了。流失每天都发生，你的反应速度决定挽回率。" }
    terminal: true

  - id: v_e06_d23_studio_offer
    campaign: venture
    day: 23
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 工作室模式 vs 产品模式：卖人头还是卖复制 }
    scene: { location: lab, characters: [] }
    setup: ["隔壁宿舍找上门：“你们有技术，一起接单吧！帮人做网站做小程序，一单赚几千，比你这破工具来钱快。”"]
    choices:
      - id: refuse_studio
        text: 拒绝：“接单是拿时间换钱，我的产品是在攒会下蛋的鸡。”
        visibleResponse: 对方转身去接单了，当月赚了¥6000，你只收入¥570。但你后台的用户数在涨——三个月后，差距会倒过来。
        hiddenEffects: [{ kind: add, key: independence, value: 5 }, { kind: setFlag, key: refused_studio }]
      - id: join_studio
        text: 加入！先赚钱活下去才有资格谈理想
        visibleResponse: 你接了两单，赚了¥4500，产品一个月没更新。结束才发现：接单赚的是现金，丢的是能滚动的时间。两个都真，但你只能选一个。
        hiddenEffects: [{ kind: add, key: money, value: 4500 }, { kind: add, key: academicDebt, value: 8 }, { kind: setFlag, key: studio_sidequest }]
    learningPoint: 接单模式现金流好，产品模式才有复利
    terminal: true

  - id: v_e06_d24_studio_trap
    campaign: venture
    day: 24
    type: story
    trigger: { kind: random, weight: 2 }
    scene: { location: dorm, characters: [] }
    setup: ["隔壁接单翻车了：客户反复改需求18版，尾款拖着不给，一单算下来时薪¥8。他来你这里吐苦水。"]
    dialogue:
      - { speaker: 邻居, text: "你说得对……接单看着快，其实一直在给别人的想法打工。你那个慢慢做的东西，现在值多少了？" }
      - { speaker: 你, text: "这个月流水¥570。但里面有¥180是老客户自动续费的——我睡觉的时候它也在动。" }
    automaticEffects:
      - { kind: add, key: credibility, value: 3 }
      - { kind: setFlag, key: studio_trap_seen }
    terminal: true

  - id: v_e06_d25_acquisition_story
    campaign: venture
    day: 25
    type: npc
    trigger: { kind: random, weight: 2 }
    scene: { location: cafe, characters: [v_mentor] }
    setup: ["罗哥给你讲了个真实案例：他认识的一个学生团队，产品做得不错，被一家教育公司收购。"]
    dialogue:
      - { speaker: 罗哥, text: "听着风光，细节呢？收购价80万，看着不少。但他们三人先把股权五五平分给了一个早退出的挂名合伙人——分掉26万。", mood: serious }
      - { speaker: 你, text: "……没签退出条款？" }
      - { speaker: 罗哥, text: "所以收购是喜事，账本是救命符。你的合伙备忘录，就是未来收购桌上你的律师。" }
    automaticEffects:
      - { kind: add, key: riskTolerance, value: -2 }
      - { kind: add, key: evidenceDiscipline, value: 3 }
    terminal: true

  - id: v_e06_d26_acq_offer
    campaign: venture
    day: 26
    type: decision
    keyDecision: true
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 收购报价：买你的是流量还是资产 }
    scene: { location: cafe, characters: [] }
    setup: ["一个做校园社群APP的创业公司联系你：出价¥30000收购你的产品和用户数据，“你继续帮我们维护半年”。"]
    choices:
      - id: counter_acq
        text: 反谈：¥30000可以谈，但用户数据不卖、维护期3个月、价不含税另算
        visibleResponse: |
          对方要的就是数据，一听不卖就拖。拖了两周不了了之。
          你明白了：他们看上的从来不是你的产品，是你那800个真实社团用户的联系方式。
