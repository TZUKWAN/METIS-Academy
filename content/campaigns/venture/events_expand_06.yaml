        text: 选A工作室，先赚钱再说
        visibleResponse: 单子越接越多，你成了小老板。半年后盘点：赚了钱，产品停了，当初的800个用户去了别处。钱赚到了，生意没了。
        hiddenEffects: [{ kind: add, key: money, value: 3000 }, { kind: subtract, key: users, value: 0 }, { kind: setFlag, key: studio_path }]
    learningPoint: 模式没有对错，但要为它付的代价签字
    terminal: true

