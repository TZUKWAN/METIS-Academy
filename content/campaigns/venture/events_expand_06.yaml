        visibleResponse: 纯粹是真纯粹，账本也是真空洞：三个月的投入期里，你的存款直线下跌，差点没熬到复利出现的那天。
        hiddenEffects: [{ kind: subtract, key: money, value: 600 }, { kind: add, key: riskTolerance, value: 4 }, { kind: setFlag, key: pure_saas_path }]
