      - id: accept_acq
        text: 卖！三万块对学生来说是一大笔钱
        visibleResponse: 卖了。钱到账那天你请了顿好的。半年维护期里你看着新东家把工具塞满广告，老用户在群里@一个再也不回复的头像。三万块，和一些说不清的失落。
        hiddenEffects: [{ kind: add, key: money, value: 30000 }, { kind: subtract, key: credibility, value: 8 }, { kind: setFlag, key: sold_product }]
    learningPoint: 收购报价单上，最值钱的往往是你最不舍得卖的
    terminal: true

