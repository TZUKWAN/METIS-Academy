# 创业线扩展事件 07（倦怠/关停/重启/长期经营 + 各阶段补全）
events:
  - id: v_e07_d25_burn_sign
    campaign: venture
    day: 25
    type: story
    keyDecision: true
    trigger: { kind: day, day: 25, phase: end }
    purpose: { learning: 倦怠的信号：效率降、乐趣失、逃避反馈 }
    scene: { location: dorm, characters: [] }
    setup: ["三个迹象同时出现了：同一封用户邮件你读了两遍没进脑子；打开后台看数据时心里发沉；晚饭点了最辣的外卖却没尝出味道。"]
    dialogue:
      - { speaker: 系统, text: "效率下降、乐趣消失、回避反馈——倦怠三联征齐了。这不是你不够拼，是你连续拼了25天。发动机不是靠意志散热的。" }
    automaticEffects:
      - { kind: subtract, key: energy, value: 8 }
      - { kind: setFlag, key: burnout_signs }
    terminal: true

  - id: v_e07_d25_rest_day
    campaign: venture
    day: 25
    type: decision
    keyDecision: true
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 休息是工程决策，不是奖励 }
    scene: { location: dorm, characters: [] }
    setup: ["明天是周六。任务清单上还有6件事，你的精力条只剩一格。"]
    choices:
      - id: full_rest
        text: 明天全天休息：关电脑、关群提醒，出门爬山，手机只留电话
        visibleResponse: |
          你消失了24小时。回来发现：产品没崩，用户没跑，群里的求助帖阿斌顺手回了。
          周日晚你一口气处理完6件事，只用了一个下午——满电的大脑快过半电的失眠。
        hiddenEffects: [{ kind: add, key: energy, value: 25 }, { kind: add, key: teamTrust, value: 3 }, { kind: achievement, achievementId: ach_v_rest }]
      - id: half_rest
        text: 半天休息半天干活，折中一下
        visibleResponse: 休息那半天你刷了三次工作群，干活那半天效率平平。身体在休息，脑子在加班，两头都没讨好。
        hiddenEffects: [{ kind: add, key: energy, value: 6 }, { kind: add, key: academicDebt, value: 2 }]
      - id: no_rest
        text: 休息什么？干！
        visibleResponse: 你连轴转到第28天，然后在一个深夜对着一个拼写错误调试了40分钟，最后趴在桌上睡着了。身体会自己接管日程——以你最不想要的方式。
        hiddenEffects: [{ kind: subtract, key: energy, value: 20 }, { kind: add, key: technicalDebt, value: 4 }, { kind: scheduleEvent, eventId: v_e07_delay_crash, onDay: 28 }]
    learningPoint: 不安排休息，身体会替你安排
    terminal: true

  - id: v_e07_d26_burn_talk
    campaign: venture
    day: 26
    type: npc
    trigger: { kind: random, weight: 2 }
    scene: { location: cafe, characters: [v_mentor] }
    setup: ["你跟罗哥坦白：“最近有点撑不住，看到用户消息就烦。”罗哥没讲大道理。"]
    dialogue:
      - { speaker: 罗哥, text: "正常。我第一次创业垮掉前三个月就是这样。问你个事：你现在做的哪些事，是可以不做的？", mood: neutral }
      - { speaker: 你, text: "……每天更新两个群、盯着后台、写内容，全是我一个人干。" }
      - { speaker: 罗哥, text: "倦怠多半不是干太多，是干太杂。挑出三件只有你能干的事，其他的——授权、延迟、或者让它烂着。" }
    choices:
      - id: cut_three
        text: 照做：砍掉“每天盯后台”和“日更内容”，只留用户服务和关键开发
        visibleResponse: |
          砍完当天，你多睡了两个小时。后台数据没看也不会跑，内容改成每周两更，没人发现。
          倦怠的解药常常不是休息，是减负。
        hiddenEffects: [{ kind: add, key: energy, value: 12 }, { kind: add, key: independence, value: 4 }, { kind: relationship, characterId: v_mentor, delta: 4 }]
      - id: shoulder_all
        text: "没事，我能扛。扛过去就好了。"
        visibleResponse: 罗哥看了你一眼，没再劝。第29天你的自动回复写成了“我现在不在人状态”——身体开始替你说真话了。
        hiddenEffects: [{ kind: subtract, key: energy, value: 10 }, { kind: setFlag, key: carried_all }]
    terminal: true

  - id: v_e07_d26_motivation_low
    campaign: venture
    day: 26
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 动力不足时，回看你改变过的具体的人 }
    scene: { location: dorm, characters: [] }
    setup: ["动力低谷：你在想“做这一切图什么”。文件夹里躺着那条你一直存着的摄影社感谢信。"]
    choices:
      - id: reread_letter
        text: 打开感谢信重读一遍，再翻翻用户群里的聊天记录
        visibleResponse: |
          “干事们第一次没在合并表头上吵架。”底下还有聊天记录里那句“学长你真行”。
          图什么？图这26个社团再也没人熬夜合表。动力回来了——它一直都在，只是你忘了看。
        hiddenEffects: [{ kind: add, key: energy, value: 10 }, { kind: setFlag, key: motivation_refilled }]
      - id: doom_scroll
        text: 刷一小时别人成功的视频找动力
        visibleResponse: 你看完了一堆“三个月十万用户”的视频，动力没找到，焦虑倒是充值成功。别人的高光治不了你的低谷。
        hiddenEffects: [{ kind: subtract, key: energy, value: 6 }, { kind: add, key: academicDebt, value: 2 }]
    terminal: true

  - id: v_e07_d27_health_alarm
    campaign: venture
    day: 27
    type: story
    trigger: { kind: random, weight: 2 }
    scene: { location: dorm, characters: [] }
    setup: ["连续第四天头疼，下午在工位上眼前发黑了几秒。你吓到了，去校医院查了：低血压+重度睡眠不足，医生的话很难听。"]
    dialogue:
      - { speaker: 医生, text: "小伙子，你这身体底子再这么造，别说创业，毕业都费劲。回去睡够一周，别的都是虚的。" }
      - { speaker: 系统, text: "你把“23点后不写代码”写进了 AGENTS.md——给自己立的规矩，和给Agent的规矩一样重要。" }
    automaticEffects:
      - { kind: subtract, key: energy, value: 5 }
      - { kind: setFlag, key: health_rules }
    terminal: true

  - id: v_e07_d27_peer_pressure
    campaign: venture
    day: 27
    type: decision
    keyDecision: true
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 同辈压力：比较是偷走快乐的贼 }
    scene: { location: canteen, characters: [] }
    setup: ["秋招季。室友签了大厂，年包肉眼可见；另一个同学保研了。饭桌上大家问：“你那个小破站，一个月挣多少？”"]
    choices:
      - id: own_clock
        text: “赚得没你们多，但我有62个每周都在用的用户，和一个能跑正的账本。各自有各自的时区。”
        visibleResponse: 饭桌安静了两秒，室友举杯：“敬你的62个用户。”说出口之后，你发现自己真的信。横向比较没有终点，纵向比较才有。
        hiddenEffects: [{ kind: add, key: independence, value: 6 }, { kind: add, key: energy, value: 6 }, { kind: achievement, achievementId: ach_v_own_clock }]
      - id: feel_behind
        text: 什么都答不上来，笑着敷衍，回宿舍之后emo到凌晨
        visibleResponse: 你把别人的时间表套在了自己头上，凌晨三点还在想“是不是该去投简历”。比较偷走了你一晚睡眠和一个项目的专注。
        hiddenEffects: [{ kind: subtract, key: energy, value: 10 }, { kind: add, key: academicDebt, value: 3 }]
    terminal: true

  - id: v_e07_d28_shutdown_list
    campaign: venture
    day: 28
    type: decision
    keyDecision: true
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 干净关停清单：让项目死得体面 }
    scene: { location: dorm, characters: [] }
    setup: ["最坏的情况也要有预案。罗哥说：“关停不可怕，可怕的是烂尾。写份关停清单备着。”"]
    choices:
      - id: write_shutdown
        text: 写关停清单：提前30天公告/数据导出通道/退款结算/服务器续费截止日/复盘报告
        visibleResponse: |
          清单五条写完，你反而安心了——最坏的情况都有路径，眼前的问题就只是眼前的问题。
          这份文件备用着，但愿它永远用不上。
        hiddenEffects: [{ kind: addAsset, assetType: checklist, name: 关停预案清单, description: 五步体面收尾, content: "30天公告/数据导出/退款结算/续费节点/复盘报告" }, { kind: add, key: riskTolerance, value: 3 }, { kind: achievement, achievementId: ach_v_shutdown_plan }]
      - id: no_plan
        text: 写这个多不吉利，不写
        visibleResponse: 不写预案不等于不会有预案执行的那天。真到那天，你会手忙脚乱地亏欠每一个信任过你的用户。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 3 }]
    terminal: true

  - id: v_e07_d28_user_care
    campaign: venture
    day: 28
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 假如关停：用户的善后优先于你的情绪 }
    scene: { location: dorm, characters: [] }
    setup: ["你认真想了一遍那个问题：如果明天必须关停，你的9个付费社团怎么办？"]
    choices:
      - id: care_plan
        text: 预案：按剩余时长退款/数据包一键导出/推荐替代工具清单/一对一告别邮件
        visibleResponse: 你甚至把告别邮件的草稿写好了。写着写着眼眶热了——这不是悲观，是你终于承认这些用户对你有多重要。
        hiddenEffects: [{ kind: add, key: credibility, value: 4 }, { kind: addAsset, assetType: document, name: 用户善后预案, description: 退款/导出/替代方案/告别信, content: "按比例退款+一键导出+替代清单+一对一邮件" }]
      - id: avoid_care
        text: 不想这些，太沉重了
        visibleResponse: 逃避没有让问题消失，只是让它在突然发生时更丑陋。你的用户值得一个有预案的经营者，哪怕预案永远不用。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 2 }]
    terminal: true

  - id: v_e07_d29_shutdown_note
    campaign: venture
    day: 29
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 关停公告怎么写：坦诚+交代+不留尾巴 }
    scene: { location: workbench, characters: [] }
    setup: ["你见过最差的关停公告是一句“服务器到期，勿念”。你决定提前想好自己的版本——假如需要的话。"]
    choices:
      - id: honest_note
        text: 草拟版本：承认没跑通/交代发生了什么/数据如何领取/推荐替代方案/留下你的复盘链接
        visibleResponse: |
          草稿200字，五要素齐了。写完你把它存进“关停预案”文件夹。
          最坏打算写清楚的人，才有资格全力奔向最好的可能。
        hiddenEffects: [{ kind: add, key: evidenceDiscipline, value: 3 }, { kind: setFlag, key: shutdown_note_ready }]
      - id: no_note
        text: 真到那天再说吧
        visibleResponse: “那天再说”的公告，通常是在情绪最糟的深夜里仓促发出的。那不是公告，是逃跑的脚印。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 2 }]
    terminal: true

  - id: v_e07_d29_restart_seed
    campaign: venture
    day: 29
    type: story
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 重启的种子早就埋在旧项目的问题日志里 }
    scene: { location: dorm, characters: [] }
    setup: ["你翻出第一周的问题日志。19条信号里被搁置的“社团交接档案”和“活动物资共享”两条，现在看依然闪闪发光。"]
    automaticEffects:
      - { kind: add, key: userUnderstanding, value: 3 }
      - { kind: addAsset, assetType: document, name: 下一个项目种子, description: 旧日志里筛出的候选, content: "社团交接档案/物资共享——旧信号的新机会" }
    dialogue:
      - { speaker: 系统, text: "一个项目最值钱的遗产，是它攒下的信号池。关停可以带走一切，带不走你看问题的眼睛。" }
    terminal: true

  - id: v_e07_d30_retro
    campaign: venture
    day: 30
    type: decision
    keyDecision: true
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 复盘会：对事不对人，产出是下学期的规则 }
    scene: { location: lab, characters: [v_mentor, v_partner] }
    setup: ["学期复盘会，三个人，一块白板，两小时的承诺。规则：只说“什么做对了/什么做砸了/下学期改什么”。"]
    choices:
      - id: full_retro
        text: 三栏复盘照做，最后产出“下学期五条军规”贴在墙上
        visibleResponse: |
          五条军规诞生：①付费前先验证②砍范围不手软③账本天天看④客服限时⑤周三必须休息。
          罗哥补了一句：“明年这时候，我要看到第六条。”复盘会开成了传统。
        hiddenEffects: [{ kind: add, key: evidenceDiscipline, value: 7 }, { kind: add, key: teamTrust, value: 5 }, { kind: addAsset, assetType: checklist, name: 下学期五条军规, description: 复盘产出, content: "先验证/砍范围/看账本/限客服/周内休息" }, { kind: achievement, achievementId: ach_v_retro }]
      - id: informal_chat
        text: 不搞形式主义，吃顿饭聊聊得了
        visibleResponse: 饭吃了，天聊了，感慨了一堆。两周后你想引用复盘结论时发现：没有结论。感慨不留档，教训就会重演。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 4 }]
    learningPoint: 没有产出的复盘只是团建
    terminal: true

  - id: v_e07_d30_second_act
    campaign: venture
    day: 30
    type: story
    trigger: { kind: day, day: 30, phase: end }
    purpose: { learning: 无论结算如何，创业是可重启的技能 }
    scene: { location: dorm, characters: [] }
    setup: ["结算前夜。你在便签上写下两个词：这台机器的说明书，和下一台机器的图纸。"]
    automaticEffects:
      - { kind: setFlag, key: restart_mindset }
      - { kind: add, key: independence, value: 4 }
    dialogue:
      - { speaker: 系统, text: "项目有终点，创业者没有。30天教会你的不是做一个报名工具，是“从0到1”这台机器的操作方法。机器可以重启，方法属于你。" }
    terminal: true

  - id: v_e07_d25_long_term_mind
    campaign: venture
    day: 25
    type: story
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 长期经营思维：从赶工切换到养店 }
    scene: { location: dorm, characters: [] }
    setup: ["心态切换的一天：你把待办从“赶功能”改成“养店铺”——每天固定巡店（数据）、补货（修复）、打扫（优化）。"]
    automaticEffects:
      - { kind: add, key: execution, value: 3 }
      - { kind: setFlag, key: long_term_mode }
    dialogue:
      - { speaker: 系统, text: "赶工的心态做项目，养店的心态做事业。前者冲刺30天，后者经营30年。" }
    terminal: true

  - id: v_e07_d26_semester_renew
    campaign: venture
    day: 26
    type: decision
    keyDecision: true
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 续约要提前90天启动，别等合同到期 }
    scene: { location: canteen, characters: [v_user_club] }
    setup: ["距学生会合同到期还有6周。老K提醒：“走流程要提前报预算，你上学期就是踩着点谈的，差点黄。”"]
    choices:
      - id: early_renew
        text: 本周启动续约：带上学期数据报告+下学期规划+早鸟价（提前签约9折）
        visibleResponse: |
          学生会两个星期内完成续约，还主动提了迎新周深度合作。
          早启动的续约是谈合作，晚启动的续约是求收留。
        hiddenEffects: [{ kind: add, key: revenue, value: 359 }, { kind: setFlag, key: early_renewal }, { kind: achievement, achievementId: ach_v_renew_early }]
      - id: late_renew
        text: 到期再谈，现在忙别的
        visibleResponse: 到期前一周你去谈，对方预算周期刚过，只能按零星采购慢慢磨。你在焦灼里等了23天，续上了，但差点没续上。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 4 }]
    terminal: true

  - id: v_e07_d27_maint_rhythm
    campaign: venture
    day: 27
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 维护节奏化：固定窗口处理琐事，保护整块时间 }
    scene: { location: workbench, characters: [] }
    setup: ["琐事总在打断你：看数据、回群、小修小补……你决定给它们圈一个固定时间窗。"]
    choices:
      - id: fixed_window
        text: 每天16:00-17:00统一处理琐事，其余时间手机勿扰
        visibleResponse: 整块时间回来了。琐事没有变少，但它们学会了排队——你的下午终于能连续写代码了。
        hiddenEffects: [{ kind: add, key: execution, value: 5 }, { kind: setFlag, key: fixed_window_set }]
      - id: ad_hoc
        text: 随来随处理，灵活动态
        visibleResponse: “灵活”的一天被切成了17段，每段都刚进入状态就被打断。你以为自己在多线作战，其实在给打断打工。
        hiddenEffects: [{ kind: subtract, key: energy, value: 6 }, { kind: add, key: academicDebt, value: 2 }]
    terminal: true

  - id: v_e07_d28_auto_ops
    campaign: venture
    day: 28
    type: story
    trigger: { kind: random, weight: 2 }
    scene: { location: workbench, characters: [v_ai_agent] }
    setup: ["你让 Agent 写了三个自动化：每日数据报表自动生成、磁盘告警自动通知、每周日凌晨自动备份校验。"]
    automaticEffects:
      - { kind: add, key: execution, value: 5 }
      - { kind: addAsset, assetType: document, name: 运维自动化清单, description: 三项日常自动化, content: "日报自动生成/磁盘告警/周日备份校验" }
    dialogue:
      - { speaker: v_ai_agent, text: "自动化部署完成。预计每周为您节省2.5小时。", mood: pleased }
      - { speaker: 你, text: "这2.5小时我要拿去睡觉——这也是生产投资。" }
    terminal: true

  - id: v_e07_d29_brand_assets
    campaign: venture
    day: 29
    type: decision
    trigger: { kind: random, weight: 2 }
    purpose: { learning: 品牌是复利的容器：名字、口碑、识别度 }
    scene: { location: workbench, characters: [] }
    setup: ["“报名管家”这个名字用了一学期，用户都这么叫它——包括那些你自己都没做过推广的场景。要不要正式做套品牌？"]
    choices:
      - id: brand_kit
        text: 做迷你品牌包：统一名称/一句定位语/一个头像/一份介绍模板
        visibleResponse: |
          品牌包两小时做完。之后每次被转发、被截图、被口口相传，都指向同一个名字和同一句话。
          用户嘴里念出来的名字，才是真正的品牌资产——你只是把它固定了下来。
        hiddenEffects: [{ kind: add, key: credibility, value: 5 }, { kind: addAsset, assetType: document, name: 品牌迷你包, description: 名称/定位/头像/模板, content: "报名管家/“把收表从3天变3分钟”/统一视觉" }, { kind: achievement, achievementId: ach_v_brand }]
      - id: skip_brand
        text: 名字无所谓，产品好就行
        visibleResponse: 产品确实好，但它一会儿被叫“那个收表的”，一会儿被叫“社团小程序”。模糊的名字，让每一次口碑都打了折。
        hiddenEffects: [{ kind: add, key: academicDebt, value: 3 }]
    terminal: true

  - id: v_e07_d30_legacy
    campaign: venture
    day: 30
    type: story
    trigger: { kind: day, day: 30, phase: end }
    scene: { location: dorm, characters: [] }
