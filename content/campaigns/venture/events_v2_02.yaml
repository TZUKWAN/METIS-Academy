    scene: { location: cafe, characters: [v_mentor] }
    setup: ["投资人回访，拿着你上次的周报：'留存健康，那我们把下轮融资提上日程。'你打开分群数据——渠道 B 已经烂穿了。"]
    dialogue:
      - { speaker: v_mentor, text: "现在你有两个选择：补一份修正报告，或者祈祷他在 DD 时自己没发现。" }
    choices:
      - id: honest_correction
        text: 立即发修正报告：附分群数据和补救计划
        visibleResponse: 投资人回复：'数据会骗人，人不骗人。下次直接给我分群。'下轮谈话反而提前了。
        hiddenEffects:
          - { kind: setFlag, key: kv_honest_correction }
          - { kind: add, key: credibility, value: 6 }
      - id: keep_quiet
        text: 先不说，等新数据把均值拉回来
        visibleResponse: 你选择了沉默。均值确实在慢慢变好，但你每次见到投资人，都会先在心里过一遍那句话。
        hiddenEffects:
          - { kind: setFlag, key: kv_quiet_burden }
          - { kind: add, key: credibility, value: -3 }
    learningPoint: 对外披露的数据错误，纠正速度决定信任损失

