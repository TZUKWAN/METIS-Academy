  # ===== K 链：留存数据误读（D15 → D25）=====
  - id: v2k1_churn_read
    campaign: venture
    day: 15
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 15, phase: start }
    purpose: { narrative: 留存曲线的两种读法, learning: 数据要分群不要平均 }
    scene: { location: lab, characters: [v_ai_agent] }
    setup: ["Agent 生成了周报：'次日留存 45%，健康！'你顺手要往下翻，忽然想起：这个 45% 是全部用户平均的。"]
    choices:
      - id: cohort_analysis
        text: 按获客渠道分群重算留存
        visibleResponse: 分群后真相浮出：渠道 A 用户留存 61%，渠道 B 只有 22%。'健康'的 45% 是两个世界的加权平均。
        hiddenEffects:
          - { kind: setFlag, key: kv_cohort_analysis }
          - { kind: add, key: evidenceDiscipline, value: 6 }
        unlockKnowledge: [kc_v_churn_funnel]
        delayed:
          - { eventId: v2k2_cohort_action, onDay: 25 }
      - id: trust_average
        text: 平均数够用，先关注新用户增长
        visibleResponse: 你把周报转发了投资人，标题写'留存健康'。数字是真的。结论呢？
        hiddenEffects:
          - { kind: setFlag, key: kv_average_trust }
          - { kind: add, key: credibility, value: 2 }
        delayed:
          - { eventId: v2k2_averaged_trap, onDay: 25 }
    learningPoint: 留存分析必须分群（cohort），平均值掩盖结构性问题

