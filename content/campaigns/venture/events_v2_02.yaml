# METIS Academy Venture V2 事件批次二 —— G-L 延迟链 + 隐藏线 + NG+ 线
# 旗标前缀 kv_（结局守卫旗标用 kv_end_ 前缀防冲突），与 events_v2_01 的 key_v_* 区分
events:
  # ===== G 链：合伙人分工模糊（D5 → D14 → D24）=====
  - id: v2g1_partner_split
    campaign: venture
    day: 5
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 5, phase: start }
    purpose: { narrative: 合伙人口头分工, learning: 口头分工是团队债务的起点 }
    scene: { location: canteen, characters: [v_partner] }
    setup: ["午饭时阿哲把筷子往桌上一放：'产品你来，推广我来，钱的事……到时候再说。'"]
    dialogue:
      - { speaker: v_partner, text: "都是兄弟，写什么书面协议，多见外。" }
    choices:
      - id: insist_written
        text: 坚持写一页纸的分工备忘
        visibleResponse: 阿哲嘟囔着"见外"，还是签了。备忘录里写清了：谁管钱、多久对一次账、分歧怎么裁决。
        hiddenEffects:
          - { kind: setFlag, key: kv_written_split }
          - { kind: add, key: teamTrust, value: 5 }
          - { kind: add, key: credibility, value: 3 }
        delayed:
          - { eventId: v2g2_split_stress, onDay: 14 }
      - id: go_verbal
        text: 算了，兄弟之间口头说好就行
        visibleResponse: 你笑着碰了个杯。分工的模糊处，像气泡一样沉进了可乐里。
        hiddenEffects:
          - { kind: setFlag, key: kv_verbal_split }
          - { kind: add, key: teamTrust, value: 2 }
        delayed:
          - { eventId: v2g2_ghost_tasks, onDay: 14 }
    learningPoint: 合伙分工必须书面化，"兄弟感"不能替代治理结构

  - id: v2g2_split_stress
    campaign: venture
    day: 14
    type: story
    trigger: { kind: delayed }
    purpose: { narrative: 书面分工的压力测试, learning: 好治理在压力时显价值 }
    scene: { location: lab, characters: [v_partner] }
    setup: ["推广预算超支了 40%。阿哲拿着备忘录找到你：'按第三条，超支要提前两天打招呼。我承认我忘了——按第五条，罚我请一周奶茶。'"]
    dialogue:
      - { speaker: v_partner, text: "写下来还是有用。这次算我的。" }
    automaticEffects:
      - { kind: add, key: teamTrust, value: 3 }
    next: v2_d14_wire

  - id: v2g2_ghost_tasks
    campaign: venture
    day: 14
    type: story
    trigger: { kind: delayed }
    purpose: { narrative: 幽灵任务现身, learning: 无书面分工的任务会蒸发 }
    scene: { location: lab, characters: [v_partner] }
    setup: ["'客服不是你管吗？''我不是管产品吗？'——你们同时发现：过去一周，用户反馈表格里堆了 23 条没人回复的消息。"]
    dialogue:
      - { speaker: v_partner, text: "……我以为是你。你不也没问过我。" }
    automaticEffects:
      - { kind: add, key: userUnderstanding, value: -3 }
      - { kind: add, key: credibility, value: -3 }
    next: v2g3_ghost_choice

  - id: v2g3_ghost_choice
    campaign: venture
    day: 14
    type: decision
    keyDecision: true
    trigger: { kind: manual }
    purpose: { narrative: 幽灵任务的补救, learning: 危机是建立治理的最佳时机 }
    scene: { location: lab, characters: [v_partner] }
    choices:
      - id: emergency_charter
        text: 借机立规矩：一小时写完分工章程
        visibleResponse: 你们把所有任务列在白板上，一条条认领，没人认领的当场分配。章程贴在墙上，阿哲主动签了名。
        hiddenEffects:
          - { kind: setFlag, key: kv_emergency_charter }
          - { kind: add, key: teamTrust, value: 6 }
        delayed:
          - { eventId: v2g4_charter_pays, onDay: 24 }
      - id: blame_and_move
        text: 吵一架，然后假装没事
        visibleResponse: 你们吵了四十分钟，谁也没说服谁，最后靠一杯奶茶休战。白板上的 23 条消息，还堆在那里。
        hiddenEffects:
          - { kind: setFlag, key: kv_ghost_unresolved }
          - { kind: add, key: teamTrust, value: -5 }
          - { kind: add, key: credibility, value: -2 }
        delayed:
          - { eventId: v2g4_collapse_day, onDay: 24 }
    learningPoint: 任务真空要靠治理机制填补，不能靠情绪和默契

  - id: v2g4_charter_pays
    campaign: venture
    day: 24
    type: story
    trigger: { kind: delayed }
    purpose: { narrative: 章程的红利, learning: 治理投入的复利 }
    scene: { location: lab, characters: [v_partner] }
    dialogue:
      - { speaker: v_partner, text: "昨晚我按章程做了次'周对账'，发现推广渠道 B 的转化是 A 的三倍。以前我们吵预算，现在我们对数据。" }
      - { speaker: 系统, text: "那页一小时的章程，在第十天开始产生利息。" }
    automaticEffects:
      - { kind: add, key: revenue, value: 4 }
      - { kind: add, key: teamTrust, value: 3 }
    next: v2_d24_wire

  - id: v2g4_collapse_day
    campaign: venture
    day: 24
    type: story
    trigger: { kind: delayed }
    purpose: { narrative: 分工真空的总爆发, learning: 未处理的团队债务会复利 }
    scene: { location: lab, characters: [v_partner] }
    setup: ["发版前夜，阿哲说'推广物料明天再说'，你说'产品 bug 明天再修'——第二天，两件事都没人做。渠道推广照常把流量引向一个带 bug 的支付页。"]
    dialogue:
      - { speaker: 系统, text: "3 小时 47 条退款请求。你们的'明天再说'清单，今天全部到期。" }
    automaticEffects:
      - { kind: add, key: credibility, value: -6 }
      - { kind: add, key: revenue, value: -5 }
    next: v2_d24_wire

  # ===== H 链：平台依赖（D7 → D18 → D27）=====
  - id: v2h1_platform_choice
    campaign: venture
    day: 7
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 7, phase: start }
    purpose: { narrative: 全押单一平台, learning: 平台流量红利与封禁风险并存 }
    scene: { location: dorm, characters: [v_ai_agent] }
    setup: ["某小程序渠道提出'流量扶持'：首页推荐位换来的条件是——内容独家，数据共享，且随时可下架。"]
    dialogue:
      - { speaker: v_ai_agent, text: "按历史案例，此类渠道的扶持期中位数是 11 周，封禁率约 18%。数据供参考。" }
    choices:
      - id: all_in_platform
        text: 全押推荐位，红利窗口不等人
        visibleResponse: 七天后用户翻了四倍。你把"封禁率 18%"这个数字忘在了第 7 天。
        hiddenEffects:
          - { kind: setFlag, key: kv_all_in_platform }
          - { kind: add, key: users, value: 15 }
        delayed:
          - { eventId: v2h2_platform_clamp, onDay: 18 }
      - id: multi_channel
        text: 只要一半推荐位，同步建私域群
        visibleResponse: 增长慢了一半，但你把 300 个种子用户拉进了自己的群——花了一周，值了。
        hiddenEffects:
          - { kind: setFlag, key: kv_multi_channel }
          - { kind: add, key: users, value: 6 }
          - { kind: add, key: userUnderstanding, value: 4 }
        unlockKnowledge: [kc_v_platform_risk]
      - id: refuse_deal
        text: 条件太霸王，完全不碰
        visibleResponse: 你婉拒了。增长曲线平得像心电图停机，但你的命是自己的。
        hiddenEffects:
          - { kind: setFlag, key: kv_refuse_platform }
          - { kind: add, key: independence, value: 4 }
    learningPoint: 平台红利与平台风险是一体两面，私域是保命符

  - id: v2h2_platform_clamp
    campaign: venture
    day: 18
    type: story
    trigger: { kind: delayed }
    purpose: { narrative: 平台规则突变, learning: 平台政策的不可控性 }
    scene: { location: dorm, characters: [] }
    setup: ["平台公告：'清理低质内容，部分小程序搜索权重下调。'你的小程序，从类目第 3 名掉到第 41 名。"]
    dialogue:
      - { speaker: 系统, text: "新用户 -73%。你第一次理解'依赖'这个词的重量。" }
    automaticEffects:
      - { kind: add, key: users, value: -8 }
      - { kind: add, key: revenue, value: -4 }
    next: v2h3_platform_response

  - id: v2h3_platform_response
    campaign: venture
    day: 18
    type: decision
    keyDecision: true
    trigger: { kind: manual }
    purpose: { narrative: 依赖崩塌后的转向, learning: 危机转向的速度决定生死 }
    scene: { location: lab, characters: [v_partner] }
    choices:
      - id: private_domain_sprint
        text: 全员冲刺私域：把老用户搬进自己的群
        visibleResponse: 你和阿哲分工：他导流，你写欢迎语。两周搬了 1200 人。平台没了，你的用户还在。
        hiddenEffects:
          - { kind: setFlag, key: kv_private_sprint }
          - { kind: add, key: userUnderstanding, value: 6 }
          - { kind: add, key: teamTrust, value: 4 }
        delayed:
          - { eventId: v2h4_private_bloom, onDay: 27 }
      - id: find_next_platform
        text: 再找一个平台，把命运交给下一家
        visibleResponse: 你签了另一家渠道。推荐位暖场中。你松了口气——又把鸡蛋放进了一个新篮子。
        hiddenEffects:
          - { kind: setFlag, key: kv_next_platform }
          - { kind: add, key: riskTolerance, value: 3 }
    learningPoint: 平台崩塌后的第一优先级是用户资产私有化

  - id: v2h4_private_bloom
    campaign: venture
    day: 27
    type: story
    trigger: { kind: delayed }
    purpose: { narrative: 私域的绽放, learning: 自有渠道的复利 }
    scene: { location: cafe, characters: [v_user_student] }
    dialogue:
      - { speaker: v_user_student, text: "你们群里发的那个新功能，我昨天就用了。顺手转给了我们社团。" }
      - { speaker: 系统, text: "1200 人的群里，当天 47 次转发。这 47 次转发，不属于任何平台。" }
    automaticEffects:
      - { kind: add, key: users, value: 6 }
      - { kind: add, key: revenue, value: 3 }
    next: v2_d27_wire

  # ===== I 链：客服与退款（D9 → D19 → D28）=====
  - id: v2i1_support_setup
    campaign: venture
    day: 9
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 9, phase: start }
    purpose: { narrative: 客服体系设计, learning: 客服是留存的第一道堤坝 }
    scene: { location: dorm, characters: [] }
    setup: ["首批 200 个用户进来了，反馈开始涌进三个渠道：表格、微信群、还有你的个人微信。"]
    choices:
      - id: sla_commit
        text: 定死 SLA：所有反馈 24 小时内必回
        visibleResponse: 你做了个反馈看板，每条消息有编号和状态。第一周你每晚花 90 分钟，回了 61 条。
        hiddenEffects:
          - { kind: setFlag, key: kv_sla_commit }
          - { kind: add, key: credibility, value: 5 }
        delayed:
          - { eventId: v2i2_sla_fan_letter, onDay: 19 }
      - id: ai_auto_reply
        text: 接 Agent 自动回复，人只处理复杂的
        visibleResponse: Agent 自动回复率 70%。有两封回信把"您的理解"写成了"您的误解"——你手动道了歉。
        hiddenEffects:
          - { kind: setFlag, key: kv_ai_support }
          - { kind: add, key: aiDependence, value: 5 }
        delayed:
          - { eventId: v2i2_ai_reply_incident, onDay: 19 }
      - id: delay_support
        text: 先攒用户，客服以后再说
        visibleResponse: 反馈表格安静地积累着。三周后它会有 240 条未读——那时它就不是反馈了，是墓志铭。
        hiddenEffects:
          - { kind: setFlag, key: kv_support_debt }
          - { kind: add, key: credibility, value: -4 }
        delayed:
          - { eventId: v2i2_silent_churn, onDay: 19 }
    learningPoint: 客服响应速度是早期产品的生命线，SLA 要定死

  - id: v2i2_sla_fan_letter
    campaign: venture
    day: 19
    type: story
    trigger: { kind: delayed }
    purpose: { narrative: SLA 的口碑飞轮, learning: 响应速度创造传播 }
    scene: { location: canteen, characters: [v_user_club] }
    dialogue:
      - { speaker: v_user_club, text: "我半夜一点提的 bug，早上八点收到你们的手写式回复。我把截图发进了我们社团群。" }
      - { speaker: 系统, text: "那张截图当天被转发了 89 次。你花 90 分钟每晚换来的，是免费的增长引擎。" }
    automaticEffects:
      - { kind: add, key: users, value: 5 }
      - { kind: add, key: credibility, value: 4 }
    next: v2_d19_wire

  - id: v2i2_ai_reply_incident
    campaign: venture
    day: 19
    type: story
    trigger: { kind: delayed }
    purpose: { narrative: AI 客服事故, learning: 自动化客服需人审兜底 }
    scene: { location: dorm, characters: [] }
    setup: ["社群里流传一张截图：用户说'我数据丢了很难受'，Agent 回复'您的误解我们深表抱歉'。配文：'这就是你们的AI客服？'"
    ]
    dialogue:
      - { speaker: 系统, text: "截图被浏览了 4000 次。你花一晚上写了道歉信，逐个私信了受影响的 17 位用户。" }
    automaticEffects:
      - { kind: add, key: credibility, value: -5 }
    next: v2i3_support_rebuild

  - id: v2i2_silent_churn
    campaign: venture
    day: 19
    type: story
    trigger: { kind: delayed }
    purpose: { narrative: 沉默流失, learning: 不响的堤坝最难防 }
    scene: { location: dorm, characters: [] }
    setup: ["周活数据悄悄从 62% 滑到 41%。没有投诉，没有差评——用户只是安静地不再打开。你翻了翻反馈表格：240 条未读，像一座沉默的火山。"]
    dialogue:
      - { speaker: 系统, text: "流失的用户不会告诉你原因。沉默本身就是他们的差评。" }
    automaticEffects:
      - { kind: add, key: users, value: -6 }
      - { kind: add, key: revenue, value: -3 }
    next: v2i3_support_rebuild

  - id: v2i3_support_rebuild
    campaign: venture
    day: 19
    type: decision
    keyDecision: true
    trigger: { kind: manual }
    purpose: { narrative: 客服体系的重建, learning: 事故后的重建决定留存曲线 }
    scene: { location: dorm, characters: [v_partner] }
    choices:
      - id: concierge_week
        text: 全员'私人管家周'：人工回复每一条
        visibleResponse: 你和阿哲用一周回了全部 240 条积压。有 31 位用户惊讶地回来了，说'没想到你们真的在意'。
        hiddenEffects:
          - { kind: setFlag, key: kv_concierge_week }
          - { kind: add, key: userUnderstanding, value: 6 }
          - { kind: add, key: credibility, value: 5 }
        unlockKnowledge: [kc_v_concierge]
      - id: triage_system
        text: 建分流体系：bug/咨询/吐槽三条通道
        visibleResponse: 你搭了个简单的分流表单。回复速度回到 24 小时内，虽然少了点人情味。
        hiddenEffects:
          - { kind: setFlag, key: kv_triage_system }
          - { kind: add, key: execution, value: 4 }
    learningPoint: 客服危机重建优先真诚人工，再谈效率工具

  # ===== J 链：B2B/B2C 摇摆（D12 → D21 → D29）=====
  - id: v2j1_route_choice
    campaign: venture
    day: 12
    type: decision
    keyDecision: true
    trigger: { kind: day, day: 12, phase: start }
    purpose: { narrative: 商业路线摇摆, learning: 路线切换有隐藏成本 }
    scene: { location: cafe, characters: [v_mentor] }
    setup: ["一家小企业主愿意付 8000/年买你们的工具（企业定制版）；同时你的学生用户群在涨——但免费为主。C 端还是 B 端？"]
    dialogue:
      - { speaker: v_mentor, text: "B 端钱多但每家都要定制；C 端增长快但收钱难。选一个，把另一个变成副产物——别两头追。" }
    choices:
      - id: commit_b2b
        text: 主攻 B 端：签下企业定制
        visibleResponse: 8000 元进了账，你的第一笔企业收入。代价：你接下来两周都在做'报表导出格式'这种定制需求。
        hiddenEffects:
          - { kind: setFlag, key: kv_commit_b2b }
          - { kind: add, key: revenue, value: 12 }
        delayed:
          - { eventId: v2j2_b2b_custom_hell, onDay: 21 }
      - id: commit_b2c
        text: 主攻 C 端：企业单先推掉
        visibleResponse: 你婉拒了 8000 元。企业主说'想通了随时来'。你把全部时间押给了增长。
        hiddenEffects:
          - { kind: setFlag, key: kv_commit_b2c }
          - { kind: add, key: userUnderstanding, value: 5 }
        delayed:
          - { eventId: v2j2_b2c_growth_math, onDay: 21 }
      - id: chase_both
        text: 两头都要：白天企业，晚上社区
        visibleResponse: 你开始了双线作战。第 10 天，你在给企业写的周报里，混进了一条学生群的梗。对方回了个问号。
        hiddenEffects:
          - { kind: setFlag, key: kv_chase_both }
          - { kind: add, key: energy, value: -12 }
        delayed:
          - { eventId: v2j2_both_burn, onDay: 21 }
    learningPoint: 商业路线要单点聚焦，双线作战的成本是隐性的

  - id: v2j2_b2b_custom_hell
    campaign: venture
    day: 21
    type: story
    trigger: { kind: delayed }
    purpose: { narrative: 定制地狱, learning: B端定制的复利陷阱 }
    scene: { location: lab, characters: [] }
    setup: ["第二家、第三家小企业找上门，每家都要'和上一家不一样的'报表。你的产品代码里，企业 A 的逻辑开始污染企业 B 的。"]
    dialogue:
      - { speaker: 系统, text: "定制需求 +7。核心产品迭代：0 次。你在变成一家外包公司。" }
    automaticEffects:
      - { kind: add, key: technicalDebt, value: 8 }
    next: v2j3_route_verdict

  - id: v2j2_b2c_growth_math
    campaign: venture
    day: 21
    type: story
    trigger: { kind: delayed }
    purpose: { narrative: C端增长的数学题, learning: 增长不等于收入 }
    scene: { location: dorm, characters: [] }
    setup: ["用户破 5000 了！你兴奋地算了笔账：按 2% 付费率、30 元客单价，月收入 3000。服务器成本 2800。"]
    dialogue:
      - { speaker: 系统, text: "增长的另一个名字：成本的前奏。除非'付费率'和'客单价'之一开始长大。" }
    automaticEffects:
      - { kind: add, key: money, value: -10 }
    next: v2j3_route_verdict

  - id: v2j2_both_burn
    campaign: venture
    day: 21
    type: story
    trigger: { kind: delayed }
    purpose: { narrative: 双线的崩塌, learning: 聚焦的代价低于分裂 }
    scene: { location: dorm, characters: [v_partner] }
    setup: ["企业客户抱怨'响应变慢了'，社群抱怨'更新变慢了'。两边的抱怨都是对的。阿哲看着你在两点钟还在切换聊天窗口：'兄弟，你会被撕成两半的。'"]
    dialogue:
      - { speaker: 系统, text: "双线作战第 9 天：企业单续约谈判暂停，社群周活 -12%。两条线同时亮黄灯。" }
    automaticEffects:
      - { kind: add, key: credibility, value: -4 }
      - { kind: add, key: revenue, value: -3 }
    next: v2j3_route_verdict

  - id: v2j3_route_verdict
    campaign: venture
    day: 21
    type: decision
    keyDecision: true
    trigger: { kind: manual }
    purpose: { narrative: 路线的最终裁决, learning: 教训之后的选择才叫战略 }
    scene: { location: cafe, characters: [v_mentor] }
    choices:
      - id: double_down_b2b
        text: 确认 B 端：做标准化的企业版
        visibleResponse: 你把三家企业的定制需求去重归并，抽出一个'标准企业版'。第三家签约时，定制工作量降了六成。
        hiddenEffects:
          - { kind: setFlag, key: kv_b2b_standardized }
          - { kind: add, key: revenue, value: 6 }
