    scene: { location: lab, characters: [v_partner] }
    dialogue:
      - { speaker: v_partner, text: "既然渠道 B 留存烂，我们把推广预算从 B 挪到 A？还是干脆搞清楚 B 的用户为什么走？" }
    choices:
      - id: reallocate_budget
        text: 预算挪向渠道 A，B 降到维护
        visibleResponse: 两周后整体留存升了 9 个点。你没搞清 B 为什么烂，但你让钱站在了对的一边。
        hiddenEffects:
          - { kind: setFlag, key: kv_budget_moved }
          - { kind: add, key: revenue, value: 5 }
      - id: b_channel_autopsy
        text: 先解剖 B：五访谈找流失根因
        visibleResponse: 五个流失用户的访谈发现了同一个原因：渠道 B 的广告承诺了'AI 全自动'，进来发现要自己配置。预期错位，不是产品差。
        hiddenEffects:
          - { kind: setFlag, key: kv_churn_root_cause }
          - { kind: add, key: userUnderstanding, value: 7 }
    learningPoint: 留存问题的终点是根因访谈，不是预算腾挪

  - id: v2k2_averaged_trap
    campaign: venture
    day: 25
    type: story
    trigger: { kind: delayed }
