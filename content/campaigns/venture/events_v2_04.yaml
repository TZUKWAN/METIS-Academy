          - { kind: add, key: evidenceDiscipline, value: 4 }
          - { kind: add, key: credibility, value: 3 }
      - id: ship_on_time
        text: 按时上线，bug 下版再修
        visibleResponse: 你按时发布了。明明知道那个 bug 在那，看着用户撞上去——这种感觉，比延迟难受多了。
        hiddenEffects:
          - { kind: setFlag, key: kv_ng_ship_anyway }
          - { kind: add, key: technicalDebt, value: 3 }
    learningPoint: 已知缺陷必须在发布前修复，“用户不会注意”是自我欺骗

