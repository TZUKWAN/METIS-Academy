  - id: v2_d15_wire8
    campaign: venture
    day: 15
    type: story
    trigger: { kind: day, day: 15, phase: end }
    purpose: { narrative: D15 夜间复盘, learning: 安全的安心 }
    scene: { location: dorm, characters: [] }
    dialogue:
      - { speaker: 系统, text: “半夜的告警短信又响了一次。你看了一眼，关掉屏幕。两次入侵，零次得手。你给自己那次凌晨五点的加固，打了个满分。” }
    automaticEffects:
      - { kind: add, key: evidenceDiscipline, value: 1 }

  - id: v2_d19_wire8
    campaign: venture
    day: 19
    type: story
    trigger: { kind: day, day: 19, phase: end }
    purpose: { narrative: D19 夜间复盘, learning: 意义的补给 }
    scene: { location: dorm, characters: [] }
    dialogue:
      - { speaker: 系统, text: “你把”意义“这个词记进了管理笔记。动机管理不是打鸡血，是定期帮队友把钱、累、意义三本账对齐。” }
    automaticEffects:
      - { kind: add, key: teamTrust, value: 1 }

  - id: v2_d22_wire8
    campaign: venture
    day: 22
    type: story
    trigger: { kind: day, day: 22, phase: end }
    purpose: { narrative: D22 夜间复盘, learning: 透明的力量 }
    scene: { location: dorm, characters: [] }
    dialogue:
      - { speaker: 系统, text: “路线图的投票结果你们照单全收——包括那个你们不想做的”导出更漂亮“。说话算话的第一天，用户看见了。” }
    automaticEffects:
      - { kind: add, key: credibility, value: 1 }
