    campaign: venture
    day: 24
    type: story
    trigger: { kind: day, day: 24, phase: end }
    purpose: { narrative: D24 夜间复盘, learning: 留存的教训 }
    scene: { location: dorm, characters: [] }
    dialogue:
      - { speaker: 系统, text: “留存曲线 today 又画了一遍。你发现自己在笑——这条曲线已经从”心电图的焦虑“变成了”体检报告的从容“。” }
    automaticEffects:
      - { kind: add, key: evidenceDiscipline, value: 1 }

  - id: v2_d27_wire10
    campaign: venture
    day: 27
    type: story
    trigger: { kind: day, day: 27, phase: end }
    purpose: { narrative: D27 夜间复盘, learning: 口碑的账本 }
    scene: { location: dorm, characters: [] }
    dialogue:
      - { speaker: 系统, text: “你在笔记里加了一栏”口碑账“：每一笔退款、每一条差评、每一句用户原话。账本不长，但每一条都有利息。” }
    automaticEffects:
      - { kind: add, key: credibility, value: 1 }
