# 非内容指标
platform:
  skills: 120
  knowledge: 100

quality:
  e2eTotal: 10
  e2ePassRequired: 10
  unitTestsPass: true
  lintZero: true
  typecheckZero: true
  contentValidateZero: true
  similarityBlockersZero: true
  witnessCoverage: 100   # % of base endings with a replayable witness
  unknownAssetLicenses: 0
  forbiddenAssetLicenses: 0
  missingAssetManifests: 0

gates:
  cleanAuditRoundsRequired: 3
  # Clean Round 定义：S0=S1=S2=S3=0 且本轮新增 visible S4 全部当轮修复
  issueSeveritiesBlocking: [S0, S1, S2, S3]

release:
  windowsPackageRequired: true
  macOS: OUT_OF_SCOPE
  externalHumanPlaytest: NON_BLOCKING
